name: CI

on:
  push:
    branches-ignore:
      - main
      # Dedicated repair rehearsals run their focused workflow; every candidate
      # and main promotion still executes the complete reusable CI gate.
      - diagnose/upgrade-20261117
      - diagnose/acl-20261118
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Run CI checks
    uses: ./.github/workflows/backend-ci.yml
    permissions:
      contents: read
