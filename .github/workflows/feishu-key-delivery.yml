name: Feishu key delivery checks

on:
  push:
    branches: ['feat/feishu-key-delivery-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feishu-key-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  obsolete-branch-checks:
    # Keep this small API-only cleanup outside the saturated Linux test queue.
    runs-on: macos-15
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - name: Release runners used by superseded checks on this feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
        shell: python3 {0}
        run: |
          import json, os, urllib.parse, urllib.request
          branch = os.environ['GH_BRANCH']
          if not branch.startswith('feat/feishu-key-delivery-'):
              raise SystemExit(0)
          base = 'https://api.github.com/repos/' + os.environ['GH_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          url = base + '/actions/workflows/ci.yml/runs?' + urllib.parse.urlencode({'branch': branch, 'per_page': 30})
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as response:
              runs = json.load(response)['workflow_runs']
          for run in runs:
              if run['head_sha'] == os.environ['GH_SHA'] or run['head_branch'] != branch or run['status'] not in ('queued', 'in_progress', 'waiting', 'pending'):
                  continue
              request = urllib.request.Request(base + '/actions/runs/' + str(run['id']) + '/cancel', method='POST', data=b'', headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      print('Cancelled superseded feature-branch CI', run['id'], response.status)
              except urllib.error.HTTPError as error:
                  if error.code != 409:
                      raise
          # The API extension superseded our own earlier main candidate while
          # it was still in CI. Never cancel a run that has reached image/deploy.
          superseded_id = 45310221613
          superseded_sha = 'e5ccc3f2bc350074ddf38f2e220da3563c22c294'
          with urllib.request.urlopen(urllib.request.Request(base + '/actions/runs/' + str(superseded_id), headers=headers), timeout=20) as response:
              candidate = json.load(response)
          if candidate['head_branch'] == 'main' and candidate['head_sha'] == superseded_sha and candidate['status'] in ('queued', 'in_progress', 'waiting', 'pending'):
              jobs, page = [], 1
              while True:
                  with urllib.request.urlopen(urllib.request.Request(base + '/actions/runs/' + str(superseded_id) + '/jobs?per_page=100&page=' + str(page), headers=headers), timeout=20) as response:
                      chunk = json.load(response)['jobs']
                  jobs.extend(chunk)
                  if len(chunk) < 100:
                      break
                  page += 1
              stages = {'Build and publish image', 'Deploy to production server'}
              reached_publication = any(job['name'] in stages and job['status'] not in ('queued', 'waiting', 'pending') for job in jobs)
              if not reached_publication:
                  request = urllib.request.Request(base + '/actions/runs/' + str(superseded_id) + '/cancel', method='POST', data=b'', headers=headers)
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          print('Cancelled our superseded CI-only main candidate', superseded_id, response.status)
                  except urllib.error.HTTPError as error:
                      if error.code != 409:
                          raise
  backend:
    needs: obsolete-branch-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Feishu, email and lifecycle regressions
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          go test -tags=unit -count=1 -timeout=10m -run '^(TestFeishu|TestDirectory|TestSMTP|TestEmailService|TestProvideCleanup)' ./internal/pkg/feishu ./internal/service ./internal/repository ./internal/handler ./internal/handler/admin ./internal/server/routes ./cmd/server 2>&1 | tee feishu-key-test.log
      - name: Report backend failure
        if: failure()
        run: bash .github/scripts/report-ci-failure.sh backend/feishu-key-test.log
      - name: Save backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feishu-key-backend
          path: backend/feishu-key-test.log
          retention-days: 7
  frontend:
    needs: obsolete-branch-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint and check frontend types
        working-directory: frontend
        run: |
          set -o pipefail
          pnpm run lint:check 2>&1 | tee lint.log
          pnpm run typecheck 2>&1 | tee types.log
      - name: Feishu user interface regressions
        working-directory: frontend
        run: |
          set -o pipefail
          pnpm exec vitest run src/views/admin/__tests__/UsersView.spec.ts src/components/admin/user/__tests__/FeishuKeyDelivery.spec.ts src/components/admin/user/__tests__/FeishuDirectorySync.spec.ts src/components/settings/FeishuSettings.spec.ts src/i18n/__tests__/localeKeyCompleteness.spec.ts 2>&1 | tee tests.log
      - name: Build frontend
        working-directory: frontend
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee build.log
      - name: Report frontend failure
        if: failure()
        run: bash .github/scripts/report-ci-failure.sh frontend/lint.log frontend/types.log frontend/tests.log frontend/build.log
      - name: Save frontend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feishu-key-frontend
          path: frontend/*.log
          retention-days: 7
