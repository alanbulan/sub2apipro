name: Pro regressions
on:
  workflow_call:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify production image selection
        env:
          APP_IMAGE: ghcr.io/alanbulan/sub2apipro:sha-${{ github.sha }}
          POSTGRES_PASSWORD: isolated_fixture_only
          DATABASE_HOST: isolated-fixture-postgres
          DATABASE_PASSWORD: isolated_fixture_only
          REDIS_HOST: isolated-fixture-redis
          REDIS_PASSWORD: isolated_fixture_only
        run: |
          for manifest in deploy/docker-compose.yml deploy/docker-compose.local.yml deploy/docker-compose.standalone.yml; do
            resolved_image=$(docker compose -f "$manifest" config --format json | python3 -c 'import json, sys; print(json.load(sys.stdin)["services"]["sub2api"]["image"])')
            if [ "$resolved_image" != "$APP_IMAGE" ]; then
              echo "::error file=$manifest::Application image does not match this Pro commit: $resolved_image"
              exit 1
            fi
          done
      - name: Check source and deployment contracts
        run: |
          python3 scripts/check-pro-contract.py > "$RUNNER_TEMP/pro-contract.log" 2>&1 || {
            cat "$RUNNER_TEMP/pro-contract.log"
            python3 scripts/ci-failure-summary.py "$RUNNER_TEMP/pro-contract.log"
            exit 1
          }
          cat "$RUNNER_TEMP/pro-contract.log"
          bash -n scripts/check-upstream.sh
          sh -n deploy/cron/upstream-sync
          node --test --test-reporter=tap deploy/tests/upstream-sync-ci.test.cjs > "$RUNNER_TEMP/pro-sync-tests.log" 2>&1 || {
            cat "$RUNNER_TEMP/pro-sync-tests.log"
            python3 - "$RUNNER_TEMP/pro-sync-tests.log" <<'PYLOG'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          for index, line in enumerate(lines):
              if line.startswith('not ok'):
                  message = '\n'.join(lines[index:index+65])[:10000]
                  print('::error::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYLOG
            exit 1
          }

  database-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pro_fixture
          POSTGRES_PASSWORD: isolated_fixture_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pro_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Export exact pre-migration schema history
        run: |
          mkdir -p "$RUNNER_TEMP/pro-previous-schema"
          git archive 0226a1f40e4019243544c19c476e8b537394809d backend/migrations | tar -x -C "$RUNNER_TEMP/pro-previous-schema"
      - name: Fresh install and canonical upgrade rehearsal
        working-directory: backend
        env:
          CANONICAL_UPGRADE_DSN: postgres://pro_fixture:isolated_fixture_only@localhost:5432/postgres?sslmode=disable
          CANONICAL_PREVIOUS_MIGRATIONS: ${{ runner.temp }}/pro-previous-schema/backend/migrations
        run: |
          go test -count=1 -v ./internal/repository -run '^TestCanonicalMigration' > "$RUNNER_TEMP/pro-database-tests.log" 2>&1 || {
            cat "$RUNNER_TEMP/pro-database-tests.log"
            python3 ../scripts/ci-failure-summary.py "$RUNNER_TEMP/pro-database-tests.log"
            exit 1
          }
          cat "$RUNNER_TEMP/pro-database-tests.log"

  frontend-pro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Pro themes, authentication, Feishu, keys, pool and IQ regressions
        working-directory: frontend
        run: |
          pnpm exec vitest run src/__tests__/rememberMePro.spec.ts src/__tests__/useAppTheme.spec.ts src/stores/__tests__/auth.spec.ts src/views/auth/__tests__/LoginView.spec.ts src/views/admin/__tests__/UsersView.spec.ts src/components/account/__tests__/PoolQuotaCard.spec.ts src/components/settings/FeishuSettings.spec.ts src/components/admin/user/__tests__/FeishuDirectorySync.spec.ts src/components/admin/user/__tests__/FeishuKeyDelivery.spec.ts src/components/admin/user/__tests__/BulkRechargeUserModal.spec.ts src/components/layout/__tests__/AppHeader.feishu.spec.ts src/views/user/__tests__/PoolDashboardView.spec.ts src/components/admin/account/__tests__/PoolDiagnostics.spec.ts src/views/admin/__tests__/ConversationLogsView.spec.ts src/api/__tests__/intelligence.spec.ts src/router/__tests__/pool-route.spec.ts src/components/admin/account/__tests__/IQTestModal.spec.ts src/components/admin/account/__tests__/PelicanRecordsDashboard.spec.ts src/components/admin/account/__tests__/PelicanTestFields.spec.ts src/components/admin/account/__tests__/ScheduledTestsPanel.pelican.spec.ts src/components/admin/account/__tests__/ScheduledTestsPanel.results.spec.ts > "$RUNNER_TEMP/pro-ui-tests.log" 2>&1 || {
            cat "$RUNNER_TEMP/pro-ui-tests.log"
            python3 ../scripts/ci-failure-summary.py "$RUNNER_TEMP/pro-ui-tests.log"
            exit 1
          }
          cat "$RUNNER_TEMP/pro-ui-tests.log"
      - name: Build production frontend
        working-directory: frontend
        run: |
          pnpm build > "$RUNNER_TEMP/pro-ui-build.log" 2>&1 || {
            cat "$RUNNER_TEMP/pro-ui-build.log"
            python3 ../scripts/ci-failure-summary.py "$RUNNER_TEMP/pro-ui-build.log"
            exit 1
          }
          cat "$RUNNER_TEMP/pro-ui-build.log"

      - name: Retain frontend for embedded server validation
        uses: actions/upload-artifact@v4
        with:
          name: canonical-pro-frontend
          path: backend/internal/web/dist
          if-no-files-found: error
          retention-days: 7

  backend-build:
    runs-on: ubuntu-latest
    needs: frontend-pro
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Validate generated ORM and dependency injection
        env:
          GOFLAGS: -mod=mod
        working-directory: backend
        run: |
          go generate ./ent ./cmd/server
          git diff --exit-code -- ent cmd/server/wire_gen.go || {
            git diff -- ent cmd/server/wire_gen.go > "$RUNNER_TEMP/pro-codegen.diff"
            python3 - "$RUNNER_TEMP/pro-codegen.diff" <<'PYDIFF'
          import pathlib, sys
          message = pathlib.Path(sys.argv[1]).read_text()[:18000]
          print('::error::Generated sources differ from committed sources: ' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYDIFF
            exit 1
          }
      - uses: actions/download-artifact@v4
        with:
          name: canonical-pro-frontend
          path: backend/internal/web/dist
      - name: Build server with production frontend embedded
        working-directory: backend
        run: go build -tags embed -o "$RUNNER_TEMP/sub2api-pro" ./cmd/server
