name: Issue605 integration startup diagnostics

on:
  push:
    branches:
      - diagnose/cleaner-20261117

permissions:
  contents: read

jobs:
  exact-composite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      GOMAXPROCS: '2'
      GOFLAGS: -p=2
      APP_SHA: b4ed59f7e8a3f41d6abd1f9ce6056bc9a75ba7fc
      EXPECTED_HEAD: b4ed59f7e8a3f41d6abd1f9ce6056bc9a75ba7fc
      EXPECTED_HEAD_SHA: b4ed59f7e8a3f41d6abd1f9ce6056bc9a75ba7fc
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.APP_SHA }}
          persist-credentials: false
      - name: Execute the repaired formal composite with the original assertions
        uses: ./.github/actions/upstream-ci/9d29a0406612d1b4
      - name: Check out the diagnostic harness after source verification
        if: always()
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - name: Export formal composite startup metadata
        if: always()
        run: |
          set -euo pipefail
          python3 harness/scripts/issue605-startup-metadata.py \
            "$RUNNER_TEMP/issue605-p1-green/integration.jsonl" \
            "$RUNNER_TEMP/issue605-composite-startup-metadata.json"
      - name: Save formal composite startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue605-exact-composite-${{ github.sha }}
          path: ${{ runner.temp }}/issue605-composite-startup-metadata.json
          if-no-files-found: error
