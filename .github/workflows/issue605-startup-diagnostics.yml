{
  "name": "Image cancellation race diagnostics",
  "on": {
    "push": {
      "branches": [
        "diagnose/cleaner-20261117"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "image-cancellation-regression": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "env": {
        "APP_SHA": "a7dd62c950be26062dae8938ffbd438419607840",
        "EXPECTED_HEAD_SHA": "a7dd62c950be26062dae8938ffbd438419607840"
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "a7dd62c950be26062dae8938ffbd438419607840",
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-go@v6",
          "with": {
            "go-version": "1.27.4",
            "cache-dependency-path": "backend/go.sum"
          }
        },
        {
          "name": "Repeat original cancellation assertion with race detection",
          "working-directory": "backend",
          "run": "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/image-cancel\"\ngo test -race ./internal/service/basispoints -run '^TestImagePolicyProgressiveUsageAndCancellation$' -count=100 -json -timeout=5m > \"$RUNNER_TEMP/image-cancel/repeated.jsonl\" 2>&1\npython3 - \"$RUNNER_TEMP/image-cancel/repeated.jsonl\" <<'PY'\nimport collections,json,sys\nrows=[json.loads(line) for line in open(sys.argv[1]) if line.startswith('{')]\nroot='TestImagePolicyProgressiveUsageAndCancellation'\nassert sum(row.get('Action')=='pass' and row.get('Test')==root for row in rows)==100\nassert not any(row.get('Action') in ('fail','skip') for row in rows)\nprint(json.dumps({'original_assertion_repeated':100,'failed':0,'skipped':0}))\nPY\n"
        },
        {
          "name": "Original BPS wire and policy composite",
          "uses": "./.github/actions/upstream-ci/121cac95a3374546"
        },
        {
          "name": "Export status metadata without synthetic bodies",
          "if": "always()",
          "run": "python3 scripts/issue605-startup-metadata.py \"$RUNNER_TEMP/image-cancel/repeated.jsonl\" \"$RUNNER_TEMP/image-cancel/metadata.json\""
        },
        {
          "uses": "actions/upload-artifact@v6",
          "if": "always()",
          "with": {
            "name": "image-cancel-metadata",
            "path": "${{ runner.temp }}/image-cancel/metadata.json",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
