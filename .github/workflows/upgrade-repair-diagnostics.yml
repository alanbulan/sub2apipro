---
name: Upgrade repair diagnostics
'on':
  push:
    branches:
    - diagnose/upgrade-20261117
permissions:
  contents: read
concurrency:
  group: upgrade-repair-diagnostics
  cancel-in-progress: false
jobs:
  fork-production-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: postgres
        ports:
        - 15432:5432
        options: --health-cmd "pg_isready -U fixture -d postgres" --health-interval
          5s --health-timeout 5s --health-retries 12
    env:
      FORK_PRODUCTION_SHA: b827111805f1b5030b141dbcea4d4a9f6dd413e6
      FORK_UPGRADE_DSN: postgres://fixture:fixture@127.0.0.1:15432/postgres?sslmode=disable
    steps:
    - uses: actions/checkout@v6
      with:
        ref: "${{ github.event.pull_request.head.sha || github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@v6
      with:
        go-version: 1.27.4
        cache-dependency-path: backend/go.sum
    - name: Archive the exact deployed 67 migration baseline
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
        mkdir -p "$RUNNER_TEMP/fork-production"
        git archive "$FORK_PRODUCTION_SHA" backend/migrations | tar -xf - -C "$RUNNER_TEMP/fork-production"
    - name: Rehearse real migrations with synthetic custom records
      shell: bash
      working-directory: backend
      env:
        FORK_PRODUCTION_MIGRATIONS: "${{ runner.temp }}/fork-production/backend/migrations"
      run: |
        set -euo pipefail
        go test -tags=unit ./internal/repository -run '^TestForkProductionUpgradePreservesCustomData$' -count=1 -v -timeout=10m 2>&1 | tee "$RUNNER_TEMP/fork-production-upgrade.log"
        grep -q -- '--- PASS: TestForkProductionUpgradePreservesCustomData' "$RUNNER_TEMP/fork-production-upgrade.log"
        ! grep -q -- '--- SKIP:' "$RUNNER_TEMP/fork-production-upgrade.log"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fork-production-upgrade-${{ github.event.pull_request.head.sha || github.sha
          }}
        path: "${{ runner.temp }}/fork-production-upgrade.log"
        if-no-files-found: error
        retention-days: 14
  pool-capacity-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v6
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum
    - name: Prove blocking regressions fail on previously reviewed head
      shell: bash
      run: |
        set -euo pipefail
        targets=(
          backend/internal/service/ratelimit_service.go
          backend/internal/service/gateway_model_availability.go
          backend/internal/service/openai_gateway_model_availability.go
        )
        trap 'git restore --source=HEAD -- "${targets[@]}"' EXIT
        for target in "${targets[@]}"; do
          git show a11c678d0ba8b899177682b8e54acccf14eeca2f:"$target" > "$target"
        done
        python3 scripts/prepare-historical-ci.py rate-limit
        python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend
        set +e
        (cd backend && go test -tags=unit ./internal/service ./internal/handler -run '^TestPoolModelNegativeCache' -count=1) > "$RUNNER_TEMP/pool-capacity-red.log" 2>&1
        result=$?
        set -e
        cat "$RUNNER_TEMP/pool-capacity-red.log"
        test "$result" -ne 0
        ! grep -q '\[build failed\]' "$RUNNER_TEMP/pool-capacity-red.log"
        grep -q -- '--- FAIL: TestPoolModelNegativeCacheWriterRespectsPoolDefaultAndOverrides' "$RUNNER_TEMP/pool-capacity-red.log"
        grep -q -- '--- FAIL: TestPoolModelNegativeCacheTwoLayersHistoricalObservationsDoNotRenew' "$RUNNER_TEMP/pool-capacity-red.log"
    - name: Verify exact head and existing boundary regressions
      working-directory: backend
      run: |
        git diff --exit-code
        python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"
        go test -tags=unit ./internal/service ./internal/handler -run 'Test(PoolModelNegativeCache|PoolCapacity|ModelCapabilityCooldownDiagnosis|AnthropicModelCapabilityCooldownDiagnosis|DiagnoseModelAvailability|OpenAIDiagnoseModelAvailability|RateLimitService_.*Model|NonStreaming.*SSEToJSON|OpenAI.*Capacity|OpenAI.*TempRule|OpenAI.*ReplayBoundary|OpenAI.*ModelNotFound|OpenAIAdmissionPreservesCapabilityCooldownCause|ClassifyNoAccountError)' -count=1
  issue-582-regression-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
        - redis: '6.0'
          image: redis:6.0.20-alpine
        - redis: '7.4'
          image: redis:7.4.12-alpine
    services:
      postgres:
        image: postgres:18.1-alpine3.23
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sub2api_test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d sub2api_test" --health-interval
          5s --health-timeout 5s --health-retries 12
      redis:
        image: "${{ matrix.image }}"
        ports:
        - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout
          5s --health-retries 12
    env:
      EXPECTED_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      SUB2API_TEST_REDIS_IMAGE: "${{ matrix.image }}"
      SUB2API_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 dbname=sub2api_test user=postgres
        password=postgres sslmode=disable TimeZone=UTC
      SUB2API_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      ISSUE_582_REDIS_VERSION: "${{ matrix.redis }}"
      CI: 'true'
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: "${{ github.event.pull_request.head.sha || github.sha }}"
    - uses: actions/setup-go@v6
      with:
        cache-dependency-path: backend/go.sum
        go-version: 1.27.3
    - name: Install Redis binary for existing readiness adapter test
      run: |
        bash scripts/ci-ubuntu-mirrors.sh
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends redis-server
    - name: Assert exact head and static formatting
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
        git rev-parse HEAD
        git diff --check
        # Match upstream's deletion-aware formatting inventory, retaining the original assertion.
        git() {
          if [ "${1:-}" = diff ] && [ "${2:-}" = --name-only ]; then
            shift
            command git diff --diff-filter=ACMRT "$@"
          else
            command git "$@"
          fi
        }
        test -z "$(git diff --name-only 08d69a522 HEAD -- '*.go' | xargs -r gofmt -l)"
    - name: Real Redis 6.0 baseline RED
      if: matrix.redis == '6.0'
      run: bash scripts/issue-582-red.sh
    - name: Exact head real Redis snapshot, outbox, queue and session behavior
      working-directory: backend
      run: |
        set -euo pipefail
        git diff --exit-code
        test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
        go test -race -tags=integration ./internal/repository -run '^(TestIssue582|TestUserMsgQueueCacheSuite|TestConcurrencyCacheSuite|TestSchedulerCache|TestSchedulerSnapshotOutboxReplay)' -count=1 -v | tee "$RUNNER_TEMP/issue-582-real-redis.log"
        ! grep -E -- '--- SKIP: TestIssue582' "$RUNNER_TEMP/issue-582-real-redis.log"
    - name: Preserve scheduler memo, fencing and failure protections
      working-directory: backend
      run: |
        set -euo pipefail
        go test -race -tags=unit ./internal/repository -run '^Test(Scheduler|APIKeyCacheIncrementCreateCount)' -count=1 -v | tee "$RUNNER_TEMP/issue-582-scheduler-unit.log"
    - name: Session, IP risk and serverless regressions
      working-directory: backend
      run: |
        set -euo pipefail
        go test -race -tags=unit ./internal/pkg/redissession ./internal/pkg/rediscompat ./internal/iprisk ./internal/serverless -count=1 -v | tee "$RUNNER_TEMP/issue-582-audit-unit.log"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: issue-582-${{ matrix.redis }}-${{ github.event_name }}-${{ github.event.pull_request.head.sha
          || github.sha }}
        path: "${{ runner.temp }}/issue-582-*.log"
  issue-600-regression-network:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      redis:
        image: redis:8.4-alpine
        ports:
        - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout
          3s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        phase:
        - RED
        - GREEN
    env:
      EXPECTED_HEAD: "${{ github.event.pull_request.head.sha || github.sha }}"
      PHASE: "${{ matrix.phase }}"
      ISSUE600_REDIS_ADDR: 127.0.0.1:6379
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: "${{ github.event.pull_request.head.sha || github.sha }}"
    - uses: actions/setup-go@v6
      with:
        cache-dependency-path: backend/go.sum
        go-version: 1.27.3
    - name: Prove source and run real handler network regression
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
        git diff --exit-code HEAD
        files=(backend/internal/handler/openai_gateway_handler.go backend/internal/service/openai_ws_forwarder.go backend/internal/service/openai_ws_forwarder_ingress.go backend/internal/service/openai_ws_v2_passthrough_adapter.go backend/internal/service/openai_codex_account_identity.go backend/internal/service/session_id.go)
        delivery_root="$PWD"
        if [ "$PHASE" = RED ]; then
          red_tree="$RUNNER_TEMP/issue600-upstream-red"
          git worktree add --detach "$red_tree" ec007920de042797299fc7cf2c034ad24c136462
          trap 'git -C "$delivery_root" worktree remove --force "$red_tree"' EXIT
          for test_file in backend/internal/handler/openai_ws_client_identity_test.go backend/internal/handler/openai_ws_nested_identity_test.go backend/internal/service/openai_nested_identity_test.go; do
            cp "$test_file" "$red_tree/$test_file"
          done
          printf 'RED supporting tree: %s; unchanged candidate tests: %s\n' ec007920de042797299fc7cf2c034ad24c136462 "$EXPECTED_HEAD"
          cd "$red_tree"
        fi
        if [ "$PHASE" = RED ]; then
          for file in "${files[@]}"; do
            git show "77455cf755fa0f119367b911704f11df88e7917e:$file" > "$file"
          done
        fi
        {
          echo "candidate=$EXPECTED_HEAD phase=$PHASE baseline=77455cf755fa0f119367b911704f11df88e7917e"
          for file in "${files[@]}"; do
            if [ "$PHASE" = RED ]; then
              test "$(git hash-object "$file")" = "$(git rev-parse "77455cf755fa0f119367b911704f11df88e7917e:$file")"
            else
              test "$(git hash-object "$file")" = "$(git rev-parse "$EXPECTED_HEAD:$file")"
            fi
            echo "$file blob=$(git hash-object "$file") candidate=$(git rev-parse "$EXPECTED_HEAD:$file") baseline=$(git rev-parse "77455cf755fa0f119367b911704f11df88e7917e:$file")"
          done
        } | tee "$RUNNER_TEMP/issue600-source-$PHASE.log"
        git hash-object backend/internal/handler/openai_ws_client_identity_test.go backend/internal/handler/openai_ws_nested_identity_test.go backend/internal/service/openai_nested_identity_test.go | tee "$RUNNER_TEMP/issue600-tests-$PHASE.log"
        python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend
        set +e
        (cd backend && go test -tags=unit ./internal/handler -run '^TestIssue600' -count=1 -v -timeout=8m) > "$RUNNER_TEMP/issue600-$PHASE.log" 2>&1
        result=$?
        set -e
        cat "$RUNNER_TEMP/issue600-$PHASE.log"
        if grep -E 'build failed|no tests to run|--- SKIP:|panic:|unexpected fixture destination|failed to get access token' "$RUNNER_TEMP/issue600-$PHASE.log"; then
          echo 'Invalid test evidence: compile, fixture, panic, skip or missing tests'
          exit 1
        fi
        if [ "$PHASE" = RED ]; then
          test "$result" -ne 0
          grep -q -- '--- FAIL: TestIssue600ClientIdentityNetwork/' "$RUNNER_TEMP/issue600-$PHASE.log"
          grep -q 'stable original client identity must admit turn 2' "$RUNNER_TEMP/issue600-$PHASE.log"
          grep -q 'cyber_session_identity_conflict' "$RUNNER_TEMP/issue600-$PHASE.log"
          grep -q 'nested outbound identity must be account isolated' "$RUNNER_TEMP/issue600-$PHASE.log"
          grep -q 'rejected turn must have no response generation' "$RUNNER_TEMP/issue600-$PHASE.log"
          for mode in ctx_pool http_bridge passthrough legacy; do
            for strict in false true; do
              for scenario in stable_header_body body_only; do
                grep -q -- "--- FAIL: TestIssue600ClientIdentityNetwork/$mode/strict=$strict/oauth/$scenario " "$RUNNER_TEMP/issue600-$PHASE.log"
              done
              for scenario in nested_header_body nested_body_only root_nested_consistent; do
                grep -q -- "--- FAIL: TestIssue600NestedIdentityNetwork/$mode/strict=$strict/oauth/$scenario " "$RUNNER_TEMP/issue600-$PHASE.log"
              done
              grep -q -- "--- FAIL: TestIssue600NestedIdentityNetwork/$mode/strict=$strict/none/conflicting_root_nested_thread " "$RUNNER_TEMP/issue600-$PHASE.log"
            done
          done
        else
          test "$result" -eq 0
          grep -q -- '--- PASS: TestIssue600ClientIdentityNetwork ' "$RUNNER_TEMP/issue600-$PHASE.log"
          for mode in ctx_pool http_bridge passthrough legacy; do
            for strict in false true; do
              for namespace in none oauth; do
                for scenario in stable_header_body body_only omitted_identity static_session_inheritance genuine_header_body_conflict true_body_identity_switch invalid_followup; do
                  grep -q -- "--- PASS: TestIssue600ClientIdentityNetwork/$mode/strict=$strict/$namespace/$scenario " "$RUNNER_TEMP/issue600-$PHASE.log"
                done
              done
            done
          done
          for mode in ctx_pool http_bridge passthrough legacy; do
            for strict in false true; do
              for namespace in none oauth; do
                for scenario in nested_header_body nested_body_only root_nested_consistent omitted_nested_identity root_hidden_by_empty_envelope conflicting_root_nested_thread conflicting_root_nested_session invalid_nested_identity invalid_root_identity invalid_nested_metadata invalid_root_metadata nested_header_conflict true_nested_switch session_only_consistent session_only_switch; do
                  grep -q -- "--- PASS: TestIssue600NestedIdentityNetwork/$mode/strict=$strict/$namespace/$scenario " "$RUNNER_TEMP/issue600-$PHASE.log"
                done
              done
              grep -q -- "--- PASS: TestIssue600NestedAccountSwitch/$mode/strict=$strict " "$RUNNER_TEMP/issue600-$PHASE.log"
            done
          done
          git diff --exit-code HEAD
        fi
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: issue600-${{ matrix.phase }}-${{ github.event_name }}-${{ github.event.pull_request.head.sha
          || github.sha }}
        path: "${{ runner.temp }}/issue600-*.log"
  issue603-observability-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASELINE: ec007920de042797299fc7cf2c034ad24c136462
      SOURCE_HEAD: "${{ github.event.pull_request.head.sha || github.sha }}"
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
    - uses: actions/checkout@v6
      with:
        ref: "${{ github.event.pull_request.head.sha || github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - uses: pnpm/action-setup@v6
      with:
        version: 9
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
      working-directory: frontend
    - name: RED - original real usage page and labels
      shell: bash
      run: |
        set -euo pipefail
        old="$RUNNER_TEMP/issue603-ui-red"
        git worktree add --detach "$old" "$SOURCE_HEAD"
        trap 'git worktree remove --force "$old"' EXIT
        # Later UI commits replaced these issue-specific test names.
        # Freeze the original assertions against their original defective UI.
        for file in frontend/src/views/admin/__tests__/UsageView.spec.ts frontend/src/components/admin/usage/__tests__/UsageTable.spec.ts; do
          git show "611d317bf2:$file" > "$old/$file"
        done
        for file in frontend/src/views/admin/UsageView.vue frontend/src/components/admin/usage/UsageTable.vue frontend/src/i18n/locales/en/dashboard.ts frontend/src/i18n/locales/zh/dashboard.ts; do
          git -C "$old" restore --source="$BASELINE" -- "$file"
          test "$(git -C "$old" hash-object "$file")" = "$(git rev-parse "$BASELINE:$file")"
        done
        ln -s "$GITHUB_WORKSPACE/frontend/node_modules" "$old/frontend/node_modules"
        set +e
        (cd "$old/frontend" && pnpm test:run src/views/admin/__tests__/UsageView.spec.ts src/components/admin/usage/__tests__/UsageTable.spec.ts -t 'Issue60[35]') > "$RUNNER_TEMP/issue603-ui-red.log" 2>&1
        result=$?
        set -e
        cat "$RUNNER_TEMP/issue603-ui-red.log"
        test "$result" -ne 0
        ! grep -Eq 'Failed to resolve|Cannot find|No test files found|SyntaxError|TypeError|ReferenceError' "$RUNNER_TEMP/issue603-ui-red.log"
        grep -F 'Issue603 embeds latency observations in the real admin usage page' "$RUNNER_TEMP/issue603-ui-red.log"
        grep -F 'Issue603 labels real usage table server timing explicitly' "$RUNNER_TEMP/issue603-ui-red.log"
    - name: GREEN - actual page and component regressions
      shell: bash
      run: |
        set -euo pipefail
        git diff --exit-code
        (cd frontend && pnpm test:run src/views/admin/__tests__/UsageView.spec.ts src/components/admin/usage/__tests__/UsageTable.spec.ts src/components/admin/usage/__tests__/UsageTimingDialog.spec.ts src/components/admin/usage/__tests__/LatencyObservabilityPanel.spec.ts src/views/admin/ops/components/__tests__/OpsNetworkChart.spec.ts) 2>&1 | tee "$RUNNER_TEMP/issue603-ui-green.log"
    - name: GREEN - frontend production typecheck and build
      shell: bash
      run: |
        set -euo pipefail
        (cd frontend && pnpm build) 2>&1 | tee "$RUNNER_TEMP/issue603-ui-build.log"
    - name: Install isolated browser for actual usage page screenshots
      run: |
        npm install --prefix "$RUNNER_TEMP/issue603-browser" --no-save --ignore-scripts playwright@1.56.1
        bash scripts/ci-ubuntu-mirrors.sh
        "$RUNNER_TEMP/issue603-browser/node_modules/.bin/playwright" install --with-deps chromium
    - name: Render exact baseline and head with offline synthetic data
      env:
        PLAYWRIGHT_ROOT: "${{ runner.temp }}/issue603-browser/node_modules/playwright"
        SCREENSHOT_DIR: "${{ runner.temp }}/issue603-screenshots"
      shell: bash
      run: |
        set -euo pipefail
        old="$RUNNER_TEMP/issue603-before-browser"
        git worktree add --detach "$old" "$BASELINE"
        trap 'git worktree remove --force "$old"' EXIT
        ln -s "$GITHUB_WORKSPACE/frontend/node_modules" "$old/frontend/node_modules"
        VIEW_ROOT="$old" SCREENSHOT_MODE=before node scripts/issue603-screenshots.mjs
        test "$(git -C "$old" hash-object frontend/src/views/admin/UsageView.vue)" = "$(git rev-parse "$BASELINE:frontend/src/views/admin/UsageView.vue")"
        git diff --exit-code
        test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
        SCREENSHOT_MODE=after node scripts/issue603-screenshots.mjs
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: issue603-ui-${{ github.event.pull_request.head.sha || github.sha }}
        path: |
          ${{ runner.temp }}/issue603-*.log
          ${{ runner.temp }}/issue603-screenshots
        if-no-files-found: error
        retention-days: 14
  pr596-cooldown-ownership-cooldown-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
    steps:
    - uses: actions/checkout@v6
      with:
        ref: "${{ github.event.pull_request.head.sha || github.sha }}"
        persist-credentials: false
    - name: Record exact source head
      env:
        EXPECTED_HEAD: "${{ github.event.pull_request.head.sha || github.sha }}"
      run: |
        mkdir -p evidence
        git rev-parse HEAD | tee evidence/head.txt
        test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
    - uses: actions/setup-go@v6
      with:
        cache-dependency-path: backend/go.sum
        go-version: 1.27.3
    - name: RED - unchanged new tests against original production files
      shell: bash
      run: |
        set -euo pipefail
        original=23b0dbae040e0d0b8c40f25ddb012ce2444feba3
        sources=(backend/internal/repository/account_quality_isolation.go backend/internal/repository/account_quality_models.go backend/internal/repository/scheduled_test_repo.go)
        mkdir -p "$RUNNER_TEMP/pr596-original"
        for source in "${sources[@]}"; do cp "$source" "$RUNNER_TEMP/pr596-original/$(basename "$source")"; done
        trap 'for source in "${sources[@]}"; do cp "$RUNNER_TEMP/pr596-original/$(basename "$source")" "$source"; done' EXIT
        git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git "$original"
        for source in "${sources[@]}"; do git show "$original:$source" > "$source"; done
        python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend
        set +e
        (cd backend && go test -tags=integration ./internal/repository -run '^TestQualityCooldown(ActionGuardRetainsAllOwnershipLayouts|OwnedScopeRejectsEdits|MappingChangeCannotStrandOwnedTarget|DeletePreservesOwnedState|DeleteChecksLiveMarkersWithoutSnapshot|DeleteAfterRecoveryPreservesExternalRestrictions)$' -count=1 -timeout=15m -json) > evidence/red.jsonl 2>&1
        result=$?
        set -e
        cat evidence/red.jsonl
        test "$result" -ne 0
        python3 - <<'PY'
        import json
        from pathlib import Path
        raw = Path('evidence/red.jsonl').read_text()
        events = []
        for line in raw.splitlines():
            try:
                events.append(json.loads(line))
            except json.JSONDecodeError:
                pass
        output = raw + ''.join(e.get('Output', '') for e in events)
        for forbidden in ('[build failed]', '[setup failed]', 'undefined:', 'syntax error:', 'no tests to run', 'panic:', '--- SKIP:'):
            assert forbidden not in output, forbidden
        for name in ('TestQualityCooldownActionGuardRetainsAllOwnershipLayouts', 'TestQualityCooldownOwnedScopeRejectsEdits', 'TestQualityCooldownMappingChangeCannotStrandOwnedTarget', 'TestQualityCooldownDeletePreservesOwnedState', 'TestQualityCooldownDeleteChecksLiveMarkersWithoutSnapshot', 'TestQualityCooldownDeleteAfterRecoveryPreservesExternalRestrictions'):
            assert any(e.get('Action') == 'fail' and e.get('Test') == name for e in events), name
        assert 'owned cooldown edit must be rejected' in output
        assert 'owned cooldown delete must be rejected' in output
        assert 'cooldown ownership must block action changes' in output
        assert 'Error Trace:' in output and 'An error is expected but got nil.' in output
        PY
    - name: GREEN - real repository transitions and retained ownership protection
      shell: bash
      run: |
        set -euo pipefail
        # The repository integration TestMain starts PostgreSQL and Redis via
        # testcontainers; CI=true makes missing Docker a failure, never a skip.
        python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend
        (cd backend && go test -tags=integration ./internal/repository -run '^TestQuality(Cooldown|Model|PersistentIsolation|Isolation|Ownership|Observation)' -count=1 -timeout=20m -json) > evidence/green.jsonl 2>&1
        cat evidence/green.jsonl
        python3 - <<'PY'
        import json
        from pathlib import Path
        events = [json.loads(line) for line in Path('evidence/green.jsonl').read_text().splitlines() if line.startswith('{')]
        assert not any(e.get('Action') in ('fail', 'skip') for e in events)
