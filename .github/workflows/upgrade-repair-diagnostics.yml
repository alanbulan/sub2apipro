---
name: Upgrade repair diagnostics
'on':
  push:
    branches:
    - diagnose/upgrade-20261117
permissions:
  contents: read
concurrency:
  group: upgrade-repair-diagnostics
  cancel-in-progress: false
jobs:
  sync-20261116-pelican-random-questions-isolated-e2e:
    name: Isolated application E2E (manual, account and group schedules; full acceptance
      pending)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      HARNESS_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      PARENT_BASE_SHA: dfc0219a9e66a19642eb73875e4914e540b49575
      COMPOSE_PROJECT_NAME: pelican-${{ github.run_id }}-${{ github.run_attempt }}
      EXPECTED_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
    - uses: actions/checkout@v6
      with:
        ref: "${{ env.HARNESS_SHA }}"
        path: harness
        persist-credentials: false
    - name: Run current upstream checks
      uses: "./harness/.github/actions/upstream-ci/441e5118366ca55a"
    permissions:
      contents: read
