---
name: Upgrade repair diagnostics
'on':
  push:
    branches:
    - diagnose/upgrade-20261117
permissions:
  contents: read
concurrency:
  group: upgrade-repair-diagnostics
  cancel-in-progress: false
jobs:
  fork-production-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: postgres
        ports:
        - 15432:5432
        options: --health-cmd "pg_isready -U fixture -d postgres" --health-interval
          5s --health-timeout 5s --health-retries 12
    env:
      FORK_PRODUCTION_SHA: b827111805f1b5030b141dbcea4d4a9f6dd413e6
      FORK_UPGRADE_DSN: postgres://fixture:fixture@127.0.0.1:15432/postgres?sslmode=disable
    steps:
    - uses: actions/checkout@v6
      with:
        ref: "${{ github.event.pull_request.head.sha || github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@v6
      with:
        go-version: 1.27.4
        cache-dependency-path: backend/go.sum
    - name: Archive the exact deployed 67 migration baseline
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
        mkdir -p "$RUNNER_TEMP/fork-production"
        git archive "$FORK_PRODUCTION_SHA" backend/migrations | tar -xf - -C "$RUNNER_TEMP/fork-production"
    - name: Rehearse real migrations with synthetic custom records
      shell: bash
      working-directory: backend
      env:
        FORK_PRODUCTION_MIGRATIONS: "${{ runner.temp }}/fork-production/backend/migrations"
      run: |
        set -euo pipefail
        go test -tags=unit ./internal/repository -run '^TestForkProductionUpgradePreservesCustomData$' -count=1 -v -timeout=10m 2>&1 | tee "$RUNNER_TEMP/fork-production-upgrade.log"
        grep -q -- '--- PASS: TestForkProductionUpgradePreservesCustomData' "$RUNNER_TEMP/fork-production-upgrade.log"
        ! grep -q -- '--- SKIP:' "$RUNNER_TEMP/fork-production-upgrade.log"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fork-production-upgrade-${{ github.event.pull_request.head.sha || github.sha
          }}
        path: "${{ runner.temp }}/fork-production-upgrade.log"
        if-no-files-found: error
        retention-days: 14
  sync-20261116-issue605-smart-protocol-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      GOMAXPROCS: '2'
      GOFLAGS: "-p=2"
      EXPECTED_HEAD: "${{ github.event.pull_request.head.sha || github.sha }}"
      EXPECTED_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
      SUB2API_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 dbname=sub2api_test user=postgres
        password=postgres sslmode=disable TimeZone=UTC
      SUB2API_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
    - uses: actions/checkout@v6
      with:
        ref: "${{ github.event.pull_request.head.sha || github.sha }}"
        persist-credentials: false
    - name: Run current upstream checks
      uses: "./.github/actions/upstream-ci/6c9e2391c50de42a"
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.1-alpine3.23
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sub2api_test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d sub2api_test" --health-interval
          5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8.4-alpine
        ports:
        - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout
          5s --health-retries 12
  sync-20261116-mature-review-repairs-upgrade:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: repair
          POSTGRES_PASSWORD: synthetic-fixture-only
          POSTGRES_DB: repair
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U repair" --health-interval 5s --health-timeout
          5s --health-retries 10
    env:
      MATURE_UPGRADE_DSN: postgres://repair:synthetic-fixture-only@127.0.0.1:5432/repair?sslmode=disable
      EXPECTED_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
    - uses: actions/checkout@v6
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
    - name: Run current upstream checks
      uses: "./.github/actions/upstream-ci/7ec064f49fb8c6a0"
    permissions:
      contents: read
  sync-20261116-pr610-queue-timing-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOMAXPROCS: '2'
      GOFLAGS: "-p=2"
      SOURCE_HEAD: "${{ github.event.pull_request.head.sha || github.sha }}"
      BASELINE: 705550f610f1f12666b8efd351a13e612b3956bf
      SUB2API_TEST_POSTGRES_IMAGE: postgres:15-alpine
      SUB2API_TEST_REDIS_IMAGE: redis:7-alpine
      EXPECTED_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
    - uses: actions/checkout@v6
      with:
        ref: "${{ github.event.pull_request.head.sha || github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - name: Run current upstream checks
      uses: "./.github/actions/upstream-ci/f350209e65f393e5"
    permissions:
      contents: read
  sync-20261116-openai-multi-auth-review-red:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: "${{ github.event.pull_request.head.sha || github.sha }}"
    - name: Run current upstream checks
      uses: "./.github/actions/upstream-ci/1929b24a2678b527"
    env:
      EXPECTED_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    permissions:
      contents: read
  sync-20261116-openai-multi-auth-lease-proof-red:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: "${{ github.event.pull_request.head.sha || github.sha }}"
    - name: Run current upstream checks
      uses: "./.github/actions/upstream-ci/85f757d8d685fa48"
    env:
      EXPECTED_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    permissions:
      contents: read
  sync-20261116-ws-readable-continuation-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v6
      with:
        ref: "${{ github.event.pull_request.head.sha || github.sha }}"
        persist-credentials: false
    - name: Run current upstream checks
      uses: "./.github/actions/upstream-ci/218aa159a525e145"
    env:
      EXPECTED_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    permissions:
      contents: read
  sync-20261116-ws-readable-continuation-transport:
    needs:
    - sync-20261116-ws-readable-continuation-validator
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        phase:
        - RED
        - GREEN
    env:
      CANDIDATE_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      BASELINE_SHA: 5e83d0b73611a447b425ad5692f883de120da9ed
      PHASE: "${{ matrix.phase }}"
      EXPECTED_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
    - uses: actions/checkout@v6
      with:
        ref: "${{ github.event.pull_request.head.sha || github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - name: Run current upstream checks
      uses: "./.github/actions/upstream-ci/5c3757851ba62aca"
      with:
        sync_matrix_phase: "${{ matrix.phase }}"
    permissions:
      contents: read
