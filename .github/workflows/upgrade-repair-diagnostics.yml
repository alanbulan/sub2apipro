  sync-20261116-ws-inherited-model-inherited-model:
    name: Inherited model ${{ matrix.phase }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        phase:
        - RED
        - GREEN
    env:
      CANDIDATE: "${{ github.event.pull_request.head.sha || github.sha }}"
      PHASE: "${{ matrix.phase }}"
      EXPECTED_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
    - name: Initialize evidence directory
      shell: bash
      run: |
        set -euo pipefail
        export EVIDENCE="$RUNNER_TEMP/ws-inherited-model-evidence"
        echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
        mkdir -p "$EVIDENCE"
    - uses: actions/checkout@v6
      with:
        ref: "${{ env.CANDIDATE }}"
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@v6
      with:
        cache-dependency-path: backend/go.sum
        go-version: 1.27.4
    - name: Isolated Redis fixture dependency
      run: |
        if ! command -v redis-server >/dev/null; then
          bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
        fi
    - name: Exact source and identical candidate fixture
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$CANDIDATE"
        git diff --exit-code
        mkdir -p "$EVIDENCE"
        git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git da526bfbab47efd40549cab98f1069f9b2b45b9f
        python3 scripts/prepare-ws-inherited-model-red.py "$RUNNER_TEMP/ws-inherited-model-baseline" "$EVIDENCE"
        if [ "$PHASE" = RED ]; then
          echo "TEST_ROOT=$RUNNER_TEMP/ws-inherited-model-baseline" >> "$GITHUB_ENV"
        else
          echo "TEST_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        fi
        python3 -m unittest discover -s scripts -p 'test_ws_inherited_model_evidence.py' -v > "$EVIDENCE/parser-tests.log" 2>&1
    - name: Authenticated same-socket tool loop and refusal controls
      shell: bash
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$TEST_ROOT/backend"
        set +e
        (cd "$TEST_ROOT/backend" && go test -race -p=2 -json -tags=unit,inheritedmodel ./internal/handler -run '^TestOpenAIWSInheritedModel(ToolProof|ProofFences)$' -count=1 -timeout=5m) > "$EVIDENCE/handler.jsonl" 2>&1
        status=$?
        set -e
        printf '%s\n' "$status" > "$EVIDENCE/handler.exit"
        cat "$EVIDENCE/handler.jsonl"
        python3 scripts/ws-inherited-model-evidence.py handler "$PHASE" "$status" "$EVIDENCE/handler.jsonl" | tee "$EVIDENCE/handler-verdict.json"
    - name: Delivery, model scope and final wire integrity controls
      if: "${{ (success() || failure()) && env.TEST_ROOT != '' }}"
      shell: bash
      run: |
        set -euo pipefail
        suite=guards
        pattern='^Test(OpenAIToolProvenanceDeliveryAndScope|OpenAIWSMixedOwnerFinalSendFences)$'
        if [ "$PHASE" = GREEN ]; then
          suite=guards_with_client_model
          pattern='^Test(OpenAIToolProvenanceDeliveryAndScope|OpenAIWSMixedOwnerFinalSendFences|OpenAIWSRecoveryEffectiveClientModel)$'
        fi
        python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$TEST_ROOT/backend"
        set +e
        (cd "$TEST_ROOT/backend" && go test -race -p=2 -json -tags=unit,ownerconflict,inheritedmodel ./internal/service -run "$pattern" -count=1 -timeout=5m) > "$EVIDENCE/guards.jsonl" 2>&1
        status=$?
        set -e
        printf '%s\n' "$status" > "$EVIDENCE/guards.exit"
        cat "$EVIDENCE/guards.jsonl"
        python3 scripts/ws-inherited-model-evidence.py "$suite" "$PHASE" "$status" "$EVIDENCE/guards.jsonl" | tee "$EVIDENCE/guards-verdict.json"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: sync-20261116-ws-inherited-model-inherited-model-ws-inherited-model-${{
          matrix.phase }}-${{ env.CANDIDATE }}
        path: "${{ env.EVIDENCE }}"
        if-no-files-found: error
    permissions:
      contents: read
