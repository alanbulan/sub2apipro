---
name: Upgrade repair diagnostics
'on':
  push:
    branches:
    - diagnose/upgrade-20261117
permissions:
  contents: read
concurrency:
  group: upgrade-repair-diagnostics
  cancel-in-progress: false
jobs:
  feishu-production-build:
    name: Frontend and embedded server build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: pnpm/action-setup@v6
      with:
        version: 9
    - uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - name: Use upstream Node 22 runtime for patched frontend dependencies
      uses: actions/setup-node@v6
      with:
        node-version: '22'
    - uses: actions/setup-go@v6
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum
    - name: Install frontend dependencies
      working-directory: frontend
      run: pnpm install --frozen-lockfile
    - name: Build frontend
      working-directory: frontend
      run: pnpm build
    - name: Verify embedded HTML nonce and cache behavior
      working-directory: backend
      run: go test -tags=embed,unit ./internal/web -count=1 -v
    - name: Build embedded server
      working-directory: backend
      env:
        CGO_ENABLED: '0'
      run: go build -tags embed -trimpath -o /tmp/sub2api-server ./cmd/server
