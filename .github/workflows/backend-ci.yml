    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-go@v6
      with:
        cache-dependency-path: backend/go.sum
        go-version: 1.27.4
    - name: Install isolated Redis fixture
      run: |
        bash scripts/ci-ubuntu-mirrors.sh
        if ! command -v redis-server >/dev/null; then
          bash scripts/ci-ubuntu-mirrors.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
        fi
    - name: Actual HTTP and Redis omission regressions
      working-directory: backend
      shell: bash
      run: |
        set -euo pipefail
        go test -race -tags=unit ./internal/service ./internal/handler ./internal/handler/admin -run '^Test(OmitOpenAIHistorical|OpenAI409|UpdateSettingsOpenAI409)' -count=1 -v -timeout=5m 2>&1 | tee "$RUNNER_TEMP/omit-history-protocol.log"
    - name: Same HTTP regression against pinned pre-fix omission code must fail
      shell: bash
      run: |
        set -euo pipefail
        baseline=11f250894eab310cbd4508946c44c9e2a3a2eb48
        callers=96ba36a85edab665ad5a035788fc07a40fd18762
        git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git "$baseline"
        git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git "$callers"
        git worktree add --detach "$RUNNER_TEMP/omit-metadata-red" HEAD
        cd "$RUNNER_TEMP/omit-metadata-red"
        # Keep the pre-rebuild callers coherent with the old omission API.
        # The historical metadata regression itself remains the candidate's.
        for target in backend/internal/service/openai_agent_message_recovery.go backend/internal/service/openai_agent_message_delivery.go backend/internal/service/openai_agent_message_recovery_error.go backend/internal/service/openai_account_scheduler.go backend/internal/service/openai_gateway_forward.go backend/internal/service/openai_codex_transform.go backend/internal/handler/openai_gateway_handler.go; do
          git show "$callers:$target" > "$target"
          test "$(git hash-object "$target")" = "$(git rev-parse "$callers:$target")"
        done
        for target in backend/internal/service/openai_ws_agent_recovery.go backend/internal/service/openai_ws_forwarder_ingress.go backend/internal/service/openai_ws_v2_passthrough_adapter.go backend/internal/service/openai_ws_http_bridge.go; do
          git show "$callers:$target" > "$target"
          test "$(git hash-object "$target")" = "$(git rev-parse "$callers:$target")"
        done
        ! git cat-file -e "$callers:backend/internal/service/openai_ws_readable_continuation.go" 2>/dev/null
        rm -- backend/internal/service/openai_ws_readable_continuation.go
        for target in backend/internal/service/openai_409_readable_shadow.go backend/internal/repository/gateway_cache_readable_shadow.go backend/internal/repository/gateway_cache_agent_shadow_epoch.go backend/internal/service/openai_400_omit_history.go backend/internal/service/openai_history_omission.go; do
          ! git cat-file -e "$callers:$target" 2>/dev/null
          rm -- "$target"
        done
        target=backend/internal/service/openai_409_omit_history.go
        git show "$baseline:$target" > "$target"
        test "$(git hash-object "$target")" = "$(git rev-parse "$baseline:$target")"
        set +e
        (cd backend && go test -race -tags=unit ./internal/handler -run '^TestOpenAI409ReplayMetadataHTTP$' -count=1 -v -timeout=5m) > "$RUNNER_TEMP/omit-history-red.log" 2>&1
        result=$?
        set -e
        cat "$RUNNER_TEMP/omit-history-red.log"
        test "$result" -ne 0
        ! grep -Eiq 'build failed|no tests to run|undefined:|panic|data race|--- SKIP:' "$RUNNER_TEMP/omit-history-red.log"
        grep -q -- '--- FAIL: TestOpenAI409ReplayMetadataHTTP' "$RUNNER_TEMP/omit-history-red.log"
        grep -q 'encrypted_agent_recovery_wire_changed' "$RUNNER_TEMP/omit-history-red.log"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: sync-20261114-encrypted-history-409-protocol-encrypted-history-409-protocol-${{ github.event.pull_request.head.sha
