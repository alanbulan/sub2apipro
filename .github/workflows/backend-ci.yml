          git worktree add --detach "$RUNNER_TEMP/ws-residual-red" "$CANDIDATE_SHA"
          tested_tree="$RUNNER_TEMP/ws-residual-red"
          while IFS= read -r target; do
            case "$target" in *_test.go) continue ;; esac
            if git cat-file -e "$baseline:$target" 2>/dev/null; then
              git show "$baseline:$target" > "$tested_tree/$target"
              test "$(git hash-object "$tested_tree/$target")" = "$(git rev-parse "$baseline:$target")"
            else
              rm -- "$tested_tree/$target"
            fi
          done < <(git diff --no-renames --name-only "$baseline" "$CANDIDATE_SHA" -- 'backend/**/*.go')
          git -C "$tested_tree" diff --exit-code "$baseline" -- 'backend/**/*.go' ':!backend/**/*_test.go'
        fi
        git -C "$tested_tree" diff --exit-code "$CANDIDATE_SHA" -- 'backend/**/*_test.go'
        if [ "$PHASE" = RED ]; then
          bash scripts/exclude-later-400-red-fixtures.sh "$baseline" "$tested_tree" "$CANDIDATE_SHA" | tee "$RUNNER_TEMP/ws-evidence/residual-400-exclusions.txt"
          bash scripts/exclude-later-http2-red-fixtures.sh "$baseline" "$tested_tree" "$CANDIDATE_SHA"
          bash scripts/prepare-moderation-red-fixtures.sh "$baseline" "$tested_tree" "$CANDIDATE_SHA" | tee "$RUNNER_TEMP/ws-evidence/residual-moderation-fixtures.txt"
          # The service test package also compiles unrelated fixtures added by
          # newer production. Match their historical APIs in this disposable
          # RED only; keep every selected 409/ticket test and all GREEN tests.
          for target in backend/internal/service/temp_unsched_pending_test.go backend/internal/service/temp_unsched_stream_timing_test.go backend/internal/service/temp_unsched_ws_forward_test.go backend/internal/service/openai_auth_connection_status_test.go backend/internal/service/openai_auth_connections_account_type_test.go backend/internal/service/account_ops_balance_test.go backend/internal/service/openai_excel_bps_bridge_failure_test.go backend/internal/service/quality_5xx_immediate_test.go; do
            candidate_blob=$(git rev-parse "$CANDIDATE_SHA:$target")
            test "$(git hash-object "$tested_tree/$target")" = "$candidate_blob"
            if git cat-file -e "$baseline:$target" 2>/dev/null; then
              expected=$(git rev-parse "$baseline:$target")
              git show "$baseline:$target" > "$tested_tree/$target"
              actual=$(git hash-object "$tested_tree/$target")
              test "$actual" = "$expected"
              printf 'path=%s baseline=%s candidate=%s candidate_blob=%s expected=%s actual=%s\n' "$target" "$baseline" "$CANDIDATE_SHA" "$candidate_blob" "$expected" "$actual" >> "$RUNNER_TEMP/ws-evidence/residual-service-fixtures.txt"
            else
              rm -- "$tested_tree/$target"
              test ! -e "$tested_tree/$target"
              printf 'path=%s baseline=%s candidate=%s candidate_blob=%s baseline_blob=absent actual=absent\n' "$target" "$baseline" "$CANDIDATE_SHA" "$candidate_blob" >> "$RUNNER_TEMP/ws-evidence/residual-service-fixtures.txt"
            fi
          done
        fi
        for target in backend/internal/handler/openai_409_ws_rebuild_test.go backend/internal/handler/openai_409_ws_oracle_test.go backend/internal/service/openai_409_ws_ticket_test.go backend/internal/service/openai_ws_agent_recovery.go backend/internal/service/openai_ws_forwarder_payload.go backend/internal/service/openai_gateway_passthrough.go; do
          git hash-object "$tested_tree/$target" >> "$RUNNER_TEMP/ws-evidence/residual-blobs.txt"
        done
        # Run both independently even when one oracle fails. Neither a
        # compilation failure nor a missing diagnostic is accepted as RED.
        failed=0
        for suite in ws-residual ws-ticket; do
          package=handler
          test_name=TestOpenAI409WSResidualRepairs
          if [ "$suite" = ws-ticket ]; then package=service; test_name=TestOpenAI409WSTicketBoundEgress; fi
          set +e
          (cd "$tested_tree/backend" && go test -race -json -tags=unit "./internal/$package" -run "^$test_name$" -count=1 -timeout=5m) > "$RUNNER_TEMP/ws-evidence/$suite.jsonl" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/ws-evidence/$suite.jsonl"
          python3 scripts/assert-ws-readable.py "$PHASE" "$result" "$RUNNER_TEMP/ws-evidence/$suite.jsonl" "$suite" || failed=1
        done
        test "$failed" = 0
