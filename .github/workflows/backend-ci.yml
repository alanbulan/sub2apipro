          for test_file in backend/internal/handler/openai_ws_client_identity_test.go backend/internal/handler/openai_ws_nested_identity_test.go backend/internal/service/openai_nested_identity_test.go; do
            cp "$test_file" "$red_tree/$test_file"
          done
          printf 'RED supporting tree: %s; unchanged candidate tests: %s\n' ec007920de042797299fc7cf2c034ad24c136462 "$EXPECTED_HEAD"
          cd "$red_tree"
        fi
        if [ "$PHASE" = RED ]; then
          for file in "${files[@]}"; do
            git show "77455cf755fa0f119367b911704f11df88e7917e:$file" > "$file"
          done
        fi
        {
          echo "candidate=$EXPECTED_HEAD phase=$PHASE baseline=77455cf755fa0f119367b911704f11df88e7917e"
          for file in "${files[@]}"; do
            if [ "$PHASE" = RED ]; then
              test "$(git hash-object "$file")" = "$(git rev-parse "77455cf755fa0f119367b911704f11df88e7917e:$file")"
