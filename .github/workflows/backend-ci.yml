  sync-20261114-ai-ops-proposal-cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-go@v6
      with:
        cache-dependency-path: backend/go.sum
        go-version: 1.27.4
    - name: Cancellation authorization and ledger boundaries
      working-directory: backend
      run: go test -race -tags=unit ./internal/repository ./internal/handler/admin -run '^TestAIOpsCancel' -count=1 -v -timeout=5m
    - name: PostgreSQL cancellation, replay and concurrent execution
      working-directory: backend
      env:
        CI: 'true'
        GOTRACEBACK: crash
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ../evidence
        uname -a > ../evidence/kernel.txt
        go version > ../evidence/toolchain.txt
        go env GOOS GOARCH CGO_ENABLED GOTOOLCHAIN >> ../evidence/toolchain.txt
        docker version > ../evidence/docker-version.txt
        docker info > ../evidence/docker-info.txt
        if ! command -v gdb >/dev/null; then
          bash ../scripts/ci-ubuntu-mirrors.sh
          bash scripts/ci-ubuntu-mirrors.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb
        fi
        ulimit -c unlimited
        sudo sysctl -w "kernel.core_pattern=$RUNNER_TEMP/ai-ops-cancel.core.%p" > ../evidence/core-pattern.txt
        export GORACE="log_path=$PWD/../evidence/race history_size=4"
        binary="$RUNNER_TEMP/ai-ops-cancel.test"
        go test -c -race -tags=integration ./internal/repository -o "$binary"
        set +e
        "$binary" -test.run '^TestAIOpsPostgres(Cancel|ConcurrentCancel)' -test.count=1 -test.v=true -test.timeout=10m > ../evidence/integration.log 2>&1
        result=$?
        set -e
        cat ../evidence/integration.log
        printf '%s\n' "$result" > ../evidence/exit.txt
        if [ "$result" -ne 0 ]; then
          for core in "$RUNNER_TEMP"/ai-ops-cancel.core.*; do
            [ -f "$core" ] || continue
            # Never upload raw core files or argument/local values.
            gdb -batch -ex 'set print frame-arguments none' -ex 'thread apply all bt' \
              "$binary" "$core" > "../evidence/backtrace-$(basename "$core").txt" 2>&1 || true
          done
          exit "$result"
        fi
        ! grep -Eq 'no tests to run|--- SKIP:|WARNING: DATA RACE|race detected during execution' ../evidence/integration.log
        for regression in CancelledProposalCannotBeRevivedOrApplied CancellationCannotUndoAnAppliedAction ConcurrentCancelAndApplyHaveOneWinner; do
          grep -q -- "=== RUN   TestAIOpsPostgres$regression$" ../evidence/integration.log
          grep -q -- "--- PASS: TestAIOpsPostgres$regression " ../evidence/integration.log
        done
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: sync-20261114-ai-ops-proposal-cancellation-ai-ops-cancellation-${{ github.event.pull_request.head.sha || github.sha
          }}
        path: evidence/
        if-no-files-found: warn
        retention-days: 14
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
  sync-20261114-anthropic-413-red:
    name: RED - pinned production source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ff23a988f4c5825ec06a7efb4e0f16f2b1e65ced
    - uses: actions/setup-go@v6
      with:
        cache-dependency-path: backend/go.sum
        go-version: 1.27.4
    - name: Run real handler regression against pre-fix source
      shell: bash
      run: |
        set -euo pipefail
        evidence="$RUNNER_TEMP/anthropic-413-red"
        mkdir -p "$evidence"
        test "$(git rev-parse HEAD)" = "$RED_BASE_SHA"
        git diff --exit-code
        test -z "$(git status --porcelain)"
        git fetch --no-tags --depth=1 origin "$EXPECTED_HEAD_SHA"
        test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD_SHA"
        regression=backend/internal/handler/anthropic_413_test.go
        test ! -e "$regression"
        restore() {
          rm -f -- "$regression"
          git diff --exit-code
          test -z "$(git status --porcelain)"
        }
        trap restore EXIT
        git show "$EXPECTED_HEAD_SHA:$regression" > "$regression"
        {
          printf 'candidate=%s\nbase=%s\n' "$EXPECTED_HEAD_SHA" "$RED_BASE_SHA"
          git rev-parse HEAD^{tree}
          sha256sum "$regression"
          go version
          printf '%s\n' 'go test -json -tags=unit ./internal/handler -run ^TestAnthropic413MessagesHTTP$/^apikey$/^stream$ -count=1 -timeout=5m'
        } > "$evidence/metadata.txt"
        set +e
        (cd backend && go test -json -tags=unit ./internal/handler -run '^TestAnthropic413MessagesHTTP$/^apikey$/^stream$' -count=1 -timeout=5m) > "$evidence/red.jsonl" 2> "$evidence/red.stderr"
        result=$?
        set -e
        printf '%s\n' "$result" > "$evidence/exit-code.txt"
        cat "$evidence/red.jsonl" "$evidence/red.stderr"
        test "$result" -eq 1
        python3 - "$evidence/red.jsonl" <<'PY'
        import json, pathlib, sys
        events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
        test = "TestAnthropic413MessagesHTTP/apikey/stream"
        assert any(e.get("Test") == test and e.get("Action") == "run" for e in events), "regression did not run"
        assert any(e.get("Test") == test and e.get("Action") == "fail" for e in events), "intended regression did not fail"
        assert not any(e.get("Action") == "skip" for e in events), "skips are not RED evidence"
        output = "".join(e.get("Output", "") for e in events)
        assert "anthropic_413_wire_status" in output, "missing intended status assertion"
        assert "expected: 413" in output and "actual  : 502" in output, "wrong failure reason"
        assert not any(s in output for s in ("[build failed]", "panic:", "no tests to run")), "invalid RED evidence"
        PY
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: sync-20261114-anthropic-413-red-anthropic-413-red-${{ github.event.pull_request.head.sha || github.sha }}
        path: ${{ runner.temp }}/anthropic-413-red/
        if-no-files-found: error
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RED_BASE_SHA: ff23a988f4c5825ec06a7efb4e0f16f2b1e65ced
      REVIEW_RED_BASE_SHA: 4bb46c4c83de1f0cd08b7f3f4ba25ec01e3a3371
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
  sync-20261114-anthropic-413-review-red:
    name: RED - L1 and L2 on reviewed implementation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 4bb46c4c83de1f0cd08b7f3f4ba25ec01e3a3371
    - uses: actions/setup-go@v6
      with:
        cache-dependency-path: backend/go.sum
        go-version: 1.27.4
    - name: Require both independent-review failures in JSON and SSE
      shell: bash
      run: |
        set -euo pipefail
        evidence="$RUNNER_TEMP/anthropic-413-review-red"
        mkdir -p "$evidence"
        test "$(git rev-parse HEAD)" = "$REVIEW_RED_BASE_SHA"
        git diff --exit-code
        test -z "$(git status --porcelain)"
        git fetch --no-tags --depth=1 origin "$EXPECTED_HEAD_SHA"
        test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD_SHA"
        regression=backend/internal/handler/anthropic_413_review_test.go
        test ! -e "$regression"
        restore() {
          rm -f -- "$regression"
          git diff --exit-code
          test -z "$(git status --porcelain)"
        }
        trap restore EXIT
        git show "$EXPECTED_HEAD_SHA:$regression" > "$regression"
        {
          printf 'candidate=%s\nreview_base=%s\n' "$EXPECTED_HEAD_SHA" "$REVIEW_RED_BASE_SHA"
          git rev-parse HEAD^{tree}
          sha256sum "$regression"
          go version
          printf '%s\n' 'go test -json -tags=unit ./internal/handler -run ^TestAnthropic413Review(AutoConfigNoCooldown|BudgetRepairMonitoring)$ -count=1 -timeout=5m'
        } > "$evidence/metadata.txt"
        set +e
        (cd backend && go test -json -tags=unit ./internal/handler -run '^TestAnthropic413Review(AutoConfigNoCooldown|BudgetRepairMonitoring)$' -count=1 -timeout=5m) > "$evidence/red.jsonl" 2> "$evidence/red.stderr"
        result=$?
        set -e
        printf '%s\n' "$result" > "$evidence/exit-code.txt"
        cat "$evidence/red.jsonl" "$evidence/red.stderr"
        test "$result" -eq 1
        python3 - "$evidence/red.jsonl" <<'PY'
        import json, pathlib, sys
        events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
        markers = {
            "TestAnthropic413ReviewAutoConfigNoCooldown": "anthropic_413_L1_final_observation",
            "TestAnthropic413ReviewBudgetRepairMonitoring": "anthropic_413_L2_final_visible",
        }
        for parent, marker in markers.items():
            for boundary in ("json", "sse"):
                test = parent + "/" + boundary
                assert any(e.get("Test") == test and e.get("Action") == "run" for e in events), f"missing test: {test}"
                assert any(e.get("Test") == test and e.get("Action") == "fail" for e in events), f"missing intended failure: {test}"
                output = "".join(e.get("Output", "") for e in events if e.get("Test") == test)
                assert marker in output, f"wrong failure reason: {test}"
        assert not any(e.get("Action") == "skip" for e in events), "skips are not RED evidence"
        output = "".join(e.get("Output", "") for e in events)
        assert not any(s in output for s in ("[build failed]", "panic:", "no tests to run")), "invalid RED evidence"
        PY
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: sync-20261114-anthropic-413-review-red-anthropic-413-review-red-${{ github.event.pull_request.head.sha || github.sha
          }}
        path: ${{ runner.temp }}/anthropic-413-review-red/
        if-no-files-found: error
    env:
