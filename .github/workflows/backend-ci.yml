  credential-operation-errors-seam:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Record exact tested head
      env:
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        mkdir -p evidence
        git rev-parse HEAD | tee evidence/head.txt
        test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
    - uses: actions/setup-go@v6
      with:
        cache-dependency-path: backend/go.sum
        go-version: 1.27.3
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: pnpm/action-setup@v6
      with:
        version: 9
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - name: Prove refresh policy regression on original 3b18f8da1
      shell: bash
      env:
        REFRESH_POLICY_BASELINE: 3b18f8da1dd17dd078590d5942c4308d005d1b89
      run: |
        set -euo pipefail
        red_tree="$RUNNER_TEMP/credential-refresh-policy-red"
        mkdir -p "$red_tree"
        git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git "$REFRESH_POLICY_BASELINE"
        git rev-parse "$REFRESH_POLICY_BASELINE" | tee evidence/refresh-policy-red-head.txt
        git archive "$REFRESH_POLICY_BASELINE" | tar -x -C "$red_tree"
        git show "$REFRESH_POLICY_BASELINE:backend/internal/service/credential_operation_failure.go" | sha256sum > evidence/refresh-policy-red-source.sha256
        test "$(cut -d ' ' -f 1 evidence/refresh-policy-red-source.sha256)" = "$(sha256sum "$red_tree/backend/internal/service/credential_operation_failure.go" | cut -d ' ' -f 1)"
        cp backend/internal/service/credential_operation_refresh_policy_test.go "$red_tree/backend/internal/service/"
        cp backend/internal/repository/credential_operation_refresh_policy{_test,_integration_test}.go "$red_tree/backend/internal/repository/"
        cp tools/fixtures/credential-refresh-policy-errors.json "$red_tree/tools/fixtures/"
        sha256sum backend/internal/{service,repository}/credential_operation_refresh_policy_test.go backend/internal/repository/credential_operation_refresh_policy_integration_test.go tools/fixtures/credential-refresh-policy-errors.json > evidence/refresh-policy-test-inputs.sha256
        set +e
        (cd "$red_tree/backend" && go test -tags=unit ./internal/service -run '^TestCredentialOperationRefreshPolicy' -count=1 -v) > evidence/refresh-policy-red-service.log 2>&1
        service_result=$?
        (cd "$red_tree/backend" && go test -tags=unit ./internal/repository -run '^TestCredentialOperationRefreshPolicy' -count=1 -v) > evidence/refresh-policy-red-http.log 2>&1
        http_result=$?
        (cd "$red_tree/backend" && go test -tags=integration ./internal/repository -run '^TestCredentialOperationRefreshPolicyPostgres' -count=1 -v) > evidence/refresh-policy-red-storage.log 2>&1
        storage_result=$?
        set -e
        cat evidence/refresh-policy-red-service.log
        cat evidence/refresh-policy-red-http.log
        cat evidence/refresh-policy-red-storage.log
        printf 'service=%s\nhttp=%s\nstorage=%s\n' "$service_result" "$http_result" "$storage_result" > evidence/refresh-policy-red-exit.txt
        test "$service_result" -ne 0
        test "$http_result" -ne 0
        test "$storage_result" -ne 0
        if grep -Eq '\[build failed\]|\[setup failed\]|undefined:|syntax error:|no tests to run|panic:' evidence/refresh-policy-red-{service,http,storage}.log; then
          echo 'Compilation/setup errors are not regression evidence'
          exit 1
        fi
        grep -F -- '--- FAIL: TestCredentialOperationRefreshPolicyStructuredSignals/type-invalid_grant' evidence/refresh-policy-red-service.log
        grep -F -- '--- FAIL: TestCredentialOperationRefreshPolicyTypeInvalidGrantRaceRecovery' evidence/refresh-policy-red-service.log
        grep -F -- '--- FAIL: TestCredentialOperationRefreshPolicyTerminalAndClientScope/type-invalid_client' evidence/refresh-policy-red-service.log
        grep -F -- '--- FAIL: TestCredentialOperationRefreshPolicyHTTPTypeInvalidGrantRace' evidence/refresh-policy-red-http.log
        grep -F -- '--- FAIL: TestCredentialOperationRefreshPolicyPostgresTypeInvalidGrantRace' evidence/refresh-policy-red-storage.log
    - name: Verify refresh policy on exact current head
      working-directory: backend
      shell: bash
      run: |
        set -o pipefail
        go test -tags=unit ./internal/service ./internal/repository -run '^TestCredentialOperationRefreshPolicy' -count=1 -v 2>&1 | tee ../evidence/refresh-policy-green.log
        go test -tags=integration ./internal/repository -run '^TestCredentialOperationRefreshPolicyPostgres' -count=1 -v 2>&1 | tee ../evidence/refresh-policy-green-storage.log
    - name: Offline worker results and regressions
      shell: bash
      run: |
        set -o pipefail
        python -m tools.credential_operation_seam "$GITHUB_WORKSPACE/evidence/worker.json" 2>&1 | tee evidence/worker.log
        python -m unittest tools.test_openai_oauth_reauth_worker tools.test_openai_oauth_reauth_engines tools.test_openai_oauth_reauth_runtime_controls tools.test_openai_codex_oauth_adapter -v 2>&1 | tee evidence/python.log
        node --test tools/test_openai_codex_diagnostics.mjs 2>&1 | tee evidence/node.log
    - name: Targeted service and ownership regressions
      working-directory: backend
      shell: bash
      run: |
        set -o pipefail
        go test -tags=unit ./internal/service -run 'Test(CredentialOperation|AccountTokenGuardV2|SessionStudioDiagnostic|LocalProtocolDiagnostic|OpenAIOAuthReauth|OAuthRefresh)' -count=1 -v 2>&1 | tee ../evidence/service.log
    - name: Worker to PostgreSQL to real admin API
      working-directory: backend
      shell: bash
      env:
        CREDENTIAL_OPERATION_WORKER_FIXTURE: ${{ github.workspace }}/evidence/worker.json
        CREDENTIAL_OPERATION_API_FIXTURE: ${{ github.workspace }}/evidence/api.json
      run: |
        set -o pipefail
        go test -tags=integration ./internal/integration/credentialops -run '^TestCredentialOperationWorkerStorageAPISeam$' -count=1 -v 2>&1 | tee ../evidence/storage-api.log
        go test -tags=integration ./internal/repository -run 'Test(AccountTokenGuardV2Repository|ReloginBudget)' -count=1 -v 2>&1 | tee ../evidence/ownership.log
        test -s ../evidence/api.json
    - name: Render actual persisted API records
      shell: bash
      env:
        CREDENTIAL_OPERATION_API_FIXTURE: ${{ github.workspace }}/evidence/api.json
        CREDENTIAL_OPERATION_REQUIRE_SEAM: '1'
      run: |
        set -o pipefail
        pnpm --dir frontend install --frozen-lockfile
        pnpm --dir frontend exec vitest run src/views/admin/ops/__tests__/TokenGuardV2View.spec.ts src/views/admin/ops/__tests__/CredentialOperationSeam.spec.ts src/components/account/__tests__/CredentialOperationFailure.spec.ts 2>&1 | tee evidence/frontend.log
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: credential-operation-errors-${{ github.event_name }}-${{ github.run_id }}
        path: evidence/
        if-no-files-found: error
        retention-days: 14
