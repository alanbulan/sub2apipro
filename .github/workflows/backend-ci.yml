          fi
        done
        cd backend
        go test -race -tags=unit ./internal/handler ./internal/service ./internal/config -run '^TestIssue805' -count=1 -v -timeout=10m 2>&1 | tee "$RUNNER_TEMP/issue805-evidence/green.log"
        if grep -Eiq 'no tests to run|--- SKIP:|panic:|panic_recovered|fatal error:|runtime error:|WARNING: DATA RACE' "$RUNNER_TEMP/issue805-evidence/green.log"; then exit 1; fi
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: sync-20261114-issue805-owner-policy-evidence-issue805-${{ env.EXPECTED_HEAD_SHA }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/issue805-evidence/
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
  sync-20261114-issue811-acl-followup-acl-concurrency:
