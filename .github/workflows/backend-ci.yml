name: Reusable CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sync-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Use upstream Node 22 runtime for patched frontend dependencies
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check sync scripts and recovery behavior
        id: sync
        run: |
          set -o pipefail
          bash -n deploy/action-deploy.sh deploy/install-action-deploy.sh
          sh -n deploy/cron/upstream-sync
          bash -n scripts/check-upstream.sh
          bash -n .github/scripts/report-ci-failure.sh
          python3 -m unittest discover -s deploy/tests -p 'test_action_deploy.py'
          node --test deploy/tests/upstream-sync-ci.test.cjs 2>&1 | tee sync-test.log
      - name: Report sync automation failure
        if: failure() && steps.sync.outcome == 'failure'
        run: bash .github/scripts/report-ci-failure.sh sync-test.log
      - name: Save sync automation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-test-log-${{ github.run_attempt }}
          path: sync-test.log
          if-no-files-found: ignore
          retention-days: 14

  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/install.sh deploy/install-mihomo-codex.sh deploy/migrate-mihomo-managed.sh
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - name: Check Docker Compose trusted proxy environment
        run: /bin/sh deploy/tests/docker-compose-trusted-proxies-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Install Redis for isolated snapshot adapter checks
        run: |
          if ! command -v redis-server >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends redis-server
          fi
          redis-server --version
      - name: Gateway initialization and fork module regression
        id: gateway
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          go test -tags=unit ./internal/server/routes ./internal/handler -run 'Test(GatewayRoutesGroupModelAllowlist|ConversationCapture|OpenAIWSConversationRecorder)' 2>&1 | tee gateway-test.log
      - name: Gateway idle worker and account operations regression tests
        working-directory: backend
        run: go test -tags=unit ./internal/service -run '^Test(GatewayAccountOps|FullAccountOps|AccountOps|ContentModeration(Workers|Worker|IdleWorker|Runtime|Async))' -count=1
      - name: Verify scope conflict regression against original handlers
        if: github.head_ref == 'fix/quality-template-switch-conflicts' || github.ref_name == 'fix/quality-template-switch-conflicts'
        shell: bash
        run: |
          set -euo pipefail
          target=backend/internal/handler/admin/scheduled_test_handler.go
          cp "$target" "$RUNNER_TEMP/quality-current-handler.go"
          trap 'cp "$RUNNER_TEMP/quality-current-handler.go" "$target"' EXIT
          git fetch --no-tags --depth=1 origin 9fcfe25d600a331abcc28a1788e597e5542d4cd3
          git show 9fcfe25d600a331abcc28a1788e597e5542d4cd3:"$target" > "$target"
          set +e
          (cd backend && go test ./internal/handler/admin -run '^TestQualityScopeConflictsUse409ForUpdateAndDelete$' -count=1) > "$RUNNER_TEMP/quality-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/quality-red.log"
          test "$result" -ne 0
          grep -q 'FAIL: TestQualityScopeConflictsUse409ForUpdateAndDelete' "$RUNNER_TEMP/quality-red.log"
          grep -Eq 'actual.*(400|500)' "$RUNNER_TEMP/quality-red.log"
      - name: Unit tests
        id: unit
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          make test-unit 2>&1 | tee unit-test.log
      - name: Integration tests
        id: integration
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          make test-integration 2>&1 | tee integration-test.log
      - name: Report backend failure
        if: failure() && (steps.gateway.outcome == 'failure' || steps.unit.outcome == 'failure' || steps.integration.outcome == 'failure')
        run: bash .github/scripts/report-ci-failure.sh backend/*-test.log
      - name: Save backend test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-logs-${{ github.run_attempt }}
          path: backend/*-test.log
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Use upstream Node 22 runtime for patched frontend dependencies
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        id: frontend
        shell: bash
        run: |
          set -o pipefail
          make test-frontend 2>&1 | tee frontend-test.log
      - name: Report frontend failure
        if: failure() && steps.frontend.outcome == 'failure'
        run: bash .github/scripts/report-ci-failure.sh frontend-test.log
      - name: Save frontend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-log-${{ github.run_attempt }}
          path: frontend-test.log
          if-no-files-found: ignore
          retention-days: 14

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh
      - run: bash -n deploy/upgrade-k3s.sh
      - run: python -m unittest discover -s deploy/tests -p 'test_upgrade_k3s.py'
      - name: Install checksum-pinned Kustomize for offline gateway rendering
        run: |
          mkdir -p "$RUNNER_TEMP/sub2api-kustomize"
          curl --fail --show-error --silent --location \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/sub2api-kustomize/kustomize.tar.gz"
          printf '%s  %s\n' 'ea375e7372f9aa029129d4b2d16c66b7750b7f1213c4f66f910d981c895818d8' \
            "$RUNNER_TEMP/sub2api-kustomize/kustomize.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/sub2api-kustomize/kustomize.tar.gz" -C "$RUNNER_TEMP/sub2api-kustomize" kustomize
          echo "$RUNNER_TEMP/sub2api-kustomize" >> "$GITHUB_PATH"
      - run: python -m unittest discover -s deploy/tests -p 'test_gateway_render*.py'
      - name: Offline multi-host contract checks
        run: python -m unittest discover -s deploy/tests -p 'test_multihost_preflight.py'
      - run: python -m unittest discover -s deploy/tests -p 'test_migrate_reauth_managed.py'
      - run: python -m unittest discover -s deploy/connection-diagnostics -p 'test_collect.py'

  prism-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install adapter wheels
        run: >-
          python -m pip install --only-binary=:all: -r prism-adapter/requirements.txt
      - name: Run offline adapter and cache tests
        run: python -m unittest discover -s prism-adapter -p 'test_*.py' -v

  upstream-security-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify upstream Go security baseline
        run: go version | grep -q 'go1.27.2'
      - name: Install Redis for isolated snapshot adapter checks
        run: |
          if ! command -v redis-server >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends redis-server
          fi
          redis-server --version
      - name: Gateway initialization and fork module regression on upstream Go
        working-directory: backend
        run: go test -tags=unit ./internal/server/routes ./internal/handler -run 'Test(GatewayRoutesGroupModelAllowlist|ConversationCapture|OpenAIWSConversationRecorder)'
      - name: Unit and integration tests on upstream Go
        working-directory: backend
        run: |
          make test-unit
          make test-integration
      - name: Upstream golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend
      - name: Vulnerability scan on upstream Go
        working-directory: backend
        env:
          GOTOOLCHAIN: go1.27.3
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  feishu-production-build:
    name: Frontend and embedded server build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Use upstream Node 22 runtime for patched frontend dependencies
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Build embedded server
        working-directory: backend
        env:
          CGO_ENABLED: '0'
        run: go build -tags embed -trimpath -o /tmp/sub2api-server ./cmd/server

  upstream-security-baseline-v1273:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify upstream Go security baseline
        run: go version | grep -q 'go1.27.3'
      - name: Install Redis for isolated snapshot adapter checks
        run: |
          if ! command -v redis-server >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends redis-server
          fi
          redis-server --version
      - name: Gateway initialization and fork module regression on upstream Go
        working-directory: backend
        run: go test -tags=unit ./internal/server/routes ./internal/handler -run 'Test(GatewayRoutesGroupModelAllowlist|ConversationCapture|OpenAIWSConversationRecorder)'
      - name: Unit and integration tests on upstream Go
        id: upstream_tests
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          make test-unit 2>&1 | tee upstream-unit-test.log
          make test-integration 2>&1 | tee upstream-integration-test.log
      - name: Report upstream backend failure
        if: failure() && steps.upstream_tests.outcome == 'failure'
        run: bash .github/scripts/report-ci-failure.sh backend/upstream-*-test.log
      - name: Upstream golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend
      - name: Vulnerability scan on upstream Go
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  real-proxy-responses:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Fetch verified Caddy 2.11.7 binary
        shell: bash
        run: |
          set -euo pipefail
          proxy_fixture_dir="$RUNNER_TEMP/sub2api-caddy-contract"
          mkdir -p "$proxy_fixture_dir"
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 90 \
            https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz \
            --output "$proxy_fixture_dir/caddy.tar.gz"
          echo '727b91701a392de6ebc5027509f548bf39979e5216340d0faed8fa5e69c84f8b  '"$proxy_fixture_dir/caddy.tar.gz" | sha256sum --check --strict
          tar -xzf "$proxy_fixture_dir/caddy.tar.gz" -C "$proxy_fixture_dir" caddy
          echo "CADDY_BIN=$proxy_fixture_dir/caddy" >> "$GITHUB_ENV"
      - name: Real proxy and two synthetic HTTP SSE origins
        run: python3 deploy/traffic/test_caddy_responses.py
      - name: Verified HTTPS origins with synthetic CA and SNI failures
        run: python3 deploy/traffic/test_caddy_responses_tls.py

  isolated-real-applications:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build actual cmd/server for the isolated runner only
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOMAXPROCS: '1'
          GOFLAGS: '-p=1'
        run: |
          set -euo pipefail
          fullapp_fixture_dir="$RUNNER_TEMP/sub2api-fullapp"
          mkdir -p "$fullapp_fixture_dir"
          fullapp_fixture_commit="$(git rev-parse HEAD)"
          go build -trimpath -ldflags="-X main.Commit=$fullapp_fixture_commit" \
            -o "$fullapp_fixture_dir/sub2api" ./cmd/server
          echo "FULLAPP_BIN=$fullapp_fixture_dir/sub2api" >> "$GITHUB_ENV"
          echo "FULLAPP_EXPECTED_COMMIT=$fullapp_fixture_commit" >> "$GITHUB_ENV"
          echo "FULLAPP_REPORT=$fullapp_fixture_dir/result.json" >> "$GITHUB_ENV"
      - name: Fetch checksum-pinned Caddy 2.11.7
        run: |
          set -euo pipefail
          fullapp_fixture_dir="$RUNNER_TEMP/sub2api-fullapp"
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 90 \
            https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz \
            --output "$fullapp_fixture_dir/caddy.tar.gz"
          echo '727b91701a392de6ebc5027509f548bf39979e5216340d0faed8fa5e69c84f8b  '"$fullapp_fixture_dir/caddy.tar.gz" | sha256sum --check --strict
          tar -xzf "$fullapp_fixture_dir/caddy.tar.gz" -C "$fullapp_fixture_dir" caddy
          echo "CADDY_BIN=$fullapp_fixture_dir/caddy" >> "$GITHUB_ENV"
      - name: Initialize two full Sub2API applications and real Caddy in isolation
        timeout-minutes: 15
        run: python3 deploy/traffic/test_fullapp_bootstrap.py
      - name: Build isolated seed and model fixture only
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOMAXPROCS: '1'
          GOFLAGS: '-p=1'
        run: |
          set -euo pipefail
          go build -tags=fullappfixture -trimpath \
            -o "$RUNNER_TEMP/sub2api-fullapp/fullapp-fixture" ./cmd/fullapp-fixture
          echo "FULLAPP_FIXTURE_BIN=$RUNNER_TEMP/sub2api-fullapp/fullapp-fixture" >> "$GITHUB_ENV"
      - name: Authenticated lifecycle, EOF boundaries and shared queued cancellation through two complete applications
        timeout-minutes: 15
        env:
          FULLAPP_REPORT: ${{ runner.temp }}/sub2api-fullapp/model-result.json
        run: python3 deploy/traffic/test_fullapp_models.py
      - name: Save bounded fixture metadata, no config or application logs
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/sub2api-fullapp/result.json" ]; then
            cat "$RUNNER_TEMP/sub2api-fullapp/result.json"
          fi
          if [ -f "$RUNNER_TEMP/sub2api-fullapp/model-result.json" ]; then
            cat "$RUNNER_TEMP/sub2api-fullapp/model-result.json"
          fi

  quality-ownership-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Use upstream Node 22 runtime for patched frontend dependencies
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Install isolated screenshot tool
        run: |
          npm install --prefix "$RUNNER_TEMP/quality-browser" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/quality-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Render actual component with offline fixtures
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/quality-browser/node_modules/playwright
          QUALITY_SCREENSHOT_DIR: ${{ runner.temp }}/quality-screenshots
        run: node scripts/quality-ownership-screenshot.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-ownership-ui-${{ github.sha }}
          path: ${{ runner.temp }}/quality-screenshots
          if-no-files-found: error

  model-billing-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Test actual billing services and admin configuration handlers
        working-directory: backend
        run: go test -tags=unit ./internal/service ./internal/handler/admin -run '^(TestModelBilling|TestAutoConfigModelBilling)' -count=1 -v -timeout=15m
  model-billing-scope-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Use upstream Node 22 runtime for patched frontend dependencies
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Exercise real configuration page, API pagination and locale keys
        env:
          NODE_OPTIONS: --max-old-space-size=1024
        run: >-
          pnpm --dir frontend exec vitest run
          src/views/admin/__tests__/AutoConfigView.spec.ts
          src/utils/__tests__/modelBilling.spec.ts
          src/i18n/__tests__/localeKeyCompleteness.spec.ts
          src/components/admin/operations/__tests__/AutoConfigHistory.spec.ts
          --maxWorkers=1 --minWorkers=1

      - name: Install isolated browser for offline real-page checks
        run: |
          npm install --prefix "$RUNNER_TEMP/model-billing-browser" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/model-billing-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Fetch immutable baseline for before screenshot
        run: git fetch --no-tags --depth=1 origin 973d4bbd0064121a5533e0d3232ece6043f0d5fc
      - name: Exercise real page with synthetic local HTTP and capture desktop/mobile
        env:
          NODE_OPTIONS: --max-old-space-size=1024
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/model-billing-browser/node_modules/playwright
          MODEL_BILLING_SCREENSHOT_DIR: ${{ runner.temp }}/model-billing-screenshots
        run: node scripts/model-billing-groups-browser.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: model-billing-groups-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/model-billing-screenshots
          if-no-files-found: error

  pool-capacity-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Prove blocking regressions fail on previously reviewed head
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            backend/internal/service/ratelimit_service.go
            backend/internal/service/gateway_model_availability.go
            backend/internal/service/openai_gateway_model_availability.go
          )
          trap 'git restore --source=HEAD -- "${targets[@]}"' EXIT
          for target in "${targets[@]}"; do
            git show a11c678d0ba8b899177682b8e54acccf14eeca2f:"$target" > "$target"
          done
          set +e
          (cd backend && go test -tags=unit ./internal/service ./internal/handler -run '^TestPoolModelNegativeCache' -count=1) > "$RUNNER_TEMP/pool-capacity-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/pool-capacity-red.log"
          test "$result" -ne 0
          ! grep -q '\[build failed\]' "$RUNNER_TEMP/pool-capacity-red.log"
          grep -q -- '--- FAIL: TestPoolModelNegativeCacheWriterRespectsPoolDefaultAndOverrides' "$RUNNER_TEMP/pool-capacity-red.log"
          grep -q -- '--- FAIL: TestPoolModelNegativeCacheTwoLayersHistoricalObservationsDoNotRenew' "$RUNNER_TEMP/pool-capacity-red.log"
      - name: Verify exact head and existing boundary regressions
        working-directory: backend
        run: |
          git diff --exit-code
          go test -tags=unit ./internal/service ./internal/handler -run 'Test(PoolModelNegativeCache|PoolCapacity|ModelCapabilityCooldownDiagnosis|AnthropicModelCapabilityCooldownDiagnosis|DiagnoseModelAvailability|OpenAIDiagnoseModelAvailability|RateLimitService_.*Model|NonStreaming.*SSEToJSON|OpenAI.*Capacity|OpenAI.*TempRule|OpenAI.*ReplayBoundary|OpenAI.*ModelNotFound|OpenAIAdmissionPreservesCapabilityCooldownCause|ClassifyNoAccountError)' -count=1

