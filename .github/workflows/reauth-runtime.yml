  sync-20261118-multihost-fullapp-isolated-real-applications:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        check-latest: false
        cache: true
        cache-dependency-path: backend/go.sum
        go-version: 1.27.4
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Build actual cmd/server for the isolated runner only
      working-directory: backend
      env:
        CGO_ENABLED: '0'
        GOMAXPROCS: '1'
        GOFLAGS: -p=1
      run: |
        set -euo pipefail
        fullapp_fixture_dir="$RUNNER_TEMP/sub2api-fullapp"
        mkdir -p "$fullapp_fixture_dir"
        fullapp_fixture_commit="$(git rev-parse HEAD)"
        go build -trimpath -ldflags="-X main.Commit=$fullapp_fixture_commit" \
          -o "$fullapp_fixture_dir/sub2api" ./cmd/server
        echo "FULLAPP_BIN=$fullapp_fixture_dir/sub2api" >> "$GITHUB_ENV"
        echo "FULLAPP_EXPECTED_COMMIT=$fullapp_fixture_commit" >> "$GITHUB_ENV"
        echo "FULLAPP_REPORT=$fullapp_fixture_dir/result.json" >> "$GITHUB_ENV"
    - name: Fetch checksum-pinned Caddy 2.11.7
      run: |
        set -euo pipefail
        fullapp_fixture_dir="$RUNNER_TEMP/sub2api-fullapp"
        curl --fail --location --silent --show-error \
          --retry 3 --retry-delay 2 --retry-max-time 120 \
          --connect-timeout 10 --max-time 90 \
          https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz \
          --output "$fullapp_fixture_dir/caddy.tar.gz"
        echo '727b91701a392de6ebc5027509f548bf39979e5216340d0faed8fa5e69c84f8b  '"$fullapp_fixture_dir/caddy.tar.gz" | sha256sum --check --strict
        tar -xzf "$fullapp_fixture_dir/caddy.tar.gz" -C "$fullapp_fixture_dir" caddy
        echo "CADDY_BIN=$fullapp_fixture_dir/caddy" >> "$GITHUB_ENV"
    - name: Initialize two full Sub2API applications and real Caddy in isolation
      timeout-minutes: 15
      run: python3 deploy/traffic/test_fullapp_bootstrap.py
    - name: Build isolated seed and model fixture only
      working-directory: backend
      env:
        CGO_ENABLED: '0'
        GOMAXPROCS: '1'
        GOFLAGS: -p=1
      run: |
        set -euo pipefail
        go build -tags=fullappfixture -trimpath \
          -o "$RUNNER_TEMP/sub2api-fullapp/fullapp-fixture" ./cmd/fullapp-fixture
        echo "FULLAPP_FIXTURE_BIN=$RUNNER_TEMP/sub2api-fullapp/fullapp-fixture" >> "$GITHUB_ENV"
    - name: Authenticated lifecycle, EOF boundaries and shared queued cancellation through two complete applications
      timeout-minutes: 15
      env:
        FULLAPP_REPORT: ${{ runner.temp }}/sub2api-fullapp/model-result.json
      run: python3 deploy/traffic/test_fullapp_models.py
    - name: Save bounded fixture metadata, no config or application logs
      if: always()
      run: |
        if [ -f "$RUNNER_TEMP/sub2api-fullapp/result.json" ]; then
          cat "$RUNNER_TEMP/sub2api-fullapp/result.json"
        fi
        if [ -f "$RUNNER_TEMP/sub2api-fullapp/model-result.json" ]; then
          cat "$RUNNER_TEMP/sub2api-fullapp/model-result.json"
        fi
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    permissions:
      contents: read
  sync-20261118-ws-inherited-model-inherited-model:
    name: Inherited model ${{ matrix.phase }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        phase:
        - RED
        - GREEN
    env:
      CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
      PHASE: ${{ matrix.phase }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
    - name: Initialize evidence directory
      shell: bash
      run: |
        set -euo pipefail
        export EVIDENCE="$RUNNER_TEMP/ws-inherited-model-evidence"
        echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
        mkdir -p "$EVIDENCE"
    - uses: actions/checkout@v6
      with:
        ref: ${{ env.CANDIDATE }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@v6
      with:
        cache-dependency-path: backend/go.sum
        go-version: 1.27.4
    - name: Isolated Redis fixture dependency
      run: |
        if ! command -v redis-server >/dev/null; then
          bash "$GITHUB_WORKSPACE/scripts/ci-ubuntu-mirrors.sh"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
        fi
    - name: Exact source and identical candidate fixture
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$CANDIDATE"
        git diff --exit-code
        mkdir -p "$EVIDENCE"
        git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git da526bfbab47efd40549cab98f1069f9b2b45b9f
        python3 scripts/prepare-ws-inherited-model-red.py "$RUNNER_TEMP/ws-inherited-model-baseline" "$EVIDENCE"
        if [ "$PHASE" = RED ]; then
          echo "TEST_ROOT=$RUNNER_TEMP/ws-inherited-model-baseline" >> "$GITHUB_ENV"
        else
          echo "TEST_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        fi
        python3 -m unittest discover -s scripts -p 'test_ws_inherited_model_evidence.py' -v > "$EVIDENCE/parser-tests.log" 2>&1
    - name: Authenticated same-socket tool loop and refusal controls
      shell: bash
      run: |
        set -euo pipefail
        set +e
        (cd "$TEST_ROOT/backend" && go test -race -p=2 -json -tags=unit,inheritedmodel ./internal/handler -run '^TestOpenAIWSInheritedModel(ToolProof|ProofFences)$' -count=1 -timeout=5m) > "$EVIDENCE/handler.jsonl" 2>&1
        status=$?
        set -e
        printf '%s\n' "$status" > "$EVIDENCE/handler.exit"
        cat "$EVIDENCE/handler.jsonl"
        python3 scripts/ws-inherited-model-evidence.py handler "$PHASE" "$status" "$EVIDENCE/handler.jsonl" | tee "$EVIDENCE/handler-verdict.json"
    - name: Delivery, model scope and final wire integrity controls
      if: ${{ (success() || failure()) && env.TEST_ROOT != '' }}
      shell: bash
      run: |
        set -euo pipefail
        suite=guards
        pattern='^Test(OpenAIToolProvenanceDeliveryAndScope|OpenAIWSMixedOwnerFinalSendFences)$'
        if [ "$PHASE" = GREEN ]; then
          suite=guards_with_client_model
          pattern='^Test(OpenAIToolProvenanceDeliveryAndScope|OpenAIWSMixedOwnerFinalSendFences|OpenAIWSRecoveryEffectiveClientModel)$'
        fi
        set +e
        (cd "$TEST_ROOT/backend" && go test -race -p=2 -json -tags=unit,ownerconflict,inheritedmodel ./internal/service -run "$pattern" -count=1 -timeout=5m) > "$EVIDENCE/guards.jsonl" 2>&1
        status=$?
        set -e
        printf '%s\n' "$status" > "$EVIDENCE/guards.exit"
        cat "$EVIDENCE/guards.jsonl"
        python3 scripts/ws-inherited-model-evidence.py "$suite" "$PHASE" "$status" "$EVIDENCE/guards.jsonl" | tee "$EVIDENCE/guards-verdict.json"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: sync-20261118-ws-inherited-model-inherited-model-ws-inherited-model-${{ matrix.phase }}-${{ env.CANDIDATE }}
        path: ${{ env.EVIDENCE }}
        if-no-files-found: error
    permissions:
      contents: read
