        target=backend/internal/service/openai_agent_message_delivery.go
        fixture=backend/internal/service/openai_agent_pending_observation_test.go
        if [ "$PHASE" = RED ]; then
          git show "$PENDING_BASELINE:$target" > "$target"
          test "$(git hash-object "$target")" = "$(git rev-parse "$PENDING_BASELINE:$target")"
          test "$(git diff --name-only)" = "$target"
          python3 scripts/prepare-discovery-red-compat.py "$PENDING_BASELINE" . "$CANDIDATE" --target delivery --fixture "$fixture" --manifest "$EVIDENCE/discovery-compatibility.json"
          test "$(git diff --name-only)" = "$target"
        fi
        test "$(git hash-object "$fixture")" = "$(git rev-parse "$CANDIDATE:$fixture")"
        python3 - <<'PY'
        import json, os, pathlib, subprocess
        def git(*args):
            return subprocess.check_output(['git', *args], text=True).strip()
        target = 'backend/internal/service/openai_agent_message_delivery.go'
        fixture = 'backend/internal/service/openai_agent_pending_observation_test.go'
        result = {
            'candidate': git('rev-parse', 'HEAD'), 'baseline': os.environ['PENDING_BASELINE'],
            'phase': os.environ['PHASE'], 'test_blob': git('hash-object', fixture),
            'compatibility_manifest': 'discovery-compatibility.json' if os.environ['PHASE'] == 'RED' else None,
            'old_production_blob': git('rev-parse', os.environ['PENDING_BASELINE'] + ':' + target),
            'actual_production_blob': git('hash-object', target),
            'candidate_production_blob': git('rev-parse', 'HEAD:' + target),
            'changed_paths': git('diff', '--name-only').splitlines(),
        }
        (pathlib.Path(os.environ['EVIDENCE']) / 'source-manifest.json').write_text(json.dumps(result, indent=2) + '\n')
        PY
        python3 -B -m unittest discover -s scripts -p 'test_ws_inherited_model_evidence.py' -v > "$EVIDENCE/parser-tests.log" 2>&1
    - name: Deterministic pending deadline and independent backend error controls
      shell: bash
      run: |
        set -euo pipefail
        set +e
        (cd backend && go test -race -p=2 -json -tags=unit,inheritedmodel ./internal/service -run '^TestOpenAIAgentPendingObservation$' -count=1 -timeout=3m) > "$EVIDENCE/pending.jsonl" 2>&1
        status=$?
        set -e
        printf '%s\n' "$status" > "$EVIDENCE/pending.exit"
        cat "$EVIDENCE/pending.jsonl"
        python3 scripts/ws-inherited-model-evidence.py pending "$PHASE" "$status" "$EVIDENCE/pending.jsonl" | tee "$EVIDENCE/pending-verdict.json"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: sync-20261118-ws-inherited-model-pending-observation-ws-pending-observation-${{ matrix.phase }}-${{ env.CANDIDATE
          }}
        path: ${{ env.EVIDENCE }}
        if-no-files-found: error
    permissions:
      contents: read
