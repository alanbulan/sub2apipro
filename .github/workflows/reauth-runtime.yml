name: Re-login runtime
on:
  workflow_call:
  pull_request:
    paths:
      - 'tools/openai_oauth_reauth_worker.py'
      - 'tools/openai_codex_*'
      - 'tools/test_openai_codex_*'
      - 'tools/fixtures/codex-http-transport.mjs'
      - 'tools/fixtures/session-studio/**'
      - 'tools/fixtures/credential-operation-errors.json'
      - 'tools/openai_totp_*'
      - 'tools/test_openai_totp_*'
      - 'tools/openai_siwc_*'
      - 'tools/test_openai_siwc_*'
      - 'tools/openai_excel_oauth_adapter.py'
      - 'tools/openai_excel_2fa_login.py'
      - 'tools/openai_excel_password_flow.mjs'
      - 'tools/test_openai_excel_password_flow.mjs'
      - 'tools/test_openai_excel_oauth_adapter.py'
      - 'tools/test_openai_oauth_reauth_worker.py'
      - 'tools/test_openai_oauth_reauth_engines.py'
      - 'tools/test_openai_oauth_reauth_runtime_controls.py'
      - 'tools/reauth-runtime/**'
      - 'backend/internal/reauthruntime/**'
      - '.github/workflows/reauth-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Package and validate without publishing
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: 0.0.0-test
        run: bash tools/reauth-runtime/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: reauth-runtime-test-${{ matrix.arch }}
          path: reauth-output/*.tar.gz
          retention-days: 3

  deployment:
    needs: package
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sub2api
          POSTGRES_PASSWORD: local-staging-only
          POSTGRES_DB: sub2api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sub2api"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: reauth-runtime-test-amd64
          path: reauth-input
      - name: Build local API
        working-directory: backend
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/sub2api-staging" ./cmd/server
      - name: Deploy API and packaged Worker with mock MFA
        env:
          AUTO_SETUP: 'true'
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: '5432'
          DATABASE_USER: sub2api
          DATABASE_PASSWORD: local-staging-only
          DATABASE_DBNAME: sub2api
          DATABASE_SSLMODE: disable
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          SERVER_HOST: 127.0.0.1
          SERVER_PORT: '18083'
          ADMIN_EMAIL: admin@example.test
          ADMIN_PASSWORD: Staging-local-Only-938!
          JWT_SECRET: local-staging-jwt-secret-000000000000000000000000000
          OPENAI_REAUTH_WORKER_TOKEN: local-staging-worker-token-00000000000000000000000
          STAGING_API_URL: http://127.0.0.1:18083
          STAGING_ADMIN_EMAIL: admin@example.test
          STAGING_ADMIN_PASSWORD: Staging-local-Only-938!
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          export STAGING_ROOT="$RUNNER_TEMP/totp-staging"
          export DATA_DIR="$STAGING_ROOT/data"
          mkdir -p "$DATA_DIR" "$STAGING_ROOT/releases/test"
          tar -xzf reauth-input/sub2api-reauth_0.0.0-test_linux_amd64.tar.gz -C "$STAGING_ROOT/releases/test"
          ln -s releases/test "$STAGING_ROOT/current"
          "$RUNNER_TEMP/sub2api-staging" > "$STAGING_ROOT/api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS "$STAGING_API_URL/health" > /dev/null; then break; fi
            if ! kill -0 "$api_pid"; then tail -n 30 "$STAGING_ROOT/api.log"; exit 1; fi
            sleep 2
          done
          curl -fsS "$STAGING_API_URL/health"
          python tools/reauth-runtime/test_deployment.py
      - uses: actions/upload-artifact@v7
        with:
          name: totp-deployment-verification
          path: ${{ runner.temp }}/totp-staging/verification.json
          if-no-files-found: error
          retention-days: 3

  sync-20261118-account-performance-regressions-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-go@v6
      with:
        cache-dependency-path: backend/go.sum
        go-version: 1.27.4
    - name: Record exact source
      run: git rev-parse HEAD
    - name: Unit and race regressions
      working-directory: backend
      run: |-
        python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"
        go test -race -tags=unit ./internal/service ./internal/repository -run '^TestAccountPerformance' -count=1 -v -timeout=10m
    - name: Migrated PostgreSQL metrics and soft-delete races
      working-directory: backend
      run: |-
        python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"
        go test -tags=integration ./internal/repository -run '^TestAccountPerformance' -count=1 -v -timeout=10m
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    permissions:
      contents: read
  sync-20261118-account-performance-regressions-regression-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        defect:
        - evaluation
        - export
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-go@v6
      with:
        cache-dependency-path: backend/go.sum
        go-version: 1.27.4
    - name: Reintroduce one original defect
      env:
        DEFECT: ${{ matrix.defect }}
      shell: bash
      run: |
        set -euo pipefail
        original=f0020cc41ecb5513014c993d20978fc59856807d
        git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git "$original"
        python3 - <<'PY'
        import os, pathlib, subprocess
        if os.environ['DEFECT'] == 'evaluation':
            path = pathlib.Path('backend/internal/service/account_performance.go')
            old = subprocess.check_output(['git', 'show', 'f0020cc41ecb5513014c993d20978fc59856807d:' + str(path)], text=True)
            current = path.read_text()
            start = 'func (s *AccountPerformanceService) evaluate('
            end = '\n// Live authority check'
            original_function = old[old.index(start):old.index(end)]
            path.write_text(current[:current.index(start)] + original_function + current[current.index(end):])
        else:
            path = pathlib.Path('backend/internal/service/regional_scheduler_sync.go')
            path.write_bytes(subprocess.check_output(['git', 'show', 'f0020cc41ecb5513014c993d20978fc59856807d:' + str(path)]))
        PY
    - name: Require a behavioral assertion failure
      env:
        DEFECT: ${{ matrix.defect }}
      shell: bash
      run: |
        set -euo pipefail
        if [ "$DEFECT" = evaluation ]; then
          regression='^TestAccountPerformanceEvaluationResumesAfterCanceledAttempt$'
        else
          regression='^TestAccountPerformanceRegionalExportChecksPauseAndFailsClosed$'
        fi
        python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend
        set +e
        (cd backend && go test -tags=unit ./internal/service -run "$regression" -count=1 -v -timeout=5m) > "$RUNNER_TEMP/performance-red.log" 2>&1
        result=$?
        set -e
        cat "$RUNNER_TEMP/performance-red.log"
        test "$result" -ne 0
        ! grep -Eq 'build failed|no tests to run|undefined:' "$RUNNER_TEMP/performance-red.log"
        grep -q -- '--- FAIL: TestAccountPerformance' "$RUNNER_TEMP/performance-red.log"
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    permissions:
      contents: read
  sync-20261118-account-request-proxy-routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/setup-go@v6
      with:
        cache-dependency-path: backend/go.sum
        go-version: 1.27.4
    - name: Install isolated Redis fixture dependency
      run: |
        bash "$GITHUB_WORKSPACE/scripts/ci-ubuntu-mirrors.sh"
        if ! command -v redis-server >/dev/null; then
          bash "$GITHUB_WORKSPACE/scripts/ci-ubuntu-mirrors.sh"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
        fi
    - name: Config switch evidence validator self-tests
      run: python3 -B -m unittest discover -s scripts -p test_account_proxy_config_switch_evidence.py -v
    - name: Account proxy leases, admission and HTTP transports
      working-directory: backend
      shell: bash
      run: |
        set -euo pipefail
        redis-server --bind 127.0.0.1 --port 16389 --save '' --appendonly no > "$RUNNER_TEMP/account-proxy-redis.log" 2>&1 &
        redis_pid=$!
        trap 'kill "$redis_pid"; wait "$redis_pid" || true' EXIT
        for attempt in {1..50}; do
          if redis-cli -h 127.0.0.1 -p 16389 ping | grep -qx PONG; then
            break
          fi
          if ! kill -0 "$redis_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/account-proxy-redis.log"
            exit 1
          fi
          sleep 0.1
        done
        redis-cli -h 127.0.0.1 -p 16389 ping | grep -qx PONG
        export BPS_REQUEST_PROXY_REDIS_ADDR=127.0.0.1:16389
        python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"
        go test -race -json -p 2 -tags=unit,bps_request_integration \
          ./internal/mihomo ./internal/service ./internal/handler ./internal/handler/admin ./internal/repository \
          -run '^(TestIndependent885|TestExcelBPSImages|TestBPSRequest|TestOpenAIRequestProxy|TestExcelBPSRequestProxy|TestRemainingMaintenance|TestOpenAIOAuthReauthRequestProxy|TestOpenAIOAuthRequestProxy|TestOpenAIProxy|TestOpenAIMaintenance|TestOpenAITurnAdmission|TestSIWC|TestAccountDataBPSRequestProxy|TestAccountDataOpenAIProxy)' \
          -count=1 -timeout=20m | tee "$RUNNER_TEMP/account-proxy.jsonl"
        python3 - "$RUNNER_TEMP/account-proxy.jsonl" <<'PYTHON'
        import json
        import sys
        from pathlib import Path

        events = [json.loads(line) for line in Path(sys.argv[1]).read_text().splitlines()]
        required = {
            "TestBPSRequestProxyAdmissionRetainsAccountConcurrency/production_cache_with_miniredis",
            "TestBPSRequestProxyAdmissionRetainsAccountConcurrency/production_cache_with_real_redis",
            "TestBPSRequestPoolDistributesConcurrentRequestsThroughSelectedProxies",
            "TestIndependent885BPSRefreshAndInferenceSameExit",
            "TestOpenAIRequestProxyFailureAttributesSelectedExit",
            "TestExcelBPSImagesRequestRefreshAndFallbackShareExit",
        }
        for root in ("Forward", "Images", "SIWC", "OAuth"):
            required.update("TestExcelBPSRequestProxyConfigSwitch" + root + "/" + mode for mode in ("single_B", "single_empty"))
        required.update("TestExcelBPSRequestProxyConfigSwitchControls/images_" + images + "/" + control for images in ("false", "true") for control in ("refresh_error", "cancel"))
        required.update("TestExcelBPSRequestProxyConfigSwitchSIWCControls/" + control for control in ("refresh_error", "refresh_cancel"))
        required.update("TestExcelBPSRequestProxyConfigSwitchOAuthControls/" + control for control in ("request_refresh_error", "single_B_no_route_refresh_error", "single_empty_no_route_refresh_error"))
        passed = {event.get("Test") for event in events if event.get("Action") == "pass"}
        missing = required - passed
        if missing:
            raise SystemExit(f"Required routing evidence did not pass: {sorted(missing)}")
        PYTHON
    - name: Require all eight config switch cases to pass
      shell: bash
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend
        (cd backend && go test -race -json -p 2 -tags=unit,bps_request_integration ./internal/service -run '^TestExcelBPSRequestProxyConfigSwitch(Forward|Images|SIWC|OAuth)$' -count=1 -timeout=2m) > "$RUNNER_TEMP/config-switch-green.jsonl" 2>&1
        python3 scripts/assert-account-proxy-config-switch.py GREEN 0 "$RUNNER_TEMP/config-switch-green.jsonl"
    - name: Preserve raw routing evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sync-20261118-account-request-proxy-routing-account-proxy-${{ github.event.pull_request.head.sha || github.sha
          }}
        path: |
          ${{ runner.temp }}/account-proxy.jsonl
          ${{ runner.temp }}/account-proxy-redis.log
          ${{ runner.temp }}/config-switch-green.jsonl
        if-no-files-found: error
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    permissions:
      contents: read
  sync-20261118-account-request-proxy-config-switch-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@v6
      with:
        cache-dependency-path: backend/go.sum
        go-version: 1.27.4
    - name: Download dependencies before capturing strict JSON evidence
      working-directory: backend
      run: go mod download
    - name: Restore exact production files before the config switch fix
      shell: bash
      run: |
        set -euo pipefail
        baseline=017d54c819f1ca571a46a99138e0f73bfbb6cd23
        candidate=$(git rev-parse HEAD)
        manifest="$RUNNER_TEMP/config-switch-red-source.txt"
        printf 'candidate=%s baseline=%s\n' "$candidate" "$baseline" > "$manifest"
        for file in openai_excel_oauth.go openai_siwc.go openai_maintenance_proxy.go openai_oauth_service.go openai_token_provider.go; do
          target="backend/internal/service/$file"
          candidate_blob=$(git rev-parse "$candidate:$target")
          test "$(git hash-object "$target")" = "$candidate_blob"
          git show "$baseline:$target" > "$target"
          baseline_blob=$(git rev-parse "$baseline:$target")
          test "$(git hash-object "$target")" = "$baseline_blob"
          printf 'path=%s candidate_blob=%s restored_baseline_blob=%s\n' "$target" "$candidate_blob" "$baseline_blob" >> "$manifest"
        done
        # Restoring the token lifecycle above removes its later read-only
        # whitelist helper. Pin only the dependent catalog caller to the
        # exact pre-helper source; keep the original config-switch defects.
        caller_baseline=add606e964972ded3d6389790586c781c89a58c1
        target=backend/internal/service/openai_excel_bps_model_access.go
        candidate_blob=$(git rev-parse "$candidate:$target")
        test "$(git hash-object "$target")" = "$candidate_blob"
        git show "$caller_baseline:$target" > "$target"
        baseline_blob=$(git rev-parse "$caller_baseline:$target")
        test "$(git hash-object "$target")" = "$baseline_blob"
        printf 'compatibility_caller=%s baseline=%s candidate_blob=%s restored_baseline_blob=%s\n' "$target" "$caller_baseline" "$candidate_blob" "$baseline_blob" >> "$manifest"
        for file in pr885_config_switch_refresh_test.go pr885_siwc_config_switch_test.go pr885_oauth_config_switch_test.go; do
          target="backend/internal/service/$file"
          blob=$(git rev-parse "$candidate:$target")
          test "$(git hash-object "$target")" = "$blob"
          printf 'unchanged_candidate_fixture=%s blob=%s\n' "$target" "$blob" >> "$manifest"
        done
        expected=$(printf '%s\n' backend/internal/service/openai_excel_bps_model_access.go backend/internal/service/openai_excel_oauth.go backend/internal/service/openai_maintenance_proxy.go backend/internal/service/openai_oauth_service.go backend/internal/service/openai_siwc.go backend/internal/service/openai_token_provider.go)
        test "$(git diff --name-only -- 'backend/**/*.go' ':!backend/**/*_test.go')" = "$expected"
    - name: Require all eight config switch failures to be behavioral
      shell: bash
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend
        set +e
        (cd backend && go test -race -json -p 2 -tags=unit,bps_request_integration ./internal/service -run '^TestExcelBPSRequestProxyConfigSwitch(Forward|Images|SIWC|OAuth)$' -count=1 -timeout=2m) > "$RUNNER_TEMP/config-switch-red.jsonl" 2>&1
        result=$?
        set -e
        python3 scripts/assert-account-proxy-config-switch.py RED "$result" "$RUNNER_TEMP/config-switch-red.jsonl"
    - name: Preserve raw config switch RED evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sync-20261118-account-request-proxy-config-switch-red-config-switch-red-${{ github.event.pull_request.head.sha
          || github.sha }}
        path: |
          ${{ runner.temp }}/config-switch-red.jsonl
          ${{ runner.temp }}/config-switch-red-source.txt
        if-no-files-found: error
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    permissions:
      contents: read
  sync-20261118-account-request-proxy-refresh-oracle-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@v6
      with:
        cache-dependency-path: backend/go.sum
        go-version: 1.27.4
    - name: Restore exact production files before the refresh fix
      shell: bash
      run: |
        set -euo pipefail
        baseline=0f5313e50705ef99dad2691edd1147d9f803a96c
        for file in openai_excel_bps.go openai_excel_bps_images.go openai_excel_bps_transport.go openai_images_responses.go priority_error_rate.go; do
          target="backend/internal/service/$file"
          git show "$baseline:$target" > "$target"
          test "$(git hash-object "$target")" = "$(git rev-parse "$baseline:$target")"
        done
    - name: Require the unchanged busy-exit oracle to fail behaviorally
      shell: bash
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend
        set +e
        (cd backend && go test -race -json -p 2 -tags=unit,bps_request_integration ./internal/service -run '^TestIndependent885BPSRefreshAndInferenceSameExit$' -count=1 -timeout=60s) > "$RUNNER_TEMP/refresh-oracle-red.jsonl" 2>&1
        result=$?
        set -e
        python3 - "$result" "$RUNNER_TEMP/refresh-oracle-red.jsonl" <<'PYTHON'
        import json
        import re
        import sys
        from pathlib import Path

        text = Path(sys.argv[2]).read_text()
        events = [json.loads(line) for line in text.splitlines() if line.startswith("{")]
        name = "TestIndependent885BPSRefreshAndInferenceSameExit"
        failures = {event.get("Test") for event in events if event.get("Action") == "fail" and event.get("Test")}
        output = "".join(event.get("Output", "") for event in events)
        observed = re.search(r"observed refresh_proxy=(\d+) inference_proxy=(\d+)", output)
        if (sys.argv[1] != "1" or failures != {name} or not observed
            or observed.group(1) == observed.group(2)
            or "BPS request-triggered refresh must share the inference exit" not in output
            or any(event.get("Action") in {"skip", "build-fail"} for event in events)
            or any(marker in output for marker in ("[no tests to run]", "DATA RACE", "panic:"))):
            raise SystemExit("RED must be the unchanged busy-exit assertion, not build/skip/panic/no-tests")
        print(f"Behavioral RED verified: refresh={observed.group(1)}, inference={observed.group(2)}, exit=1")
        PYTHON
    - name: Preserve raw RED oracle evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sync-20261118-account-request-proxy-refresh-oracle-red-refresh-oracle-red-${{ github.event.pull_request.head.sha
          || github.sha }}
        path: ${{ runner.temp }}/refresh-oracle-red.jsonl
        if-no-files-found: error
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    permissions:
      contents: read
  sync-20261118-backend-ci-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Assert exact candidate head
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
    - uses: actions/setup-go@v6
      with:
        check-latest: false
        cache: false
        go-version: 1.27.4
    - name: Verify Go version
      run: go version | grep -q 'go1.27.4'
    - name: Resolve Go cache paths and bootstrap key
      id: go-cache
      run: |
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        version="$(go env GOVERSION)"
        arch="$(node -p process.arch)"
        echo "bootstrap=setup-go-${RUNNER_OS}-${arch}-${ImageOS}-go-${version#go}-" >> "$GITHUB_OUTPUT"
    - name: Restore Go module and build caches
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.go-cache.outputs.modules }}
          ${{ steps.go-cache.outputs.build }}
        key: go-tests-v2-${{ runner.os }}-${{ runner.arch }}-unit-${{ matrix.shard }}-${{ hashFiles('backend/go.mod', 'backend/go.sum')
          }}-${{ env.EXPECTED_HEAD_SHA }}
        restore-keys: |
          go-tests-v2-${{ runner.os }}-${{ runner.arch }}-unit-${{ matrix.shard }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-
          ${{ steps.go-cache.outputs.bootstrap }}${{ hashFiles('backend/go.sum') }}
          ${{ steps.go-cache.outputs.bootstrap }}
    - name: Install Redis for isolated snapshot adapter checks
      run: |
        bash "$GITHUB_WORKSPACE/scripts/ci-ubuntu-mirrors.sh"
        if ! command -v redis-server >/dev/null; then
          bash "$GITHUB_WORKSPACE/scripts/ci-ubuntu-mirrors.sh"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
        fi
        redis-server --version
    - name: Unit tests with timings
      run: python3 .github/ci/go_tests.py unit --shard ${{ matrix.shard }} --total ${{ strategy.job-total }} --output "$RUNNER_TEMP/go-test-results"
    - name: Upload unit test timings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sync-20261118-backend-ci-unit-test-go-unit-${{ matrix.shard }}-${{ github.run_attempt }}
