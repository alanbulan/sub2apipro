name: Cancel superseded deployment only
on:
  push:
    branches: ['codex/actions-queue-reset-*']
permissions:
  contents: read
  actions: write
concurrency:
  group: actions-queue-reset
  cancel-in-progress: true
jobs:
  cancel-superseded:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Cancel the obsolete deployment and retain current main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EXPECTED_MAIN_SHA: 48658705dfa6fa4748cfd2c4ccb70c8161c5aa59
          OLD_SHA: e7af09bf9028f21a1693747fa255193130b92a58
          OLD_RUN_ID: '45345812538'
        shell: python {0}
        run: |
          import json, os, time, urllib.error, urllib.request
          base = 'https://api.github.com/repos/' + os.environ['GH_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, method='GET'):
              request = urllib.request.Request(base + path, headers=headers, method=method, data=None if method == 'GET' else b'')
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  if method == 'POST' and error.code == 409:
                      return None
                  raise SystemExit('GitHub API returned HTTP ' + str(error.code))
          current = api('/git/ref/heads/main')['object']['sha']
          if current != os.environ['EXPECTED_MAIN_SHA']:
              raise SystemExit('Main changed; preserving every workflow.')
          path = '/actions/runs/' + os.environ['OLD_RUN_ID']
          run = api(path)
          if run['head_sha'] != os.environ['OLD_SHA'] or run['head_branch'] != 'main' or run['name'] != 'Build and Deploy':
              raise SystemExit('The obsolete run identity does not match; preserving it.')
          if run['status'] != 'completed':
              api(path + '/cancel', 'POST')
              for attempt in range(24):
                  time.sleep(5)
                  run = api(path)
                  if run['status'] == 'completed':
                      break
                  if attempt == 9:
                      api(path + '/force-cancel', 'POST')
              else:
                  raise SystemExit('The superseded run has not stopped.')
          message = 'Superseded deployment ' + os.environ['OLD_RUN_ID'] + ': ' + str(run['conclusion']) + '. Current main deployment was not canceled or restarted.'
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(message + '\n')
