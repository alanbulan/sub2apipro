name: sync-20261116-pr838-ws-phase-redis-interleave
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Real Redis instances, PostgreSQL persistence and delayed Reset
    shell: bash
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    run: 'set -euo pipefail

      mkdir -p evidence

      test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      git rev-parse HEAD > evidence/head.txt

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -race -tags=integration ./internal/repository -run ''^TestTempUnschedRealRedisCrossInstancePersistAndDelayedReset$''
      -count=1 -v -timeout=5m) > evidence/redis-interleave.log 2>&1

      result=$?

      set -e

      cat evidence/redis-interleave.log

      printf ''%s\n'' "$result" > evidence/exit.txt

      test "$result" -eq 0

      if grep -Eiq -- ''--- SKIP:|no tests to run|WARNING: DATA RACE|panic:|fatal error:'' evidence/redis-interleave.log;
      then exit 1; fi

      grep -q -- ''--- PASS: TestTempUnschedRealRedisCrossInstancePersistAndDelayedReset'' evidence/redis-interleave.log

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-pr838-ws-phase-redis-interleave-pr838-real-redis-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: evidence/
      if-no-files-found: error
