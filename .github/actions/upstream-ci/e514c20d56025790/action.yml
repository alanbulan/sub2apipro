name: sync-20261116-openai-multi-auth-ui
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v4
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: 22
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Connection components and both locales
    working-directory: frontend
    run: 'set -euo pipefail

      test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      pnpm exec vitest run src/components/account/__tests__/OpenAIAuthConnections.spec.ts src/components/account/__tests__/SIWCAccountSettings.spec.ts
      src/i18n/__tests__/localeKeyCompleteness.spec.ts | tee "$RUNNER_TEMP/issue594-ui-tests.log"

      pnpm exec eslint src/components/account/OpenAIAuthConnections.vue src/api/admin/openaiAuthConnections.ts src/components/account/__tests__/OpenAIAuthConnections.spec.ts

      pnpm run typecheck

      '
    shell: bash
  - name: Sanitized screenshots of actual component and styles
    run: 'set -euo pipefail

      npm install --prefix "$RUNNER_TEMP/issue594-browser" --no-package-lock playwright

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/issue594-browser/node_modules/.bin/playwright" install --with-deps chromium

      cp .github/fixtures/openai-auth-ui.html frontend/.issue594-ui.html

      pnpm --dir frontend exec vite --host 127.0.0.1 --port 4179 > "$RUNNER_TEMP/issue594-vite.log" 2>&1 &

      server_pid=$!

      trap ''kill "$server_pid" || true; rm -f frontend/.issue594-ui.html'' EXIT

      ISSUE594_PLAYWRIGHT="$RUNNER_TEMP/issue594-browser/node_modules/playwright" node scripts/openai-auth-screenshots.cjs

      '
    shell: bash
  - uses: actions/upload-artifact@v6
    if: always()
    with:
      name: sync-20261116-openai-multi-auth-ui-issue594-ui-${{ github.event_name }}-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: '${{ runner.temp }}/issue594-*.png

        ${{ runner.temp }}/issue594-*.log

        '
