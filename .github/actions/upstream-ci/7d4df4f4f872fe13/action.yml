name: sync-20261116-http2-stream-reset-user-surface
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: F2 behavioral RED through the actual UsageView status control
    shell: bash
    run: 'set -euo pipefail

      mkdir -p "$RUNNER_TEMP/http2-ui"

      target=frontend/src/views/user/UsageView.vue

      baseline=3137257829f0cc48466911aa4a249dd03f3c088f

      restore_usage_view() { git show "HEAD:$target" > "$target"; }

      trap restore_usage_view EXIT

      git show "$baseline:$target" > "$target"

      test "$(git hash-object "$target")" = "$(git rev-parse "$baseline:$target")"

      git rev-parse HEAD "$baseline:$target" > "$RUNNER_TEMP/http2-ui/f2-red-identity.txt"

      set +e

      pnpm --dir frontend exec vitest run src/views/user/__tests__/UsageView.spec.ts > "$RUNNER_TEMP/http2-ui/f2-red.log"
      2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/http2-ui/f2-red.log"

      test "$result" -eq 1

      if grep -Eiq ''No test files found|no tests|[0-9]+ skipped|Failed to resolve|Unhandled Errors|Unhandled Rejection|SyntaxError|ReferenceError|TypeError|Transform
      failed|panic|DATA RACE'' "$RUNNER_TEMP/http2-ui/f2-red.log"; then exit 1; fi

      grep -q ''HTTP200 must be selectable from the real error status control'' "$RUNNER_TEMP/http2-ui/f2-red.log"

      grep -q ''1 failed'' "$RUNNER_TEMP/http2-ui/f2-red.log"

      restore_usage_view

      trap - EXIT

      git diff --exit-code

      '
  - name: Real component regressions and production frontend build
    shell: bash
    run: 'set -euo pipefail

      mkdir -p "$RUNNER_TEMP/http2-ui"

      git rev-parse HEAD > "$RUNNER_TEMP/http2-ui/head.txt"

      pnpm --dir frontend exec vitest run src/views/user/__tests__/UsageView.spec.ts src/components/user/__tests__/UserErrorTransport.spec.ts
      src/components/user/__tests__/UserErrorDetailModal.spec.ts 2>&1 | tee "$RUNNER_TEMP/http2-ui/component.log"

      if grep -Eiq ''No test files found|Unhandled Errors|Unhandled Rejection|Transform failed|panic|DATA RACE'' "$RUNNER_TEMP/http2-ui/component.log";
      then exit 1; fi

      pnpm --dir frontend run build 2>&1 | tee "$RUNNER_TEMP/http2-ui/build.log"

      '
  - name: Isolated screenshot browser
    run: 'npm install --prefix "$RUNNER_TEMP/http2-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      node "$RUNNER_TEMP/http2-browser/node_modules/playwright/cli.js" install --with-deps chromium

      '
    shell: bash
  - name: Actual component before and after in English and Chinese
    env:
      SUB2API_PLAYWRIGHT_MODULE: ${{ runner.temp }}/http2-browser/node_modules/playwright/index.mjs
    run: node .github/http2-stream-reset-preview.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/http2-ui"
    shell: bash
  - name: Actual error-tab category and HTTP200 filter before and after
    env:
      SUB2API_PLAYWRIGHT_MODULE: ${{ runner.temp }}/http2-browser/node_modules/playwright/index.mjs
    run: node .github/http2-user-filter-preview.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/http2-ui/filters"
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-http2-stream-reset-user-surface-http2-ui-${{ github.event.pull_request.head.sha || github.sha }}
      path: ${{ runner.temp }}/http2-ui/
