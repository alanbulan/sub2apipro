name: sync-20261116-issue618-easypay-recovery-recovery
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Real EasyPay adapter and order recovery regressions
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit ./internal/service -run ''^TestEasyPayRecovery'' -count=1 -v -timeout=8m'
    shell: bash
  - name: Keep EasyPay callback confirmation and signature guards
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race ./internal/payment/provider -run ''^TestEasyPay(Query|Confirm|Notify)'' -count=1 -v -timeout=4m'
    shell: bash
