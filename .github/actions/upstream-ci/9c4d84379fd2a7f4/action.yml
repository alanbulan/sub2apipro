name: sync-20261116-pr596-cooldown-ownership-cooldown-ownership
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Record exact source head
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    run: 'mkdir -p evidence

      git rev-parse HEAD | tee evidence/head.txt

      test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      '
    shell: bash
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: RED - unchanged new tests against original production files
    shell: bash
    run: "set -euo pipefail\noriginal=23b0dbae040e0d0b8c40f25ddb012ce2444feba3\nsources=(backend/internal/repository/account_quality_isolation.go\
      \ backend/internal/repository/account_quality_models.go backend/internal/repository/scheduled_test_repo.go)\nmkdir -p\
      \ \"$RUNNER_TEMP/pr596-original\"\nfor source in \"${sources[@]}\"; do cp \"$source\" \"$RUNNER_TEMP/pr596-original/$(basename\
      \ \"$source\")\"; done\ntrap 'for source in \"${sources[@]}\"; do cp \"$RUNNER_TEMP/pr596-original/$(basename \"$source\"\
      )\" \"$source\"; done' EXIT\ngit fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git \"$original\"\n\
      for source in \"${sources[@]}\"; do git show \"$original:$source\" > \"$source\"; done\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ backend\nset +e\n(cd backend && go test -tags=integration ./internal/repository -run '^TestQualityCooldown(ActionGuardRetainsAllOwnershipLayouts|OwnedScopeRejectsEdits|MappingChangeCannotStrandOwnedTarget|DeletePreservesOwnedState|DeleteChecksLiveMarkersWithoutSnapshot|DeleteAfterRecoveryPreservesExternalRestrictions)$'\
      \ -count=1 -timeout=15m -json) > evidence/red.jsonl 2>&1\nresult=$?\nset -e\ncat evidence/red.jsonl\ntest \"$result\"\
      \ -ne 0\npython3 - <<'PY'\nimport json\nfrom pathlib import Path\nraw = Path('evidence/red.jsonl').read_text()\nevents\
      \ = []\nfor line in raw.splitlines():\n    try:\n        events.append(json.loads(line))\n    except json.JSONDecodeError:\n\
      \        pass\noutput = raw + ''.join(e.get('Output', '') for e in events)\nfor forbidden in ('[build failed]', '[setup\
      \ failed]', 'undefined:', 'syntax error:', 'no tests to run', 'panic:', '--- SKIP:'):\n    assert forbidden not in output,\
      \ forbidden\nfor name in ('TestQualityCooldownActionGuardRetainsAllOwnershipLayouts', 'TestQualityCooldownOwnedScopeRejectsEdits',\
      \ 'TestQualityCooldownMappingChangeCannotStrandOwnedTarget', 'TestQualityCooldownDeletePreservesOwnedState', 'TestQualityCooldownDeleteChecksLiveMarkersWithoutSnapshot',\
      \ 'TestQualityCooldownDeleteAfterRecoveryPreservesExternalRestrictions'):\n    assert any(e.get('Action') == 'fail'\
      \ and e.get('Test') == name for e in events), name\nassert 'owned cooldown edit must be rejected' in output\nassert\
      \ 'owned cooldown delete must be rejected' in output\nassert 'cooldown ownership must block action changes' in output\n\
      assert 'Error Trace:' in output and 'An error is expected but got nil.' in output\nPY\n"
  - name: GREEN - real repository transitions and retained ownership protection
    shell: bash
    run: "set -euo pipefail\n# The repository integration TestMain starts PostgreSQL and Redis via\n# testcontainers; CI=true\
      \ makes missing Docker a failure, never a skip.\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\n\
      (cd backend && go test -tags=integration ./internal/repository -run '^TestQuality(Cooldown|Model|PersistentIsolation|Isolation|Ownership|Observation)'\
      \ -count=1 -timeout=20m -json) > evidence/green.jsonl 2>&1\ncat evidence/green.jsonl\npython3 - <<'PY'\nimport json\n\
      from pathlib import Path\nevents = [json.loads(line) for line in Path('evidence/green.jsonl').read_text().splitlines()\
      \ if line.startswith('{')]\nassert not any(e.get('Action') in ('fail', 'skip') for e in events)\ntop_level_passes =\
      \ {e['Test'] for e in events if e.get('Action') == 'pass' and 'Test' in e and '/' not in e['Test']}\nassert len(top_level_passes)\
      \ == 39, sorted(top_level_passes)\nfor name in ('TestQualityCooldownOwnedScopeRejectsEdits', 'TestQualityCooldownOrdinaryEditRetainsOwnershipUntilPassingRecovery',\
      \ 'TestQualityCooldownExternalOwnerSurvivesEditsAndRecovery', 'TestQualityCooldownMappingChangeCannotStrandOwnedTarget',\
      \ 'TestQualityCooldownChangedActionOutcomeRetainsOwnership', 'TestQualityCooldownActionGuardRetainsAllOwnershipLayouts',\
      \ 'TestQualityCooldownDeadlinePersistedRecovery', 'TestQualityCooldownDeletePreservesOwnedState', 'TestQualityCooldownDeleteChecksLiveMarkersWithoutSnapshot',\
      \ 'TestQualityCooldownDeleteAfterRecoveryPreservesExternalRestrictions', 'TestQualityIsolationScopeAndDeleteGuard',\
      \ 'TestQualityIsolationGroupsFollowIndependentModelRecovery'):\n    assert any(e.get('Action') == 'pass' and e.get('Test')\
      \ == name for e in events), name\nPY\n"
  - name: Verify Node and locked i18n toolchain contract
    run: 'python3 - <<''PY''

      import json

      from pathlib import Path

      package = json.loads(Path(''frontend/package.json'').read_text())

      assert package[''engines''][''node''] == ''>=22''

      assert package[''dependencies''][''vue-i18n''] == ''^11.4.16''

      lock = Path(''frontend/pnpm-lock.yaml'').read_text()

      assert ''vue-i18n@11.4.16:'' in lock

      assert "engines: {node: ''>= 22''}" in lock

      PY

      '
    shell: bash
  - uses: actions/upload-artifact@v6
    if: always()
    with:
      name: sync-20261116-pr596-cooldown-ownership-cooldown-ownership-pr596-cooldown-ownership-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: evidence/
