name: sync-20261116-issue805-owner-policy-evidence
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Install isolated Redis fixture
    run: "bash \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\nif ! command -v redis-server >/dev/null; then\n  bash\
      \ \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\n  sudo apt-get update\n  sudo apt-get install -y --no-install-recommends\
      \ redis-server\nfi\nredis-server --version\n"
    shell: bash
  - name: Pinned production business RED in disposable worktree
    shell: bash
    run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_HEAD_SHA\"\ntest -z \"$(git status --porcelain)\"\
      \nmkdir -p \"$RUNNER_TEMP/issue805-evidence\"\ngit rev-parse HEAD HEAD^{tree} > \"$RUNNER_TEMP/issue805-evidence/candidate.txt\"\
      \nbaseline=2cfdda4aeae1f482efd8a2ca6551b7f40f6e9d66\ngit fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git\
      \ \"$baseline\"\ngit worktree add --detach \"$RUNNER_TEMP/issue805-red\" \"$EXPECTED_HEAD_SHA\"\ncd \"$RUNNER_TEMP/issue805-red\"\
      \n# Restore every changed production Go blob; retain Issue805 candidate tests.\nwhile IFS= read -r target; do\n  case\
      \ \"$target\" in *_test.go) continue ;; esac\n  if git cat-file -e \"$baseline:$target\" 2>/dev/null; then\n    mkdir\
      \ -p \"$(dirname \"$target\")\"\n    git show \"$baseline:$target\" > \"$target\"\n    # A file removed by the candidate\
      \ is untracked after restoration.\n    # Include it in the baseline diff without staging different content.\n    git\
      \ add -N -- \"$target\"\n    expected=$(git rev-parse \"$baseline:$target\")\n    actual=$(git hash-object \"$target\"\
      )\n    echo \"$target baseline=present expected=$expected actual=$actual\" >> \"$RUNNER_TEMP/issue805-evidence/red-blobs.txt\"\
      \n    test \"$expected\" = \"$actual\"\n  else\n    # Candidate-only production must not survive in the baseline.\n\
      \    # This directory is disposable; the candidate checkout stays clean.\n    candidate=$(git rev-parse \"$EXPECTED_HEAD_SHA:$target\"\
      )\n    rm -- \"$target\"\n    echo \"$target baseline=absent candidate=$candidate actual=absent\" >> \"$RUNNER_TEMP/issue805-evidence/red-blobs.txt\"\
      \n    test ! -e \"$target\"\n  fi\ndone < <(git diff --no-renames --name-only \"$baseline\" \"$EXPECTED_HEAD_SHA\" --\
      \ 'backend/**/*.go')\ngit diff --exit-code \"$baseline\" -- 'backend/**/*.go' ':!backend/**/*_test.go'\ngit diff --exit-code\
      \ \"$EXPECTED_HEAD_SHA\" -- 'backend/**/*_test.go'\nbash \"$GITHUB_WORKSPACE/scripts/exclude-later-http2-red-fixtures.sh\"\
      \ \"$baseline\" . \"$EXPECTED_HEAD_SHA\" | tee \"$RUNNER_TEMP/issue805-evidence/http2-exclusions.txt\"\n# These unrelated\
      \ context-policy tests require newer production symbols.\n# Use their baseline versions only in this disposable RED\
      \ checkout so\n# compilation can reach the unchanged Issue805 business assertions.\nfor target in backend/internal/handler/api_key_long_context_admission_test.go\
      \ backend/internal/handler/api_key_long_context_ws_test.go backend/internal/handler/api_key_model_policy_write_permissions_test.go\
      \ backend/internal/handler/gemini_cached_contents_billing_test.go; do\n  git show \"$baseline:$target\" > \"$target\"\
      \n  expected=$(git rev-parse \"$baseline:$target\")\n  actual=$(git hash-object \"$target\")\n  echo \"$target test=baseline\
      \ expected=$expected actual=$actual\" >> \"$RUNNER_TEMP/issue805-evidence/red-blobs.txt\"\n  test \"$expected\" = \"\
      $actual\"\ndone\n# The later omission fixtures require a Beta setting absent from this\n# baseline. The readable/task-rebuild\
      \ fixtures import its settings and\n# usage helpers. Exclude this exact dependency set only in the old\n# Issue805 RED;\
      \ GREEN and each feature's own TDD job retain them.\nfor omission_test in backend/internal/handler/openai_409_omit_history_test.go\
      \ backend/internal/handler/openai_409_readable_continuation_test.go backend/internal/handler/openai_409_http_rebuild_test.go\
      \ backend/internal/handler/openai_409_shadow_http_test.go backend/internal/handler/openai_409_shadow_race_test.go backend/internal/handler/openai_409_ws_rebuild_test.go\
      \ backend/internal/handler/openai_409_ws_oracle_test.go backend/internal/handler/openai_400_omit_history_test.go backend/internal/handler/openai_issue854_continuation_test.go\
      \ backend/internal/handler/openai_issue854_upstream_test.go backend/internal/handler/openai_issue854_postgres_test.go;\
      \ do\n  git cat-file -e \"$EXPECTED_HEAD_SHA:$omission_test\"\n  rm -- \"$omission_test\"\n  test ! -e \"$omission_test\"\
      \n  echo \"$omission_test test=candidate-only actual=absent\" >> \"$RUNNER_TEMP/issue805-evidence/red-blobs.txt\"\n\
      done\n# The pinned HTTP2 exclusion helper above already handles the handler\n# fixture absent from this baseline; do\
      \ not remove it a second time.\nbash \"$GITHUB_WORKSPACE/scripts/prepare-replay-red-fixtures.sh\" \"$baseline\" . \"\
      $EXPECTED_HEAD_SHA\" | tee \"$RUNNER_TEMP/issue805-evidence/replay-fixtures.txt\"\nbash \"$GITHUB_WORKSPACE/scripts/prepare-moderation-red-fixtures.sh\"\
      \ \"$baseline\" . \"$EXPECTED_HEAD_SHA\" | tee \"$RUNNER_TEMP/issue805-evidence/moderation-fixtures.txt\"\nbash \"$GITHUB_WORKSPACE/scripts/prepare-usage-sort-red-fixture.sh\"\
      \ \"$baseline\" . \"$EXPECTED_HEAD_SHA\" | tee -a \"$RUNNER_TEMP/issue805-evidence/red-blobs.txt\"\n# The selected regression\
      \ and its shared harness must remain exact\n# candidate blobs. The clean GREEN checkout retains all new tests.\nfor\
      \ target in backend/internal/handler/openai_issue805_delivery_test.go backend/internal/handler/openai_issue805_owner_policy_test.go\
      \ backend/internal/handler/openai_issue805_ws_test.go backend/internal/handler/openai_issue715_recovery_test.go backend/internal/handler/openai_responses_failover_cancel_test.go;\
      \ do\n  expected=$(git rev-parse \"$EXPECTED_HEAD_SHA:$target\")\n  actual=$(git hash-object \"$target\")\n  echo \"\
      $target test=candidate expected=$expected actual=$actual\" >> \"$RUNNER_TEMP/issue805-evidence/red-blobs.txt\"\n  test\
      \ \"$expected\" = \"$actual\"\ndone\n# Also prove the unchanged core blobs on the initial test-only head.\nfor target\
      \ in backend/internal/service/openai_agent_message_recovery.go backend/internal/service/openai_account_scheduler.go\
      \ backend/internal/service/openai_gateway_forward.go backend/internal/service/openai_agent_message_delivery.go backend/internal/service/openai_ws_agent_recovery.go;\
      \ do\n  expected=$(git rev-parse \"$baseline:$target\")\n  actual=$(git hash-object \"$target\")\n  echo \"$target baseline=present\
      \ expected=$expected actual=$actual\" >> \"$RUNNER_TEMP/issue805-evidence/red-blobs.txt\"\n  test \"$expected\" = \"\
      $actual\"\ndone\ngit diff --stat > \"$RUNNER_TEMP/issue805-evidence/red-diff.txt\"\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ backend\nset +e\n(cd backend && go test -tags=unit ./internal/handler -run '^TestIssue805HTTPCompletedHistorySelectsAlternative$'\
      \ -count=1 -v -timeout=5m) > \"$RUNNER_TEMP/issue805-evidence/red.log\" 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/issue805-evidence/red.log\"\
      \ntest \"$result\" -ne 0\nif grep -Eiq 'build failed|no tests to run|undefined:|panic:|panic_recovered|fatal error:|runtime\
      \ error:|WARNING: DATA RACE|--- SKIP:' \"$RUNNER_TEMP/issue805-evidence/red.log\"; then exit 1; fi\ngrep -q -- '---\
      \ FAIL: TestIssue805HTTPCompletedHistorySelectsAlternative/stream=false' \"$RUNNER_TEMP/issue805-evidence/red.log\"\n\
      grep -q -- '--- FAIL: TestIssue805HTTPCompletedHistorySelectsAlternative/stream=true' \"$RUNNER_TEMP/issue805-evidence/red.log\"\
      \ngrep -q 'opt-out must dispatch complete A history to eligible B without clearing Redis' \"$RUNNER_TEMP/issue805-evidence/red.log\"\
      \n"
  - name: Exact clean candidate GREEN and race
    shell: bash
    run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_HEAD_SHA\"\ntest -z \"$(git status --porcelain)\"\
      \nfor target in backend/internal/handler/http2_peer_reset_test.go backend/internal/service/http2_gateway_test_support.go;\
      \ do\n  if git cat-file -e \"$EXPECTED_HEAD_SHA:$target\" 2>/dev/null; then\n    test \"$(git hash-object \"$target\"\
      )\" = \"$(git rev-parse \"$EXPECTED_HEAD_SHA:$target\")\"\n  fi\ndone\ncd backend\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ \"$PWD\"\ngo test -race -tags=unit ./internal/handler ./internal/service ./internal/config -run '^TestIssue805' -count=1\
      \ -v -timeout=10m 2>&1 | tee \"$RUNNER_TEMP/issue805-evidence/green.log\"\nif grep -Eiq 'no tests to run|--- SKIP:|panic:|panic_recovered|fatal\
      \ error:|runtime error:|WARNING: DATA RACE' \"$RUNNER_TEMP/issue805-evidence/green.log\"; then exit 1; fi\n"
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-issue805-owner-policy-evidence-issue805-${{ env.EXPECTED_HEAD_SHA }}-${{ github.run_attempt }}
      path: ${{ runner.temp }}/issue805-evidence/
