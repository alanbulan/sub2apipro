name: sync-20261116-backend-ci-test
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Assert exact candidate head
    run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
    shell: bash
  - name: Check Docker Compose simple mode environment
    run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
    shell: bash
  - name: Check Docker Compose trusted proxy environment
    run: /bin/sh deploy/tests/docker-compose-trusted-proxies-env-test.sh
    shell: bash
  - uses: actions/setup-go@v6
    with:
      check-latest: false
      cache: true
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Verify Go version
    run: 'go version | grep -q ''go1.27.4''

      '
    shell: bash
  - name: Install Redis for isolated snapshot adapter checks
    run: "bash \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\nif ! command -v redis-server >/dev/null; then\n  bash\
      \ \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\n  sudo apt-get update\n  sudo apt-get install -y --no-install-recommends\
      \ redis-server\nfi\nredis-server --version\n"
    shell: bash
  - name: Usage trend local bucket regressions
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=integration ./internal/repository -run ''^TestUsageTrendAggregateTimezone'' -count=1 -v'
    shell: bash
  - name: Unit tests
    working-directory: backend
    run: make test-unit
    shell: bash
  - name: Integration tests
    working-directory: backend
    env:
      PROMPT_AUDIT_TEST_POSTGRES_DSN: postgres://fixture:fixture@127.0.0.1:15432/shadow_audit?sslmode=disable
      PROMPT_AUDIT_TEST_REDIS_ADDR: 127.0.0.1:16379
      GOFLAGS: -p=1
    run: make test-integration
    shell: bash
