name: sync-20261116-twofa-import-parallel-baseline-red
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - name: Install locked dependencies on remote runner only
    run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Isolate exact production sources and retain new mounted regression
    run: 'set -euo pipefail

      mkdir -p evidence "$RUNNER_TEMP/twofa-red"

      test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      git diff --exit-code

      git rev-parse HEAD > evidence/head.txt

      git rev-parse "$SOURCE_BASE" > evidence/base.txt

      git archive "$SOURCE_BASE" | tar -x -C "$RUNNER_TEMP/twofa-red"

      cmp frontend/package.json "$RUNNER_TEMP/twofa-red/frontend/package.json"

      cmp frontend/pnpm-lock.yaml "$RUNNER_TEMP/twofa-red/frontend/pnpm-lock.yaml"

      component=frontend/src/components/account/OpenAITwoFAImport.vue

      git rev-parse "$SOURCE_BASE:$component" > evidence/baseline-component-blob.txt

      git hash-object "$RUNNER_TEMP/twofa-red/$component" > evidence/red-component-blob.txt

      cmp evidence/baseline-component-blob.txt evidence/red-component-blob.txt

      cp frontend/src/components/account/__tests__/OpenAITwoFAImport.parallel.spec.ts "$RUNNER_TEMP/twofa-red/frontend/src/components/account/__tests__/"

      sha256sum frontend/src/components/account/__tests__/OpenAITwoFAImport.parallel.spec.ts > evidence/test-input.sha256

      ln -s "$GITHUB_WORKSPACE/frontend/node_modules" "$RUNNER_TEMP/twofa-red/frontend/node_modules"

      '
    shell: bash
  - name: Prove assertion RED rather than a compilation or setup failure
    run: 'set -euo pipefail

      printf ''%s\n'' ''pnpm exec vitest run src/components/account/__tests__/OpenAITwoFAImport.parallel.spec.ts --reporter=verbose
      --reporter=json --outputFile.json=<evidence>/red.json'' > evidence/red-command.txt

      set +e

      (cd "$RUNNER_TEMP/twofa-red/frontend" && pnpm exec vitest run src/components/account/__tests__/OpenAITwoFAImport.parallel.spec.ts
      --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/red.json") > evidence/red.log 2>&1

      result=$?

      set -e

      cat evidence/red.log

      printf ''%s\n'' "$result" > evidence/red-exit.txt

      test "$result" -ne 0

      node --input-type=module <<''JS''

      import { readFileSync } from ''node:fs''

      import assert from ''node:assert/strict''

      const report = JSON.parse(readFileSync(''evidence/red.json'', ''utf8''))

      assert.equal(report.numRuntimeErrorTestSuites ?? 0, 0)

      assert(report.testResults.every(suite => suite.assertionResults.length > 0))

      assert.doesNotMatch(readFileSync(''evidence/red.log'', ''utf8''), /\[vitest\]|Transform failed|Unhandled Error|SyntaxError/)

      assert(report.numPassedTests > 0)

      const regression = report.testResults.flatMap(suite => suite.assertionResults).find(test => test.title.startsWith(''overlaps
      exactly three''))

      assert.equal(regression?.status, ''failed'')

      assert.match(regression.failureMessages.join(''\n''), /AssertionError/)

      assert.match(regression.failureMessages.join(''\n''), /3 times.*1 times|1 times.*3 times/s)

      JS

      '
    shell: bash
  - name: Prove ownership regressions against the independently reviewed implementation
    env:
      REVIEW_BASE: 4f49ecf6f2a2eb008cd9510503ceace46590e93f
    run: "set -euo pipefail\nreview_tree=\"$RUNNER_TEMP/twofa-ownership-red\"\nmkdir -p \"$review_tree\"\ngit archive \"$REVIEW_BASE\"\
      \ | tar -x -C \"$review_tree\"\ncmp frontend/package.json \"$review_tree/frontend/package.json\"\ncmp frontend/pnpm-lock.yaml\
      \ \"$review_tree/frontend/pnpm-lock.yaml\"\ncomponent=frontend/src/components/account/OpenAITwoFAImport.vue\ngit rev-parse\
      \ \"$REVIEW_BASE:$component\" > evidence/review-baseline-component-blob.txt\ngit hash-object \"$review_tree/$component\"\
      \ > evidence/ownership-red-component-blob.txt\ncmp evidence/review-baseline-component-blob.txt evidence/ownership-red-component-blob.txt\n\
      printf '%s\\n' \"$REVIEW_BASE\" > evidence/review-base.txt\ncp frontend/src/components/account/__tests__/OpenAITwoFAImport.ownership.spec.ts\
      \ \"$review_tree/frontend/src/components/account/__tests__/\"\nsha256sum frontend/src/components/account/__tests__/OpenAITwoFAImport.ownership.spec.ts\
      \ > evidence/ownership-tests.sha256\nln -s \"$GITHUB_WORKSPACE/frontend/node_modules\" \"$review_tree/frontend/node_modules\"\
      \ncommand=(pnpm exec vitest run src/components/account/__tests__/OpenAITwoFAImport.ownership.spec.ts --reporter=verbose\
      \ --reporter=json --outputFile.json=\"$GITHUB_WORKSPACE/evidence/ownership-red.json\")\nprintf '%q ' \"${command[@]}\"\
      \ > evidence/ownership-red-command.txt\nset +e\n(cd \"$review_tree/frontend\" && \"${command[@]}\") > evidence/ownership-red.log\
      \ 2>&1\nresult=$?\nset -e\ncat evidence/ownership-red.log\nprintf '%s\\n' \"$result\" > evidence/ownership-red-exit.txt\n\
      test \"$result\" -ne 0\nnode --input-type=module <<'JS'\nimport { readFileSync } from 'node:fs'\nimport assert from\
      \ 'node:assert/strict'\nconst report = JSON.parse(readFileSync('evidence/ownership-red.json', 'utf8'))\nassert.equal(report.numRuntimeErrorTestSuites\
      \ ?? 0, 0)\nassert(report.testResults.every(suite => suite.assertionResults.length > 0))\nassert.doesNotMatch(readFileSync('evidence/ownership-red.log',\
      \ 'utf8'), /\\[vitest\\]|Transform failed|Unhandled Error|SyntaxError/)\nconst tests = report.testResults.flatMap(suite\
      \ => suite.assertionResults)\nfor (const prefix of ['retains live polling-failed', 'keeps Stop busy', 'fences failed\
      \ DELETE', 'recovers accepted start IDs through real Axios']) {\n  const regression = tests.find(test => test.title.startsWith(prefix))\n\
      \  assert.equal(regression?.status, 'failed', prefix)\n  assert.match(regression.failureMessages.join('\\n'), /AssertionError/,\
      \ prefix)\n}\nJS\n"
    shell: bash
  - name: Prove actual modal Close-reopen regression against fixed-head review
    env:
      MODAL_REVIEW_BASE: 3facaf7966def4e640590a23b8db3bf648d53ed9
    run: "set -euo pipefail\nmodal_tree=\"$RUNNER_TEMP/twofa-modal-red\"\nmkdir -p \"$modal_tree\"\ngit archive \"$MODAL_REVIEW_BASE\"\
      \ | tar -x -C \"$modal_tree\"\ncmp frontend/package.json \"$modal_tree/frontend/package.json\"\ncmp frontend/pnpm-lock.yaml\
      \ \"$modal_tree/frontend/pnpm-lock.yaml\"\nprintf '%s\\n' \"$MODAL_REVIEW_BASE\" > evidence/modal-review-base.txt\n\
      for component in OpenAITwoFAImport.vue CreateAccountModal.vue; do\n  source=\"frontend/src/components/account/$component\"\
      \n  git rev-parse \"$MODAL_REVIEW_BASE:$source\" > \"evidence/modal-base-$component.blob\"\n  git hash-object \"$modal_tree/$source\"\
      \ > \"evidence/modal-red-$component.blob\"\n  cmp \"evidence/modal-base-$component.blob\" \"evidence/modal-red-$component.blob\"\
      \ndone\ncp frontend/src/components/account/__tests__/CreateAccountModal.spec.ts \"$modal_tree/frontend/src/components/account/__tests__/\"\
      \nsha256sum frontend/src/components/account/__tests__/CreateAccountModal.spec.ts > evidence/modal-tests.sha256\nln -s\
      \ \"$GITHUB_WORKSPACE/frontend/node_modules\" \"$modal_tree/frontend/node_modules\"\ncommand=(pnpm exec vitest run src/components/account/__tests__/CreateAccountModal.spec.ts\
      \ -t '2FA controlled Close/reopen' --reporter=verbose --reporter=json --outputFile.json=\"$GITHUB_WORKSPACE/evidence/modal-red.json\"\
      )\nprintf '%q ' \"${command[@]}\" > evidence/modal-red-command.txt\nset +e\n(cd \"$modal_tree/frontend\" && \"${command[@]}\"\
      ) > evidence/modal-red.log 2>&1\nresult=$?\nset -e\ncat evidence/modal-red.log\nprintf '%s\\n' \"$result\" > evidence/modal-red-exit.txt\n\
      test \"$result\" -ne 0\nnode --input-type=module <<'JS'\nimport { readFileSync } from 'node:fs'\nimport assert from\
      \ 'node:assert/strict'\nconst report = JSON.parse(readFileSync('evidence/modal-red.json', 'utf8'))\nassert.equal(report.numRuntimeErrorTestSuites\
      \ ?? 0, 0)\nassert.doesNotMatch(readFileSync('evidence/modal-red.log', 'utf8'), /\\[vitest\\]|Transform failed|Unhandled\
      \ Error|SyntaxError/)\nconst tests = report.testResults.flatMap(suite => suite.assertionResults).filter(test => test.title.startsWith('2FA\
      \ controlled Close/reopen'))\nassert.equal(tests.length, 2)\nfor (const test of tests) {\n  assert.equal(test.status,\
      \ 'failed')\n  assert.match(test.failureMessages.join('\\n'), /AssertionError/)\n  assert.match(test.failureMessages.join('\\\
      n'), /expected 6 to be 3/)\n}\nJS\n"
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-twofa-import-parallel-baseline-red-twofa-red-${{ github.sha }}
      path: evidence/
      if-no-files-found: error
      retention-days: 30
