name: sync-20261116-ws-owner-conflict-behavior
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Install isolated Redis
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    run: 'if ! command -v redis-server >/dev/null; then brew install redis; fi

      '
    shell: bash
  - name: Real handler RED against exact production blobs
    shell: bash
    run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$CANDIDATE\"\nmkdir -p \"$RUNNER_TEMP/ws-owner-evidence\"\n\
      git rev-parse HEAD HEAD^{tree} > \"$RUNNER_TEMP/ws-owner-evidence/candidate.txt\"\ngit worktree add --detach \"$RUNNER_TEMP/ws-owner-red\"\
      \ \"$CANDIDATE\"\ngit diff --name-only \"$BASELINE\" \"$CANDIDATE\" -- backend | while IFS= read -r target; do\n  case\
      \ \"$target\" in\n    *_test.go) continue ;;\n    *.go)\n      if git cat-file -e \"$BASELINE:$target\" 2>/dev/null;\
      \ then\n        mkdir -p -- \"$(dirname -- \"$RUNNER_TEMP/ws-owner-red/$target\")\"\n        git show \"$BASELINE:$target\"\
      \ > \"$RUNNER_TEMP/ws-owner-red/$target\"\n        test \"$(git hash-object \"$RUNNER_TEMP/ws-owner-red/$target\")\"\
      \ = \"$(git rev-parse \"$BASELINE:$target\")\"\n        printf '%s %s\\n' \"$(git rev-parse \"$BASELINE:$target\")\"\
      \ \"$target\" >> \"$RUNNER_TEMP/ws-owner-evidence/baseline-blobs.txt\"\n      else\n        rm -- \"$RUNNER_TEMP/ws-owner-red/$target\"\
      \n      fi ;;\n  esac\ndone\nbash scripts/prepare-free-fast-red-fixtures.sh \"$BASELINE\" \"$RUNNER_TEMP/ws-owner-red\"\
      \ \"$CANDIDATE\"\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" \"$RUNNER_TEMP/ws-owner-red/backend\"\nset\
      \ +e\n(cd \"$RUNNER_TEMP/ws-owner-red/backend\" && go test -p=2 -tags=unit,ownerconflict ./internal/handler -run '^TestOpenAIWSMixedOwnerContinuation$/turn_2$'\
      \ -count=1 -json -timeout=2m) > \"$RUNNER_TEMP/ws-owner-evidence/red.jsonl\" 2>&1\nstatus=$?\nset -e\ncat \"$RUNNER_TEMP/ws-owner-evidence/red.jsonl\"\
      \ntest \"$status\" -eq 1\npython3 scripts/ws-owner-conflict-evidence.py red \"$status\" \"$RUNNER_TEMP/ws-owner-evidence/red.jsonl\"\
      \n"
  - name: Candidate GREEN after production repair
    shell: bash
    run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$CANDIDATE\"\ngit diff --exit-code\npython3 -m unittest discover\
      \ -s scripts -p 'test_ws_owner_conflict_evidence.py'\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\n\
      set +e\n(cd backend && go test -p=2 -tags=unit,ownerconflict ./internal/handler -run '^TestOpenAIWSMixedOwnerContinuation$'\
      \ -count=1 -json -timeout=2m) > \"$RUNNER_TEMP/ws-owner-evidence/first-green.jsonl\" 2>&1\nstatus=$?\nset -e\ncat \"\
      $RUNNER_TEMP/ws-owner-evidence/first-green.jsonl\"\npython3 scripts/ws-owner-conflict-evidence.py continuation \"$status\"\
      \ \"$RUNNER_TEMP/ws-owner-evidence/first-green.jsonl\"\nfor suite in continuation boundaries transports; do\n  case\
      \ \"$suite\" in\n    continuation) test_name=TestOpenAIWSMixedOwnerContinuation ;;\n    boundaries) test_name=TestOpenAIWSMixedOwnerBoundaries\
      \ ;;\n    transports) test_name=TestOpenAIWSMixedOwnerTransports ;;\n  esac\n  python3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ backend\n  set +e\n  (cd backend && go test -race -p=2 -tags=unit,ownerconflict ./internal/handler -run \"^${test_name}$\"\
      \ -count=1 -json -timeout=5m) > \"$RUNNER_TEMP/ws-owner-evidence/green-$suite.jsonl\" 2>&1\n  status=$?\n  set -e\n\
      \  cat \"$RUNNER_TEMP/ws-owner-evidence/green-$suite.jsonl\"\n  python3 scripts/ws-owner-conflict-evidence.py \"$suite\"\
      \ \"$status\" \"$RUNNER_TEMP/ws-owner-evidence/green-$suite.jsonl\"\ndone\n"
  - name: Existing policy, shadow and actual-wire contracts
    shell: bash
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\n(cd backend && go test -race\
      \ -p=2 -tags=unit,ownerconflict ./internal/handler -run '^Test(OpenAI409(WSReadableContinuation|WSReadableBoundaries|WSCrossModelProofRefused|WSReviewRepairs|WSResidualRepairs|WSNativeNamespaceRecovery|WSRecoveredAudit|WSRecoveredAuditNextTurn|WSAmbiguousOracleMutations|FutureShadowPublicationFences|FutureShadowBoundaries|FutureShadowTaskAssociation|FutureShadowAuditProvenance)|OpenAIWSRevalidation|OpenAIResponsesWebSocketRevalidatesKeyWithoutCache|OpenAIWSKeyQueueAdmissionUsesCurrentTurnPermissions|OpenAIWSTurnPricing|Issue600ClientIdentityNetwork)'\
      \ -count=1 -json -timeout=10m) > \"$RUNNER_TEMP/ws-owner-evidence/contracts.jsonl\" 2>&1\npython3 scripts/assert-readable-continuation.py\
      \ --clean-log \"$RUNNER_TEMP/ws-owner-evidence/contracts.jsonl\"\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ backend\n(cd backend && go test -race -p=2 -tags=unit,ownerconflict ./internal/service -run '^Test(OpenAIWSMixedOwner|OpenAIRecovery(Diagnostics|ShadowRefusalDiagnostics|ShadowRetainsTaskBeforeOpaqueEnvelope|ShadowDoesNotReclassifyClientMetadataText)|OpenAI409(RebuildRechecksOriginalDeliveryBeforeSend|WSUnsentTurnBoundary|WSTicket|ReplayInputTamperingStillFails|OAuthReplayKeepsOriginalSnapshotAndFinalControls)|Issue854BeforeSendRecoveryGuards|Issue715WS)'\
      \ -count=1 -json -timeout=5m) > \"$RUNNER_TEMP/ws-owner-evidence/service-contracts.jsonl\" 2>&1\npython3 scripts/assert-readable-continuation.py\
      \ --clean-log \"$RUNNER_TEMP/ws-owner-evidence/service-contracts.jsonl\"\npython3 - \"$RUNNER_TEMP/ws-owner-evidence/service-contracts.jsonl\"\
      \ <<'PY'\nimport json, sys\nrows = [json.loads(line) for line in open(sys.argv[1]) if line.startswith('{')]\nfor test\
      \ in ('TestOpenAIWSMixedOwnerFinalSendFences', 'TestOpenAIWSMixedOwnerProofCannotComeFromDiagnostics', 'TestOpenAIRecoveryDiagnosticsAreAllowlisted',\
      \ 'TestOpenAIRecoveryShadowRefusalDiagnostics', 'TestOpenAIRecoveryShadowRetainsTaskBeforeOpaqueEnvelope', 'TestOpenAIRecoveryShadowDoesNotReclassifyClientMetadataText'):\n\
      \    assert sum(r.get('Action') == 'pass' and r.get('Test') == test for r in rows) == 1, test\nPY\n"
  - name: Persist safe refusal subtype with logical turn
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit,ownerdiagnostics ./internal/handler -run ''^TestOwnerConflictPersistence'' -count=1 -v -timeout=5m'
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-ws-owner-conflict-behavior-ws-owner-conflict-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: ${{ runner.temp }}/ws-owner-evidence
