name: sync-20261116-issue715-agent-recovery-red-first-delivery
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Reviewed pre-fix delivery order with identical barrier regression
    shell: bash
    run: "set -euo pipefail\ngit rev-parse HEAD\noriginal=242f5b0892a59d95005099e6294262b066bd2f8b\nbash scripts/historical-recovery-timezone-callers.sh\n\
      targets=(backend/internal/service/openai_agent_message_recovery.go backend/internal/service/openai_agent_message_recovery_cache.go\
      \ backend/internal/repository/gateway_cache_agent_recovery.go backend/internal/service/openai_gateway_forward.go backend/internal/service/openai_gateway_response_handling.go)\n\
      added=backend/internal/service/openai_agent_message_delivery.go\nws_original=a575df898ccd0876c4c0eb1559da38cedfdfe99d\n\
      ws_targets=(backend/internal/handler/openai_gateway_handler.go backend/internal/service/openai_ws_forwarder_ingress.go\
      \ backend/internal/service/openai_ws_v2_passthrough_adapter.go backend/internal/service/openai_ws_http_bridge.go backend/internal/service/openai_ws_pool.go)\n\
      # Neither helper exists on the restored historical socket structure.\nws_added=(backend/internal/service/openai_ws_agent_recovery.go\
      \ backend/internal/service/openai_ws_search_activation.go)\nws_added+=(backend/internal/service/openai_ws_readable_continuation.go\
      \ backend/internal/service/openai_agent_recovery_diagnostics.go backend/internal/service/openai_tool_provenance.go backend/internal/repository/gateway_cache_tool_provenance.go)\n\
      handler_compat=aa8e596e6d6f3e4648d6beba73b39b240dd5357a\nhandler_leaf=backend/internal/handler/openai_agent_message_recovery.go\n\
      error_leaf=backend/internal/service/openai_agent_message_recovery_error.go\n# The historical recovery request predates\
      \ Issue758 cooldown state.\n# Keep the exact delivery-defect blobs above, and pin only this\n# scheduling compatibility\
      \ leaf to the pre-Issue758 production base.\nscheduler_compat=45e92f44470f91435bd261ea18111c271063c0ac\nscheduler_leaf=backend/internal/service/openai_account_scheduler.go\n\
      wait_added=backend/internal/service/openai_agent_message_recovery_wait.go\n# The Beta helper depends on fields absent\
      \ in this historical recovery struct.\nomission_added=(backend/internal/service/openai_409_omit_history.go backend/internal/service/openai_409_readable_shadow.go\
      \ backend/internal/repository/gateway_cache_readable_shadow.go backend/internal/repository/gateway_cache_agent_shadow_epoch.go\
      \ backend/internal/service/openai_400_omit_history.go backend/internal/service/openai_history_omission.go)\nomission_added+=(backend/internal/service/openai_agent_replay_metadata.go)\n\
      projection_types=backend/internal/service/openai_ws_plaintext_projection.go\nmetadata_compat=aa8e596e6d6f3e4648d6beba73b39b240dd5357a\n\
      metadata_leaf=backend/internal/service/openai_gateway_request_body.go\ngit fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git\
      \ \"$original\"\ngit fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git \"$ws_original\"\ngit fetch\
      \ --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git \"$scheduler_compat\"\ngit fetch --no-tags --depth=1\
      \ https://github.com/ranxi2001/sub2api.git \"$metadata_compat\"\ntrap 'git restore --source=HEAD -- \"${targets[@]}\"\
      \ \"$added\" \"${ws_targets[@]}\" \"${ws_added[@]}\" \"$scheduler_leaf\" \"$wait_added\" \"${omission_added[@]}\" \"\
      $handler_leaf\" \"$error_leaf\" \"$metadata_leaf\" \"$projection_types\" backend/internal/service/openai_request_timezone_egress.go\
      \ backend/internal/service/openai_ws_client.go backend/internal/handler/wire.go; git diff --exit-code' EXIT\ngit restore --source=\"$original\" -- \"\
      ${targets[@]}\"\ngit restore --source=\"$ws_original\" -- \"${ws_targets[@]}\"\ngit restore --source=\"$metadata_compat\"\
      \ -- \"$metadata_leaf\"\ntest \"$(git hash-object \"$metadata_leaf\")\" = \"$(git rev-parse \"$metadata_compat:$metadata_leaf\"\
      )\"\necho \"compatibility_leaf_baseline=$metadata_compat path=$metadata_leaf blob=$(git hash-object \"$metadata_leaf\"\
      )\"\ngit restore --source=\"$scheduler_compat\" -- \"$scheduler_leaf\"\nexpected=$(git rev-parse \"$scheduler_compat:$scheduler_leaf\"\
      )\nactual=$(git hash-object \"$scheduler_leaf\")\necho \"compatibility_leaf_baseline=$scheduler_compat path=$scheduler_leaf\
      \ expected_blob=$expected tested_blob=$actual\"\ntest \"$expected\" = \"$actual\"\ngit fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git\
      \ \"$handler_compat\"\ngit restore --source=\"$handler_compat\" -- \"$handler_leaf\" \"$error_leaf\"\ntest \"$(git hash-object\
      \ \"$error_leaf\")\" = \"$(git rev-parse \"$handler_compat:$error_leaf\")\"\necho \"error_compatibility_baseline=$handler_compat\
      \ path=$error_leaf blob=$(git hash-object \"$error_leaf\")\"\ntest \"$(git hash-object \"$handler_leaf\")\" = \"$(git\
      \ rev-parse \"$handler_compat:$handler_leaf\")\"\necho \"handler_compatibility_baseline=$handler_compat path=$handler_leaf\"\
      \nrm -- \"$added\" \"${ws_added[@]}\" \"$wait_added\" \"${omission_added[@]}\"\nfor target in \"${omission_added[@]}\"\
      ; do\n  test ! -e \"$target\"\n  echo \"candidate-only shadow dependency removed: $target\"\ndone\ntest ! -e \"$wait_added\"\
      \nfor target in \"${targets[@]}\"; do\n  expected=$(git rev-parse \"$original:$target\")\n  actual=$(git hash-object\
      \ \"$target\")\n  echo \"baseline=$original path=$target expected_blob=$expected tested_blob=$actual\"\n  test \"$expected\"\
      \ = \"$actual\"\ndone\nbash scripts/historical-ws-projection-types.sh \"$original\" \"$ws_original\"\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ backend\nset +e\n(cd backend && go test -race -tags=unit ./internal/handler -run '^TestIssue715HTTPFirstDeliveryCrossNodeBarrier$/(generated-json|generated-stream|generated-stream-items)$'\
      \ -count=1 -v -timeout=5m) > \"$RUNNER_TEMP/issue715-first-delivery-red.log\" 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/issue715-first-delivery-red.log\"\
      \npython3 scripts/assert-readable-continuation.py --clean-log \"$RUNNER_TEMP/issue715-first-delivery-red.log\"\ntest\
      \ \"$result\" -ne 0\nif grep -Eq 'build failed|no tests to run|undefined:|panic:|DATA RACE|fixture barrier not reached'\
      \ \"$RUNNER_TEMP/issue715-first-delivery-red.log\"; then exit 1; fi\nfor format in generated-json generated-stream generated-stream-items;\
      \ do\n  grep -q -- \"--- FAIL: TestIssue715HTTPFirstDeliveryCrossNodeBarrier/$format\" \"$RUNNER_TEMP/issue715-first-delivery-red.log\"\
      \ndone\ngrep -q 'client-visible first delivery must not race shared ownership' \"$RUNNER_TEMP/issue715-first-delivery-red.log\"\
      \n"
