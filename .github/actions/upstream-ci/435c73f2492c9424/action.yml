name: sync-20261116-issue614-lifecycle-physical-write
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: RED old production must fail the physical generation boundary
    run: 'set -euo pipefail

      mkdir -p "$RUNNER_TEMP/issue614-proof"

      test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      git diff --exit-code HEAD

      git rev-parse HEAD > "$RUNNER_TEMP/issue614-proof/head.txt"

      git worktree add --detach "$RUNNER_TEMP/issue614-red" "$BASELINE"

      git show d79c1044914e7924c38cc4a239e42ff8980698e6:backend/internal/service/priority_lifecycle_prewrite_test.go > "$RUNNER_TEMP/issue614-red/backend/internal/service/priority_lifecycle_prewrite_test.go"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$RUNNER_TEMP/issue614-red/backend"

      set +e

      (cd "$RUNNER_TEMP/issue614-red/backend" && go test -tags=unit ./internal/service -run ''^TestPriorityLifecyclePassthroughPhysicalWriteFence$''
      -count=1 -v -timeout=12m) > "$RUNNER_TEMP/issue614-proof/red.log" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/issue614-proof/red.log"

      test "$result" -ne 0

      grep -q ''LIFECYCLE_PREWRITE: stopped follow-up generation reached physical upstream write'' "$RUNNER_TEMP/issue614-proof/red.log"

      grep -q -- ''--- FAIL: TestPriorityLifecyclePassthroughPhysicalWriteFence'' "$RUNNER_TEMP/issue614-proof/red.log"

      ! grep -Eq ''undefined:|build failed|no tests to run|fixture must publish'' "$RUNNER_TEMP/issue614-proof/red.log"

      '
    shell: bash
  - name: GREEN exact head production adapters handlers and physical writes
    run: 'set -euo pipefail

      test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -tags=unit ./internal/service ./internal/handler ./internal/repository ./internal/service/openai_ws_v2
      -run ''^TestPriorityLifecycle|^TestPriorityLatency|^TestRelay|^TestOpenAITurnAdmission'' -count=1 -v -timeout=15m) >
      "$RUNNER_TEMP/issue614-proof/green.log" 2>&1 || { cat "$RUNNER_TEMP/issue614-proof/green.log"; exit 1; }

      cat "$RUNNER_TEMP/issue614-proof/green.log"

      grep -q -- ''--- PASS: TestPriorityLifecyclePassthroughPhysicalWriteFence'' "$RUNNER_TEMP/issue614-proof/green.log"

      (cd backend && go build ./internal/service ./internal/repository ./internal/handler/... ./internal/server/... ./cmd/server)

      git diff --exit-code HEAD

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-issue614-lifecycle-physical-write-issue614-physical-write-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/issue614-proof
      if-no-files-found: error
