name: sync-20261116-pr610-queue-timing-generated
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Exact head and generated Ent verification
    run: 'set -euo pipefail

      test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"

      echo "exact_head=$SOURCE_HEAD"

      (cd backend && go generate ./ent)

      git diff --binary -- backend/ent > "$RUNNER_TEMP/ent-generated.patch"

      git diff --exit-code -- backend/ent

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-pr610-queue-timing-generated-pr610-ent-${{ github.event.pull_request.head.sha || github.sha }}
      path: ${{ runner.temp }}/ent-generated.patch
