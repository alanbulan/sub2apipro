name: sync-20261116-issue825-video-pricing-regression
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Assert exact candidate
    run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
    shell: bash
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Real pricing components and locale completeness (GREEN)
    run: 'set -euo pipefail

      mkdir -p "$RUNNER_TEMP/issue825-tests"

      pnpm --dir frontend exec vitest run src/components/modelPlaza/__tests__/PlazaModelPricingTable.spec.ts src/components/modelPlaza/__tests__/PlazaModelPricingTable.video.spec.ts
      src/i18n/__tests__/localeKeyCompleteness.spec.ts --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/issue825-tests/green.log"

      '
    shell: bash
  - name: Same localized component regression against fixed defective source (RED)
    env:
      EVIDENCE_DIR: ${{ runner.temp }}/issue825-tests
    run: "set -euo pipefail\nfor file in frontend/src/components/modelPlaza/PlazaModelPricingTable.vue frontend/src/i18n/locales/zh/dashboard.ts\
      \ frontend/src/i18n/locales/en/dashboard.ts; do\n  git show \"$SOURCE_BASE:$file\" > \"$file\"\ndone\nset +e\npnpm --dir\
      \ frontend exec vitest run src/components/modelPlaza/__tests__/PlazaModelPricingTable.video.spec.ts --reporter=verbose\
      \ --reporter=json --outputFile=\"$EVIDENCE_DIR/red.json\" > \"$EVIDENCE_DIR/red.log\" 2>&1\nresult=$?\nset -e\ncat \"\
      $EVIDENCE_DIR/red.log\"\ntest \"$result\" -ne 0\nnode --input-type=module <<'JS'\nimport assert from 'node:assert/strict'\n\
      import { readFileSync } from 'node:fs'\nconst report = JSON.parse(readFileSync(`${process.env.EVIDENCE_DIR}/red.json`,\
      \ 'utf8'))\nassert.equal(report.numFailedTests, 10)\nassert.equal(report.numPassedTests, 6)\nconst failures = report.testResults.flatMap(file\
      \ => file.assertionResults).filter(test => test.status === 'failed')\nassert.equal(failures.length, 10)\nfor (const\
      \ test of failures) {\n  assert.ok(test.fullName.includes('shows seconds and preserves'))\n  assert.ok(test.failureMessages.join('\\\
      n').includes('to contain'))\n}\nconsole.log('RED confirmed: 10 video label assertions fail; 6 image/request/token controls\
      \ pass')\nJS\n"
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-issue825-video-pricing-regression-issue825-tests-${{ github.event_name }}-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/issue825-tests
      if-no-files-found: error
