name: sync-20261116-mature-review-repairs-r1-handler
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_phase:
    description: Upstream matrix parameter phase.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      cache: false
      go-version: 1.27.4
  - uses: actions/cache/restore@v6
    with:
      path: '~/.cache/go-build

        ~/go/pkg/mod

        '
      key: mature-repair-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
      restore-keys: 'mature-go-${{ runner.os }}-${{ hashFiles(''backend/go.sum'') }}-candidate-

        mature-go-${{ runner.os }}-${{ hashFiles(''backend/go.sum'') }}-

        '
  - name: Bind R1 handler tests and pre-confirmation production blob
    env:
      PHASE: ${{ inputs.sync_matrix_phase }}
    run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/repair-r1-handler\"\ntest \"$(git rev-parse HEAD)\" = '${{ github.sha\
      \ }}'\ntest -z \"$(git status --porcelain)\"\ngit rev-parse HEAD HEAD^{tree} > \"$RUNNER_TEMP/repair-r1-handler/candidate.txt\"\
      \nsha256sum backend/internal/server/routes/repair_r1_payment_review_test.go > \"$RUNNER_TEMP/repair-r1-handler/test-sha256.txt\"\
      \nbaseline=00b48f2757ffb684acdcc96b0cea16ea24a2a353\ngit fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git\
      \ \"$baseline\"\nfor name in payment_handler.go; do\n  path=\"backend/internal/handler/admin/$name\"\n  if [ \"$PHASE\"\
      \ = red ]; then\n    git show \"$baseline:$path\" > \"$path\"\n    test \"$(git hash-object \"$path\")\" = \"$(git rev-parse\
      \ \"$baseline:$path\")\"\n  fi\n  git hash-object \"$path\" >> \"$RUNNER_TEMP/repair-r1-handler/production-blobs.txt\"\
      \ndone\n"
    shell: bash
  - name: PostgreSQL payment recovery oracle
    env:
      PHASE: ${{ inputs.sync_matrix_phase }}
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\nset +e\n(cd backend && go test\
      \ -tags=integration ./internal/server/routes -run '^TestRepairR1' -count=1 -json -timeout=5m) > \"$RUNNER_TEMP/repair-r1-handler/test.jsonl\"\
      \ 2>&1\nresult=$?\nset -e\nprintf '%s\\n' \"$result\" > \"$RUNNER_TEMP/repair-r1-handler/exit-code.txt\"\ncat \"$RUNNER_TEMP/repair-r1-handler/test.jsonl\"\
      \npython3 - <<'PYORACLE'\nimport json, os\nfrom pathlib import Path\np = Path(os.environ['RUNNER_TEMP']) / 'repair-r1-handler'\n\
      raw = (p / 'test.jsonl').read_text()\nevents = [json.loads(line) for line in raw.splitlines() if line.startswith('{')]\n\
      outcomes = {e['Test']: e['Action'] for e in events if e.get('Test') and e['Action'] in ('pass', 'fail', 'skip')}\ncases\
      \ = ['TestRepairR1CouponHoldRequiresAuthorizedExplicitApproval/' + status for status in ('CANCELLED', 'EXPIRED')]\n\
      assert not any(e['Action'] == 'skip' for e in events), 'No skipped database evidence'\nassert all(s not in raw.lower()\
      \ for s in ('build failed', 'no tests to run', 'undefined:', 'panic:')), 'Invalid RED fixture/build'\nif os.environ['PHASE']\
      \ == 'red':\n    assert int((p / 'exit-code.txt').read_text()) != 0\n    assert all(outcomes.get(case) == 'fail' for\
      \ case in cases), outcomes\n    assert raw.count('R1 paid coupon hold must not fulfill without explicit handler confirmation')\
      \ >= 2\nelse:\n    assert int((p / 'exit-code.txt').read_text()) == 0\n    assert all(outcomes.get(case) == 'pass' for\
      \ case in cases), outcomes\nPYORACLE\n"
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-review-repairs-r1-handler-repair-r1-handler-${{ inputs.sync_matrix_phase }}-${{ github.sha
        }}
      path: ${{ runner.temp }}/repair-r1-handler/
