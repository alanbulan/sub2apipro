name: sync-20261116-balance-forecast-compatibility
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Retired settings and notification compatibility
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit ./internal/service ./internal/handler/admin ./cmd/server -run ''TestBalanceForecastRetired|TestProvideCleanup|TestResolveBalanceThreshold|TestNotificationEmail''
      -count=1 -v -timeout=10m'
    shell: bash
