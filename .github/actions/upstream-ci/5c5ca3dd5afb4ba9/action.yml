name: sync-20261116-upstream-v0221-regression-orphan-allocation-proof
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Assert exact candidate head
    run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
    shell: bash
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Require predicate and copy/decode RED, then repeated normal/race GREEN
    run: python3 .github/upstream-v0221-orphan-alloc-proof.py
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-upstream-v0221-regression-orphan-allocation-proof-v0221-orphan-alloc-${{ github.event_name }}-${{
        github.event.pull_request.head.sha || github.sha }}
      path: ${{ runner.temp }}/v0221-orphan-alloc-proof/
      if-no-files-found: error
