name: sync-20261116-balance-forecast-ui
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - run: pnpm --dir frontend exec vitest run src/views/admin/__tests__/SettingsView.spec.ts
    shell: bash
  - name: Prepare baseline and isolated browser
    env:
      SOURCE_BASE: 4c660794b89279dcbf699275091340eb2c87959a
    run: 'git worktree add --detach "$RUNNER_TEMP/forecast-before" "$SOURCE_BASE"

      pnpm --dir "$RUNNER_TEMP/forecast-before/frontend" install --frozen-lockfile

      npm install --prefix "$RUNNER_TEMP/forecast-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/forecast-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Render actual settings page before and after removal
    env:
      SOURCE_BASE: 4c660794b89279dcbf699275091340eb2c87959a
      BASELINE_ROOT: ${{ runner.temp }}/forecast-before/frontend
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/forecast-browser/node_modules/playwright
      SCREENSHOT_DIR: ${{ runner.temp }}/forecast-ui
    run: node scripts/balance-forecast-screenshot.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-balance-forecast-ui-balance-forecast-removal-ui-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: ${{ runner.temp }}/forecast-ui
