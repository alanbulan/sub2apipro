name: sync-20261116-future-shadow-http
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_phase:
    description: Upstream matrix parameter phase.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Install isolated Redis
    run: "bash \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\nif ! command -v redis-server >/dev/null; then\n  bash\
      \ \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\n  sudo apt-get update\n  sudo apt-get install -y --no-install-recommends\
      \ redis-server\nfi\n"
    shell: bash
  - name: Freeze candidate tests and disposable baseline source
    shell: bash
    run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$CANDIDATE_SHA\"\ntest -z \"$(git status --porcelain)\"\n\
      mkdir -p \"$RUNNER_TEMP/shadow-evidence\"\ngit rev-parse HEAD HEAD^{tree} > \"$RUNNER_TEMP/shadow-evidence/candidate.txt\"\
      \ngit rev-parse \"$BASELINE_SHA\" > \"$RUNNER_TEMP/shadow-evidence/baseline.txt\"\nif [ \"$PHASE\" = RED ]; then\n \
      \ git worktree add --detach \"$RUNNER_TEMP/shadow-red\" \"$CANDIDATE_SHA\"\n  cd \"$RUNNER_TEMP/shadow-red\"\n  while\
      \ IFS= read -r target; do\n    case \"$target\" in *_test.go) continue ;; esac\n    if git cat-file -e \"$BASELINE_SHA:$target\"\
      \ 2>/dev/null; then\n      mkdir -p -- \"$(dirname -- \"$target\")\"\n      git show \"$BASELINE_SHA:$target\" > \"\
      $target\"\n      git add -N -- \"$target\"\n      test \"$(git hash-object \"$target\")\" = \"$(git rev-parse \"$BASELINE_SHA:$target\"\
      )\"\n    else\n      rm -- \"$target\"\n    fi\n  done < <(git diff --no-renames --name-only \"$BASELINE_SHA\" \"$CANDIDATE_SHA\"\
      \ -- 'backend/**/*.go')\n  git diff --exit-code \"$BASELINE_SHA\" -- 'backend/**/*.go' ':!backend/**/*_test.go'\nfi\n\
      git diff --exit-code \"$CANDIDATE_SHA\" -- 'backend/**/*_test.go'\nif [ \"$PHASE\" = RED ]; then\n  bash \"$GITHUB_WORKSPACE/scripts/exclude-later-400-red-fixtures.sh\"\
      \ \"$BASELINE_SHA\"\n  bash \"$GITHUB_WORKSPACE/scripts/exclude-later-http2-red-fixtures.sh\" \"$BASELINE_SHA\"\n  bash\
      \ \"$GITHUB_WORKSPACE/scripts/prepare-replay-red-fixtures.sh\" \"$BASELINE_SHA\" . \"$CANDIDATE_SHA\" | tee \"$RUNNER_TEMP/shadow-evidence/replay-fixtures.txt\"\
      \n  bash \"$GITHUB_WORKSPACE/scripts/prepare-moderation-red-fixtures.sh\" \"$BASELINE_SHA\" . \"$CANDIDATE_SHA\" | tee\
      \ \"$RUNNER_TEMP/shadow-evidence/moderation-fixtures.txt\"\nfi\nfor target in backend/internal/handler/openai_409_shadow_http_test.go\
      \ backend/internal/service/openai_agent_message_delivery.go backend/internal/service/openai_409_omit_history.go; do\n\
      \  git hash-object \"$target\" >> \"$RUNNER_TEMP/shadow-evidence/blobs.txt\"\ndone\n"
  - name: Actual cross-node HTTP continuation
    shell: bash
    run: 'set -euo pipefail

      tested_tree="$GITHUB_WORKSPACE"

      if [ "$PHASE" = RED ]; then tested_tree="$RUNNER_TEMP/shadow-red"; fi

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$tested_tree/backend"

      set +e

      (cd "$tested_tree/backend" && go test -race -json -tags=unit ./internal/handler -run ''^TestOpenAI409FutureShadowHTTP$''
      -count=1 -timeout=5m) > "$RUNNER_TEMP/shadow-evidence/transport.jsonl" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/shadow-evidence/transport.jsonl"

      python3 scripts/assert-future-shadow.py "$PHASE" "$result" "$RUNNER_TEMP/shadow-evidence/transport.jsonl"

      '
  - name: GREEN scope and delivery boundaries
    if: inputs.sync_matrix_phase == 'GREEN'
    shell: bash
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -race -json -tags=unit ./internal/handler -run ''^TestOpenAI409FutureShadowBoundaries$'' -count=1
      -timeout=5m) > "$RUNNER_TEMP/shadow-evidence/boundaries.jsonl" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/shadow-evidence/boundaries.jsonl"

      python3 scripts/assert-future-shadow.py GREEN "$result" "$RUNNER_TEMP/shadow-evidence/boundaries.jsonl" --boundaries

      '
  - name: GREEN bounded storage and exact delivered task association
    if: inputs.sync_matrix_phase == 'GREEN'
    shell: bash
    run: "set -euo pipefail\nfor suite in resources association; do\n  if [ \"$suite\" = resources ]; then root=TestOpenAI409FutureShadowResources;\
      \ else root=TestOpenAI409FutureShadowTaskAssociation; fi\n  python3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ backend\n  set +e\n  (cd backend && go test -race -json -tags=unit ./internal/handler -run \"^${root}$\" -count=1\
      \ -timeout=5m) > \"$RUNNER_TEMP/shadow-evidence/$suite.jsonl\" 2>&1\n  result=$?\n  set -e\n  cat \"$RUNNER_TEMP/shadow-evidence/$suite.jsonl\"\
      \n  python3 scripts/assert-future-shadow.py GREEN \"$result\" \"$RUNNER_TEMP/shadow-evidence/$suite.jsonl\" \"--$suite\"\
      \ndone\n"
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-future-shadow-http-future-shadow-${{ inputs.sync_matrix_phase }}-${{ env.CANDIDATE_SHA }}
      path: ${{ runner.temp }}/shadow-evidence/
      if-no-files-found: error
