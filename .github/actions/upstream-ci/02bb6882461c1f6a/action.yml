name: sync-20261116-ws-tool-association-association
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_phase:
    description: Upstream matrix parameter phase.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Install isolated Redis
    run: 'bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      if ! command -v redis-server >/dev/null; then sudo apt-get update && sudo apt-get install -y redis-server; fi

      '
    shell: bash
  - name: Freeze candidate and exact pre-repair projection
    env:
      CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
      PHASE: ${{ inputs.sync_matrix_phase }}
    run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$CANDIDATE\"\ngit diff --exit-code\nmkdir -p \"$RUNNER_TEMP/association\"\
      \ngit rev-parse HEAD HEAD^{tree} > \"$RUNNER_TEMP/association/candidate.txt\"\nif [ \"$PHASE\" = RED ]; then\n  baseline=cc1a9e80223695684ad54ab0e9cf4f27c7991bf2\n\
      \  path=backend/internal/service/openai_ws_readable_continuation.go\n  git show \"$baseline:$path\" > \"$path\"\n  test\
      \ \"$(git hash-object \"$path\")\" = \"$(git rev-parse \"$baseline:$path\")\"\n  git rev-parse \"$baseline:$path\" >\
      \ \"$RUNNER_TEMP/association/baseline-blob.txt\"\nfi\n"
    shell: bash
  - name: Verify actual transmitted call/result association
    env:
      PHASE: ${{ inputs.sync_matrix_phase }}
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -race -p=2 -tags=unit,ownerconflict ./internal/handler -run ''^TestOpenAIWSMixedOwnerToolAssociation$''
      -count=1 -json -timeout=10m) > "$RUNNER_TEMP/association/result.jsonl" 2>&1

      status=$?

      set -e

      cat "$RUNNER_TEMP/association/result.jsonl"

      python3 scripts/ws-tool-association-evidence.py "$PHASE" "$status" "$RUNNER_TEMP/association/result.jsonl"

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-ws-tool-association-association-ws-tool-association-${{ inputs.sync_matrix_phase }}-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/association
