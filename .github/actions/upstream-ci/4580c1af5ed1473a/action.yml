name: sync-20261116-pr598-repair-regression-repository-green
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Prove clean exact-head production sources
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    run: "set -euo pipefail\ngit diff --exit-code HEAD\nmkdir -p \"$RUNNER_TEMP/pr598-source-proof\"\nbash scripts/pr598-source-proof.sh\
      \ \"$GITHUB_WORKSPACE\" \"$EXPECTED_HEAD\" \\\n  backend/internal/service/priority_scheduling_history.go \\\n  backend/internal/service/priority_scheduling_recompute.go\
      \ \\\n  backend/internal/service/priority_scheduling_snapshot.go \\\n  backend/internal/service/priority_scheduling.go\
      \ \\\n  backend/internal/service/priority_latency_series.go \\\n  backend/internal/repository/priority_latency_series.go\
      \ \\\n  backend/internal/repository/priority_scheduling.go \\\n  backend/internal/handler/admin/priority_scheduling_handler.go\
      \ \\\n  backend/internal/handler/admin/priority_scheduling_sticky.go \\\n  frontend/src/views/admin/PrioritySchedulingView.vue\
      \ \\\n  frontend/src/api/admin/priorityScheduling.ts | tee \"$RUNNER_TEMP/pr598-source-proof/production.txt\"\n"
    shell: bash
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Isolated PostgreSQL latency series regressions must pass
    shell: bash
    run: 'set -euo pipefail

      mkdir -p "$RUNNER_TEMP/pr598-red"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -tags=integration ./internal/repository -run ''^TestPriorityLatencySeries(ErrorsOnlyBucket|UsesConfiguredMeasurementAndPercentile)$''
      -count=1 -v -timeout=15m) 2>&1 | tee "$RUNNER_TEMP/pr598-red/repository.log"

      grep -q -- ''PASS: TestPriorityLatencySeriesErrorsOnlyBucket'' "$RUNNER_TEMP/pr598-red/repository.log"

      grep -q -- ''PASS: TestPriorityLatencySeriesUsesConfiguredMeasurementAndPercentile'' "$RUNNER_TEMP/pr598-red/repository.log"

      ! grep -Eq ''no tests to run|--- SKIP:'' "$RUNNER_TEMP/pr598-red/repository.log"

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-pr598-repair-regression-repository-green-pr598-red-repository-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: '${{ runner.temp }}/pr598-red/repository.log

        ${{ runner.temp }}/pr598-source-proof/production.txt

        '
      if-no-files-found: error
