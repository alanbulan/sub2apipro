name: sync-20261116-vip-credit-history-history-ui
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - run: pnpm --dir frontend exec vitest run src/components/admin/user/__tests__/UserBalanceHistoryModal.spec.ts
    shell: bash
  - name: Prepare browser
    run: 'bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      npm install --prefix "$RUNNER_TEMP/vip-history-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      node "$RUNNER_TEMP/vip-history-browser/node_modules/playwright/cli.js" install --with-deps chromium

      '
    shell: bash
  - name: Capture actual component before and after and verify filter
    env:
      SUB2API_PLAYWRIGHT_MODULE: ${{ runner.temp }}/vip-history-browser/node_modules/playwright/index.mjs
    run: node scripts/vip-credit-history-preview.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/vip-history-ui"
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-vip-credit-history-history-ui-vip-history-ui-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: ${{ runner.temp }}/vip-history-ui
      if-no-files-found: error
  - name: Frontend production build
    run: pnpm --dir frontend run build
    shell: bash
