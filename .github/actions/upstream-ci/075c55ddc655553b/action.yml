name: sync-20261116-anthropic-413-candidate
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Candidate handler, wire and ops regressions
    shell: bash
    run: 'set -euo pipefail

      evidence="$RUNNER_TEMP/anthropic-413-candidate"

      mkdir -p "$evidence"

      test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      git diff --exit-code

      test -z "$(git status --porcelain)"

      { git rev-parse HEAD HEAD^{tree}; go version; } > "$evidence/metadata.txt"

      cd backend

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=unit ./internal/handler -run ''^TestAnthropic413(MessagesHTTP|Review.*)$'' -count=1 -v -timeout=5m 2>&1
      | tee "$evidence/regression.log"

      '
  - name: Focused boundary regressions and race
    shell: bash
    run: 'set -euo pipefail

      cd backend

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit ./internal/handler -run ''^Test(Anthropic413|AutoConfig|GatewayEnsureForwardErrorResponse|GatewayForwardErrorAlreadyCommunicated|StreamWrittenGuard|HandleFailoverError|HandleSelectionExhausted|FailoverClientGone|OpsErrorLoggerMiddleware_(Google|RequestScoped|IntermediateSkipMonitoring|RecoveredTelemetry)|ShouldSkipFinalOpsFailureUsesOnlyFinalAttemptRule|SetOpsLocalErrorTypeClearsRequestScopedMark)''
      -count=1 -v -timeout=10m 2>&1 | tee "$RUNNER_TEMP/anthropic-413-candidate/race.log"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=unit ./internal/service -run ''^Test(GatewayService_Forward_|GatewayService_AnthropicAPIKeyPassthrough_|GatewayCompatPoolMode429AllowsSameAccountRetry|CalculateAnthropic429ResetTime|RateLimitService_HandleUpstreamError_(OAuth401|NonOAuth401|NonOAuthModel401)|HandleUpstreamTransportError|ClaudeClientCancelForwardStopsActualHTTPAndDoesNotRetry)''
      -count=1 -v -timeout=10m 2>&1 | tee "$RUNNER_TEMP/anthropic-413-candidate/service.log"

      '
  - name: Build affected production packages without test tags
    shell: bash
    run: 'set -euo pipefail

      (cd backend && go build ./internal/handler ./internal/service) 2>&1 | tee "$RUNNER_TEMP/anthropic-413-candidate/build.log"

      git diff --exit-code

      test -z "$(git status --porcelain)"

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-anthropic-413-candidate-anthropic-413-candidate-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: ${{ runner.temp }}/anthropic-413-candidate/
      if-no-files-found: error
