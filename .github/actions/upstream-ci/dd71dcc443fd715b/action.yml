name: sync-20261116-image-header-timeout-ui
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - run: pnpm --dir frontend exec vitest run src/views/admin/__tests__/SettingsView.spec.ts src/components/common/__tests__/NewFeatureBadge.spec.ts
    shell: bash
  - name: Install isolated browser
    run: 'npm install --prefix "$RUNNER_TEMP/image-header-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/image-header-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Render actual SettingsView with synthetic configuration
    env:
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/image-header-browser/node_modules/playwright
      SCREENSHOT_DIR: ${{ runner.temp }}/image-header-ui
      SOURCE_BASE: c4587c3a2e66121d088f74bb0561368c24738c50
    run: node scripts/image-header-timeout-screenshot.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-image-header-timeout-ui-image-header-ui-${{ github.event.pull_request.head.sha || github.sha }}
      path: ${{ runner.temp }}/image-header-ui
