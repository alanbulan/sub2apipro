name: sync-20261116-oauth-degradation-actions-timezone-race
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/checkout@v6
    with:
      ref: 256d5b1fc082b6eef493843fa557dc0be2129f1a
      path: retention-baseline
  - uses: actions/checkout@v6
    with:
      ref: 0c038c595c771c38f4e7d94b5022272b512662ac
      path: timezone-baseline
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: candidate/backend/go.sum
      go-version: 1.27.4
  - name: Check changed Go formatting remotely
    shell: bash
    run: 'set -euo pipefail

      mkdir -p evidence

      git -C candidate fetch --no-tags --depth=1 origin 0c038c595c771c38f4e7d94b5022272b512662ac

      (cd candidate && git diff --name-only --diff-filter=ACM 0c038c595c771c38f4e7d94b5022272b512662ac HEAD -- ''*.go'' |
      xargs -r -n 32 gofmt -d) > evidence/timezone-gofmt.diff

      cat evidence/timezone-gofmt.diff

      test ! -s evidence/timezone-gofmt.diff

      '
  - name: Original time.Local race on isolated pre-fix checkout
    shell: bash
    run: 'set -euo pipefail

      mkdir -p evidence

      git -C timezone-baseline rev-parse HEAD > evidence/timezone-red-head.txt

      git -C candidate rev-parse HEAD > evidence/timezone-green-head.txt

      cp candidate/backend/internal/repository/custom_timezone_isolation_test.go timezone-baseline/backend/internal/repository/

      python3 "$GITHUB_WORKSPACE/candidate/scripts/prepare-sync-ci.py" timezone-baseline/backend

      set +e

      (cd timezone-baseline/backend && go test -race -tags=unit ./internal/repository -run ''^TestRepositoryTimezoneIsolation$''
      -count=1 -v) > evidence/timezone-red.log 2>&1

      result=$?

      set -e

      cat evidence/timezone-red.log

      printf ''%s\n'' "$result" > evidence/timezone-red-exit.txt

      test "$result" -ne 0

      bash candidate/scripts/assert-test-log-clean.sh race-red evidence/timezone-red.log

      grep -F ''WARNING: DATA RACE'' evidence/timezone-red.log

      grep -F ''internal/pkg/timezone.Init()'' evidence/timezone-red.log

      grep -F ''time.Now()'' evidence/timezone-red.log

      grep -F ''repository.useGroupUsageRepositoryTestTimezone()'' evidence/timezone-red.log

      '
  - name: Pre-repair production cleanup with the same candidate assertions (RED)
    shell: bash
    run: "set -euo pipefail\ngit -C retention-baseline rev-parse HEAD > evidence/retention-red-head.txt\ntest \"$(git -C candidate\
      \ rev-parse HEAD)\" = '${{ github.event.pull_request.head.sha || github.sha }}'\nfor file in dashboard_aggregation_group_usage_test.go\
      \ usage_log_repo_group_summary_test.go; do\n  cp \"candidate/backend/internal/repository/$file\" \"retention-baseline/backend/internal/repository/$file\"\
      \n  cmp \"candidate/backend/internal/repository/$file\" \"retention-baseline/backend/internal/repository/$file\"\n \
      \ sha256sum \"candidate/backend/internal/repository/$file\" >> evidence/retention-oracle-sha256.txt\ndone\nset +e\n\
      (cd retention-baseline/backend && go test -race -tags=unit ./internal/repository -run '^TestDashboardAggregationRepositoryCleanupUsageLogs|^TestUsageLogRepositoryGetAllGroupUsageSummary'\
      \ -count=1 -v) > evidence/retention-red.log 2>&1\nresult=$?\nset -e\ncat evidence/retention-red.log\nprintf '%s\\n'\
      \ \"$result\" > evidence/retention-red-exit.txt\ntest \"$result\" -ne 0\nbash candidate/scripts/assert-test-log-clean.sh\
      \ red evidence/retention-red.log\ngrep -F -- '--- FAIL: TestDashboardAggregationRepositoryCleanupUsageLogsExpiresWholeDaysBeforeDeleting'\
      \ evidence/retention-red.log\ngrep -F -- '--- FAIL: TestDashboardAggregationRepositoryCleanupUsageLogsMidnightDSTGap'\
      \ evidence/retention-red.log\ngrep -F -- '--- FAIL: TestUsageLogRepositoryGetAllGroupUsageSummaryMidnightDSTGap' evidence/retention-red.log\n\
      grep -F 'arguments do not match' evidence/retention-red.log\ngrep -F -- '--- PASS: TestUsageLogRepositoryGetAllGroupUsageSummaryTailStartsAtExpiredBefore'\
      \ evidence/retention-red.log\n"
  - name: Exact head isolated clocks and all repository timezone unit assertions
    shell: bash
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/candidate/scripts/prepare-sync-ci.py" candidate/backend

      (cd candidate/backend && go test -race -tags=unit ./internal/repository -run ''^TestRepositoryTimezoneIsolation$|^TestUsageTrend|^TestUsageLogRepositoryGetAllGroupUsageSummary|^TestDashboardAggregationRepository|^TestUsageCleanupRepository''
      -count=1 -v) 2>&1 | tee evidence/timezone-green.log

      bash candidate/scripts/assert-test-log-clean.sh green evidence/timezone-green.log

      '
  - name: Original upstream merge-only scheduler regressions
    shell: bash
    run: 'set -euo pipefail

      (cd candidate/backend && go test -race -tags=unit ./internal/service -run ''^TestSchedulerSnapshotValuesReaderFiltersTimeBlockedAccounts$|^TestSchedulerFallbackPublishesPoolAndReturnsSchedulable$''
      -count=1 -v) 2>&1 | tee evidence/merge-scheduler-green.log

      grep -F -- ''--- PASS: TestSchedulerSnapshotValuesReaderFiltersTimeBlockedAccounts '' evidence/merge-scheduler-green.log

      grep -F -- ''--- PASS: TestSchedulerFallbackPublishesPoolAndReturnsSchedulable '' evidence/merge-scheduler-green.log

      bash candidate/scripts/assert-test-log-clean.sh green evidence/merge-scheduler-green.log

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-oauth-degradation-actions-timezone-race-oauth-degradation-timezone-race-${{ github.run_id }}
      path: evidence/
