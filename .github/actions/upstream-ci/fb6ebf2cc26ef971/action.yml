name: sync-20261116-pr598-repair-regression-service-green
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Prove clean exact-head production sources
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    run: "set -euo pipefail\ngit diff --exit-code HEAD\nmkdir -p \"$RUNNER_TEMP/pr598-source-proof\"\nbash scripts/pr598-source-proof.sh\
      \ \"$GITHUB_WORKSPACE\" \"$EXPECTED_HEAD\" \\\n  backend/internal/service/priority_scheduling_history.go \\\n  backend/internal/service/priority_scheduling_recompute.go\
      \ \\\n  backend/internal/service/priority_scheduling_snapshot.go \\\n  backend/internal/service/priority_scheduling.go\
      \ \\\n  backend/internal/service/priority_latency_series.go \\\n  backend/internal/repository/priority_latency_series.go\
      \ \\\n  backend/internal/repository/priority_scheduling.go \\\n  backend/internal/handler/admin/priority_scheduling_handler.go\
      \ \\\n  backend/internal/handler/admin/priority_scheduling_sticky.go \\\n  frontend/src/views/admin/PrioritySchedulingView.vue\
      \ \\\n  frontend/src/api/admin/priorityScheduling.ts | tee \"$RUNNER_TEMP/pr598-source-proof/production.txt\"\n"
    shell: bash
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Service, handler and recompute regressions must pass
    shell: bash
    run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/pr598-red\"\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ backend\n(cd backend && go test -race -tags=unit ./internal/service ./internal/handler -run '^TestPriority(LatencySeriesNoHistorySerializesEmptyBuckets|LatencySeriesUsesSnapshotMeasurementAndPercentile|RecomputeDoesNotTreatHistoryErrorAsSuccess|RecomputeKeepsCapturedScopeAcrossNewSelection|RecomputeRefreshFailurePreservesCachedRiskForScheduler|RecomputeWaitsForFreshReadAfterInflightReader|RecomputeIncompleteReadPreservesWholeObservation|LatencySeriesHandlerUsesEmptyArrayForNoHistory)$'\
      \ -count=1 -v -timeout=5m) 2>&1 | tee \"$RUNNER_TEMP/pr598-red/service.log\"\nfor name in PriorityLatencySeriesNoHistorySerializesEmptyBuckets\
      \ PriorityLatencySeriesUsesSnapshotMeasurementAndPercentile PriorityRecomputeDoesNotTreatHistoryErrorAsSuccess PriorityRecomputeKeepsCapturedScopeAcrossNewSelection\
      \ PriorityRecomputeRefreshFailurePreservesCachedRiskForScheduler PriorityRecomputeWaitsForFreshReadAfterInflightReader\
      \ PriorityRecomputeIncompleteReadPreservesWholeObservation PriorityLatencySeriesHandlerUsesEmptyArrayForNoHistory; do\n\
      \  grep -q -- \"PASS: Test$name\" \"$RUNNER_TEMP/pr598-red/service.log\"\ndone\n"
  - name: Repeat reader barriers under the race detector
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -race -tags=unit ./internal/service -run ''^TestPriorityRecompute(RefreshFailurePreservesCachedRiskForScheduler|WaitsForFreshReadAfterInflightReader|IncompleteReadPreservesWholeObservation)$''
      -count=20 -v -timeout=2m) 2>&1 | tee "$RUNNER_TEMP/pr598-red/reader-race.log"

      '
    shell: bash
  - name: Prove production sources remain unchanged after execution
    run: git diff --exit-code HEAD
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-pr598-repair-regression-service-green-pr598-red-service-${{ github.event.pull_request.head.sha ||
        github.sha }}
      path: '${{ runner.temp }}/pr598-red/service.log

        ${{ runner.temp }}/pr598-red/reader-race.log

        ${{ runner.temp }}/pr598-source-proof/production.txt

        '
      if-no-files-found: error
