name: sync-20261116-channel-operations-postgres-boundaries
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Record exact source and run HTTP/auth/validation boundaries
    working-directory: backend
    run: 'git rev-parse HEAD

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=unit ./internal/service ./internal/handler/admin ./internal/server/routes -run ''^TestChannelOperations''
      -count=1

      '
    shell: bash
  - name: Missing peer model must fail against the reviewed source
    working-directory: backend
    shell: bash
    run: 'set -euo pipefail

      target=internal/repository/channel_operations_stats.go

      cp "$target" "$RUNNER_TEMP/channel-operations-current-stats.go"

      trap ''cp "$RUNNER_TEMP/channel-operations-current-stats.go" "$target"'' EXIT

      git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git 0e1f50475a552bffd68c1822e17aa87c0a1561ac

      git show 0e1f50475a552bffd68c1822e17aa87c0a1561ac:backend/internal/repository/channel_operations_stats.go > "$target"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      set +e

      go test -tags=integration ./internal/repository -run ''^TestChannelOperationsQualityWaitsForAllFrozenModels$'' -count=1
      -v > "$RUNNER_TEMP/channel-operations-quality-red.log" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/channel-operations-quality-red.log"

      test "$result" -ne 0

      grep -q ''FAIL: TestChannelOperationsQualityWaitsForAllFrozenModels'' "$RUNNER_TEMP/channel-operations-quality-red.log"

      grep -q ''missing peer model cannot pass'' "$RUNNER_TEMP/channel-operations-quality-red.log"

      '
  - name: Actual PostgreSQL persistence, HTTP, migration and statistics regressions
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=integration ./internal/repository -run ''^TestChannelOperations'' -count=1 -v'
    shell: bash
