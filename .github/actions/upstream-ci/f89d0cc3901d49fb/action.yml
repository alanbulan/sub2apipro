name: sync-20261116-upstream-v0220-regression-selected-race
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Verify candidate identity
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
    shell: bash
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Codex non-stream exact candidate GREEN
    shell: bash
    run: 'set -euo pipefail

      proof="$RUNNER_TEMP/pr722-green"

      mkdir -p "$proof"

      test -z "$(git status --porcelain)"

      git rev-parse HEAD | tee "$proof/candidate.txt"

      git ls-files -s backend/internal/service/openai_gateway_passthrough.go backend/internal/service/openai_gateway_response_handling.go
      backend/internal/service/openai_oauth_passthrough_non_stream_test.go | tee "$proof/blobs.txt"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -json -tags=unit ./internal/service -run ''^TestOpenAIGatewayService_OAuthLike(NonStreamTerminalMatrix|StreamTrueStillStreams|NonStreamJSONLiteralFramingPreserved)$''
      -count=1 -timeout=5m) > "$proof/tests.jsonl" 2>&1

      result=$?

      set -e

      echo "$result" > "$proof/exit.txt"

      cat "$proof/tests.jsonl"

      python3 scripts/pr722-codex-nonstream-proof.py green "$proof/tests.jsonl" "$result" | tee "$proof/summary.txt"

      '
  - name: Protocol, authentication and resource regressions with race detection
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit ./internal/pkg/apicompat ./internal/pkg/antigravity ./internal/service ./internal/handler ./internal/server/middleware
      -run ''^(TestOpenAIGatewayService_OAuth|TestBedrockEventStreamDecoder|TestGeminiTextDelta|TestResponsesReasoningContent|TestOpenAICompatBufferedReasoningContent|TestMessageContentWireConsistent|TestMessageRefusalPreserved|TestEmptyMessageContentArray|TestHandleUpstreamError_Kimi|TestSanitizeGrokResponsesModelInput|TestOpenAIBodyLimitFailoverExhausted|TestUpdateSessionWindow_|TestHandleUpstreamError_SamplesWeeklyUsage|TestAccountUsageService_.*SetupToken|TestStreamingProcessorResponseShapes|TestAccountTestService_OpenAIImage|TestProbeOpenAIAPIKeyResponsesSupport|TestAPIKeyAuthLookupFailureWhenClientGoneReturns499|TestAPIKeyAuthRejectsNonUTF8KeyAsInvalid|TestAPIKeyService_GetByKeyRejectsNonUTF8BeforeLookup|TestCleanGeminiRequest_|TestBuildAnthropicMessagesURL|TestAnthropicMessagesURL_|TestAccountTestService_CloudflareMessagesRejectsBetaQuery)''
      -count=1 -v -timeout=15m'
    shell: bash
  - name: Backend compilation
    working-directory: backend
    run: go build ./cmd/server
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-upstream-v0220-regression-selected-race-pr722-green-${{ github.event_name }}-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/pr722-green/
