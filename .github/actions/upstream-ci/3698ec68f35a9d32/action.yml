name: sync-20261116-account-alert-data-ux-acceptance
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Account notification regressions
    run: pnpm --dir frontend exec vitest run src/components/admin/operations/__tests__/AccountOps src/views/admin/__tests__/AccountOpsView.spec.ts
    shell: bash
  - run: pnpm --dir frontend run build
    shell: bash
  - name: Install screenshot browser
    run: 'npm install --prefix "$RUNNER_TEMP/alert-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      node "$RUNNER_TEMP/alert-browser/node_modules/playwright/cli.js" install --with-deps chromium

      '
    shell: bash
  - name: Render actual components with fictional data
    env:
      EVIDENCE_DIR: ${{ runner.temp }}/account-alert-ui
      SUB2API_PLAYWRIGHT_MODULE: ${{ runner.temp }}/alert-browser/node_modules/playwright/index.mjs
    run: node scripts/account-alert-data-ux.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-account-alert-data-ux-acceptance-account-alert-ui-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: ${{ runner.temp }}/account-alert-ui
