name: sync-20261116-mature-review-repairs-upgrade
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      cache: false
      go-version: 1.27.4
  - uses: actions/cache/restore@v6
    with:
      path: '~/.cache/go-build

        ~/go/pkg/mod

        '
      key: mature-repair-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
      restore-keys: 'mature-go-${{ runner.os }}-${{ hashFiles(''backend/go.sum'') }}-candidate-

        mature-go-${{ runner.os }}-${{ hashFiles(''backend/go.sum'') }}-

        '
  - name: Pin merged production migrations and runner identity
    run: 'set -euo pipefail

      base=e90811e27bc442763a496027f935a7bb1fb4396b

      git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git "$base"

      git merge-base --is-ancestor "$base" HEAD

      test "$(git rev-parse HEAD:backend/internal/repository/migrations_runner.go)" = "$(git rev-parse "$base:backend/internal/repository/migrations_runner.go")"

      mkdir -p "$RUNNER_TEMP/repair-upgrade/source" "$RUNNER_TEMP/repair-upgrade/evidence"

      git archive "$base" backend/migrations | tar -x -C "$RUNNER_TEMP/repair-upgrade/source"

      git rev-parse HEAD "$base" > "$RUNNER_TEMP/repair-upgrade/evidence/identity.txt"

      '
    shell: bash
  - name: Fresh upgrade mixed-version and application rollback compatibility
    run: 'set -euo pipefail

      export MATURE_PRODUCTION_MIGRATIONS="$RUNNER_TEMP/repair-upgrade/source/backend/migrations"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test ./internal/repository -run ''^TestRepairMatureProductionUpgradeAndRollbackBoundary$'' -count=1
      -json -timeout=5m) > "$RUNNER_TEMP/repair-upgrade/evidence/test.jsonl" 2>&1

      cat "$RUNNER_TEMP/repair-upgrade/evidence/test.jsonl"

      python3 - <<''PYORACLE''

      import json, os

      from pathlib import Path

      rows=[json.loads(s) for s in (Path(os.environ[''RUNNER_TEMP''])/''repair-upgrade/evidence/test.jsonl'').read_text().splitlines()
      if s.startswith(''{'')]

      outcomes={r[''Test'']:r[''Action''] for r in rows if r.get(''Test'') and r[''Action''] in (''pass'',''fail'',''skip'')}

      assert all(outcomes.get(''TestRepairMatureProductionUpgradeAndRollbackBoundary/fresh_''+v)==''pass'' for v in (''false'',''true'')),outcomes

      assert not any(r[''Action'']==''skip'' for r in rows)

      PYORACLE

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-review-repairs-upgrade-repair-upgrade-${{ github.sha }}
      path: ${{ runner.temp }}/repair-upgrade/evidence/
