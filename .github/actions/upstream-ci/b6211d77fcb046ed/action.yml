name: sync-20261116-bps-diagnostics-auth-authorization-ui
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - run: pnpm --dir frontend exec vitest run src/components/account/__tests__/OpenAIAuthConnections.spec.ts src/i18n/__tests__/localeKeyCompleteness.spec.ts
    shell: bash
  - run: pnpm --dir frontend typecheck
    shell: bash
  - name: Install isolated screenshot browser
    run: 'npm install --prefix "$RUNNER_TEMP/bps-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      node "$RUNNER_TEMP/bps-browser/node_modules/playwright/cli.js" install --with-deps chromium

      '
    shell: bash
  - name: Render actual authorization component with synthetic callbacks
    env:
      SUB2API_PLAYWRIGHT_MODULE: ${{ runner.temp }}/bps-browser/node_modules/playwright/index.mjs
    run: node scripts/bps-auth-preview.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/bps-auth-evidence"
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-bps-diagnostics-auth-authorization-ui-bps-auth-evidence-${{ github.event.pull_request.head.sha ||
        github.sha }}
      path: ${{ runner.temp }}/bps-auth-evidence
      retention-days: 30
