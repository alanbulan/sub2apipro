name: sync-20261116-mature-channel-community-ops-wiring
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache: false
      go-version: 1.27.4
  - uses: actions/cache/restore@v6
    with:
      path: '~/.cache/go-build

        ~/go/pkg/mod

        '
      key: mature-go-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-wiring-${{ github.sha }}
      restore-keys: 'mature-go-${{ runner.os }}-${{ hashFiles(''backend/go.sum'') }}-candidate-

        '
  - name: Generate dependency graph from current source
    working-directory: backend
    run: 'cp go.mod .mature-wire.mod

      cp go.sum .mature-wire.sum

      GOFLAGS="-mod=mod -modfile=$PWD/.mature-wire.mod" go generate ./cmd/server

      mkdir -p "$RUNNER_TEMP/wiring-evidence"

      cp cmd/server/wire_gen.go "$RUNNER_TEMP/wiring-evidence/"

      git diff -- cmd/server/wire_gen.go go.mod go.sum > "$RUNNER_TEMP/wiring-evidence/diff.patch"

      git diff --exit-code -- cmd/server/wire_gen.go go.mod go.sum

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-channel-community-ops-wiring-mature-wiring-${{ github.sha }}
      path: ${{ runner.temp }}/wiring-evidence/
