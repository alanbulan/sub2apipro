name: sync-20261116-mature-provider-scope-proof-scope
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: RED pinned scope parser must not echo arbitrary identifiers
    shell: bash
    run: 'set -euo pipefail

      mkdir -p "$RUNNER_TEMP/scope-evidence"

      git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/scope-evidence/candidate.txt"

      target=backend/internal/handler/admin/mature_provider_newapi_auth.go

      cp "$target" "$RUNNER_TEMP/scope-current.go"

      trap ''cp "$RUNNER_TEMP/scope-current.go" "$target"'' EXIT

      git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git 407eea6822cd27a1772f41ff75615bc50592d941

      git show 407eea6822cd27a1772f41ff75615bc50592d941:"$target" > "$target"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test ./internal/handler/admin -run ''^TestMatureProviderScopeCannotReflectCredential$'' -count=1 -v)
      > "$RUNNER_TEMP/scope-evidence/red.log" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/scope-evidence/red.log"

      test "$result" -ne 0

      ! grep -Eiq ''build failed|no tests to run|undefined:|--- SKIP:'' "$RUNNER_TEMP/scope-evidence/red.log"

      grep -q ''an arbitrary scope label must not reflect a dashboard credential'' "$RUNNER_TEMP/scope-evidence/red.log"

      '
  - name: Candidate public error boundary
    working-directory: backend
    run: 'set -o pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test ./internal/handler/admin -run ''^TestMatureProviderScopeCannotReflectCredential$'' -count=1 -v 2>&1 | tee "$RUNNER_TEMP/scope-evidence/green.log"

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-provider-scope-proof-scope-mature-scope-${{ github.sha }}
      path: ${{ runner.temp }}/scope-evidence/
