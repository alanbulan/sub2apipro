name: sync-20261116-admin-usage-platform-filter-browser
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Install isolated browser
    run: 'npm install --prefix "$RUNNER_TEMP/platform-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/platform-browser/node_modules/.bin/playwright" install --with-deps chromium

      sudo apt-get install -y fonts-noto-cjk

      '
    shell: bash
  - name: Render real before and after components
    env:
      PLATFORM_EXPECTED_HEAD: ${{ github.sha }}
      PLATFORM_EVIDENCE_DIR: ${{ runner.temp }}/platform-evidence
      PLATFORM_CAPTURE_PHASE: both
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/platform-browser/node_modules/playwright
    run: node .github/fixtures/admin-usage-platform-filter/browser.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-admin-usage-platform-filter-browser-platform-browser-${{ github.sha }}
      path: ${{ runner.temp }}/platform-evidence
