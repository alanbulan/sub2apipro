name: sync-20261116-readable-continuation-409-evidence-validator
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Accept valid evidence and reject injected contamination
    shell: bash
    run: 'set -euo pipefail

      python3 -B -m unittest discover -s scripts -p ''test_assert_readable_continuation.py'' -v 2>&1 | tee "$RUNNER_TEMP/readable-validator-self-tests.log"

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-readable-continuation-409-evidence-validator-readable-validator-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/readable-validator-self-tests.log
      if-no-files-found: error
