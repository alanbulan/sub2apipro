name: sync-20261116-oauth-degradation-actions-postgres
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - uses: actions/checkout@v6
    with:
      ref: 1411d0fc6e1fca51d4b657c21837cd74c87bf84e
      path: baseline
  - name: PostgreSQL baseline behavioral RED
    shell: bash
    run: 'set -euo pipefail

      mkdir -p evidence

      cp backend/internal/repository/oauth_degradation_actions_integration_test.go backend/internal/repository/oauth_degradation_edit_integration_test.go
      backend/internal/repository/oauth_degradation_recovery_integration_test.go baseline/backend/internal/repository/

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" baseline/backend

      set +e

      (cd baseline/backend && go test -tags=integration ./internal/repository -run ''^TestOAuthDegradation'' -count=1 -v -timeout=15m)
      > evidence/postgres-red.log 2>&1

      result=$?

      set -e

      cat evidence/postgres-red.log

      test "$result" -ne 0

      ! grep -Eq ''build failed|setup failed|undefined:|syntax error:|no tests to run|panic:|--- SKIP:'' evidence/postgres-red.log

      grep -F ''OAuth degradation startup must apply'' evidence/postgres-red.log

      grep -F ''stale editor must not erase'' evidence/postgres-red.log

      '
  - name: Migrated disposable PostgreSQL and Redis
    shell: bash
    run: 'set -euo pipefail

      mkdir -p evidence

      git rev-parse HEAD > evidence/integration-head.txt

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -tags=integration ./internal/repository -run ''^TestOAuthDegradation|^TestAutoConfigConcurrent|^TestAccountPerformancePostgres|^TestAstraGroups|^TestAstraSchedulingModes|^TestOpenAITwoFAAdmission|^TestQualityActionsRestore|^TestQualityIsolation|^TestQualityBPSAndQuarantineCoexist|^TestQualityCoexist''
      -count=1 -v -timeout=15m) 2>&1 | tee evidence/postgres.log

      ! grep -Eq -- ''--- SKIP:|no tests to run'' evidence/postgres.log

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-oauth-degradation-actions-postgres-oauth-degradation-postgres-${{ github.event_name }}-${{ github.run_id
        }}
      path: evidence/
