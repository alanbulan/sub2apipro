name: sync-20261116-mature-channel-community-ops-race
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache: false
      go-version: 1.27.4
  - uses: actions/cache/restore@v6
    with:
      path: '~/.cache/go-build

        ~/go/pkg/mod

        '
      key: mature-go-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-race-${{ github.sha }}
      restore-keys: 'mature-go-${{ runner.os }}-${{ hashFiles(''backend/go.sum'') }}-race-

        mature-go-${{ runner.os }}-${{ hashFiles(''backend/go.sum'') }}-candidate-

        '
  - name: Race detector on QQ protocol, context, queue and coupon logic
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race ./internal/qqbot ./internal/coupon -count=1 -timeout=10m'
    shell: bash
  - uses: actions/cache/save@v6
    if: always()
    with:
      path: '~/.cache/go-build

        ~/go/pkg/mod

        '
      key: mature-go-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-race-${{ github.sha }}
