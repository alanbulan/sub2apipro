name: sync-20261116-api-key-model-policy-ui-policy-ui
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Real key policy dialog and both-entry notice regressions
    run: pnpm --dir frontend exec vitest run src/components/admin/user/__tests__/ApiKeyModelPolicyDialog.spec.ts src/components/admin/user/__tests__/ApiKeyModelPolicyNotices.spec.ts
    shell: bash
  - name: Install isolated browser
    run: 'npm install --prefix "$RUNNER_TEMP/key-policy-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/key-policy-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Render real entry and dialog with fictional API fixtures
    env:
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/key-policy-browser/node_modules/playwright
      SCREENSHOT_DIR: ${{ runner.temp }}/key-policy-ui
    run: node scripts/api-key-model-policy-screenshot.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-api-key-model-policy-ui-policy-ui-api-key-model-policy-ui-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/key-policy-ui
