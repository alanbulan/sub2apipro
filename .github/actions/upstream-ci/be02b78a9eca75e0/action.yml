name: sync-20261116-quality-jev-judge-offline-ui
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Install isolated screenshot tool
    run: 'npm install --prefix "$RUNNER_TEMP/quality-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/quality-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Render real grading editor with offline fixtures
    env:
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/quality-browser/node_modules/playwright
      QUALITY_SCREENSHOT_DIR: ${{ runner.temp }}/quality-jev-ui
      QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    run: node scripts/quality-jev-screenshot.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-quality-jev-judge-offline-ui-quality-jev-ui-${{ github.event.pull_request.head.sha || github.sha
        }}-${{ github.event_name }}
      path: ${{ runner.temp }}/quality-jev-ui
