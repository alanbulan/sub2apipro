name: sync-20261116-free-fast-customer-cost-details-frontend
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: GREEN complete affected suite, lint and typecheck
    run: 'mkdir -p "$RUNNER_TEMP/free-fast-ui"

      pnpm --dir frontend exec vitest run src/components/admin/usage/__tests__/UsageTable.spec.ts src/components/admin/usage/__tests__/UsageDetailPopover.spec.ts
      --maxWorkers=1 --minWorkers=1 --reporter=json --outputFile="$RUNNER_TEMP/free-fast-ui/green.json"

      pnpm --dir frontend lint:check

      pnpm --dir frontend typecheck

      pnpm --dir frontend build

      '
    shell: bash
  - name: RED same DOM assertions against original shared component
    shell: bash
    run: "set -euo pipefail\ngit fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git 0e8e97aa23afd8e88a61ea64a84a8fb84f1bfdc6\n\
      cp frontend/src/components/admin/usage/UsageTable.vue \"$RUNNER_TEMP/free-fast-ui/UsageTable.vue\"\ngit show 0e8e97aa23afd8e88a61ea64a84a8fb84f1bfdc6:frontend/src/components/admin/usage/UsageTable.vue\
      \ > frontend/src/components/admin/usage/UsageTable.vue\nset +e\npnpm --dir frontend exec vitest run src/components/admin/usage/__tests__/UsageTable.spec.ts\
      \ --maxWorkers=1 --minWorkers=1 --reporter=json --outputFile=\"$RUNNER_TEMP/free-fast-ui/red.json\"\ncode=$?\nset -e\n\
      cp \"$RUNNER_TEMP/free-fast-ui/UsageTable.vue\" frontend/src/components/admin/usage/UsageTable.vue\ntest \"$code\" -ne\
      \ 0\npython3 - \"$RUNNER_TEMP/free-fast-ui\" <<'PY'\nimport json,sys,pathlib\np=pathlib.Path(sys.argv[1])\nfor mode\
      \ in ('green','red'):\n    data=json.loads((p/(mode+'.json')).read_text())\n    assert data['numPendingTests']==0, data\n\
      \    assert data['numTotalTests']>=70, data\n    if mode=='green': assert data['numFailedTests']==0, data\n    else:\n\
      \        assertions=[a for r in data['testResults'] for a in r['assertionResults']]\n        target=[a for a in assertions\
      \ if 'shows Standard unit prices' in a['fullName']]\n        assert len(target)==2 and all(a['status']=='failed' for\
      \ a in target),target\n        assert all('$10.00' in '\\n'.join(a['failureMessages']) for a in target),target\n   \
      \     aliases=[a for a in assertions if 'F1 fast alias with missing or invalid snapshot' in a['fullName']]\n       \
      \ assert len(aliases)==4 and all(a['status']=='failed' for a in aliases),aliases\n        cache=[a for a in assertions\
      \ if 'G1 displays saved Standard cache read and distinct TTL unit prices' in a['fullName']]\n        assert len(cache)==2\
      \ and all(a['status']=='failed' for a in cache),cache\n        assert all('cache-unit-read' in '\\n'.join(a['failureMessages'])\
      \ for a in cache),cache\nPY\n"
  - name: Install isolated browser
    run: 'npm install --prefix "$RUNNER_TEMP/free-fast-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/free-fast-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Real Vue bilingual before/after screenshots
    env:
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/free-fast-browser/node_modules/playwright
      FREE_FAST_SCREENSHOT_DIR: ${{ runner.temp }}/free-fast-ui/screenshots
    run: node scripts/free-fast-customer-cost-browser.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-free-fast-customer-cost-details-frontend-free-fast-ui-${{ github.event.pull_request.head.sha ||
        github.sha }}
      path: '${{ runner.temp }}/free-fast-ui/*.json

        ${{ runner.temp }}/free-fast-ui/screenshots/*.png

        ${{ runner.temp }}/free-fast-ui/screenshots/manifest.json

        '
      if-no-files-found: error
