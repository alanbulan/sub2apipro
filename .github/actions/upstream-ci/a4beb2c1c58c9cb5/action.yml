name: sync-20261116-oauth-fallback-scope-screenshots
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Prepare isolated browser
    run: 'npm install --prefix "$RUNNER_TEMP/fallback-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      node "$RUNNER_TEMP/fallback-browser/node_modules/playwright/cli.js" install --with-deps chromium

      '
    shell: bash
  - name: Capture fallback card before and after
    env:
      EVIDENCE_DIR: ${{ runner.temp }}/oauth-fallback-${{ github.sha }}
      SUB2API_PLAYWRIGHT_MODULE: ${{ runner.temp }}/fallback-browser/node_modules/playwright/index.mjs
    run: node scripts/oauth-fallback-scope-preview.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-oauth-fallback-scope-screenshots-oauth-fallback-${{ github.sha }}
      path: ${{ runner.temp }}/oauth-fallback-${{ github.sha }}
      if-no-files-found: error
