name: sync-20261116-oauth429-weekly-only-green
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Clean candidate GREEN with race detector
    shell: bash
    run: 'set -euo pipefail

      mkdir -p evidence

      test "$(git rev-parse HEAD)" = "$CANDIDATE"

      git rev-parse HEAD HEAD^{tree} > evidence/candidate.txt

      git diff --exit-code

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -race -json -tags=unit ./internal/service -run ''^Test(OAuth429WeeklyOnly|DisableScheduling429|RateLimitDisableSchedulingOn429|OpenAIGatewayDisableSchedulingOn429|Managed429WeeklyPolicy|Weekly429Threshold|TOTPRotationOn429|OpenAIStream429|OpenAIQuotaRecovery|CalculateOpenAI429ResetTime|CompatErrorPipelineCountsEachResponseOnce|FastPathThenGeneralHandler_CountsOne502UntilThreshold|PendingModel401_DoesNotDisableWholeAccount|Credential401_StillDisablesDespitePendingModelRule|OpenAIWSAfterOutput_Generic500AndExplicit502NeedAfterStream|MemoryTempUnschedTriggerDelayedResetKeepsNewRound)''
      -count=1 -timeout=10m) > evidence/green.jsonl 2> evidence/green.stderr

      result=$?

      set -e

      printf ''%s\n'' "$result" > evidence/green-exit.txt

      python3 scripts/oauth429-weekly-only-evidence.py green evidence/green.jsonl "$result"

      '
  - name: Durable scheduling and rotation lifecycle on isolated PostgreSQL
    if: success() || failure()
    shell: bash
    env:
      CI: 'true'
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -json -tags=integration ./internal/repository -run ''^TestOAuth429WeeklyOnly'' -count=1 -timeout=10m)
      > evidence/green-repository.jsonl 2> evidence/green-repository.stderr

      result=$?

      set -e

      printf ''%s\n'' "$result" > evidence/green-repository-exit.txt

      python3 scripts/oauth429-weekly-only-evidence.py repository evidence/green-repository.jsonl "$result"

      '
  - name: Ordinary backend build without test tags
    if: success() || failure()
    shell: bash
    run: 'set -euo pipefail

      test "$(git rev-parse HEAD)" = "$CANDIDATE"

      (cd backend && go build ./...) > evidence/ordinary-build.log 2>&1

      printf ''PASS go build ./... at %s\n'' "$CANDIDATE" | tee -a evidence/ordinary-build.log

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-oauth429-weekly-only-green-oauth429-green-${{ github.event.pull_request.head.sha || github.sha }}
      path: evidence/
      if-no-files-found: error
