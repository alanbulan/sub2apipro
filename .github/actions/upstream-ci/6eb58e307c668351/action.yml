name: sync-20261116-issue-578-regression-shared-storage
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Prepare isolated PostgreSQL Redis and dependencies
    shell: bash
    run: "set -euo pipefail\nmkdir -p evidence\ngit rev-parse HEAD | tee evidence/head.txt\nbash \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\
      \nsudo apt-get update\nsudo apt-get install -y --no-install-recommends postgresql redis-server\nfor attempt in 1 2 3\
      \ 4 5; do\n  if (cd backend && go mod download all); then break; fi\n  if [ \"$attempt\" -eq 5 ]; then exit 1; fi\n\
      \  sleep \"$attempt\"\ndone\n"
  - name: Exact head and rejected-head shared storage regression
    shell: bash
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    run: "set -euo pipefail\nmkdir -p evidence\ngit rev-parse HEAD | tee evidence/head.txt\ntest \"$(git rev-parse HEAD)\"\
      \ = \"$EXPECTED_HEAD\"\nred_tree=\"$RUNNER_TEMP/issue-578-storage-red\"\nmkdir -p \"$red_tree\"\ngit archive 4f57d52e0f161f9dcd99ceb519cd4a102ad1394b\
      \ | tar -x -C \"$red_tree\"\nmkdir -p \"$red_tree/backend/internal/integration/issue578\"\ncp backend/internal/integration/issue578/*test.go\
      \ \"$red_tree/backend/internal/integration/issue578/\"\nreview2_tree=\"$RUNNER_TEMP/issue-578-storage-review2-red\"\n\
      mkdir -p \"$review2_tree\"\ngit archive 60254aa9081f715161ef0c0ce3b6683e671b4798 | tar -x -C \"$review2_tree\"\ncp backend/internal/integration/issue578/*test.go\
      \ \"$review2_tree/backend/internal/integration/issue578/\"\necho 60254aa9081f715161ef0c0ce3b6683e671b4798 > evidence/review2-baseline-head.txt\n\
      # Each RED tree retains its pinned go.mod rather than HEAD's newer\n# graph. Prewarm both before entering the loopback-only\
      \ namespace.\nfor tree in \"$red_tree\" \"$review2_tree\"; do\n  for attempt in 1 2 3 4 5; do\n    if (cd \"$tree/backend\"\
      \ && go mod download all); then break; fi\n    if [ \"$attempt\" -eq 5 ]; then exit 1; fi\n    sleep \"$attempt\"\n\
      \  done\ndone\nsudo env PATH=\"$PATH\" GOPATH=\"$(go env GOPATH)\" GOCACHE=\"$(go env GOCACHE)\" \\\n  GOMODCACHE=\"\
      $(go env GOMODCACHE)\" GOPROXY=off GOSUMDB=off \\\n  unshare --net bash scripts/issue-578-storage.sh \"$PWD\" \"$red_tree\"\
      \ \"$PWD/evidence\" \"$review2_tree\"\n"
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-issue-578-regression-shared-storage-issue-578-storage-${{ github.event_name }}-${{ github.run_id
        }}
      path: evidence/
      if-no-files-found: error
      retention-days: 14
