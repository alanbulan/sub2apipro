name: sync-20261116-issue-578-regression-regression
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Record exact tested head
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    run: 'mkdir -p evidence

      git rev-parse HEAD | tee evidence/head.txt

      test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      sha256sum backend/internal/service/issue_578_regression_test.go > evidence/tests.sha256

      '
    shell: bash
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Verify toolchain
    run: go version | tee evidence/toolchain.txt
    shell: bash
  - name: Prepare dependencies and loopback-only test runner
    shell: bash
    run: "set -euo pipefail\n(cd backend && go mod download all)\ncat > \"$RUNNER_TEMP/issue-578-offline\" <<'SH'\n#!/usr/bin/env\
      \ bash\nset -euo pipefail\nexec sudo env PATH=\"$PATH\" GOPATH=\"$(go env GOPATH)\" \\\n  GOCACHE=\"$(go env GOCACHE)\"\
      \ GOMODCACHE=\"$(go env GOMODCACHE)\" \\\n  GOPROXY=off GOSUMDB=off \\\n  unshare --net bash -c 'ip link set lo up;\
      \ exec \"$@\"' bash \"$@\"\nSH\nchmod +x \"$RUNNER_TEMP/issue-578-offline\"\n\"$RUNNER_TEMP/issue-578-offline\" ip -brief\
      \ address | tee evidence/offline-network.txt\n"
  - name: Review 2 behavioral RED on exact merged pre-fix source
    shell: bash
    env:
      REVIEW2_BASELINE: 60254aa9081f715161ef0c0ce3b6683e671b4798
    run: 'set -euo pipefail

      red_tree="$RUNNER_TEMP/issue-578-review2-red"

      mkdir -p "$red_tree"

      git archive "$REVIEW2_BASELINE" | tar -x -C "$red_tree"

      cp backend/internal/service/issue_578_review2_regression_test.go "$red_tree/backend/internal/service/"

      echo "$REVIEW2_BASELINE" > evidence/review2-baseline-head.txt

      # The pinned source can require older module versions than HEAD.

      # Download the full selected graph, including transitive modules,

      # before the offline assertion can run on a cold module cache.

      (cd "$red_tree/backend" && go mod download all)

      set +e

      (cd "$red_tree/backend" && "$RUNNER_TEMP/issue-578-offline" go test -tags=unit ./internal/service -run ''^TestIssue578Review2''
      -count=1 -v) > evidence/review2-red.log 2>&1

      result=$?

      set -e

      cat evidence/review2-red.log

      echo "$result" > evidence/review2-red-exit.txt

      test "$result" -ne 0

      if grep -Eq ''\[build failed\]|\[setup failed\]|undefined:|syntax error:|no tests to run|panic:|--- SKIP:'' evidence/review2-red.log;
      then exit 1; fi

      grep -F -- ''--- FAIL: TestIssue578Review2PendingFieldObservationSurvivesRetry'' evidence/review2-red.log

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-issue-578-regression-regression-issue-578-review2-red-${{ github.event_name }}-${{ github.run_id
        }}
      path: evidence/
      if-no-files-found: error
      retention-days: 14
  - name: Prove behavioral RED on pinned production baseline
    shell: bash
    env:
      BASELINE: 08d69a522c79a182fd681ead8fa4d848d9e1554e
    run: "set -euo pipefail\nred_tree=\"$RUNNER_TEMP/issue-578-baseline\"\nmkdir -p \"$red_tree\"\ngit archive \"$BASELINE\"\
      \ | tar -x -C \"$red_tree\"\necho \"$BASELINE\" > evidence/baseline-head.txt\ncp backend/internal/service/issue_578_regression_test.go\
      \ \"$red_tree/backend/internal/service/\"\n(cd \"$red_tree/backend\" && go mod download all)\nset +e\n(cd \"$red_tree/backend\"\
      \ && \"$RUNNER_TEMP/issue-578-offline\" go test -tags=unit ./internal/service -run '^TestIssue578(HeaderLatestValue|HeaderSerialAndRetry|QueryUsageSynchronizesNonzero|BPSTTLRefreshAndThrottle)$'\
      \ -count=1 -v) > evidence/baseline-red.log 2>&1\nresult=$?\nset -e\ncat evidence/baseline-red.log\necho \"$result\"\
      \ > evidence/baseline-exit.txt\ntest \"$result\" -ne 0\nif grep -Eq '\\[build failed\\]|\\[setup failed\\]|undefined:|syntax\
      \ error:|no tests to run|panic:' evidence/baseline-red.log; then\n  echo 'Build/setup failures are not behavioral RED\
      \ evidence'\n  exit 1\nfi\nfor name in HeaderLatestValue HeaderSerialAndRetry QueryUsageSynchronizesNonzero BPSTTLRefreshAndThrottle;\
      \ do\n  grep -F -- \"--- FAIL: TestIssue578$name\" evidence/baseline-red.log\ndone\n"
  - name: Exact head offline regressions and preserved controls
    if: '!cancelled()'
    shell: bash
    working-directory: backend
    run: 'set -o pipefail

      "$RUNNER_TEMP/issue-578-offline" go test -tags=unit ./internal/service -run ''^(TestIssue578|TestExcelBPSQuotaSnapshot|TestExcelBPS429|TestOpenAIQuotaRecovery|TestShouldRefreshOpenAICodexSnapshot|TestGetOpenAIUsage_SparkShadow|TestQueryUsageAgentIdentity|TestQueryUsageShadow|TestOpenAIQuotaAutoReset|TestShouldAutoPauseOpenAIAccountByQuota|TestEvaluateAccountSchedulingThreshold_OpenAI)''
      -count=1 -v 2>&1 | tee ../evidence/green-service.log

      "$RUNNER_TEMP/issue-578-offline" go test -tags=unit ./internal/handler/admin -run ''^TestIssue578|^TestOpenAI.*(Quota|Refresh)''
      -count=1 -v 2>&1 | tee ../evidence/green-admin.log

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-issue-578-regression-regression-issue-578-early-${{ github.event_name }}-${{ github.run_id }}
      path: evidence/
      if-no-files-found: error
      retention-days: 14
  - name: Review blockers behavioral RED on rejected head
    if: '!cancelled()'
    shell: bash
    env:
      REVIEW_BASELINE: 4f57d52e0f161f9dcd99ceb519cd4a102ad1394b
    run: 'set -euo pipefail

      red_tree="$RUNNER_TEMP/issue-578-review-red"

      mkdir -p "$red_tree"

      git archive "$REVIEW_BASELINE" | tar -x -C "$red_tree"

      cp backend/internal/service/issue_578_review_regression_test.go "$red_tree/backend/internal/service/"

      (cd "$red_tree/backend" && go mod download all)

      set +e

      (cd "$red_tree/backend" && "$RUNNER_TEMP/issue-578-offline" go test -tags=unit ./internal/service -run ''^TestIssue578Review''
      -count=1 -v) > evidence/review-red.log 2>&1

      result=$?

      set -e

      cat evidence/review-red.log

      echo "$REVIEW_BASELINE" > evidence/review-baseline-head.txt

      test "$result" -ne 0

      if grep -Eq ''\[build failed\]|\[setup failed\]|undefined:|syntax error:|no tests to run|panic:'' evidence/review-red.log;
      then exit 1; fi

      grep -F -- ''--- FAIL: TestIssue578ReviewQueryDownstreamCannotRestampWindows'' evidence/review-red.log

      grep -F -- ''--- FAIL: TestIssue578ReviewWorkerPermanentErrorAndShutdown'' evidence/review-red.log

      '
  - name: Exact head concurrency regressions
    if: '!cancelled()'
    working-directory: backend
    shell: bash
    run: 'set -o pipefail

      "$RUNNER_TEMP/issue-578-offline" go test -race -tags=unit ./internal/service -run ''^TestIssue578'' -count=3 -v 2>&1
      | tee ../evidence/race.log

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-issue-578-regression-regression-issue-578-${{ github.event_name }}-${{ github.run_id }}
      path: evidence/
      if-no-files-found: error
      retention-days: 14
