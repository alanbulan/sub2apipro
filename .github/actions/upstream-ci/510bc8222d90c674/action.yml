name: sync-20261116-multihost-caddy-real-proxy-responses
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-python@v6
    with:
      python-version: '3.13'
  - name: Fetch verified Caddy 2.11.7 binary
    shell: bash
    run: "set -euo pipefail\nproxy_fixture_dir=\"$RUNNER_TEMP/sub2api-caddy-contract\"\nmkdir -p \"$proxy_fixture_dir\"\n\
      curl --fail --location --silent --show-error \\\n  --retry 3 --retry-delay 2 --retry-max-time 120 \\\n  --connect-timeout\
      \ 10 --max-time 90 \\\n  https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz\
      \ \\\n  --output \"$proxy_fixture_dir/caddy.tar.gz\"\necho '727b91701a392de6ebc5027509f548bf39979e5216340d0faed8fa5e69c84f8b\
      \  '\"$proxy_fixture_dir/caddy.tar.gz\" | sha256sum --check --strict\ntar -xzf \"$proxy_fixture_dir/caddy.tar.gz\" -C\
      \ \"$proxy_fixture_dir\" caddy\necho \"CADDY_BIN=$proxy_fixture_dir/caddy\" >> \"$GITHUB_ENV\"\n"
  - name: Real proxy and two synthetic HTTP SSE origins
    run: python3 deploy/traffic/test_caddy_responses.py
    shell: bash
  - name: Verified HTTPS origins with synthetic CA and SNI failures
    run: python3 deploy/traffic/test_caddy_responses_tls.py
    shell: bash
