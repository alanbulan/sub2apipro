name: sync-20261116-upstream-v0221-regression-generated
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Assert exact candidate head
    run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
    shell: bash
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Verify committed Ent generation and module metadata
    run: 'set -euo pipefail

      mkdir -p "$RUNNER_TEMP/v0221-generated"

      (cd backend && go generate ./ent)

      git diff --binary -- backend/ent backend/go.mod backend/go.sum > "$RUNNER_TEMP/v0221-generated/generated.patch"

      git diff --exit-code -- backend/ent backend/go.mod backend/go.sum

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-upstream-v0221-regression-generated-v0221-generated-${{ github.event_name }}-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/v0221-generated/
      if-no-files-found: error
