name: sync-20261116-quality-retest-rest-frontend
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Account and group editors, copies, bulk fields and shared notice dismissal
    run: pnpm --dir frontend exec vitest run src/views/admin/__tests__/AccountQualityView.spec.ts src/utils/__tests__/qualityRulePatch.spec.ts
      src/components/admin/operations/__tests__/SmartOpsNav.spec.ts src/components/common/__tests__/NewFeatureBadge.spec.ts
      src/i18n/__tests__/localeKeyCompleteness.spec.ts
    shell: bash
