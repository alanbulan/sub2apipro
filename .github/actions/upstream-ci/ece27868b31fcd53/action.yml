name: sync-20261116-account-performance-error-threshold-frontend
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: 22
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Error bounds, legacy payloads and new feature notice behavior
    working-directory: frontend
    run: pnpm exec vitest run src/components/account/__tests__/AccountPerformanceDialog.spec.ts src/components/account/__tests__/AccountPerformanceCell.spec.ts
      src/api/__tests__/admin.accounts.performance.spec.ts src/components/account/__tests__/AccountUpstreamErrorNotice.spec.ts
    shell: bash
  - name: Typecheck and production bundle
    run: pnpm --dir frontend run build
    shell: bash
  - name: Install isolated screenshot browser
    run: 'npm install --prefix "$RUNNER_TEMP/cache-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/cache-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Render performance column before and after with synthetic metrics
    env:
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/cache-browser/node_modules/playwright
      SCREENSHOT_DIR: ${{ runner.temp }}/account-cache-ui
      SOURCE_BASE: ${{ github.event.pull_request.base.sha || '11f250894eab310cbd4508946c44c9e2a3a2eb48' }}
    run: 'git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git "$SOURCE_BASE"

      node scripts/account-performance-cache-screenshot.mjs

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-account-performance-error-threshold-frontend-account-cache-ui-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: '${{ runner.temp }}/account-cache-ui/*.png

        ${{ runner.temp }}/account-cache-ui/manifest.json

        '
