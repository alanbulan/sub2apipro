name: sync-20261116-issue715-agent-recovery-red-ws-bridge-sequence
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Pre-fix bridge with unchanged two-continuation socket regression
    shell: bash
    run: 'set -euo pipefail

      git rev-parse HEAD

      original=d91d890049a9bd8bd0e414f30b0cb3b5bcc0f06e

      bash scripts/historical-recovery-timezone-callers.sh

      target=backend/internal/service/openai_ws_forwarder_ingress.go

      git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git "$original"

      trap ''git restore --source=HEAD -- "$target" backend/internal/service/openai_request_timezone_egress.go backend/internal/service/openai_ws_client.go;
      git diff --exit-code'' EXIT

      git restore --source="$original" -- "$target"

      expected=$(git rev-parse "$original:$target")

      actual=$(git hash-object "$target")

      echo "baseline=$original path=$target expected_blob=$expected tested_blob=$actual"

      test "$expected" = "$actual"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -race -tags=unit ./internal/handler -run ''^TestIssue715WSGeneratedTaskContinuation$/http_bridge/cross-node=false$''
      -count=1 -v -timeout=5m) > "$RUNNER_TEMP/issue715-ws-bridge-sequence-red.log" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/issue715-ws-bridge-sequence-red.log"

      test "$result" -ne 0

      if grep -Eq ''build failed|no tests to run|undefined:|panic:|DATA RACE|--- SKIP:'' "$RUNNER_TEMP/issue715-ws-bridge-sequence-red.log";
      then exit 1; fi

      grep -q -- ''--- FAIL: TestIssue715WSGeneratedTaskContinuation/http_bridge/cross-node=false'' "$RUNNER_TEMP/issue715-ws-bridge-sequence-red.log"

      # PR855 returns the safe structured refusal before the close. The

      # unchanged oracle now reaches its content assertion (instead of the

      # socket-read assertion). Require that exact business failure after

      # the first continuation completed; do not accept arbitrary errors.

      grep -q ''generated opaque WS task and tool result must return to producer'' "$RUNNER_TEMP/issue715-ws-bridge-sequence-red.log"

      grep -q ''encrypted_agent_recovery_wire_changed'' "$RUNNER_TEMP/issue715-ws-bridge-sequence-red.log"

      grep -q ''ingress_ws_http_bridge_turn_completed.*turn=2'' "$RUNNER_TEMP/issue715-ws-bridge-sequence-red.log"

      '
