name: sync-20261116-upstream-v0221-regression-backend
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Assert exact candidate head
    run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
    shell: bash
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Install Redis for retained recovery and ownership regressions
    run: |
      set -euo pipefail
      if ! command -v redis-server >/dev/null; then
        bash "$GITHUB_WORKSPACE/scripts/ci-ubuntu-mirrors.sh"
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends redis-server
      fi
      redis-server --version
    shell: bash
  - name: Compile production server and all adapters
    working-directory: backend
    run: go build ./cmd/server
    shell: bash
  - name: Isolated queue and retry timer discrimination
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=unit ./internal/handler -run ''^TestPR610(BridgeRejectedFieldRetryKeepsLegacyDenominator|RealBridgeRetryDenominator)$''
      -count=3 -v -timeout=5m'
    shell: bash
  - name: Race and resource lifecycle packages
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit ./internal/pkg/apicompat ./internal/pkg/openai ./internal/pkg/antigravity ./internal/pkg/claude
      ./internal/pkg/sysutil ./internal/securityaudit ./internal/service/openai_ws_v2 ./internal/pkg/httputil -count=1 -v
      -timeout=20m'
    shell: bash
  - name: Gateway, authentication, pricing and scheduling regressions
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit ./internal/service ./internal/handler ./internal/repository ./internal/server/middleware ./internal/payment/provider
      ./internal/config -run ''Test(GPT61|OrphanCleanup|Issue715|WSNodeOwner|Messages|NativeImages|AsyncImage|RequestBody|OpenAI|AnthropicCompat|AuthServiceRefresh|RefreshTokenCache|GatewayServiceNewSelection|Antigravity|ConvertGeminiToClaude|GeminiResponseToChatCompletions|Claude52|NewModelPricing|PricingSync|EasyPay|ExecuteEasyPay|UpdatePaymentConfig|AutoRequestBody|LoadRequestBody|PoolCapacity|AgentRecovery|UsageLog|ChannelCacheWrite|ApplyMigrationsFS)''
      -count=1 -v -timeout=30m'
    shell: bash
  - name: Migration source contracts
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test ./migrations -count=1 -v -timeout=5m'
    shell: bash
