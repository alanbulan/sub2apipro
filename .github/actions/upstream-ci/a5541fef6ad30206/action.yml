name: sync-20261116-http-recovery-native-controls-behavior
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_phase:
    description: Upstream matrix parameter phase.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Install isolated Redis
    run: "bash \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\nif ! command -v redis-server >/dev/null; then\n  bash\
      \ \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\n  sudo apt-get update\n  sudo apt-get install -y --no-install-recommends\
      \ redis-server\nfi\n"
    shell: bash
  - name: Restore exact pre-fix production implementation for RED
    if: inputs.sync_matrix_phase == 'RED'
    shell: bash
    run: "set -euo pipefail\nbaseline=c115bef917eae22fc2f5a4d0ba6ac6cbe600e8e4\ngit diff --name-only \"$baseline\" HEAD --\
      \ backend | while IFS= read -r target; do\n  case \"$target\" in\n    *_test.go) continue ;;\n    *.go)\n      if git\
      \ cat-file -e \"$baseline:$target\" 2>/dev/null; then\n        mkdir -p -- \"$(dirname -- \"$target\")\"\n        git\
      \ show \"$baseline:$target\" > \"$target\"\n        test \"$(git hash-object \"$target\")\" = \"$(git rev-parse \"$baseline:$target\"\
      )\"\n      else\n        rm -- \"$target\"\n      fi ;;\n  esac\ndone\npython3 scripts/prepare-upstream-v0222-red-fixtures.py\
      \ \"$baseline\" . HEAD\nbash scripts/prepare-usage-sort-red-fixture.sh \"$baseline\" . \"${{ github.event.pull_request.head.sha\
      \ || github.sha }}\"\n"
  - name: Authenticated HTTP task continuation
    env:
      PHASE: ${{ inputs.sync_matrix_phase }}
    shell: bash
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -race -json -tags=unit,httpprojection ./internal/handler -run ''^TestOpenAI409NativeControlsContinuation$''
      -count=1 -timeout=8m) > "$RUNNER_TEMP/native-controls.jsonl" 2>&1

      result=$?

      set -e

      python3 scripts/http-recovery-native-controls.py "$PHASE" "$result" "$RUNNER_TEMP/native-controls.jsonl"

      '
  - name: Trusted source and late mutation guards
    if: inputs.sync_matrix_phase == 'GREEN'
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit,httpprojection ./internal/service -run ''^TestOpenAI409NativeControlsIntegrity$'' -count=1
      -v -timeout=3m'
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-http-recovery-native-controls-behavior-http-native-controls-${{ inputs.sync_matrix_phase }}-${{
        github.event.pull_request.head.sha || github.sha }}
      path: ${{ runner.temp }}/native-controls.jsonl
