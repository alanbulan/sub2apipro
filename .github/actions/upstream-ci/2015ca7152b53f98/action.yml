name: sync-20261116-issue733-priority-filters-filters
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - run: mkdir -p "$RUNNER_TEMP/filters-evidence"
    shell: bash
  - name: Candidate filter regression GREEN
    run: pnpm --dir frontend exec vitest run src/views/admin/__tests__/PrioritySchedulingFilters.spec.ts src/views/admin/__tests__/PrioritySchedulingReading.spec.ts
      src/views/admin/__tests__/PrioritySchedulingView.spec.ts src/views/admin/__tests__/PrioritySchedulingQuantile.spec.ts
      src/i18n/__tests__/localeKeyCompleteness.spec.ts --maxWorkers=1 --minWorkers=1
    shell: bash
  - name: Lint frontend changes
    run: pnpm --dir frontend run lint:check
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-issue733-priority-filters-filters-issue733-filters-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: ${{ runner.temp }}/filters-evidence
