name: sync-20261116-pr598-repair-regression-actual-ui-screenshot
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Prove clean exact-head production sources
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    run: "set -euo pipefail\ngit diff --exit-code HEAD\nmkdir -p \"$RUNNER_TEMP/pr598-source-proof\"\nbash scripts/pr598-source-proof.sh\
      \ \"$GITHUB_WORKSPACE\" \"$EXPECTED_HEAD\" \\\n  backend/internal/service/priority_scheduling_history.go \\\n  backend/internal/service/priority_scheduling_recompute.go\
      \ \\\n  backend/internal/service/priority_scheduling_snapshot.go \\\n  backend/internal/service/priority_scheduling.go\
      \ \\\n  backend/internal/service/priority_latency_series.go \\\n  backend/internal/repository/priority_latency_series.go\
      \ \\\n  backend/internal/repository/priority_scheduling.go \\\n  backend/internal/handler/admin/priority_scheduling_handler.go\
      \ \\\n  backend/internal/handler/admin/priority_scheduling_sticky.go \\\n  frontend/src/views/admin/PrioritySchedulingView.vue\
      \ \\\n  frontend/src/api/admin/priorityScheduling.ts | tee \"$RUNNER_TEMP/pr598-source-proof/production.txt\"\n"
    shell: bash
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - name: Install frontend dependencies
    working-directory: frontend
    run: pnpm install --frozen-lockfile
    shell: bash
  - name: Install isolated browser
    run: 'npm install --prefix "$RUNNER_TEMP/pr598-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/pr598-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Render the actual priority scheduling component with offline synthetic data
    env:
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/pr598-browser/node_modules/playwright
      PR598_SCREENSHOT_DIR: ${{ runner.temp }}/pr598-screenshots
    run: node scripts/pr598-priority-scheduling-screenshot.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-pr598-repair-regression-actual-ui-screenshot-pr598-priority-scheduling-ui-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: '${{ runner.temp }}/pr598-screenshots

        ${{ runner.temp }}/pr598-source-proof/production.txt

        '
      if-no-files-found: error
