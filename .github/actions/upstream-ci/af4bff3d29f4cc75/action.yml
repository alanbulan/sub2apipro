name: sync-20261116-mature-channel-community-ops-candidate
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      cache: false
      go-version: 1.27.4
  - uses: actions/cache/restore@v6
    with:
      path: '~/.cache/go-build

        ~/go/pkg/mod

        '
      key: mature-go-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-${{ github.job }}-${{ github.sha }}
      restore-keys: 'mature-go-${{ runner.os }}-${{ hashFiles(''backend/go.sum'') }}-${{ github.job }}-

        mature-go-${{ runner.os }}-${{ hashFiles(''backend/go.sum'') }}-candidate-

        mature-go-${{ runner.os }}-${{ hashFiles(''backend/go.sum'') }}-

        '
  - name: RED provider identity must resolve old balance alerts
    shell: bash
    run: 'set -euo pipefail

      target=backend/internal/repository/mature_providers.go

      cp "$target" "$RUNNER_TEMP/mature-provider-current.go"

      trap ''cp "$RUNNER_TEMP/mature-provider-current.go" "$target"'' EXIT

      git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git 2e2e6def253c07eb1a48f2a9e58c137f87c2bdc9

      git show 2e2e6def253c07eb1a48f2a9e58c137f87c2bdc9:"$target" > "$target"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -tags=integration ./internal/server/routes -run ''^TestMatureProvidersRefreshClaimAndLowBalance$''
      -count=1 -v) > "$RUNNER_TEMP/mature-provider-identity-red.log" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/mature-provider-identity-red.log"

      test "$result" -ne 0

      ! grep -Eiq ''build failed|no tests to run|undefined:|--- SKIP:'' "$RUNNER_TEMP/mature-provider-identity-red.log"

      grep -q ''identity change must end the previous balance episode'' "$RUNNER_TEMP/mature-provider-identity-red.log"

      '
  - name: RED uncertain local persistence after remote key creation
    if: always()
    shell: bash
    run: "set -euo pipefail\nbaseline=407eea6822cd27a1772f41ff75615bc50592d941\nsession_baseline=ae7598867c9a9138f5f36ed7a67bc2fa97e48bad\n\
      red_tree=\"$RUNNER_TEMP/mature-key-persistence-red\"\nevidence=\"$RUNNER_TEMP/mature-key-persistence-evidence\"\nmkdir\
      \ -p \"$evidence\"\ntest \"$(git rev-parse HEAD)\" = '${{ github.sha }}'\ntest -z \"$(git status --porcelain)\"\ngit\
      \ rev-parse HEAD HEAD^{tree} > \"$evidence/candidate.txt\"\nsha256sum backend/internal/server/routes/mature_providers_keys_postgres_test.go\
      \ > \"$evidence/test-sha256.txt\"\ngit fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git \"$baseline\"\
      \ \"$session_baseline\"\ngit worktree add --detach \"$red_tree\" '${{ github.sha }}'\n# Keep the target handler byte-identical\
      \ to its defective source.\n# Its pre-budget callback needs the matching interface, repository\n# and refresh caller;\
      \ ae759 retains the later pending-key contract.\nfor target in backend/internal/handler/admin/mature_provider_keys.go\
      \ backend/internal/service/mature_providers.go backend/internal/repository/mature_providers_session.go backend/internal/handler/admin/mature_provider_connection.go;\
      \ do\n  source=\"$session_baseline\"\n  if [ \"$target\" = backend/internal/handler/admin/mature_provider_keys.go ];\
      \ then source=\"$baseline\"; fi\n  git show \"$source:$target\" > \"$red_tree/$target\"\n  blob=$(git rev-parse \"$source:$target\"\
      )\n  test \"$(git hash-object \"$red_tree/$target\")\" = \"$blob\"\n  printf '%s %s %s\\n' \"$source\" \"$target\" \"\
      $blob\" >> \"$evidence/production-blobs.txt\"\ndone\ncmp backend/internal/server/routes/mature_providers_keys_postgres_test.go\
      \ \"$red_tree/backend/internal/server/routes/mature_providers_keys_postgres_test.go\"\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ \"$red_tree/backend\"\nset +e\n(cd \"$red_tree/backend\" && go test -tags=integration ./internal/server/routes -run\
      \ '^TestMatureProvidersKeyCreationIdempotency/persistence_failure$' -count=1 -v) > \"$RUNNER_TEMP/mature-key-persistence-red.log\"\
      \ 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/mature-key-persistence-red.log\"\ntest \"$result\" -ne 0\n! grep -Eiq\
      \ 'build failed|no tests to run|undefined:|--- SKIP:' \"$RUNNER_TEMP/mature-key-persistence-red.log\"\ngrep -q 'local\
      \ persistence failure after upstream creation must be classified as uncertain' \"$RUNNER_TEMP/mature-key-persistence-red.log\"\
      \n"
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-channel-community-ops-candidate-mature-key-persistence-red-${{ github.sha }}
      path: '${{ runner.temp }}/mature-key-persistence-red.log

        ${{ runner.temp }}/mature-key-persistence-evidence/

        '
  - name: Candidate business HTTP assertions
    working-directory: backend
    run: 'set -o pipefail

      test "$(git rev-parse HEAD)" = ''${{ github.sha }}''

      test -z "$(git status --porcelain)"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=integration ./internal/server/routes -run ''^TestMature'' -count=1 -v -timeout=5m 2>&1 | tee "$RUNNER_TEMP/mature-http.log"

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-channel-community-ops-candidate-mature-http-${{ github.sha }}
      path: ${{ runner.temp }}/mature-http.log
  - name: RED unsafe provider errors and missing probe confirmation
    if: always()
    shell: bash
    run: 'set -euo pipefail

      git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git 796a73f9e5b5c0a936ba5e074c3ab84506de1961

      files=(backend/internal/handler/admin/mature_provider_key_types.go backend/internal/handler/admin/mature_provider_newapi_auth.go
      backend/internal/handler/qq_bot_handler.go backend/internal/handler/qq_bot_setup_handler.go)

      mkdir -p "$RUNNER_TEMP/mature-handler-original"

      for target in "${files[@]}"; do cp "$target" "$RUNNER_TEMP/mature-handler-original/$(basename "$target")"; git show
      796a73f9e5b5c0a936ba5e074c3ab84506de1961:"$target" > "$target"; done

      restore(){ for target in "${files[@]}"; do cp "$RUNNER_TEMP/mature-handler-original/$(basename "$target")" "$target";
      done; }

      trap restore EXIT

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test ./internal/handler/admin ./internal/handler -run ''^TestMature(ProviderReflectedCredentialIsNotPublic|ProviderScopeCannotReflectCredential|QQProbeRequiresExplicitConfirmation)$''
      -count=1 -v) > "$RUNNER_TEMP/mature-handler-red.log" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/mature-handler-red.log"

      test "$result" -ne 0

      ! grep -Eiq ''build failed|no tests to run|undefined:|--- SKIP:'' "$RUNNER_TEMP/mature-handler-red.log"

      grep -q -- ''--- FAIL: TestMatureProviderReflectedCredentialIsNotPublic'' "$RUNNER_TEMP/mature-handler-red.log"

      grep -q -- ''--- FAIL: TestMatureProviderScopeCannotReflectCredential'' "$RUNNER_TEMP/mature-handler-red.log"

      grep -q -- ''--- FAIL: TestMatureQQProbeRequiresExplicitConfirmation'' "$RUNNER_TEMP/mature-handler-red.log"

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-channel-community-ops-candidate-mature-handler-red-${{ github.sha }}
      path: ${{ runner.temp }}/mature-handler-red.log
  - name: RED observed debt and unconverted quota currency
    if: always()
    shell: bash
    run: 'set -euo pipefail

      target=backend/internal/handler/admin/mature_provider_remote.go

      cp "$target" "$RUNNER_TEMP/mature-protocol-current.go"

      trap ''cp "$RUNNER_TEMP/mature-protocol-current.go" "$target"'' EXIT

      git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git 5f96a6f0a94a88322dd5a97b3ee15e235007179b

      git show 5f96a6f0a94a88322dd5a97b3ee15e235007179b:"$target" > "$target"

      # The removed, unused convenience wrapper in that source still

      # references this factory; preserve only that compile-time dependency.

      printf ''\nvar providerSessionHTTPClient = providerHTTPClient\n'' >> "$target"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test ./internal/handler/admin -run ''^TestMatureProvider(NegativeBalanceRemainsObserved|CurrencyDoesNotRelabelQuota)$''
      -count=1 -v) > "$RUNNER_TEMP/mature-metrics-red.log" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/mature-metrics-red.log"

      test "$result" -ne 0

      ! grep -Eiq ''build failed|no tests to run|undefined:|--- SKIP:'' "$RUNNER_TEMP/mature-metrics-red.log"

      grep -q -- ''--- FAIL: TestMatureProviderNegativeBalanceRemainsObserved'' "$RUNNER_TEMP/mature-metrics-red.log"

      grep -q -- ''--- FAIL: TestMatureProviderCurrencyDoesNotRelabelQuota'' "$RUNNER_TEMP/mature-metrics-red.log"

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-channel-community-ops-candidate-mature-metrics-red-${{ github.sha }}
      path: ${{ runner.temp }}/mature-metrics-red.log
  - name: Candidate handler assertions
    if: always()
    working-directory: backend
    run: 'set -o pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test ./internal/handler/admin ./internal/handler -run ''^Test(Mature|QQ)'' -count=1 -v -timeout=5m 2>&1 | tee "$RUNNER_TEMP/mature-handlers.log"

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-channel-community-ops-candidate-mature-handlers-${{ github.sha }}
      path: ${{ runner.temp }}/mature-handlers.log
  - name: RED transfer atomicity against imported implementation
    if: always()
    shell: bash
    run: 'set -euo pipefail

      target=backend/internal/qqbot/transfer.go

      cp "$target" "$RUNNER_TEMP/mature-transfer-current.go"

      trap ''cp "$RUNNER_TEMP/mature-transfer-current.go" "$target"'' EXIT

      git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git 796a73f9e5b5c0a936ba5e074c3ab84506de1961

      git show 796a73f9e5b5c0a936ba5e074c3ab84506de1961:"$target" > "$target"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -tags=integration ./internal/qqbot -run ''^TestMatureTransferRollsBackWhenRecipientIsNotCredited$''
      -count=1 -v) > "$RUNNER_TEMP/mature-transfer-red.log" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/mature-transfer-red.log"

      test "$result" -ne 0

      ! grep -Eiq ''build failed|no tests to run|undefined:|--- SKIP:|file does not exist'' "$RUNNER_TEMP/mature-transfer-red.log"

      grep -q ''a transfer must roll back unless the recipient is credited'' "$RUNNER_TEMP/mature-transfer-red.log"

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-channel-community-ops-candidate-mature-transfer-red-${{ github.sha }}
      path: ${{ runner.temp }}/mature-transfer-red.log
  - name: QQ business isolated database
    if: always()
    working-directory: backend
    run: 'set -o pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=integration ./internal/qqbot -count=1 -timeout=10m 2>&1 | tee "$RUNNER_TEMP/mature-qqdb.log"

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-channel-community-ops-candidate-mature-qqdb-${{ github.sha }}
      path: ${{ runner.temp }}/mature-qqdb.log
  - name: RED coupon preservation through signed resume
    if: always()
    shell: bash
    run: 'set -euo pipefail

      target=backend/internal/service/payment_resume_service.go

      cp "$target" "$RUNNER_TEMP/mature-resume-current.go"

      trap ''cp "$RUNNER_TEMP/mature-resume-current.go" "$target"'' EXIT

      git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git 37dc4620a41a68abaeab329358c15821c41e3f7f

      git show 37dc4620a41a68abaeab329358c15821c41e3f7f:"$target" > "$target"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test ./internal/service -run ''^TestMatureCouponSurvivesSignedPaymentResume$'' -count=1 -v) > "$RUNNER_TEMP/mature-coupon-resume-red.log"
      2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/mature-coupon-resume-red.log"

      test "$result" -ne 0

      ! grep -Eiq ''build failed|no tests to run|undefined:|--- SKIP:'' "$RUNNER_TEMP/mature-coupon-resume-red.log"

      grep -q ''signed payment resumption must preserve the selected coupon'' "$RUNNER_TEMP/mature-coupon-resume-red.log"

      '
  - name: Coupon accounting and isolation regressions
    if: always()
    working-directory: backend
    run: 'set -o pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=unit ./internal/service -run ''^Test(Coupon|QQBot|MatureCoupon)'' -count=1 -v -timeout=10m 2>&1 | tee
      "$RUNNER_TEMP/mature-coupon.log"

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-channel-community-ops-candidate-mature-coupon-${{ github.sha }}
      path: ${{ runner.temp }}/mature-coupon.log
  - name: Canonical database compatibility and provider import
    if: always()
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=integration ./internal/repository -run ''^TestMatureProviderImportPreservesCanonicalData$'' -count=1 -v
      -timeout=10m'
    shell: bash
  - name: Server build
    if: always()
    working-directory: backend
    run: go build -o "$RUNNER_TEMP/mature-server" ./cmd/server
    shell: bash
  - name: Startup and shutdown wiring regressions
    if: always()
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test ./cmd/server -run ''^TestProvide'' -count=1 -timeout=5m'
    shell: bash
  - name: Regenerate and verify dependency wiring remotely
    if: always()
    working-directory: backend
    run: 'cp go.mod .mature-wire.mod

      cp go.sum .mature-wire.sum

      GOFLAGS="-mod=mod -modfile=$PWD/.mature-wire.mod" go generate ./cmd/server

      cp cmd/server/wire_gen.go "$RUNNER_TEMP/mature-wire_gen.go"

      git diff --exit-code -- cmd/server/wire_gen.go go.mod go.sum

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-channel-community-ops-candidate-mature-wire-${{ github.sha }}
      path: ${{ runner.temp }}/mature-wire_gen.go
  - uses: actions/cache/save@v6
    if: always()
    with:
      path: '~/.cache/go-build

        ~/go/pkg/mod

        '
      key: mature-go-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-${{ github.job }}-${{ github.sha }}
