name: sync-20261116-free-ultrafast-ui
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Form, cost display and notice regressions
    run: pnpm --dir frontend exec vitest run src/views/admin/__tests__/GroupsView.freeUltrafast.spec.ts src/utils/__tests__/customerCostDetails.ultrafast.spec.ts
      src/components/common/__tests__/NewFeatureBadge.spec.ts src/components/admin/usage/__tests__/UsageTable.spec.ts --maxWorkers=1
      --minWorkers=1
    shell: bash
  - name: Changed frontend lint
    run: pnpm --dir frontend exec eslint src/views/admin/GroupsView.vue src/views/admin/__tests__/GroupsView.freeUltrafast.spec.ts
      src/utils/customerCostDetails.ts src/utils/__tests__/customerCostDetails.ultrafast.spec.ts
    shell: bash
  - name: Frontend build and type check
    run: pnpm --dir frontend run build
    shell: bash
  - name: Install isolated browser
    run: 'npm install --prefix "$RUNNER_TEMP/ultrafast-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/ultrafast-browser/node_modules/.bin/playwright" install --with-deps chromium

      sudo apt-get install -y fonts-noto-cjk

      '
    shell: bash
  - name: Real GroupsView screenshots and saved state
    env:
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/ultrafast-browser/node_modules/playwright
      SCREENSHOT_DIR: ${{ runner.temp }}/ultrafast-screenshots
      SOURCE_BASE: 2927209f5492d8cb690b83a1964b2f093c19ad7a
    run: node scripts/free-ultrafast-browser.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-free-ultrafast-ui-free-ultrafast-ui-${{ github.event.pull_request.head.sha || github.sha }}
      path: ${{ runner.temp }}/ultrafast-screenshots
      if-no-files-found: warn
