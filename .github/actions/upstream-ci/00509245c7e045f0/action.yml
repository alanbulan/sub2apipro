name: sync-20261116-priority-observation-persistence
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: PostgreSQL persisted usage and quality scope regressions
    run: 'set -euo pipefail

      mkdir -p "$RUNNER_TEMP/priority-logs"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -tags=integration ./internal/repository -run ''^(TestPriorityObservation|TestPriorityScheduling)''
      -count=1 -v -timeout=15m) 2>&1 | tee "$RUNNER_TEMP/priority-logs/persistence.log"

      grep -q -- ''--- PASS: TestPriorityObservationPersistedPublicAliasAndGroup'' "$RUNNER_TEMP/priority-logs/persistence.log"

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-priority-observation-persistence-priority-persistence-${{ github.event.pull_request.head.sha ||
        github.sha }}
      path: ${{ runner.temp }}/priority-logs
