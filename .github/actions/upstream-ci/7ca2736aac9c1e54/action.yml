name: sync-20261116-mistral-budget-ui
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - run: pnpm --dir frontend exec vitest run src/components/account/__tests__/AccountUsageCell.spec.ts src/components/account/__tests__/CNProviderQuotaCell.spec.ts
      src/components/account/__tests__/CNProviderBalanceCell.spec.ts src/components/common/__tests__/NewFeatureBadge.spec.ts
      src/views/admin/__tests__/SettingsView.spec.ts
    shell: bash
  - name: Install isolated browser
    run: 'npm install --prefix "$RUNNER_TEMP/mistral-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/mistral-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Render actual Mistral account cell before, after and after probing
    env:
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/mistral-browser/node_modules/playwright
      SCREENSHOT_DIR: ${{ runner.temp }}/mistral-ui
      SOURCE_BASE: 7eb2e271acdc4b36d62f1b542b16b5abb5b1bb09
    run: node scripts/mistral-budget-screenshot.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mistral-budget-ui-mistral-budget-ui-${{ github.event.pull_request.head.sha || github.sha }}
      path: ${{ runner.temp }}/mistral-ui
