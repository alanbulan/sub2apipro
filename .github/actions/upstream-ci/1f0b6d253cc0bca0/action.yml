name: sync-20261116-security-scan-frontend-security
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Assert exact candidate head
    run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
    shell: bash
  - name: Set up pnpm
    uses: pnpm/action-setup@v6
    with:
      version: 9
  - name: Set up Node.js
    uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - name: Install dependencies
    working-directory: frontend
    run: pnpm install --frozen-lockfile
    shell: bash
  - name: Run pnpm audit
    working-directory: frontend
    run: 'pnpm audit --prod --audit-level=high --json > audit.json || true

      '
    shell: bash
  - name: Check audit exceptions
    run: "python tools/check_pnpm_audit_exceptions.py \\\n  --audit frontend/audit.json \\\n  --exceptions .github/audit-exceptions.yml\n"
    shell: bash
