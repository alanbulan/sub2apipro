name: sync-20261116-pr838-ws-phase-forwarding
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_behavior:
    description: Upstream matrix parameter behavior.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Exact candidate tests and bounded historical production sources
    shell: bash
    run: "set -euo pipefail\nmkdir -p evidence\ntest \"$(git rev-parse HEAD)\" = \"$CANDIDATE\"\ngit diff --exit-code\ngit\
      \ rev-parse HEAD HEAD^{tree} > evidence/candidate.txt\nbaseline=cf2c96ddf377e60a3df7fdd636c37669d6167d17\nfor target\
      \ in backend/internal/service/openai_ws_forwarder_v2.go backend/internal/service/openai_ws_forwarder_ingress.go; do\n\
      \  original=$(git rev-parse \"$baseline:$target\")\n  candidate=$(git rev-parse \"$CANDIDATE:$target\")\n  if [ \"$BEHAVIOR\"\
      \ = red ]; then git show \"$baseline:$target\" > \"$target\"; fi\n  actual=$(git hash-object \"$target\")\n  expected=\"\
      $candidate\"\n  if [ \"$BEHAVIOR\" = red ]; then expected=\"$original\"; fi\n  test \"$actual\" = \"$expected\"\n  printf\
      \ '%s baseline=%s candidate=%s actual=%s\\n' \"$target\" \"$original\" \"$candidate\" \"$actual\" >> evidence/source-blobs.txt\n\
      done\ngit diff --exit-code -- '*_test.go'\ntarget=backend/internal/service/temp_unsched_ws_forward_test.go\nexpected=$(git\
      \ rev-parse \"$CANDIDATE:$target\")\ntest \"$(git hash-object \"$target\")\" = \"$expected\"\nprintf '%s %s\\n' \"$expected\"\
      \ \"$target\" > evidence/retained-tests.txt\nprintf 'No tests excluded; only the two listed production files restored\
      \ in RED.\\n' > evidence/compilation-boundary.txt\ngit diff --stat > evidence/source-diff.txt\n"
  - name: Real forwarding entries with race and unchanged safety controls
    shell: bash
    run: "set -euo pipefail\nregression='^TestTempUnschedWSForwardAfterOutputSemantic429$'\nif [ \"$BEHAVIOR\" = green ];\
      \ then\n  regression='^Test(TempUnschedWSForwardAfterOutputSemantic429|CompatErrorPipeline|FastPathThenGeneralHandler|PendingModel401|Credential401|OpenAIWSAfterOutput|MemoryTempUnschedTrigger|OAuth429WeeklyOnly)'\n\
      fi\nprintf 'cd backend && go test -race -json -tags=unit ./internal/service -run %q -count=1 -timeout=10m\\n' \"$regression\"\
      \ > evidence/command.txt\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\nset +e\n(cd backend && go\
      \ test -race -json -tags=unit ./internal/service -run \"$regression\" -count=1 -timeout=10m) > \"evidence/$BEHAVIOR.jsonl\"\
      \ 2> \"evidence/$BEHAVIOR.stderr\"\nresult=$?\nset -e\nprintf '%s\\n' \"$result\" > evidence/exit.txt\npython3 scripts/pr838-ws-phase-evidence.py\
      \ \"$BEHAVIOR\" \"evidence/$BEHAVIOR.jsonl\" \"$result\"\n"
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-pr838-ws-phase-forwarding-pr838-ws-phase-${{ inputs.sync_matrix_behavior }}-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: evidence/
      if-no-files-found: error
