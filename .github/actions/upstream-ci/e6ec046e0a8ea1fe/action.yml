name: sync-20261116-oauth-initial-ws-evidence-rendered-before-after
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Preserve the complete pre-change frontend
    env:
      SOURCE_BASE: 1c3882e935a01b376f9aefdf844863125fff7c2b
    run: 'set -euo pipefail

      mkdir -p "$RUNNER_TEMP/oauth-ws-base"

      git archive "$SOURCE_BASE" | tar -x -C "$RUNNER_TEMP/oauth-ws-base"

      cmp frontend/package.json "$RUNNER_TEMP/oauth-ws-base/frontend/package.json"

      cmp frontend/pnpm-lock.yaml "$RUNNER_TEMP/oauth-ws-base/frontend/pnpm-lock.yaml"

      ln -s "$GITHUB_WORKSPACE/frontend/node_modules" "$RUNNER_TEMP/oauth-ws-base/frontend/node_modules"

      '
    shell: bash
  - name: Install isolated browser
    run: 'npm install --prefix "$RUNNER_TEMP/oauth-ws-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/oauth-ws-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Render originals and exercise actual form save
    env:
      SOURCE_BASE: 1c3882e935a01b376f9aefdf844863125fff7c2b
      BASELINE_ROOT: ${{ runner.temp }}/oauth-ws-base/frontend
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/oauth-ws-browser/node_modules/playwright
      SCREENSHOT_DIR: ${{ runner.temp }}/oauth-ws-evidence
    run: 'set -euo pipefail

      mkdir -p "$SCREENSHOT_DIR"

      node scripts/oauth-initial-ws-screenshot.mjs 2>&1 | tee "$SCREENSHOT_DIR/render.log"

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-oauth-initial-ws-evidence-rendered-before-after-oauth-initial-ws-${{ github.event.pull_request.head.sha
        || github.sha }}-${{ github.event_name }}
      path: ${{ runner.temp }}/oauth-ws-evidence
      if-no-files-found: error
