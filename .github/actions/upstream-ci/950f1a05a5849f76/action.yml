name: sync-20261116-token-guard-v2-scheduler-browser
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Install isolated browser for CI only
    run: 'npm install --prefix "$RUNNER_TEMP/token-guard-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/token-guard-browser/node_modules/.bin/playwright" install --with-deps chromium

      sudo apt-get install -y fonts-noto-cjk

      '
    shell: bash
  - name: Real page before and after, readback and desktop/mobile screenshots
    env:
      CI: 'true'
      TOKEN_GUARD_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/token-guard-browser/node_modules/playwright
      TOKEN_GUARD_SCREENSHOT_DIR: ${{ runner.temp }}/token-guard-screenshots
    run: node scripts/token-guard-v2-browser.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-token-guard-v2-scheduler-browser-credential-patrol-ui-${{ github.event.pull_request.head.sha ||
        github.sha }}
      path: ${{ runner.temp }}/token-guard-screenshots
      if-no-files-found: error
