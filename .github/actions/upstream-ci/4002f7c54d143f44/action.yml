name: sync-20261116-mature-channel-community-ops-qq-network
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      cache: false
      go-version: 1.27.4
  - uses: actions/cache/restore@v6
    with:
      path: '~/.cache/go-build

        ~/go/pkg/mod

        '
      key: mature-go-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-${{ github.job }}-${{ github.sha }}
      restore-keys: 'mature-go-${{ runner.os }}-${{ hashFiles(''backend/go.sum'') }}-${{ github.job }}-

        mature-go-${{ runner.os }}-${{ hashFiles(''backend/go.sum'') }}-candidate-

        mature-go-${{ runner.os }}-${{ hashFiles(''backend/go.sum'') }}-

        '
  - name: RED pinned imported QQ transport before hardening
    shell: bash
    run: 'set -euo pipefail

      mkdir -p "$RUNNER_TEMP/mature-network-evidence"

      base=1ba2716504e7462e948c715d7d8ffe03aa30b198

      git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git "$base"

      git worktree add --detach "$RUNNER_TEMP/mature-network-red" "$base"

      cp backend/internal/qqbot/mature_network_test.go "$RUNNER_TEMP/mature-network-red/backend/internal/qqbot/"

      cd "$RUNNER_TEMP/mature-network-red/backend"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      set +e

      go test ./internal/qqbot -run ''^TestMatureQQ(DefaultTransport|RejectsTranslation)'' -count=1 -v > "$RUNNER_TEMP/mature-network-evidence/red.log"
      2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/mature-network-evidence/red.log"

      test "$result" -ne 0

      ! grep -Eiq ''build failed|no tests to run|undefined:|--- SKIP:'' "$RUNNER_TEMP/mature-network-evidence/red.log"

      grep -q -- ''--- FAIL: TestMatureQQDefaultTransportRejectsPrivateDestination'' "$RUNNER_TEMP/mature-network-evidence/red.log"

      grep -q -- ''--- FAIL: TestMatureQQRejectsTranslationAndSpecialPurposeIPs'' "$RUNNER_TEMP/mature-network-evidence/red.log"

      '
  - name: Candidate network policy regressions
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test ./internal/qqbot -run ''^TestMatureQQ(DefaultTransport|RejectsTranslation)'' -count=1 -v'
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-channel-community-ops-qq-network-mature-network-${{ github.sha }}
      path: ${{ runner.temp }}/mature-network-evidence/
  - uses: actions/cache/save@v6
    if: always()
    with:
      path: '~/.cache/go-build

        ~/go/pkg/mod

        '
      key: mature-go-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-${{ github.job }}-${{ github.sha }}
