name: sync-20261116-ws-readable-continuation-transport
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_phase:
    description: Upstream matrix parameter phase.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Install isolated Redis
    run: "bash \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\nif ! command -v redis-server >/dev/null; then\n  bash\
      \ \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\n  sudo apt-get update\n  sudo apt-get install -y --no-install-recommends\
      \ redis-server\nfi\n"
    shell: bash
  - name: Immutable candidate tests and baseline production
    run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$CANDIDATE_SHA\"\ntest -z \"$(git status --porcelain)\"\n\
      mkdir -p \"$RUNNER_TEMP/ws-evidence\"\ngit rev-parse HEAD HEAD^{tree} > \"$RUNNER_TEMP/ws-evidence/candidate.txt\"\n\
      git rev-parse \"$BASELINE_SHA\" > \"$RUNNER_TEMP/ws-evidence/baseline.txt\"\nif [ \"$PHASE\" = RED ]; then\n  git worktree\
      \ add --detach \"$RUNNER_TEMP/ws-red\" \"$CANDIDATE_SHA\"\n  cd \"$RUNNER_TEMP/ws-red\"\n  while IFS= read -r target;\
      \ do\n    case \"$target\" in *_test.go) continue ;; esac\n    if git cat-file -e \"$BASELINE_SHA:$target\" 2>/dev/null;\
      \ then\n      mkdir -p -- \"$(dirname -- \"$target\")\"\n      git show \"$BASELINE_SHA:$target\" > \"$target\"\n  \
      \    git add -N -- \"$target\"\n      test \"$(git hash-object \"$target\")\" = \"$(git rev-parse \"$BASELINE_SHA:$target\"\
      )\"\n    else\n      rm -- \"$target\"\n    fi\n  done < <(git diff --no-renames --name-only \"$BASELINE_SHA\" \"$CANDIDATE_SHA\"\
      \ -- 'backend/**/*.go')\n  git diff --exit-code \"$BASELINE_SHA\" -- 'backend/**/*.go' ':!backend/**/*_test.go'\nfi\n\
      git diff --exit-code \"$CANDIDATE_SHA\" -- 'backend/**/*_test.go'\nif [ \"$PHASE\" = RED ]; then\n  bash \"$GITHUB_WORKSPACE/scripts/exclude-later-400-red-fixtures.sh\"\
      \ \"$BASELINE_SHA\" . \"$CANDIDATE_SHA\" | tee \"$RUNNER_TEMP/ws-evidence/transport-400-exclusions.txt\"\n  bash \"\
      $GITHUB_WORKSPACE/scripts/exclude-later-http2-red-fixtures.sh\" \"$BASELINE_SHA\"\n  bash \"$GITHUB_WORKSPACE/scripts/prepare-replay-red-fixtures.sh\"\
      \ \"$BASELINE_SHA\" . \"$CANDIDATE_SHA\" | tee \"$RUNNER_TEMP/ws-evidence/transport-replay-fixtures.txt\"\n  bash \"\
      $GITHUB_WORKSPACE/scripts/prepare-moderation-red-fixtures.sh\" \"$BASELINE_SHA\" . \"$CANDIDATE_SHA\" | tee \"$RUNNER_TEMP/ws-evidence/transport-moderation-fixtures.txt\"\
      \nfi\nfor target in backend/internal/handler/openai_409_ws_rebuild_test.go backend/internal/service/openai_ws_agent_recovery.go\
      \ backend/internal/handler/openai_gateway_handler.go; do\n  git hash-object \"$target\" >> \"$RUNNER_TEMP/ws-evidence/blobs.txt\"\
      \ndone\n"
    shell: bash
  - name: Same-client five-adapter actual continuation
    run: 'set -euo pipefail

      tested_tree="$GITHUB_WORKSPACE"

      if [ "$PHASE" = RED ]; then tested_tree="$RUNNER_TEMP/ws-red"; fi

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$tested_tree/backend"

      set +e

      (cd "$tested_tree/backend" && go test -race -json -tags=unit ./internal/handler -run ''^TestOpenAI409WSReadableContinuation$''
      -count=1 -timeout=5m) > "$RUNNER_TEMP/ws-evidence/transport.jsonl" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/ws-evidence/transport.jsonl"

      python3 scripts/assert-ws-readable.py "$PHASE" "$result" "$RUNNER_TEMP/ws-evidence/transport.jsonl" ws

      '
    shell: bash
  - name: GREEN delivery and eligibility boundaries
    if: inputs.sync_matrix_phase == 'GREEN'
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -race -json -tags=unit ./internal/handler -run ''^TestOpenAI409WSReadableBoundaries$'' -count=1
      -timeout=5m) > "$RUNNER_TEMP/ws-evidence/boundaries.jsonl" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/ws-evidence/boundaries.jsonl"

      python3 scripts/assert-ws-readable.py GREEN "$result" "$RUNNER_TEMP/ws-evidence/boundaries.jsonl" ws-boundaries

      '
    shell: bash
  - name: GREEN typed current-frame admission guards
    if: ${{ !cancelled() && inputs.sync_matrix_phase == 'GREEN' }}
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -race -json ./internal/service -run ''^TestOpenAI409WSUnsentTurnBoundary$'' -count=1 -timeout=5m)
      2>&1 | tee "$RUNNER_TEMP/ws-evidence/unsent-guards.jsonl"

      '
    shell: bash
  - name: Reject actual-wire ambiguous oracle mutations
    if: ${{ !cancelled() }}
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -race -json -tags=unit ./internal/handler -run ''^TestOpenAI409WSAmbiguousOracleMutations$''
      -count=1 -timeout=5m) > "$RUNNER_TEMP/ws-evidence/oracle.jsonl" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/ws-evidence/oracle.jsonl"

      python3 scripts/assert-ws-readable.py GREEN "$result" "$RUNNER_TEMP/ws-evidence/oracle.jsonl" ws-oracle

      '
    shell: bash
  - name: Actual transport review counterexamples and repaired candidate
    if: ${{ !cancelled() }}
    run: "set -euo pipefail\ntested_tree=\"$GITHUB_WORKSPACE\"\nbaseline=b5892afda5d176cf4ec5c346b07add48f224ab28\ngit rev-parse\
      \ \"$baseline\" > \"$RUNNER_TEMP/ws-evidence/review-baseline.txt\"\nif [ \"$PHASE\" = RED ]; then\n  git worktree add\
      \ --detach \"$RUNNER_TEMP/ws-review-red\" \"$CANDIDATE_SHA\"\n  tested_tree=\"$RUNNER_TEMP/ws-review-red\"\n  while\
      \ IFS= read -r target; do\n    case \"$target\" in *_test.go) continue ;; esac\n    if git cat-file -e \"$baseline:$target\"\
      \ 2>/dev/null; then\n      mkdir -p -- \"$(dirname -- \"$tested_tree/$target\")\"\n      git show \"$baseline:$target\"\
      \ > \"$tested_tree/$target\"\n      git -C \"$tested_tree\" add -N -- \"$target\"\n      test \"$(git hash-object \"\
      $tested_tree/$target\")\" = \"$(git rev-parse \"$baseline:$target\")\"\n    else\n      rm -- \"$tested_tree/$target\"\
      \n    fi\n  done < <(git diff --no-renames --name-only \"$baseline\" \"$CANDIDATE_SHA\" -- 'backend/**/*.go')\n  git\
      \ -C \"$tested_tree\" diff --exit-code \"$baseline\" -- 'backend/**/*.go' ':!backend/**/*_test.go'\nfi\ngit -C \"$tested_tree\"\
      \ diff --exit-code \"$CANDIDATE_SHA\" -- 'backend/**/*_test.go'\nif [ \"$PHASE\" = RED ]; then\n  bash scripts/exclude-later-400-red-fixtures.sh\
      \ \"$baseline\" \"$tested_tree\" \"$CANDIDATE_SHA\" | tee \"$RUNNER_TEMP/ws-evidence/review-400-exclusions.txt\"\n \
      \ bash scripts/exclude-later-http2-red-fixtures.sh \"$baseline\" \"$tested_tree\" \"$CANDIDATE_SHA\"\n  bash scripts/prepare-replay-red-fixtures.sh\
      \ \"$baseline\" \"$tested_tree\" \"$CANDIDATE_SHA\" | tee \"$RUNNER_TEMP/ws-evidence/review-replay-fixtures.txt\"\n\
      \  bash scripts/prepare-moderation-red-fixtures.sh \"$baseline\" \"$tested_tree\" \"$CANDIDATE_SHA\" | tee \"$RUNNER_TEMP/ws-evidence/review-moderation-fixtures.txt\"\
      \nfi\nfor target in backend/internal/handler/openai_409_ws_rebuild_test.go backend/internal/handler/openai_409_ws_oracle_test.go\
      \ backend/internal/handler/openai_gateway_handler.go backend/internal/service/openai_ws_http_bridge.go backend/internal/service/openai_ws_forwarder_payload.go;\
      \ do\n  git hash-object \"$tested_tree/$target\" >> \"$RUNNER_TEMP/ws-evidence/review-blobs.txt\"\ndone\npython3 \"\
      $GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" \"$tested_tree/backend\"\nset +e\n(cd \"$tested_tree/backend\" && go\
      \ test -race -json -tags=unit ./internal/handler -run '^TestOpenAI409WSReviewRepairs$' -count=1 -timeout=5m) > \"$RUNNER_TEMP/ws-evidence/review.jsonl\"\
      \ 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/ws-evidence/review.jsonl\"\npython3 scripts/assert-ws-readable.py \"$PHASE\"\
      \ \"$result\" \"$RUNNER_TEMP/ws-evidence/review.jsonl\" ws-review\n"
    shell: bash
  - name: Residual headers tools and ticket actual transport counterexamples
    if: ${{ !cancelled() }}
    run: "set -euo pipefail\ntested_tree=\"$GITHUB_WORKSPACE\"\nbaseline=94bb4a53e9e5057990cd851ab0620d99b116ad41\ngit rev-parse\
      \ \"$baseline\" > \"$RUNNER_TEMP/ws-evidence/residual-baseline.txt\"\nif [ \"$PHASE\" = RED ]; then\n  git worktree\
      \ add --detach \"$RUNNER_TEMP/ws-residual-red\" \"$CANDIDATE_SHA\"\n  tested_tree=\"$RUNNER_TEMP/ws-residual-red\"\n\
      \  while IFS= read -r target; do\n    case \"$target\" in *_test.go) continue ;; esac\n    if git cat-file -e \"$baseline:$target\"\
      \ 2>/dev/null; then\n      mkdir -p -- \"$(dirname -- \"$tested_tree/$target\")\"\n      git show \"$baseline:$target\"\
      \ > \"$tested_tree/$target\"\n      git -C \"$tested_tree\" add -N -- \"$target\"\n      test \"$(git hash-object \"\
      $tested_tree/$target\")\" = \"$(git rev-parse \"$baseline:$target\")\"\n    else\n      rm -- \"$tested_tree/$target\"\
      \n    fi\n  done < <(git diff --no-renames --name-only \"$baseline\" \"$CANDIDATE_SHA\" -- 'backend/**/*.go')\n  git\
      \ -C \"$tested_tree\" diff --exit-code \"$baseline\" -- 'backend/**/*.go' ':!backend/**/*_test.go'\n  # BEGIN residual\
      \ Redis test-support overlay\n  # The complete production baseline is proved above. Restore only\n  # this candidate\
      \ test dependency, with an explicit blob manifest.\n  helper=backend/internal/testutil/redissession/store.go\n  test\
      \ \"$helper\" = backend/internal/testutil/redissession/store.go\n  if git cat-file -e \"$baseline:$helper\" 2>/dev/null;\
      \ then exit 1; fi\n  candidate_blob=$(git rev-parse \"$CANDIDATE_SHA:$helper\")\n  test \"$(git cat-file -t \"$candidate_blob\"\
      )\" = blob\n  for support_dir in backend backend/internal backend/internal/testutil backend/internal/testutil/redissession;\
      \ do\n    test ! -L \"$GITHUB_WORKSPACE/$support_dir\"\n    test ! -L \"$tested_tree/$support_dir\"\n  done\n  test\
      \ -f \"$GITHUB_WORKSPACE/$helper\"\n  test ! -L \"$GITHUB_WORKSPACE/$helper\"\n  source_blob=$(git hash-object \"$GITHUB_WORKSPACE/$helper\"\
      )\n  test \"$source_blob\" = \"$candidate_blob\"\n  test ! -e \"$tested_tree/$helper\"\n  test ! -L \"$tested_tree/$helper\"\
      \n  mkdir -p -- \"$(dirname -- \"$tested_tree/$helper\")\"\n  git show \"$CANDIDATE_SHA:$helper\" > \"$tested_tree/$helper\"\
      \n  restored_blob=$(git hash-object \"$tested_tree/$helper\")\n  test \"$restored_blob\" = \"$candidate_blob\"\n  git\
      \ -C \"$tested_tree\" diff --exit-code \"$baseline\" -- 'backend/**/*.go' ':!backend/**/*_test.go' \":!$helper\"\n \
      \ test \"$(git -C \"$tested_tree\" diff --name-only \"$baseline\" -- 'backend/**/*.go' ':!backend/**/*_test.go')\" =\
      \ \"$helper\"\n  printf 'path=%s baseline=%s baseline_blob=absent candidate=%s candidate_blob=%s source_blob=%s restored_blob=%s\\\
      n' \"$helper\" \"$baseline\" \"$CANDIDATE_SHA\" \"$candidate_blob\" \"$source_blob\" \"$restored_blob\" > \"$RUNNER_TEMP/ws-evidence/residual-test-support.txt\"\
      \n  # END residual Redis test-support overlay\nfi\ngit -C \"$tested_tree\" diff --exit-code \"$CANDIDATE_SHA\" -- 'backend/**/*_test.go'\n\
      if [ \"$PHASE\" = RED ]; then\n  bash scripts/exclude-later-400-red-fixtures.sh \"$baseline\" \"$tested_tree\" \"$CANDIDATE_SHA\"\
      \ | tee \"$RUNNER_TEMP/ws-evidence/residual-400-exclusions.txt\"\n  bash scripts/exclude-later-http2-red-fixtures.sh\
      \ \"$baseline\" \"$tested_tree\" \"$CANDIDATE_SHA\"\n  bash scripts/prepare-replay-red-fixtures.sh \"$baseline\" \"\
      $tested_tree\" \"$CANDIDATE_SHA\" | tee \"$RUNNER_TEMP/ws-evidence/residual-replay-fixtures.txt\"\n  bash scripts/prepare-moderation-red-fixtures.sh\
      \ \"$baseline\" \"$tested_tree\" \"$CANDIDATE_SHA\" | tee \"$RUNNER_TEMP/ws-evidence/residual-moderation-fixtures.txt\"\
      \n  # The service test package also compiles unrelated fixtures added by\n  # newer production. Match their historical\
      \ APIs in this disposable\n  # RED only; keep every selected 409/ticket test and all GREEN tests.\n  # PR855 route-evidence\
      \ types and later production BPS search APIs\n  # are absent in this baseline. Their unselected tests follow the\n \
      \ # pinned historical APIs too; the selected ticket oracle stays current.\n  # The replay helper already owns the four\
      \ UltraFast group fixtures\n  # and the base BPS search fixtures. Do not apply them twice here.\n  # The separate search-business\
      \ fixture still depends on the removed\n  # search helper, so this loop alone owns its historical adaptation.\n  # The\
      \ shared replay helper already owns PR899 platform-edit fixtures;\n  # do not exclude the same files again in this loop.\n\
      \  # The later WS close diagnostic fixture also requires candidate-only APIs.\n  # Never change the selected ticket\
      \ oracle or candidate GREEN tests.\n  for target in backend/internal/service/temp_unsched_pending_test.go backend/internal/service/temp_unsched_stream_timing_test.go\
      \ backend/internal/service/temp_unsched_ws_forward_test.go backend/internal/service/openai_auth_connection_status_test.go\
      \ backend/internal/service/openai_auth_connections_account_type_test.go backend/internal/service/account_ops_balance_test.go\
      \ backend/internal/service/openai_excel_bps_bridge_failure_test.go backend/internal/service/quality_5xx_immediate_test.go\
      \ backend/internal/service/openai_ws_agent_recovery_test.go backend/internal/service/openai_excel_bps_search_business_test.go\
      \ backend/internal/service/gemini_compat_response_format_test.go backend/internal/service/openai_ws_close_logging_test.go\
      \ backend/internal/service/upstream_request_id_test.go; do\n    candidate_blob=$(git rev-parse \"$CANDIDATE_SHA:$target\"\
      )\n    test \"$(git hash-object \"$tested_tree/$target\")\" = \"$candidate_blob\"\n    if git cat-file -e \"$baseline:$target\"\
      \ 2>/dev/null; then\n      expected=$(git rev-parse \"$baseline:$target\")\n      git show \"$baseline:$target\" > \"\
      $tested_tree/$target\"\n      actual=$(git hash-object \"$tested_tree/$target\")\n      test \"$actual\" = \"$expected\"\
      \n      printf 'path=%s baseline=%s candidate=%s candidate_blob=%s expected=%s actual=%s\\n' \"$target\" \"$baseline\"\
      \ \"$CANDIDATE_SHA\" \"$candidate_blob\" \"$expected\" \"$actual\" >> \"$RUNNER_TEMP/ws-evidence/residual-service-fixtures.txt\"\
      \n    else\n      rm -- \"$tested_tree/$target\"\n      test ! -e \"$tested_tree/$target\"\n      printf 'path=%s baseline=%s\
      \ candidate=%s candidate_blob=%s baseline_blob=absent actual=absent\\n' \"$target\" \"$baseline\" \"$CANDIDATE_SHA\"\
      \ \"$candidate_blob\" >> \"$RUNNER_TEMP/ws-evidence/residual-service-fixtures.txt\"\n    fi\n  done\n  # PR885 unit\
      \ fixtures require the later request-proxy contract.\n  # Restore the existing warm fixture to its pinned historical\
      \ blob.\n  # Keep the selected ticket oracle and the proved production baseline.\n  python3 scripts/prepare-request-proxy-historical-tests.py\
      \ \"$baseline\" \"$tested_tree\" \"$CANDIDATE_SHA\" \"$RUNNER_TEMP/ws-evidence/request-proxy-historical-tests.json\"\
      \nfi\nfor target in backend/internal/handler/openai_409_ws_rebuild_test.go backend/internal/handler/openai_409_ws_oracle_test.go\
      \ backend/internal/service/openai_409_ws_ticket_test.go backend/internal/service/openai_ws_agent_recovery.go backend/internal/service/openai_ws_forwarder_payload.go\
      \ backend/internal/service/openai_gateway_passthrough.go; do\n  git hash-object \"$tested_tree/$target\" >> \"$RUNNER_TEMP/ws-evidence/residual-blobs.txt\"\
      \ndone\n# Run both independently even when one oracle fails. Neither a\n# compilation failure nor a missing diagnostic\
      \ is accepted as RED.\nfailed=0\nfor suite in ws-residual ws-ticket; do\n  package=handler\n  test_name=TestOpenAI409WSResidualRepairs\n\
      \  if [ \"$suite\" = ws-ticket ]; then package=service; test_name=TestOpenAI409WSTicketBoundEgress; fi\n  python3 \"\
      $GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" \"$tested_tree/backend\"\n  set +e\n  (cd \"$tested_tree/backend\" &&\
      \ go test -race -json -tags=unit \"./internal/$package\" -run \"^$test_name$\" -count=1 -timeout=5m) > \"$RUNNER_TEMP/ws-evidence/$suite.jsonl\"\
      \ 2>&1\n  result=$?\n  set -e\n  cat \"$RUNNER_TEMP/ws-evidence/$suite.jsonl\"\n  python3 scripts/assert-ws-readable.py\
      \ \"$PHASE\" \"$result\" \"$RUNNER_TEMP/ws-evidence/$suite.jsonl\" \"$suite\" || failed=1\ndone\ntest \"$failed\" =\
      \ 0\n"
    shell: bash
  - name: Native namespace semantics against ceed and candidate
    if: ${{ !cancelled() }}
    run: "set -euo pipefail\ntested_tree=\"$GITHUB_WORKSPACE\"\nbaseline=ceed61d478116dc0ef1ccf5c830bb6bb3d995270\ngit rev-parse\
      \ \"$baseline\" > \"$RUNNER_TEMP/ws-evidence/native-namespace-baseline.txt\"\nif [ \"$PHASE\" = RED ]; then\n  git worktree\
      \ add --detach \"$RUNNER_TEMP/ws-native-namespace-red\" \"$CANDIDATE_SHA\"\n  tested_tree=\"$RUNNER_TEMP/ws-native-namespace-red\"\
      \n  while IFS= read -r target; do\n    case \"$target\" in *_test.go) continue ;; esac\n    if git cat-file -e \"$baseline:$target\"\
      \ 2>/dev/null; then\n      mkdir -p -- \"$(dirname -- \"$tested_tree/$target\")\"\n      git show \"$baseline:$target\"\
      \ > \"$tested_tree/$target\"\n      git -C \"$tested_tree\" add -N -- \"$target\"\n      test \"$(git hash-object \"\
      $tested_tree/$target\")\" = \"$(git rev-parse \"$baseline:$target\")\"\n    else\n      rm -- \"$tested_tree/$target\"\
      \n    fi\n  done < <(git diff --no-renames --name-only \"$baseline\" \"$CANDIDATE_SHA\" -- 'backend/**/*.go')\n  git\
      \ -C \"$tested_tree\" diff --exit-code \"$baseline\" -- 'backend/**/*.go' ':!backend/**/*_test.go'\nfi\ngit -C \"$tested_tree\"\
      \ diff --exit-code \"$CANDIDATE_SHA\" -- 'backend/**/*_test.go'\nif [ \"$PHASE\" = RED ]; then\n  bash scripts/exclude-later-400-red-fixtures.sh\
      \ \"$baseline\" \"$tested_tree\" \"$CANDIDATE_SHA\" | tee \"$RUNNER_TEMP/ws-evidence/namespace-400-exclusions.txt\"\n\
      \  bash scripts/prepare-mature-red-fixtures.sh \"$baseline\" \"$tested_tree\" \"$CANDIDATE_SHA\" | tee \"$RUNNER_TEMP/ws-evidence/namespace-mature-fixtures.txt\"\
      \n  bash scripts/prepare-replay-red-fixtures.sh \"$baseline\" \"$tested_tree\" \"$CANDIDATE_SHA\" | tee \"$RUNNER_TEMP/ws-evidence/namespace-replay-fixtures.txt\"\
      \n  bash scripts/prepare-moderation-red-fixtures.sh \"$baseline\" \"$tested_tree\" \"$CANDIDATE_SHA\" | tee \"$RUNNER_TEMP/ws-evidence/namespace-moderation-fixtures.txt\"\
      \nfi\nfor target in backend/internal/handler/openai_409_ws_rebuild_test.go backend/internal/handler/openai_409_ws_oracle_test.go\
      \ backend/internal/service/openai_ws_agent_recovery.go; do\n  git hash-object \"$tested_tree/$target\" >> \"$RUNNER_TEMP/ws-evidence/native-namespace-blobs.txt\"\
      \ndone\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" \"$tested_tree/backend\"\nset +e\n(cd \"$tested_tree/backend\"\
      \ && go test -race -json -tags=unit ./internal/handler -run '^TestOpenAI409WSNativeNamespaceRecovery$' -count=1 -timeout=5m)\
      \ > \"$RUNNER_TEMP/ws-evidence/native-namespace.jsonl\" 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/ws-evidence/native-namespace.jsonl\"\
      \npython3 scripts/assert-ws-readable.py \"$PHASE\" \"$result\" \"$RUNNER_TEMP/ws-evidence/native-namespace.jsonl\" ws-native-namespace\n"
    shell: bash
  - name: Restored same-client task must pass current audit before B dispatch
    if: ${{ !cancelled() }}
    run: "set -euo pipefail\ntested_tree=\"$GITHUB_WORKSPACE\"\nbaseline=112d342e9d1fb1ac5c2796d980eded4d71f646d9\ntarget=backend/internal/handler/openai_gateway_handler.go\n\
      git rev-parse \"$baseline\" > \"$RUNNER_TEMP/ws-evidence/recovered-audit-baseline.txt\"\nif [ \"$PHASE\" = RED ]; then\n\
      \  git worktree add --detach \"$RUNNER_TEMP/ws-recovered-audit-red\" \"$CANDIDATE_SHA\"\n  tested_tree=\"$RUNNER_TEMP/ws-recovered-audit-red\"\
      \n  git show \"$baseline:$target\" > \"$tested_tree/$target\"\n  test \"$(git hash-object \"$tested_tree/$target\")\"\
      \ = \"$(git rev-parse \"$baseline:$target\")\"\nfi\ngit -C \"$tested_tree\" diff --exit-code \"$CANDIDATE_SHA\" -- 'backend/**/*_test.go'\n\
      for target in backend/internal/handler/openai_gateway_handler.go backend/internal/handler/openai_409_ws_audit_test.go\
      \ backend/internal/handler/openai_ws_v2_passthrough_cyber_test.go; do\n  printf '%s %s\\n' \"$target\" \"$(git hash-object\
      \ \"$tested_tree/$target\")\" >> \"$RUNNER_TEMP/ws-evidence/recovered-audit-blobs.txt\"\ndone\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ \"$tested_tree/backend\"\nset +e\n(cd \"$tested_tree/backend\" && go test -race -json -tags=unit ./internal/handler\
      \ -run '^TestOpenAI409WSRecoveredAudit$' -count=1 -timeout=5m) > \"$RUNNER_TEMP/ws-evidence/recovered-audit.jsonl\"\
      \ 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/ws-evidence/recovered-audit.jsonl\"\npython3 scripts/assert-ws-readable.py\
      \ \"$PHASE\" \"$result\" \"$RUNNER_TEMP/ws-evidence/recovered-audit.jsonl\" ws-recovered-audit\n"
    shell: bash
  - name: GREEN restored audit keeps original identity and fresh next-turn policy
    if: ${{ !cancelled() && inputs.sync_matrix_phase == 'GREEN' }}
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -race -json -tags=unit ./internal/handler -run ''^TestOpenAI409WSRecoveredAuditNextTurn$'' -count=1
      -timeout=5m) > "$RUNNER_TEMP/ws-evidence/recovered-audit-next.jsonl" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/ws-evidence/recovered-audit-next.jsonl"

      python3 scripts/assert-ws-readable.py GREEN "$result" "$RUNNER_TEMP/ws-evidence/recovered-audit-next.jsonl" ws-recovered-audit-next

