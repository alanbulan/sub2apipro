name: sync-20261116-issue715-agent-recovery-red-generated
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Reviewed output path with retained generated-task regressions
    shell: bash
    run: 'set -euo pipefail

      git rev-parse HEAD

      original=b6d780f1a4fee66c2930219dfe9e400b8f0279de

      bash scripts/historical-recovery-timezone-callers.sh

      target=backend/internal/service/openai_gateway_response_handling.go

      git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git "$original"

      trap ''git restore --source=HEAD -- "$target" backend/internal/service/openai_request_timezone_egress.go backend/internal/service/openai_ws_client.go;
      git diff --exit-code'' EXIT

      git restore --source="$original" -- "$target"

      expected=$(git rev-parse "$original:$target")

      actual=$(git hash-object "$target")

      echo "baseline=$original path=$target expected_blob=$expected tested_blob=$actual"

      test "$expected" = "$actual"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -tags=unit ./internal/handler -run ''^TestIssue715HTTPGeneratedTaskReturnsToItsProducer$'' -count=1
      -v -timeout=10m) > "$RUNNER_TEMP/issue715-generated-red.log" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/issue715-generated-red.log"

      test "$result" -ne 0

      if grep -Eq ''build failed|no tests to run|undefined:|panic:'' "$RUNNER_TEMP/issue715-generated-red.log"; then exit
      1; fi

      grep -q -- ''--- FAIL: TestIssue715HTTPGeneratedTaskReturnsToItsProducer/generated-json'' "$RUNNER_TEMP/issue715-generated-red.log"

      grep -q -- ''--- FAIL: TestIssue715HTTPGeneratedTaskReturnsToItsProducer/generated-stream-items'' "$RUNNER_TEMP/issue715-generated-red.log"

      grep -q ''newly generated task must return to its producer before any prior successful input'' "$RUNNER_TEMP/issue715-generated-red.log"

      '
