name: sync-20261116-account-connection-timing-frontend
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/download-artifact@v8
    with:
      name: account-timing-backend-${{ github.event.pull_request.head.sha || github.sha }}
      path: ${{ runner.temp }}/handler-proof
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: RED real modal consumers in a separate baseline directory
    shell: bash
    run: 'set -euo pipefail

      mkdir -p "$RUNNER_TEMP/ui-proof" "$RUNNER_TEMP/timing-ui-baseline"

      git archive "$BASELINE" frontend | tar -x -C "$RUNNER_TEMP/timing-ui-baseline"

      ln -s "$GITHUB_WORKSPACE/frontend/node_modules" "$RUNNER_TEMP/timing-ui-baseline/frontend/node_modules"

      cp frontend/src/components/account/__tests__/AccountConnectionTiming.spec.ts "$RUNNER_TEMP/timing-ui-baseline/frontend/src/components/account/__tests__/"

      set +e

      env -u ACCOUNT_TIMING_FIXTURES_DIR pnpm --dir "$RUNNER_TEMP/timing-ui-baseline/frontend" exec vitest run src/components/account/__tests__/AccountConnectionTiming.spec.ts
      -t ''keeps legacy success'' --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/ui-proof/red.json"
      > "$RUNNER_TEMP/ui-proof/red.log" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/ui-proof/red.log"

      test "$result" -ne 0

      python3 - "$RUNNER_TEMP/ui-proof/red.json" <<''PY''

      import json, sys

      report = json.load(open(sys.argv[1]))

      assert report[''numFailedTests''] == 2, ''Both actual modals must fail the intended assertion''

      failed = [t for f in report[''testResults''] for t in f[''assertionResults''] if t[''status''] == ''failed'']

      assert len(failed) == 2 and all(''account-test-timing'' in ''\n''.join(t[''failureMessages'']) for t in failed)

      PY

      git diff --exit-code HEAD

      '
  - name: Exact source, real components and captured handler events
    shell: bash
    run: 'set -euo pipefail

      export ACCOUNT_TIMING_FIXTURES_DIR="$RUNNER_TEMP/handler-proof/fixtures"

      test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      mkdir -p "$RUNNER_TEMP/ui-proof"

      printf ''exact_head=%s\n'' "$EXPECTED_HEAD" | tee "$RUNNER_TEMP/ui-proof/source.txt"

      test -f "$ACCOUNT_TIMING_FIXTURES_DIR/apikey-responses.sse"

      pnpm --dir frontend exec vitest run src/components/account/__tests__/AccountConnectionTiming.spec.ts src/components/account/__tests__/AccountTestModal.spec.ts
      src/components/admin/account/__tests__/AccountTestModal.spec.ts src/i18n/__tests__/localeKeyCompleteness.spec.ts --maxWorkers=1
      --minWorkers=1 --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/ui-proof/tests.log"

      pnpm --dir frontend exec vue-tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/ui-proof/types.log"

      pnpm --dir frontend exec eslint src/components/account/AccountTestModal.vue src/components/admin/account/AccountTestModal.vue
      src/components/account/AccountTestTiming.vue src/composables/useAccountTestTiming.ts src/utils/accountTestStream.ts
      src/components/account/__tests__/AccountConnectionTiming.spec.ts 2>&1 | tee "$RUNNER_TEMP/ui-proof/lint.log"

      git diff --exit-code HEAD

      '
  - name: Install isolated pinned browser tooling
    run: 'npm install --prefix "$RUNNER_TEMP/account-timing-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/account-timing-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Real desktop and mobile modals in both languages
    env:
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/account-timing-browser/node_modules/playwright
      ACCOUNT_TIMING_FIXTURES_DIR: ${{ runner.temp }}/handler-proof/fixtures
      ACCOUNT_TIMING_SCREENSHOT_DIR: ${{ runner.temp }}/ui-proof/screenshots
    run: node scripts/account-connection-timing-browser.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-account-connection-timing-frontend-account-timing-ui-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: ${{ runner.temp }}/ui-proof
      if-no-files-found: error
