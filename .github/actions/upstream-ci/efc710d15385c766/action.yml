name: sync-20261116-shadow-review-repair-repair
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_phase:
    description: Upstream matrix parameter phase.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Install isolated HTTP fixture Redis
    run: "bash \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\nif ! command -v redis-server >/dev/null; then\n  bash\
      \ \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\n  sudo apt-get update\n  sudo apt-get install -y --no-install-recommends\
      \ redis-server\nfi\n"
    shell: bash
  - name: Validator and immutable baseline assembly
    run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$CANDIDATE_SHA\"\ntest -z \"$(git status --porcelain)\"\n\
      mkdir -p \"$RUNNER_TEMP/shadow-repair-evidence\"\npython3 -B -m unittest discover -s scripts -p 'test_assert_ws_readable.py'\
      \ -v 2>&1 | tee \"$RUNNER_TEMP/shadow-repair-evidence/validator.log\"\ngit rev-parse HEAD HEAD^{tree} > \"$RUNNER_TEMP/shadow-repair-evidence/candidate.txt\"\
      \ngit rev-parse \"$BASELINE_SHA\" > \"$RUNNER_TEMP/shadow-repair-evidence/baseline.txt\"\nif [ \"$PHASE\" = RED ]; then\n\
      \  git worktree add --detach \"$RUNNER_TEMP/shadow-review-red\" \"$CANDIDATE_SHA\"\n  cd \"$RUNNER_TEMP/shadow-review-red\"\
      \n  while IFS= read -r target; do\n    case \"$target\" in *_test.go) continue ;; esac\n    if git cat-file -e \"$BASELINE_SHA:$target\"\
      \ 2>/dev/null; then\n      mkdir -p -- \"$(dirname -- \"$target\")\"\n      git show \"$BASELINE_SHA:$target\" > \"\
      $target\"\n      git add -N -- \"$target\"\n      test \"$(git hash-object \"$target\")\" = \"$(git rev-parse \"$BASELINE_SHA:$target\"\
      )\"\n    else\n      rm -- \"$target\"\n    fi\n  done < <(git diff --no-renames --name-only \"$BASELINE_SHA\" \"$CANDIDATE_SHA\"\
      \ -- 'backend/**/*.go')\n  git diff --exit-code \"$BASELINE_SHA\" -- 'backend/**/*.go' ':!backend/**/*_test.go'\nfi\n\
      git diff --exit-code \"$CANDIDATE_SHA\" -- 'backend/**/*_test.go'\nif [ \"$PHASE\" = RED ]; then\n  bash \"$GITHUB_WORKSPACE/scripts/exclude-later-400-red-fixtures.sh\"\
      \ \"$BASELINE_SHA\"\n  bash \"$GITHUB_WORKSPACE/scripts/exclude-later-http2-red-fixtures.sh\" \"$BASELINE_SHA\"\n  bash\
      \ \"$GITHUB_WORKSPACE/scripts/prepare-replay-red-fixtures.sh\" \"$BASELINE_SHA\" . \"$CANDIDATE_SHA\" | tee \"$RUNNER_TEMP/shadow-repair-evidence/replay-fixtures.txt\"\
      \n  bash \"$GITHUB_WORKSPACE/scripts/prepare-moderation-red-fixtures.sh\" \"$BASELINE_SHA\" . \"$CANDIDATE_SHA\" | tee\
      \ \"$RUNNER_TEMP/shadow-repair-evidence/moderation-fixtures.txt\"\nfi\nfor target in backend/internal/handler/openai_409_shadow_race_test.go\
      \ backend/internal/handler/openai_409_shadow_http_test.go backend/internal/securityaudit/prompt_recovered_context_test.go\
      \ backend/internal/service/openai_409_readable_shadow.go; do\n  git hash-object \"$target\" >> \"$RUNNER_TEMP/shadow-repair-evidence/blobs.txt\"\
      \ndone\n"
    shell: bash
  - name: Actual publication races and persistent audit canaries
    run: "set -euo pipefail\ntested_tree=\"$GITHUB_WORKSPACE\"\nif [ \"$PHASE\" = RED ]; then tested_tree=\"$RUNNER_TEMP/shadow-review-red\"\
      ; fi\nfor suite in shadow-races audit-provenance audit-persistence; do\n  package=handler\n  tags=unit\n  case \"$suite\"\
      \ in\n    shadow-races) root=TestOpenAI409FutureShadowPublicationFences ;;\n    audit-provenance) root=TestOpenAI409FutureShadowAuditProvenance\
      \ ;;\n    audit-persistence) root=TestRecoveredContextAuditPersistence; package=securityaudit; tags=integration ;;\n\
      \  esac\n  python3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" \"$tested_tree/backend\"\n  set +e\n  (cd \"$tested_tree/backend\"\
      \ && go test -race -json -tags=\"$tags\" \"./internal/$package\" -run \"^${root}$\" -count=1 -timeout=5m) > \"$RUNNER_TEMP/shadow-repair-evidence/$suite.jsonl\"\
      \ 2>&1\n  result=$?\n  set -e\n  cat \"$RUNNER_TEMP/shadow-repair-evidence/$suite.jsonl\"\n  python3 scripts/assert-ws-readable.py\
      \ \"$PHASE\" \"$result\" \"$RUNNER_TEMP/shadow-repair-evidence/$suite.jsonl\" \"$suite\"\ndone\n"
    shell: bash
  - name: GREEN native OAuth session identity boundaries
    if: ${{ !cancelled() && inputs.sync_matrix_phase == 'GREEN' }}
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -race -json ./internal/service -run ''^TestBuildUpstreamRequestOAuthHeaderOnlySession$'' -count=1
      -timeout=5m) 2>&1 | tee "$RUNNER_TEMP/shadow-repair-evidence/oauth-session-identity.jsonl"

      '
    shell: bash
  - name: GREEN OAuth final-wire shadow and pointers without opaque owners
    if: ${{ !cancelled() && inputs.sync_matrix_phase == 'GREEN' }}
    run: "set -euo pipefail\nfor suite in oauth-shadow pointer pointer-boundaries; do\n  case \"$suite\" in\n    oauth-shadow)\
      \ root=TestOpenAI409FutureShadowOAuth ;;\n    pointer) root=TestOpenAI409HTTPReadablePointerWithoutOpaque ;;\n    pointer-boundaries)\
      \ root=TestOpenAI409HTTPPointerWithoutOpaqueBoundaries ;;\n  esac\n  python3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ backend\n  set +e\n  (cd backend && go test -race -json -tags=unit ./internal/handler -run \"^${root}$\" -count=1\
      \ -timeout=5m) > \"$RUNNER_TEMP/shadow-repair-evidence/$suite.jsonl\" 2>&1\n  result=$?\n  set -e\n  cat \"$RUNNER_TEMP/shadow-repair-evidence/$suite.jsonl\"\
      \n  python3 scripts/assert-ws-readable.py GREEN \"$result\" \"$RUNNER_TEMP/shadow-repair-evidence/$suite.jsonl\" \"\
      $suite\"\ndone\n"
    shell: bash
  - name: Async penalty and admission counterexamples on reviewed d023
    if: ${{ !cancelled() }}
    run: "set -euo pipefail\ntested_tree=\"$GITHUB_WORKSPACE\"\nbaseline=d023408b8a48eac7247faad17086e2aa7c7107e9\ngit rev-parse\
      \ \"$baseline\" > \"$RUNNER_TEMP/shadow-repair-evidence/async-baseline.txt\"\nif [ \"$PHASE\" = RED ]; then\n  git worktree\
      \ add --detach \"$RUNNER_TEMP/async-review-red\" \"$CANDIDATE_SHA\"\n  tested_tree=\"$RUNNER_TEMP/async-review-red\"\
      \n  while IFS= read -r target; do\n    case \"$target\" in *_test.go) continue ;; esac\n    if git cat-file -e \"$baseline:$target\"\
      \ 2>/dev/null; then\n      mkdir -p -- \"$(dirname -- \"$tested_tree/$target\")\"\n      git show \"$baseline:$target\"\
      \ > \"$tested_tree/$target\"\n      git -C \"$tested_tree\" add -N -- \"$target\"\n      test \"$(git hash-object \"\
      $tested_tree/$target\")\" = \"$(git rev-parse \"$baseline:$target\")\"\n    else\n      rm -- \"$tested_tree/$target\"\
      \n    fi\n  done < <(git diff --no-renames --name-only \"$baseline\" \"$CANDIDATE_SHA\" -- 'backend/**/*.go')\n  git\
      \ -C \"$tested_tree\" diff --exit-code \"$baseline\" -- 'backend/**/*.go' ':!backend/**/*_test.go'\nfi\ngit -C \"$tested_tree\"\
      \ diff --exit-code \"$CANDIDATE_SHA\" -- 'backend/**/*_test.go'\nif [ \"$PHASE\" = RED ]; then\n  bash scripts/exclude-later-http2-red-fixtures.sh\
      \ \"$baseline\" \"$tested_tree\" \"$CANDIDATE_SHA\"\n  bash scripts/prepare-replay-red-fixtures.sh \"$baseline\" \"\
      $tested_tree\" \"$CANDIDATE_SHA\" | tee \"$RUNNER_TEMP/shadow-repair-evidence/async-replay-fixtures.txt\"\n  bash scripts/prepare-moderation-red-fixtures.sh\
      \ \"$baseline\" \"$tested_tree\" \"$CANDIDATE_SHA\" | tee \"$RUNNER_TEMP/shadow-repair-evidence/async-moderation-fixtures.txt\"\
      \nfi\nfor target in backend/internal/securityaudit/prompt_service.go backend/internal/securityaudit/prompt_repository.go\
      \ backend/internal/securityaudit/prompt_recovered_context_test.go; do\n  git hash-object \"$tested_tree/$target\" >>\
      \ \"$RUNNER_TEMP/shadow-repair-evidence/async-blobs.txt\"\ndone\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ \"$tested_tree/backend\"\nset +e\n(cd \"$tested_tree/backend\" && go test -race -json -tags=integration ./internal/securityaudit\
      \ -run '^TestRecoveredContextAsyncEnforcement$' -count=1 -timeout=5m) > \"$RUNNER_TEMP/shadow-repair-evidence/async-enforcement.jsonl\"\
      \ 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/shadow-repair-evidence/async-enforcement.jsonl\"\npython3 scripts/assert-ws-readable.py\
      \ \"$PHASE\" \"$result\" \"$RUNNER_TEMP/shadow-repair-evidence/async-enforcement.jsonl\" audit-async\n"
    shell: bash
  - name: Actual HTTP and socket ambiguous-oracle mutations
    if: ${{ !cancelled() }}
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -race -json -tags=unit ./internal/handler -run ''^TestOpenAI409WSAmbiguousOracleMutations$''
      -count=1 -timeout=5m) > "$RUNNER_TEMP/shadow-repair-evidence/ws-oracle.jsonl" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/shadow-repair-evidence/ws-oracle.jsonl"

      python3 scripts/assert-ws-readable.py GREEN "$result" "$RUNNER_TEMP/shadow-repair-evidence/ws-oracle.jsonl" ws-oracle

      '
    shell: bash
  - name: Inspect strict pointer baseline without inventing a RED
    if: matrix.phase == 'RED'
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$RUNNER_TEMP/shadow-review-red/backend"

      set +e

      (cd "$RUNNER_TEMP/shadow-review-red/backend" && go test -race -json -tags=unit ./internal/handler -run ''^TestOpenAI409HTTPPointerWithoutOpaqueBoundaries$/.*/.*/strict$''
      -count=1 -timeout=5m) > "$RUNNER_TEMP/shadow-repair-evidence/strict-pointer.jsonl" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/shadow-repair-evidence/strict-pointer.jsonl"

      python3 scripts/assert-ws-readable.py BASELINE "$result" "$RUNNER_TEMP/shadow-repair-evidence/strict-pointer.jsonl"
      strict-pointer

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-shadow-review-repair-repair-shadow-review-repair-${{ inputs.sync_matrix_phase }}-${{ env.CANDIDATE_SHA
        }}
      path: ${{ runner.temp }}/shadow-repair-evidence/
      if-no-files-found: error
