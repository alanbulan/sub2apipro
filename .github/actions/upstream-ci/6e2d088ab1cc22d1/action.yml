name: sync-20261116-priority-observation-seams
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Availability regressions must fail on exact 9620 baseline
    shell: bash
    run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/priority-logs\"\nold=\"$RUNNER_TEMP/latency-availability-old\"\ngit worktree\
      \ add --detach \"$old\" 9620d315f72a7dbf04fa10fca02970e1e410805e\ntrap 'git worktree remove --force \"$old\"' EXIT\n\
      git show d79c1044914e7924c38cc4a239e42ff8980698e6:backend/internal/service/priority_latency_availability_test.go > \"\
      $old/backend/internal/service/priority_latency_availability_test.go\"\ncp backend/internal/handler/priority_latency_availability_test.go\
      \ \"$old/backend/internal/handler/\"\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" \"$old/backend\"\nset\
      \ +e\n(cd \"$old/backend\" && go test -tags=unit ./internal/service ./internal/handler -run '^TestPriorityLatencyAvailability'\
      \ -count=1 -v -timeout=5m) > \"$RUNNER_TEMP/priority-logs/availability-red.log\" 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/priority-logs/availability-red.log\"\
      \ntest \"$result\" -ne 0\n! grep -Eq 'build failed|undefined:|no tests to run|panic:' \"$RUNNER_TEMP/priority-logs/availability-red.log\"\
      \nfor name in PoolBoundaries HistoryDegrades BoundContinuation EligibilityAndScope; do\n  grep -q -- \"--- FAIL: TestPriorityLatencyAvailability$name\"\
      \ \"$RUNNER_TEMP/priority-logs/availability-red.log\"\ndone\n"
  - name: Complete old production checkout must fail behavioral regressions
    shell: bash
    run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/priority-logs\"\ncleanup_old_checkout() {\n  if test -d \"$RUNNER_TEMP/priority-old\"\
      ; then\n    git -C \"$RUNNER_TEMP/priority-old\" restore --source=00788a4705152cb90aab089d352a494531e4664b --staged\
      \ --worktree -- .\n    git -C \"$RUNNER_TEMP/priority-old\" diff --exit-code\n    git -C \"$RUNNER_TEMP/priority-old\"\
      \ diff --cached --exit-code\n    git worktree remove --force \"$RUNNER_TEMP/priority-old\"\n    echo \"Restored immutable\
      \ baseline source and removed isolated red checkout\"\n  fi\n}\ntrap cleanup_old_checkout EXIT\ntrap 'exit 130' INT\n\
      trap 'exit 143' TERM\npython3 scripts/priority-observation-red.py\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ \"$RUNNER_TEMP/priority-old/backend\"\nset +e\n(cd \"$RUNNER_TEMP/priority-old/backend\" && go test -tags=unit ./internal/service\
      \ ./internal/handler ./internal/handler/admin -run '^TestPriorityObservationBaseline' -count=1 -v -timeout=10m) > \"\
      $RUNNER_TEMP/priority-logs/red.log\" 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/priority-logs/red.log\"\ntest \"$result\"\
      \ -ne 0\npython3 scripts/priority-observation-check-red.py \"$RUNNER_TEMP/priority-logs/red.log\"\n"
  - name: Complete a426 review baseline must fail the three review regressions
    if: ${{ !cancelled() }}
    shell: bash
    run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/priority-logs\"\ncleanup_review_checkout() {\n  if test -d \"$RUNNER_TEMP/priority-review-old\"\
      ; then\n    git -C \"$RUNNER_TEMP/priority-review-old\" restore --source=a426477ecc8cec1af43b0545467850ea5768a23d --staged\
      \ --worktree -- .\n    git -C \"$RUNNER_TEMP/priority-review-old\" diff --exit-code\n    git worktree remove --force\
      \ \"$RUNNER_TEMP/priority-review-old\"\n    echo \"Restored a426 baseline and removed review checkout\"\n  fi\n}\ntrap\
      \ cleanup_review_checkout EXIT\ntrap 'exit 130' INT\ntrap 'exit 143' TERM\npython3 scripts/priority-penalty-review-red.py\n\
      python3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" \"$RUNNER_TEMP/priority-review-old/backend\"\nset +e\n(cd \"\
      $RUNNER_TEMP/priority-review-old/backend\" && go test -tags=unit ./internal/service ./internal/handler -run '^TestPriorityPenaltyReview(NativeLease|LateSelection|HandlerFailover)$'\
      \ -count=1 -v -timeout=10m) > \"$RUNNER_TEMP/priority-logs/review-red.log\" 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/priority-logs/review-red.log\"\
      \ntest \"$result\" -ne 0\npython3 scripts/priority-penalty-review-red.py \"$RUNNER_TEMP/priority-logs/review-red.log\"\
      \n"
  - name: Install Redis for retained HTTP replay regressions
    run: "bash \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\nif ! command -v redis-server >/dev/null; then\n  bash\
      \ \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\n  sudo apt-get update\n  sudo apt-get install -y --no-install-recommends\
      \ redis-server\nfi\nredis-server --version\n"
    shell: bash
  - name: New transport scheduler history and handler seams
    id: green
    if: ${{ !cancelled() }}
    shell: bash
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -tags=unit ./internal/service ./internal/handler ./internal/handler/admin -run ''^(TestPriority|TestOpenAI.*Sticky|Test.*PreviousResponse|TestOpenAI.*Profit|TestOpenAI.*RPM|TestOpenAI.*Replay|TestOpenAI.*Failover)''  -count=1
      -v -timeout=15m) 2>&1 | tee "$RUNNER_TEMP/priority-logs/green.log"

      '
  - name: Race check asynchronous history and observation seams
    if: ${{ !cancelled() && steps.green.outcome == 'success' }}
    shell: bash
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -race -tags=unit ./internal/service -run ''^(TestPriorityObservation|TestPriorityLatencyModes|TestPriorityLatencyAvailability|TestPriorityPenaltyReview|TestPriorityHistory|TestPrioritySignalRefresh)''
      -count=1 -v -timeout=8m) 2>&1 | tee "$RUNNER_TEMP/priority-logs/race.log"

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-priority-observation-seams-priority-seams-${{ github.event.pull_request.head.sha || github.sha }}
      path: ${{ runner.temp }}/priority-logs
      if-no-files-found: error
