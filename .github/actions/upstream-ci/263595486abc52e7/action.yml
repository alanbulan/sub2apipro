name: sync-20261116-pool-capacity-regression-regression
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Prove blocking regressions fail on previously reviewed head
    shell: bash
    run: "set -euo pipefail\ntargets=(\n  backend/internal/service/ratelimit_service.go\n  backend/internal/service/gateway_model_availability.go\n\
      \  backend/internal/service/openai_gateway_model_availability.go\n)\ntrap 'git restore --source=HEAD -- \"${targets[@]}\"\
      ' EXIT\nfor target in \"${targets[@]}\"; do\n  git show a11c678d0ba8b899177682b8e54acccf14eeca2f:\"$target\" > \"$target\"\
      \ndone\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\nset +e\n(cd backend && go test -tags=unit\
      \ ./internal/service ./internal/handler -run '^TestPoolModelNegativeCache' -count=1) > \"$RUNNER_TEMP/pool-capacity-red.log\"\
      \ 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/pool-capacity-red.log\"\ntest \"$result\" -ne 0\n! grep -q '\\[build failed\\\
      ]' \"$RUNNER_TEMP/pool-capacity-red.log\"\ngrep -q -- '--- FAIL: TestPoolModelNegativeCacheWriterRespectsPoolDefaultAndOverrides'\
      \ \"$RUNNER_TEMP/pool-capacity-red.log\"\ngrep -q -- '--- FAIL: TestPoolModelNegativeCacheTwoLayersHistoricalObservationsDoNotRenew'\
      \ \"$RUNNER_TEMP/pool-capacity-red.log\"\n"
  - name: Verify exact head and existing boundary regressions
    working-directory: backend
    run: 'git diff --exit-code

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=unit ./internal/service ./internal/handler -run ''Test(PoolModelNegativeCache|PoolCapacity|ModelCapabilityCooldownDiagnosis|AnthropicModelCapabilityCooldownDiagnosis|DiagnoseModelAvailability|OpenAIDiagnoseModelAvailability|RateLimitService_.*Model|NonStreaming.*SSEToJSON|OpenAI.*Capacity|OpenAI.*TempRule|OpenAI.*ReplayBoundary|OpenAI.*ModelNotFound|OpenAIAdmissionPreservesCapabilityCooldownCause|ClassifyNoAccountError)''
      -count=1

      '
    shell: bash
