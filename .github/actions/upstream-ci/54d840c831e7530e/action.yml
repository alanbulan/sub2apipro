name: sync-20261116-rebuilt-request-dispatch-behavior
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_phase:
    description: Upstream matrix parameter phase.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Install isolated Redis fixture
    run: 'bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      sudo apt-get update

      sudo apt-get install -y --no-install-recommends redis-server

      '
    shell: bash
  - name: Restore release implementation for RED
    if: matrix.phase == 'RED'
    run: "set -euo pipefail\nbaseline=aa8e596e6d6f3e4648d6beba73b39b240dd5357a\nfor target in backend/internal/handler/openai_gateway_handler.go\
      \ backend/internal/service/openai_409_omit_history.go backend/internal/service/openai_account_scheduler.go backend/internal/service/openai_agent_message_recovery.go\
      \ backend/internal/service/openai_gateway_forward.go backend/internal/service/openai_request_timezone_egress.go backend/internal/service/openai_ws_client.go\
      \ backend/internal/service/openai_responses_namespace.go; do\n  git show \"$baseline:$target\" > \"$target\"\ndone\n\
      # Keep unrelated replay callers compatible with the frozen recovery\n# struct. These pinned blobs predate PR853's OAuth\
      \ projection; none\n# of the selected dispatch defect blobs above are replaced.\ncompatibility=00d2e9be01404c6e85c0560fa196e4650ef5d0fb\n\
      callers=\"$baseline\"\n# PR855 adds typed WS route refusals; preserve that pre-PR853 caller\n# only when the candidate\
      \ actually contains the corresponding types.\nif git grep -q 'type openAIWSOwnerRouteError struct' HEAD -- backend/internal/service/openai_ws_readable_continuation.go;\
      \ then\n  callers=d1bd861bcfa34443a629db98de9121a4e15d1d0b\nfi\nfor source in \"$compatibility\" \"$callers\"; do git\
      \ fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git \"$source\"; done\nfor target in backend/internal/service/openai_agent_replay_metadata.go\
      \ backend/internal/service/openai_gateway_request_body.go backend/internal/service/openai_ws_agent_recovery.go backend/internal/service/openai_ws_readable_continuation.go;\
      \ do\n  source=\"$callers\"\n  if [ \"$target\" = backend/internal/service/openai_agent_replay_metadata.go ]; then source=\"\
      $compatibility\"; fi\n  expected=$(git rev-parse \"$source:$target\")\n  git show \"$source:$target\" > \"$target\"\n\
      \  test \"$(git hash-object \"$target\")\" = \"$expected\"\n  echo \"$target compatibility=$source blob=$expected\"\
      \ >> \"$RUNNER_TEMP/dispatch-compatibility.txt\"\ndone\nbash \"$GITHUB_WORKSPACE/scripts/prepare-ws-owner-red-fixtures.sh\"\
      \ \"$baseline\" . HEAD | tee \"$RUNNER_TEMP/dispatch-ws-owner-red-blobs.txt\"\n"
    shell: bash
  - name: Same network and tool-loop regressions
    env:
      PHASE: ${{ inputs.sync_matrix_phase }}
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\nset +e\n(cd backend && go test\
      \ -race -json -tags=unit ./internal/service ./internal/handler -run '^TestOpenAI409(HTTPProjectionAndPassthrough|WSInitialWithoutPointer|PhysicalTimezonePreservesReadableTask|NamespaceProjectionPreservesNumbers)$'\
      \ -count=1 -timeout=10m) > \"$RUNNER_TEMP/dispatch.jsonl\" 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/dispatch.jsonl\"\
      \npython3 - \"$PHASE\" \"$result\" \"$RUNNER_TEMP/dispatch.jsonl\" <<'PY'\nimport json,sys\nphase,result,path=sys.argv[1:]\n\
      raw=open(path).read()\nfor invalid in ('[build failed]', 'undefined:', 'panic:', 'WARNING: DATA RACE', 'no tests to\
      \ run'):\n    assert invalid not in raw, invalid\nevents=[]\nfor line in raw.splitlines():\n    try: events.append(json.loads(line))\n\
      \    except ValueError: pass\nterminals={e['Test']:e['Action'] for e in events if 'Test' in e and e.get('Action') in\
      \ ('pass','fail','skip')}\nassert terminals and 'skip' not in terminals.values(), terminals\nexpected=[\n    'TestOpenAI409HTTPProjectionAndPassthrough/oauth/stream=false/internal_metadata',\n\
      \    'TestOpenAI409HTTPProjectionAndPassthrough/oauth/stream=true/message_namespace',\n    'TestOpenAI409HTTPProjectionAndPassthrough/apikey/stream=true/passthrough',\n\
      \    'TestOpenAI409PhysicalTimezonePreservesReadableTask/http/preserved=true',\n    'TestOpenAI409PhysicalTimezonePreservesReadableTask/ws/preserved=true',\n\
      ]\nif phase=='GREEN':\n    assert int(result)==0 and set(terminals.values())=={'pass'}, terminals\n    assert all(terminals.get(t)=='pass'\
      \ for t in expected)\n    assert len([t for t,v in terminals.items() if t.startswith('TestOpenAI409WSInitialWithoutPointer/')\
      \ and t.count('/')==2 and v=='pass'])==15\nelse:\n    assert int(result)!=0\n    assert all(terminals.get(t)=='fail'\
      \ for t in expected), terminals\n    assert any(t.startswith('TestOpenAI409WSInitialWithoutPointer/') and t.count('/')==2\
      \ and v=='fail' for t,v in terminals.items()), terminals\nPY\n"
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-rebuilt-request-dispatch-behavior-rebuilt-dispatch-${{ inputs.sync_matrix_phase }}-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/dispatch.jsonl
