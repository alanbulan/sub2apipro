name: sync-20261116-moderation-upstream-scope-behavioral-red
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Pinned original implementation with candidate regression
    run: 'mkdir -p "$RUNNER_TEMP/moderation-scope"

      git rev-parse HEAD > "$RUNNER_TEMP/moderation-scope/head.txt"

      cp backend/internal/handler/moderation_upstream_scope_test.go "$RUNNER_TEMP/scope_test.go"

      git checkout --detach 4189ed821

      cp "$RUNNER_TEMP/scope_test.go" backend/internal/handler/moderation_upstream_scope_test.go

      cd backend

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      set +e

      go test ./internal/handler -run ''^TestModerationUpstreamScopeUnselectedDoesNotAudit$'' -count=1 -v > "$RUNNER_TEMP/moderation-scope/red.log"
      2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/moderation-scope/red.log"

      test "$result" -ne 0

      if grep -Eiq ''build failed|no tests to run|undefined:|--- SKIP:|panic:|fatal error:|DATA RACE|signal:|segmentation
      fault'' "$RUNNER_TEMP/moderation-scope/red.log"; then exit 1; fi

      grep -q -- ''--- FAIL: TestModerationUpstreamScopeUnselectedDoesNotAudit'' "$RUNNER_TEMP/moderation-scope/red.log"

      grep -q ''unselected upstream account must make zero audit calls'' "$RUNNER_TEMP/moderation-scope/red.log"

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-moderation-upstream-scope-behavioral-red-moderation-scope-red-${{ github.sha }}
      path: ${{ runner.temp }}/moderation-scope
