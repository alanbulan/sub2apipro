name: sync-20261116-quality-ownership-ui-screenshot
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Record exact head
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    run: 'mkdir -p "$RUNNER_TEMP/quality-screenshots"

      git rev-parse HEAD | tee "$RUNNER_TEMP/quality-screenshots/head.txt"

      test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      '
    shell: bash
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Install isolated screenshot tool
    run: 'npm install --prefix "$RUNNER_TEMP/quality-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/quality-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Render actual component with offline fixtures
    env:
      QUALITY_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/quality-browser/node_modules/playwright
      QUALITY_SCREENSHOT_DIR: ${{ runner.temp }}/quality-screenshots
    run: node scripts/quality-ownership-screenshot.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-quality-ownership-ui-screenshot-quality-ownership-ui-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: ${{ runner.temp }}/quality-screenshots
      if-no-files-found: error
