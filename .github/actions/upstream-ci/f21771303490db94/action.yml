name: sync-20261116-issue881-totp-persistence
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Freeze identity
    run: 'test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      mkdir -p evidence

      git rev-parse HEAD HEAD^{tree} > evidence/head.txt

      '
    shell: bash
  - name: Validate RED evidence gate
    run: python3 -m unittest discover -s scripts -p 'test_issue881_red_evidence.py' -v
    shell: bash
  - name: Real PG RED compatibility reproduction using existing Upsert SQL
    shell: bash
    run: 'set -euo pipefail

      # Compatibility shim delegates to the real existing Upsert SQL; this is

      # not a full historical-blob restoration. Restore candidate before GREEN.

      source=backend/internal/repository/openai_totp_recovery.go

      cp "$source" "$RUNNER_TEMP/recovery-green.go"

      trap ''cp "$RUNNER_TEMP/recovery-green.go" "$source"'' EXIT

      python3 - <<''PY''

      from pathlib import Path

      Path(''backend/internal/repository/openai_totp_recovery.go'').write_text(''''''package repository

      import ("context"; "github.com/Wei-Shaw/sub2api/internal/service")

      func (r *openAIOAuthReauthRepository) InsertTOTPRecoveryConfig(ctx context.Context, c *service.OpenAIOAuthReauthStoredConfig)
      error {return r.UpsertConfig(ctx,c)}

      '''''')

      PY

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -tags=integration ./internal/repository -run ''^TestTOTPRecoveryInsertNeverOverwritesExistingOrConcurrentConfig$''
      -count=1 -v -timeout=10m) > evidence/red-recovery-pg.log 2>&1

      result=$?

      set -e

      echo "$result" > evidence/red-recovery-pg.exit

      cat evidence/red-recovery-pg.log

      test "$result" -ne 0

      if grep -Eqi -- ''build failed|setup failed|undefined:|no tests to run|--- SKIP:|panic:|fatal error:|data race|race
      detected|(^|[^[:alnum:]_])timeout([^[:alnum:]_]|$)|timed out|deadline exceeded'' evidence/red-recovery-pg.log; then
      exit 1; fi

      python3 scripts/issue881-red-evidence.py evidence/red-recovery-pg.log

      '
  - name: Real PG RED against pre-fix migration reload
    shell: bash
    run: 'set -euo pipefail

      sed ''s/ADD COLUMN IF NOT EXISTS/ADD COLUMN/g'' backend/migrations/382_openai_totp_binding.sql > "$RUNNER_TEMP/migration-red.sql"

      set +e

      (cd backend && ISSUE881_MIGRATION_TEST_FILE="$RUNNER_TEMP/migration-red.sql" go test -tags=integration ./internal/repository
      -run ''^TestTOTPBindingMigrationCanReloadWithoutReplacingSnapshot$'' -count=1 -v -timeout=10m) > evidence/red-migration-pg.log
      2>&1

      result=$?

      set -e

      echo "$result" > evidence/red-migration-pg.exit

      cat evidence/red-migration-pg.log

      test "$result" -ne 0

      if grep -Eqi -- ''build failed|setup failed|undefined:|no tests to run|--- SKIP:|panic:|fatal error:|data race|race
      detected|(^|[^[:alnum:]_])timeout([^[:alnum:]_]|$)|timed out|deadline exceeded'' evidence/red-migration-pg.log; then
      exit 1; fi

      grep -Eq -- ''^--- FAIL: TestTOTPBindingMigrationCanReloadWithoutReplacingSnapshot \('' evidence/red-migration-pg.log

      grep -F ''migration reload must be idempotent'' evidence/red-migration-pg.log

      '
  - name: Actual handler and service GREEN
    shell: bash
    run: 'set -euo pipefail

      git diff --exit-code

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -tags=unit ./internal/handler/admin ./internal/service -run ''^Test(TOTP|OpenAIOAuthReauth|OpenAISessionExport)''
      -count=1 -v -timeout=10m) 2>&1 | tee evidence/green-handler-service.log

      if grep -Eqi -- ''build failed|setup failed|undefined:|no tests to run|--- SKIP:|panic:|fatal error:|data race|race
      detected|(^|[^[:alnum:]_])timeout([^[:alnum:]_]|$)|timed out|deadline exceeded'' evidence/green-handler-service.log;
      then exit 1; fi

      '
  - name: Real PG GREEN migration reload, binding, CAS, recovery conflicts
    shell: bash
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -tags=integration ./internal/repository -run ''^Test(TOTP|OAuth429)'' -count=1 -v -timeout=10m)
      2>&1 | tee evidence/green-persistence.log

      if grep -Eqi -- ''build failed|setup failed|undefined:|no tests to run|--- SKIP:|panic:|fatal error:|data race|race
      detected|(^|[^[:alnum:]_])timeout([^[:alnum:]_]|$)|timed out|deadline exceeded'' evidence/green-persistence.log; then
      exit 1; fi

      '
  - name: Production Go build
    shell: bash
    run: 'set -euo pipefail

      (cd backend && CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/sub2api-production" ./cmd/server) 2>&1 | tee evidence/production-build.log

      sha256sum "$RUNNER_TEMP/sub2api-production" > evidence/production-build.sha256

      git diff --exit-code

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-issue881-totp-persistence-issue881-persistence-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: evidence/
