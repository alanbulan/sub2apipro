name: sync-20261116-profit-operations-postgres
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - run: git rev-parse HEAD
    shell: bash
  - run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=unit ./internal/service ./internal/handler/admin ./internal/server/routes -run ''^TestProfitOperations''
      -count=1 -v'
    working-directory: backend
    shell: bash
  - name: Standard charge cost formula RED against account-statistics substitution
    working-directory: backend
    shell: bash
    run: 'set -euo pipefail

      target=internal/repository/profit_operations.go

      cp "$target" "$RUNNER_TEMP/current-profit.go"

      trap ''cp "$RUNNER_TEMP/current-profit.go" "$target"'' EXIT

      python3 - <<''PYRED''

      from pathlib import Path

      p=Path(''internal/repository/profit_operations.go'')

      s=p.read_text()

      assert ''u.total_cost AS cost_base'' in s

      p.write_text(s.replace(''u.total_cost AS cost_base'',''COALESCE(u.account_stats_cost,u.total_cost) AS cost_base''))

      PYRED

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      set +e

      go test -tags=integration ./internal/repository -run ''^TestProfitOperationsHTTPPostgresWithoutModelChannelBinding$''
      -count=1 -v > "$RUNNER_TEMP/profit-cost-red.log" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/profit-cost-red.log"

      test "$result" -ne 0

      grep -q ''FAIL: TestProfitOperationsHTTPPostgresWithoutModelChannelBinding'' "$RUNNER_TEMP/profit-cost-red.log"

      grep -q ''standard model charge base, not account statistics override'' "$RUNNER_TEMP/profit-cost-red.log"

      '
  - run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=integration ./internal/repository -run ''^TestProfitOperations'' -count=1 -v'
    working-directory: backend
    shell: bash
