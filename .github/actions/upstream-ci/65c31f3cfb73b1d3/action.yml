name: sync-20261116-keys-usage-layout-browser
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Keys page and risk notice regressions
    run: pnpm --dir frontend exec vitest run src/views/user/__tests__/KeysView.spec.ts src/features/ip-audit/__tests__/UserKeyRiskNotices.spec.ts
    shell: bash
  - name: Build production frontend
    run: pnpm --dir frontend run build
    shell: bash
  - name: Install isolated CI browser
    run: 'npm install --prefix "$RUNNER_TEMP/keys-layout-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/keys-layout-browser/node_modules/.bin/playwright" install --with-deps chromium

      sudo apt-get install -y fonts-noto-cjk

      '
    shell: bash
  - name: Render actual Keys page with synthetic data
    env:
      KEYS_LAYOUT_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      KEYS_LAYOUT_SCREENSHOT_DIR: ${{ runner.temp }}/keys-layout-screenshots
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/keys-layout-browser/node_modules/playwright
    run: node scripts/keys-usage-layout-browser.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-keys-usage-layout-browser-keys-layout-${{ github.event.pull_request.head.sha || github.sha }}
      path: ${{ runner.temp }}/keys-layout-screenshots
