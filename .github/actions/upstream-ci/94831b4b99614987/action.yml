name: sync-20261116-http-task-rebuild-validator
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Evidence manifest and contamination self-tests
    shell: bash
    run: 'set -euo pipefail

      python3 -B -m unittest discover -s scripts -p ''test_assert_http_task_rebuild.py'' -v 2>&1 | tee "$RUNNER_TEMP/http-task-validator.log"

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-http-task-rebuild-validator-http-task-validator-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: ${{ runner.temp }}/http-task-validator.log
      if-no-files-found: error
