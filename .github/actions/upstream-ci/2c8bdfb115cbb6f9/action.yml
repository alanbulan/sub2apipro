name: sync-20261116-upstream-v0221-regression-behavioral-proof
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_defect:
    description: Upstream matrix parameter defect.
    required: true
runs:
  using: composite
  steps:
  - name: Assert exact candidate head
    run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
    shell: bash
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Require candidate GREEN and effective old-behavior RED
    run: python3 scripts/upstream-v0221-red.py '${{ inputs.sync_matrix_defect }}'
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-upstream-v0221-regression-behavioral-proof-v0221-proof-${{ inputs.sync_matrix_defect }}-${{ github.event_name
        }}-${{ github.event.pull_request.head.sha || github.sha }}
      path: ${{ runner.temp }}/v0221-proof-${{ inputs.sync_matrix_defect }}/
      if-no-files-found: error
