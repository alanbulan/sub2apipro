name: sync-20261116-ws-shadow-omission-shadow-intent
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Isolated Redis and evidence parser
    run: "set -euo pipefail\nbash \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\nif ! command -v redis-server >/dev/null;\
      \ then\n  bash \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\n  sudo apt-get update\n  sudo apt-get install -y\
      \ --no-install-recommends redis-server\nfi\npython3 -m unittest discover -s scripts -p 'test_shadow_omission_evidence.py'\n"
    shell: bash
  - name: Original handler assertions RED on exact bd824 shadow production
    shell: bash
    run: 'set -euo pipefail

      test "$(git rev-parse HEAD)" = "$CANDIDATE"

      git diff --exit-code

      mkdir -p "$RUNNER_TEMP/shadow-omission-evidence"

      git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/shadow-omission-evidence/candidate.txt"

      # The actual audit and NextTurn fixture/expectations are unchanged.

      fixture=backend/internal/handler/openai_409_ws_audit_test.go

      test "$(git hash-object "$fixture")" = "$(git rev-parse "$BASELINE:$fixture")"

      git rev-parse "$CANDIDATE:$fixture" > "$RUNNER_TEMP/shadow-omission-evidence/unchanged-handler-test.txt"

      git worktree add --detach "$RUNNER_TEMP/shadow-omission-red" "$CANDIDATE"

      target=backend/internal/service/openai_409_readable_shadow.go

      git show "$BASELINE:$target" > "$RUNNER_TEMP/shadow-omission-red/$target"

      test "$(git hash-object "$RUNNER_TEMP/shadow-omission-red/$target")" = "$(git rev-parse "$BASELINE:$target")"

      git rev-parse "$BASELINE" "$BASELINE:$target" > "$RUNNER_TEMP/shadow-omission-evidence/baseline.txt"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$RUNNER_TEMP/shadow-omission-red/backend"

      set +e

      (cd "$RUNNER_TEMP/shadow-omission-red/backend" && go test -p=1 -tags=unit,ownerconflict ./internal/handler -run ''^TestOpenAI409WSRecoveredAudit(NextTurn)?$''
      -count=1 -json -timeout=5m) > "$RUNNER_TEMP/shadow-omission-evidence/red.jsonl" 2>&1

      status=$?

      set -e

      cat "$RUNNER_TEMP/shadow-omission-evidence/red.jsonl"

      python3 scripts/shadow-omission-evidence.py RED "$status" "$RUNNER_TEMP/shadow-omission-evidence/red.jsonl"

      '
  - name: Same original handler assertions GREEN on clean candidate
    shell: bash
    run: 'set -euo pipefail

      test "$(git rev-parse HEAD)" = "$CANDIDATE"

      git diff --exit-code

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -race -p=1 -tags=unit,ownerconflict ./internal/handler -run ''^TestOpenAI409WSRecoveredAudit(NextTurn)?$''
      -count=1 -json -timeout=5m) > "$RUNNER_TEMP/shadow-omission-evidence/green.jsonl" 2>&1

      status=$?

      set -e

      cat "$RUNNER_TEMP/shadow-omission-evidence/green.jsonl"

      python3 scripts/shadow-omission-evidence.py GREEN "$status" "$RUNNER_TEMP/shadow-omission-evidence/green.jsonl"

      '
  - name: Typed source and supplied-text boundaries
    shell: bash
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\n(cd backend && go test -race\
      \ -p=1 -tags=unit,ownerconflict ./internal/service -run '^TestOpenAIRecoveryShadow(RetainsTaskBeforeOpaqueEnvelope|RetainsTaskBeforeOpaqueEnvelopeAndSummary|DoesNotReclassifyClientMetadataText|TypedEnvelopeOmission|PreservesSuppliedText|PreservesSummaryOnlyIntent|SummaryIntentBoundaries)$'\
      \ -count=1 -json -timeout=5m) > \"$RUNNER_TEMP/shadow-omission-evidence/source-boundaries.jsonl\" 2>&1\npython3 scripts/assert-readable-continuation.py\
      \ --clean-log \"$RUNNER_TEMP/shadow-omission-evidence/source-boundaries.jsonl\"\npython3 - \"$RUNNER_TEMP/shadow-omission-evidence/source-boundaries.jsonl\"\
      \ <<'PY'\nimport json,sys\nrows=[json.loads(line) for line in open(sys.argv[1]) if line.startswith('{')]\nfor name in\
      \ ('RetainsTaskBeforeOpaqueEnvelope','RetainsTaskBeforeOpaqueEnvelopeAndSummary','DoesNotReclassifyClientMetadataText','TypedEnvelopeOmission','PreservesSuppliedText','PreservesSummaryOnlyIntent','SummaryIntentBoundaries'):\n\
      \    assert sum(row.get('Action')=='pass' and row.get('Test')=='TestOpenAIRecoveryShadow'+name for row in rows)==1,name\n\
      assert not any(row.get('Action') in ('skip','fail') for row in rows)\nPY\n"
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-ws-shadow-omission-shadow-intent-ws-shadow-omission-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: ${{ runner.temp }}/shadow-omission-evidence
