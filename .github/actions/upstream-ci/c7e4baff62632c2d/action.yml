name: sync-20261116-issue817-manual-fencing-manual-fencing
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_behavior:
    description: Upstream matrix parameter behavior.
    required: true
runs:
  using: composite
  steps:
  - name: Record exact head and isolate baseline sources
    working-directory: ${{ inputs.sync_matrix_behavior }}
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      BEHAVIOR: ${{ inputs.sync_matrix_behavior }}
    shell: bash
    run: "set -euo pipefail\nmkdir -p evidence\ngit rev-parse HEAD | tee evidence/head.txt\ntest \"$(git rev-parse HEAD)\"\
      \ = \"$EXPECTED_HEAD\"\nif [ \"$BEHAVIOR\" = red ]; then\n  original=4189ed821d6e4308b2f5fc3791b73d2eb53cda8a\n  git\
      \ fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git \"$original\"\n  for source in backend/internal/repository/account_quality.go\
      \ backend/internal/repository/scheduled_test_repo.go; do\n    git rev-parse \"$original:$source\" >> evidence/original-blobs.txt\n\
      \    git show \"$original:$source\" > \"$source\"\n  done\n  git diff --stat > evidence/red-source-diff.txt\nelse\n\
      \  git diff --exit-code\nfi\n"
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: ${{ inputs.sync_matrix_behavior }}/backend/go.sum
      go-version: 1.27.4
  - name: Real worker and persisted manual requests with race detection
    working-directory: ${{ inputs.sync_matrix_behavior }}
    env:
      CI: 'true'
      BEHAVIOR: ${{ inputs.sync_matrix_behavior }}
    shell: bash
    run: "set -euo pipefail\npattern='^(TestIssue817ManualWorkerInterleaving|TestIssue817ManualUpdateInterleaving)$'\nrequired=(TestIssue817ManualWorkerInterleaving\
      \ TestIssue817ManualUpdateInterleaving)\nif [ \"$BEHAVIOR\" = green ]; then\n  required+=(TestIssue817ManualGenerationAndLeaseFencing\
      \ TestIssue817QuotaSkipPreservesPending5xxExecution TestIssue817QuotaSkipPreserves401AndOwnership TestIssue817QuotaSkipRetainsActualIsolationOwnership\
      \ TestIssue817ManualTriggerIsOneShotAndLeaseFenced TestQuality5xxClaimKeepsCronAndCoalescesScheduledRun TestQuality5xxFinishConsumesCrossedCronWithoutOverwritingEdits\
      \ TestQualityRetestRestBlocksEveryClaimUntilDeadline)\n  pattern='^(TestIssue817|TestQuality5xxClaimKeepsCronAndCoalescesScheduledRun|TestQuality5xxFinishConsumesCrossedCronWithoutOverwritingEdits|TestQualityRetestRestBlocksEveryClaimUntilDeadline)'\n\
      fi\nset +e\nbash scripts/issue817-race-gate.sh \"$BEHAVIOR\" \"$PWD\" \"$pattern\" > evidence/manual-fencing.log 2>&1\n\
      result=$?\nset -e\ncat evidence/manual-fencing.log\ntest \"$(cat evidence/binary-identity-ok.txt)\" = passed\nif grep\
      \ -Eiq 'no tests to run|--- SKIP:|panic:|WARNING: DATA RACE|race detected during execution|segmentation fault|SIGSEGV|\\\
      [build failed\\]' evidence/manual-fencing.log; then\n  exit 1\nfi\nif [ \"$BEHAVIOR\" = red ]; then\n  test \"$result\"\
      \ -eq 1\n  for name in \"${required[@]}\"; do\n    grep -F -- \"--- FAIL: $name (\" evidence/manual-fencing.log\n  done\n\
      \  grep -F '5xx worker must not consume a pending manual request with substituted configuration' evidence/manual-fencing.log\n\
      \  grep -F 'configuration save must preserve the newer pending manual request' evidence/manual-fencing.log\nelse\n \
      \ test \"$result\" -eq 0\n  for name in \"${required[@]}\"; do\n    grep -F -- \"--- PASS: $name (\" evidence/manual-fencing.log\n\
      \  done\n  for child in never_run previous_completed_run; do\n    grep -F -- \"--- PASS: TestIssue817QuotaSkipPreservesPending5xxExecution/$child\
      \ (\" evidence/manual-fencing.log\n  done\nfi\n"
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-issue817-manual-fencing-manual-fencing-issue817-manual-${{ inputs.sync_matrix_behavior }}-${{ github.event_name
        }}-${{ github.run_id }}
      path: ${{ inputs.sync_matrix_behavior }}/evidence/
      if-no-files-found: error
