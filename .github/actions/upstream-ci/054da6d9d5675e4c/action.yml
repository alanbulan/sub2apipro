name: sync-20261116-free-fast-customer-cost-details-backend
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Verify evidence rejection guards
    run: python3 -m unittest discover -s scripts -p 'test_free_fast_cost_evidence.py'
    shell: bash
  - name: Generate Ent and retain reproducibility patch
    run: 'mkdir -p "$RUNNER_TEMP/free-fast"

      git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/free-fast/head.txt"

      (cd backend && go generate ./ent)

      git diff -- backend/ent > "$RUNNER_TEMP/free-fast/ent-generated.patch"

      '
    shell: bash
  - name: GREEN service and DTO business evidence
    shell: bash
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -race -json -tags=unit ./internal/service ./internal/handler/dto ./internal/handler/admin ./internal/repository
      -run ''^Test(FreeFastCustomerCost|OpenAIGatewayServiceRecordUsage_FreeOpenAIFast|GroupBillsOpenAIFast|UsageLogStaticInsertShape|PrepareUsageLogInsert|UsageLogRepositoryCreate|ScanUsageLogRequestTypeAndLegacyFallback)''
      -count=1 -timeout=15m) > "$RUNNER_TEMP/free-fast/green-unit.jsonl" 2>&1

      python3 scripts/free-fast-cost-evidence.py green "$RUNNER_TEMP/free-fast/green-unit.jsonl" TestFreeFastCustomerCostSnapshot
      TestFreeFastCustomerCostVariants TestFreeFastCustomerCostDTO TestFreeFastCustomerCostScopedAdmin TestFreeFastCustomerCostCachePrices
      TestFreeFastCustomerCostCacheDTO TestUsageLogStaticInsertShape_PlaceholdersMatchArgTypes TestScanUsageLogRequestTypeAndLegacyFallback

      '
  - name: GREEN all insertion paths, immutable history and durable replay
    shell: bash
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -json -tags=integration ./internal/repository -run ''^TestFreeFastCustomerCost'' -count=1 -timeout=15m)
      > "$RUNNER_TEMP/free-fast/green-sql.jsonl" 2>&1

      python3 scripts/free-fast-cost-evidence.py green "$RUNNER_TEMP/free-fast/green-sql.jsonl" TestFreeFastCustomerCostPersistence
      TestFreeFastCustomerCostDurableReplay TestFreeFastCustomerCostMigration TestFreeFastCustomerCostCachePersistence

      '
  - name: Same tests against pinned production code must reach business RED
    shell: bash
    run: "set -euo pipefail\nbaseline=0e8e97aa23afd8e88a61ea64a84a8fb84f1bfdc6\ngit fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git\
      \ \"$baseline\"\nfor file in backend/internal/service/openai_gateway_usage.go backend/internal/service/usage_log.go\
      \ backend/internal/handler/dto/types.go backend/internal/handler/dto/mappers.go backend/internal/handler/admin/scoped_admin_usage_response.go\
      \ backend/internal/repository/usage_log_repo_insert.go backend/internal/repository/usage_log_repo_query.go; do\n  git\
      \ show \"$baseline:$file\" > \"$file\"\n  test \"$(git hash-object \"$file\")\" = \"$(git rev-parse \"$baseline:$file\"\
      )\"\ndone\n# Tests stay byte-for-byte at candidate HEAD. Keep the new additive\n# DB column so a missing migration can\
      \ never qualify as business RED.\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\nset +e\n(cd backend\
      \ && go test -race -json -tags=unit ./internal/service ./internal/handler/dto ./internal/handler/admin -run '^TestFreeFastCustomerCost(Snapshot|Variants|DTO|ScopedAdmin)$'\
      \ -count=1 -timeout=15m) > \"$RUNNER_TEMP/free-fast/red-unit.jsonl\" 2>&1\nunit_exit=$?\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ backend\n(cd backend && go test -json -tags=integration ./internal/repository -run '^TestFreeFastCustomerCostPersistence$'\
      \ -count=1 -timeout=15m) > \"$RUNNER_TEMP/free-fast/red-sql.jsonl\" 2>&1\nsql_exit=$?\nset -e\ntest \"$unit_exit\" -ne\
      \ 0\ntest \"$sql_exit\" -ne 0\npython3 scripts/free-fast-cost-evidence.py red \"$RUNNER_TEMP/free-fast/red-unit.jsonl\"\
      \ TestFreeFastCustomerCostSnapshot TestFreeFastCustomerCostVariants TestFreeFastCustomerCostDTO TestFreeFastCustomerCostScopedAdmin\n\
      python3 scripts/free-fast-cost-evidence.py red \"$RUNNER_TEMP/free-fast/red-sql.jsonl\" TestFreeFastCustomerCostPersistence\n"
  - name: Cache-price snapshot business RED against pre-cache producer
    shell: bash
    run: 'set -euo pipefail

      # Restore candidate production paths after the original baseline RED.

      git restore backend/internal/service/openai_gateway_usage.go backend/internal/service/usage_log.go backend/internal/handler/dto/types.go
      backend/internal/handler/dto/mappers.go backend/internal/handler/admin/scoped_admin_usage_response.go backend/internal/repository/usage_log_repo_insert.go
      backend/internal/repository/usage_log_repo_query.go

      # UltraFast adds a new snapshot marker. Keep the original Free Fast

      # gateway while overlaying the historical cache-price producer, so

      # this RED remains a cache-price assertion rather than a missing-field

      # compilation failure. Candidate UltraFast runs in its own workflow.

      git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git 2927209f5492d8cb690b83a1964b2f093c19ad7a

      git show 2927209f5492d8cb690b83a1964b2f093c19ad7a:backend/internal/service/openai_gateway_usage.go > backend/internal/service/openai_gateway_usage.go

      baseline=6826ea7c13459f0fb8080b0753da4b8ae73dd383

      git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git "$baseline"

      git show "$baseline:backend/internal/service/customer_cost_details.go" > backend/internal/service/customer_cost_details.go

      test "$(git hash-object backend/internal/service/customer_cost_details.go)" = "$(git rev-parse "$baseline:backend/internal/service/customer_cost_details.go")"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -json -tags=unit ./internal/service -run ''^TestFreeFastCustomerCostCachePrices$'' -count=1 -timeout=15m)
      > "$RUNNER_TEMP/free-fast/red-cache.jsonl" 2>&1

      code=$?

      set -e

      test "$code" -ne 0

      python3 scripts/free-fast-cost-evidence.py red "$RUNNER_TEMP/free-fast/red-cache.jsonl" TestFreeFastCustomerCostCachePrices

      '
  - name: Require committed generated code
    if: always()
    run: test ! -s "$RUNNER_TEMP/free-fast/ent-generated.patch"
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-free-fast-customer-cost-details-backend-free-fast-backend-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/free-fast
      if-no-files-found: error
