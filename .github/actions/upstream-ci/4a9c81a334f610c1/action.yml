name: sync-20261116-http2-stream-reset-timezone-race
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/checkout@v6
    with:
      ref: 0c038c595c771c38f4e7d94b5022272b512662ac
      path: timezone-baseline
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: candidate/backend/go.sum
      go-version: 1.27.4
  - name: Check changed Go formatting remotely
    shell: bash
    run: 'set -euo pipefail

      mkdir -p evidence

      test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      test -z "$(git -C candidate status --porcelain)"

      git -C candidate fetch --no-tags --depth=1 origin 0c038c595c771c38f4e7d94b5022272b512662ac

      (cd candidate && git diff --name-only --diff-filter=ACM 0c038c595c771c38f4e7d94b5022272b512662ac HEAD -- ''*.go'' |
      xargs -r gofmt -d) > evidence/timezone-gofmt.diff

      cat evidence/timezone-gofmt.diff

      test ! -s evidence/timezone-gofmt.diff

      '
  - name: Original time.Local race on isolated pre-fix checkout
    shell: bash
    run: 'set -euo pipefail

      mkdir -p evidence

      git -C timezone-baseline rev-parse HEAD > evidence/timezone-red-head.txt

      git -C candidate rev-parse HEAD > evidence/timezone-green-head.txt

      cp candidate/backend/internal/repository/custom_timezone_isolation_test.go timezone-baseline/backend/internal/repository/

      python3 "$GITHUB_WORKSPACE/candidate/scripts/prepare-sync-ci.py" timezone-baseline/backend

      set +e

      (cd timezone-baseline/backend && go test -race -tags=unit ./internal/repository -run ''^TestRepositoryTimezoneIsolation$''
      -count=1 -v) > evidence/timezone-red.log 2>&1

      result=$?

      set -e

      cat evidence/timezone-red.log

      printf ''%s\n'' "$result" > evidence/timezone-red-exit.txt

      test "$result" -ne 0

      ! grep -Eq -- ''build failed|setup failed|undefined:|syntax error:|no tests to run|panic:|signal:|SIGSEGV|--- SKIP:''
      evidence/timezone-red.log

      grep -F ''WARNING: DATA RACE'' evidence/timezone-red.log

      grep -F ''internal/pkg/timezone.Init()'' evidence/timezone-red.log

      grep -F ''time.Now()'' evidence/timezone-red.log

      grep -F ''repository.useGroupUsageRepositoryTestTimezone()'' evidence/timezone-red.log

      '
  - name: Exact head isolated clocks and all repository timezone unit assertions
    shell: bash
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/candidate/scripts/prepare-sync-ci.py" candidate/backend

      (cd candidate/backend && go test -race -tags=unit ./internal/repository -run ''^TestRepositoryTimezoneIsolation$|^TestUsageTrend|^TestUsageLogRepositoryGetAllGroupUsageSummary|^TestDashboardAggregationRepository|^TestUsageCleanupRepository''
      -count=1 -v) 2>&1 | tee evidence/timezone-green.log

      ! grep -Eq -- ''WARNING: DATA RACE|--- SKIP:|no tests to run|build failed|panic:'' evidence/timezone-green.log

      grep -q -- ''--- PASS: TestRepositoryTimezoneIsolation'' evidence/timezone-green.log

      test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      test -z "$(git -C candidate status --porcelain)"

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-http2-stream-reset-timezone-race-http2-timezone-race-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: evidence/
