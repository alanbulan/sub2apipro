name: sync-20261116-channel-operations-frontend-workflow
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Actual page interactions and existing editor compatibility
    working-directory: frontend
    run: pnpm exec vitest run src/views/admin/__tests__/ChannelOperationsView.spec.ts src/components/admin/operations/__tests__/SmartOpsNav.spec.ts
      src/views/admin/__tests__/AccountQualityView.spec.ts src/views/admin/__tests__/ChannelsView.modelSync.spec.ts --maxWorkers=1
      --minWorkers=1 --no-file-parallelism
    shell: bash
  - name: Full frontend build (remote only)
    run: pnpm --dir frontend run build
    shell: bash
  - name: Isolated browser for synthetic UI acceptance
    run: 'npm install --prefix "$RUNNER_TEMP/channel-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/channel-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Actual page screenshots and mutation confirmation
    env:
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/channel-browser/node_modules/playwright
      CHANNEL_SCREENSHOT_DIR: ${{ runner.temp }}/channel-screenshots
    run: node scripts/channel-operations-screenshot.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-channel-operations-frontend-workflow-channel-operations-ui-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/channel-screenshots
      if-no-files-found: error
