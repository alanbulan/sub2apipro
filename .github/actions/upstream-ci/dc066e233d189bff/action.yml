name: sync-20261116-vip-credit-production-ui-production-ui
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Prepare isolated browser
    run: 'bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      npm install --prefix "$RUNNER_TEMP/vip-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      node "$RUNNER_TEMP/vip-browser/node_modules/playwright/cli.js" install --with-deps chromium

      '
    shell: bash
  - name: Production collection interactions
    env:
      SUB2API_PLAYWRIGHT_MODULE: ${{ runner.temp }}/vip-browser/node_modules/playwright/index.mjs
    run: node scripts/vip-credit-production-preview.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/vip-production-ui"
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-vip-credit-production-ui-production-ui-vip-production-ui-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/vip-production-ui
      if-no-files-found: error
