name: sync-20261116-request-timing-build-validate-build
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm install --frozen-lockfile
    working-directory: frontend
    shell: bash
  - name: Timing regression tests with race detector
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race ./internal/pkg/requesttiming ./internal/server/middleware ./internal/repository -run ''Test(FinishAndBinding|ConcurrentCallbacks|HTTPTraceKeeps|RequestTiming|TimingWrite|TimingBinding|CompletedStreamCleanup|HeartbeatFlush)''
      -count=1'
    shell: bash
  - name: Compile affected packages
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=unit ./internal/handler/... ./internal/service ./internal/repository ./internal/server/... -run ''^$'''
    shell: bash
  - name: Gateway idle worker and account operations regression tests
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=unit ./internal/service -run ''^Test(GatewayAccountOps|FullAccountOps|AccountOps|ContentModeration(Workers|Worker|IdleWorker|Runtime|Async))''
      -count=1'
    shell: bash
  - name: Frontend regression tests
    working-directory: frontend
    run: pnpm test:run src/components/admin/usage/__tests__/UsageTable.spec.ts src/components/admin/usage/__tests__/UsageTimingDialog.spec.ts
      src/utils/__tests__/usageTps.spec.ts src/utils/__tests__/latencyHealth.spec.ts src/utils/__tests__/requestTimingHealth.spec.ts
      src/views/admin/settings/MihomoSettings.spec.ts
    shell: bash
  - name: Frontend production build
    working-directory: frontend
    run: pnpm build
    shell: bash
  - name: Build pinned production binary
    working-directory: backend
    run: 'mkdir -p ../artifacts

      VERSION=$(cat cmd/server/VERSION)

      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags embed -trimpath -ldflags "-s -w -X main.Version=$VERSION -X main.Commit=$GITHUB_SHA
      -X main.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o ../artifacts/sub2api ./cmd/server

      cd ../artifacts

      sha256sum sub2api > SHA256SUMS

      printf ''%s\n'' "$GITHUB_SHA" > SOURCE_COMMIT

      git -C .. rev-parse HEAD^{tree} > SOURCE_TREE

      ./sub2api --version > VERSION.txt 2>&1

      '
    shell: bash
  - uses: actions/upload-artifact@v6
    with:
      name: sync-20261116-request-timing-build-validate-build-request-timing-linux-amd64
      path: 'artifacts/

        frontend/dist/

        '
      retention-days: 14
