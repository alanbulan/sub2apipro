name: sync-20261116-reauth-runtime-deployment
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Assert exact head
    run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
    shell: bash
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - uses: actions/setup-python@v6
    with:
      python-version: '3.12'
  - uses: actions/download-artifact@v8
    with:
      name: sync-20261116-reauth-runtime-package-reauth-runtime-test-amd64-${{ github.event.pull_request.head.sha || github.sha }}
      path: reauth-input
  - name: Build local API
    working-directory: backend
    run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/sub2api-staging" ./cmd/server
    shell: bash
  - name: Deploy API and packaged Worker with mock MFA
    env:
      AUTO_SETUP: 'true'
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '5432'
      DATABASE_USER: sub2api
      DATABASE_PASSWORD: local-staging-only
      DATABASE_DBNAME: sub2api
      DATABASE_SSLMODE: disable
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      SERVER_HOST: 127.0.0.1
      SERVER_PORT: '18083'
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: Staging-local-Only-938!
      JWT_SECRET: local-staging-jwt-secret-000000000000000000000000000
      OPENAI_REAUTH_WORKER_TOKEN: local-staging-worker-token-00000000000000000000000
      STAGING_API_URL: http://127.0.0.1:18083
      STAGING_ADMIN_EMAIL: admin@example.test
      STAGING_ADMIN_PASSWORD: Staging-local-Only-938!
      PYTHONDONTWRITEBYTECODE: '1'
    run: "export STAGING_ROOT=\"$RUNNER_TEMP/totp-staging\"\nexport DATA_DIR=\"$STAGING_ROOT/data\"\nmkdir -p \"$DATA_DIR\"\
      \ \"$STAGING_ROOT/releases/test\"\ntar -xzf reauth-input/sub2api-reauth_0.0.0-test_linux_amd64.tar.gz -C \"$STAGING_ROOT/releases/test\"\
      \nln -s releases/test \"$STAGING_ROOT/current\"\n\"$RUNNER_TEMP/sub2api-staging\" > \"$STAGING_ROOT/api.log\" 2>&1 &\n\
      api_pid=$!\ntrap 'kill \"$api_pid\" 2>/dev/null || true; wait \"$api_pid\" 2>/dev/null || true' EXIT\nfor attempt in\
      \ $(seq 1 60); do\n  if curl -fsS \"$STAGING_API_URL/health\" > /dev/null; then break; fi\n  if ! kill -0 \"$api_pid\"\
      ; then tail -n 30 \"$STAGING_ROOT/api.log\"; exit 1; fi\n  sleep 2\ndone\ncurl -fsS \"$STAGING_API_URL/health\"\nset\
      \ -o pipefail\npython tools/reauth-runtime/test_deployment.py 2>&1 | tee \"$STAGING_ROOT/acceptance.log\"\n"
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-reauth-runtime-deployment-totp-deployment-verification-${{ github.event.pull_request.head.sha ||
        github.sha }}
      path: '${{ runner.temp }}/totp-staging/verification.json

        ${{ runner.temp }}/totp-staging/acceptance.log

        ${{ runner.temp }}/totp-staging/api.log

        '
      if-no-files-found: error
      retention-days: 3
