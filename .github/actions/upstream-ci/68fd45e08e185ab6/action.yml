name: sync-20261116-image-header-timeout-backend
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Real loopback image forwarding, regional transport and setting boundaries
    working-directory: backend
    shell: bash
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit ./internal/handler ./internal/repository ./internal/service ./internal/handler/admin -run ''^(TestPR714|TestOpenAIImageResponseHeaderTimeout|TestForwardImagesAppliesResponseHeaderTimeout|TestOpenAIResponseHeaderTimeout)''
      -count=1 -v -timeout=10m | tee "$RUNNER_TEMP/image-header-tests.log"

      ! grep -Eq ''no tests to run|--- SKIP:'' "$RUNNER_TEMP/image-header-tests.log"

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-image-header-timeout-backend-image-header-backend-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: ${{ runner.temp }}/image-header-tests.log
