name: sync-20261116-account-ops-team-backend
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit ./internal/service ./internal/handler/admin -run ''^TestAccountOps'' -count=1 -timeout=10m'
    working-directory: backend
    shell: bash
  - run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=integration ./internal/repository -run ''^TestAccountOpsProviderSnapshot'' -count=1 -v -timeout=10m'
    working-directory: backend
    shell: bash
