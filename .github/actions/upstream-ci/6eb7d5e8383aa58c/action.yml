name: sync-20261116-openai-sse-delivery-backend
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Regional response ownership RED on pre-fix production code
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    shell: bash
    run: "evidence=\"$RUNNER_TEMP/pr777-response-ownership\"\nmkdir -p \"$evidence\"\nbaseline_sha=978ad19f2299a61f3ec1a158a1c79203bbfc0bcb\n\
      production_path=backend/internal/service/openai_ws_sse_incomplete.go\ntest_name=TestOpenAIWSSSEIncompleteRegionalHandlerOwnsSingleResponse\n\
      test_path=backend/internal/handler/openai_ws_sse_incomplete_regional_test.go\ntest \"$(git rev-parse HEAD)\" = \"$CANDIDATE_SHA\"\
      \ntest -z \"$(git status --porcelain)\"\nbaseline_checkout=$(mktemp -d \"$RUNNER_TEMP/pr777-baseline.XXXXXX\")\ngit\
      \ clone --no-hardlinks --no-checkout \"$GITHUB_WORKSPACE\" \"$baseline_checkout\"\ngit -C \"$baseline_checkout\" checkout\
      \ --detach \"$CANDIDATE_SHA\"\ngit -C \"$baseline_checkout\" restore --source=\"$baseline_sha\" --worktree -- \"$production_path\"\
      \ntest \"$(git -C \"$baseline_checkout\" diff --name-only)\" = \"$production_path\"\ntest \"$(git -C \"$baseline_checkout\"\
      \ hash-object \"$production_path\")\" = \"$(git rev-parse \"$baseline_sha:$production_path\")\"\ntest \"$(git -C \"\
      $baseline_checkout\" hash-object \"$test_path\")\" = \"$(git rev-parse \"HEAD:$test_path\")\"\nprintf 'candidate=%s\\\
      nbaseline_production=%s\\nrestored_path=%s\\n' \"$CANDIDATE_SHA\" \"$baseline_sha\" \"$production_path\" > \"$evidence/identity.txt\"\
      \ngit -C \"$baseline_checkout\" diff -- \"$production_path\" > \"$evidence/baseline-production.diff\"\ncd \"$baseline_checkout/backend\"\
      \npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" \"$PWD\"\nset +e\ngo test -race -v -tags=unit ./internal/handler\
      \ -run \"^${test_name}$\" -count=1 -timeout=3m 2>&1 | tee \"$evidence/baseline.log\"\nbaseline_exit=${PIPESTATUS[0]}\n\
      set -e\nprintf '%s\\n' \"$baseline_exit\" > \"$evidence/baseline.exitcode\"\ntest \"$baseline_exit\" -eq 1\nif grep\
      \ -Eq 'WARNING: DATA RACE|build failed|setup failed|no tests to run|panic:|fatal error:|test timed out|accept local\
      \ WS:|read response.create:|write local WS event:|expected response.create, got' \"$evidence/baseline.log\"; then\n\
      \  echo 'RED must fail on the ownership assertions, not compilation or fixture errors.'\n  exit 1\nfi\nfor mode in json\
      \ sse; do\n  for close_mode in eof 1000; do\n    grep -F -- \"--- FAIL: $test_name/$mode/$close_mode \" \"$evidence/baseline.log\"\
      \n  done\ndone\ntest \"$(grep -Fc 'regional JSON must remain one complete JSON response' \"$evidence/baseline.log\"\
      )\" -eq 2\ntest \"$(grep -Fc 'regional SSE must have exactly one failed terminal' \"$evidence/baseline.log\")\" -eq\
      \ 2\ntest \"$(grep -Fc 'stages=[admit reserve start] reservations=1 starts=1 completed=0 canceled=0 started=true reserved_model=\"\
      gpt-5.4\" maximum=1200000 expected_maximum=1200000 handshakes=1 submissions=1 http_replays=0 context_error=<nil>' \"\
      $evidence/baseline.log\")\" -eq 4\n"
  - name: Regional prepared JSON RED on pre-fix forwarder
    if: ${{ !cancelled() }}
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    shell: bash
    run: "evidence=\"$RUNNER_TEMP/pr777-response-ownership\"\nmkdir -p \"$evidence\"\nbaseline_sha=3347ece6f10e8937f7980ce830c73187c1ab6005\n\
      production_path=backend/internal/service/openai_ws_forwarder_v2.go\ntest_name=TestOpenAIWSSSEIncompleteRegionalHandlerOwnsSingleResponse\n\
      test_path=backend/internal/handler/openai_ws_sse_incomplete_regional_test.go\ntest \"$(git rev-parse HEAD)\" = \"$CANDIDATE_SHA\"\
      \ntest -z \"$(git status --porcelain)\"\nbaseline_checkout=$(mktemp -d \"$RUNNER_TEMP/pr777-prepared-baseline.XXXXXX\"\
      )\ngit clone --no-hardlinks --no-checkout \"$GITHUB_WORKSPACE\" \"$baseline_checkout\"\ngit -C \"$baseline_checkout\"\
      \ checkout --detach \"$CANDIDATE_SHA\"\ngit -C \"$baseline_checkout\" restore --source=\"$baseline_sha\" --worktree\
      \ -- \"$production_path\"\ntest \"$(git -C \"$baseline_checkout\" diff --name-only)\" = \"$production_path\"\ntest \"\
      $(git -C \"$baseline_checkout\" hash-object \"$production_path\")\" = \"$(git rev-parse \"$baseline_sha:$production_path\"\
      )\"\ntest \"$(git -C \"$baseline_checkout\" hash-object \"$test_path\")\" = \"$(git rev-parse \"HEAD:$test_path\")\"\
      \nprintf 'candidate=%s\\nbaseline_production=%s\\nrestored_path=%s\\n' \"$CANDIDATE_SHA\" \"$baseline_sha\" \"$production_path\"\
      \ > \"$evidence/prepared-identity.txt\"\ngit -C \"$baseline_checkout\" diff -- \"$production_path\" > \"$evidence/prepared-baseline-production.diff\"\
      \ncd \"$baseline_checkout/backend\"\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" \"$PWD\"\nset +e\ngo test\
      \ -race -v -tags=unit ./internal/handler -run \"^${test_name}$\" -count=1 -timeout=3m 2>&1 | tee \"$evidence/prepared-baseline.log\"\
      \nbaseline_exit=${PIPESTATUS[0]}\nset -e\nprintf '%s\\n' \"$baseline_exit\" > \"$evidence/prepared-baseline.exitcode\"\
      \ntest \"$baseline_exit\" -eq 1\npeer_close_pattern='^[[:space:]]+openai_ws_sse_incomplete_regional_test\\.go:[0-9]+:\
      \ read response\\.create: failed to get reader: received close frame: status = StatusNormalClosure and reason = \"\"\
      $'\ntest \"$(grep -Ec \"$peer_close_pattern\" \"$evidence/prepared-baseline.log\")\" -eq 4\ngrep -Ev \"$peer_close_pattern\"\
      \ \"$evidence/prepared-baseline.log\" > \"$evidence/prepared-baseline-other.log\"\nif grep -Eq 'WARNING: DATA RACE|build\
      \ failed|setup failed|no tests to run|panic:|fatal error:|test timed out|accept local WS:|read response.create:|write\
      \ local WS event:|expected response.create, got' \"$evidence/prepared-baseline-other.log\"; then\n  echo 'Prepared RED\
      \ must reject before Start and submission, without unrelated fixture errors.'\n  exit 1\nfi\nfor mode in json sse; do\n\
      \  for close_mode in eof 1000; do\n    grep -F -- \"--- FAIL: $test_name/$mode/$close_mode \" \"$evidence/prepared-baseline.log\"\
      \n    awk -v case_name=\"$test_name/$mode/$close_mode\" '\n      $0 == \"=== RUN   \" case_name { active = 1; next }\n\
      \      active && /^=== RUN   / { active = 0 }\n      active && /Messages:[[:space:]]+exactly one billable response\\\
      .create$/ { message++ }\n      active && /expected: int\\(1\\)$/ { expected++ }\n      active && /actual[[:space:]]*:\
      \ int32\\(0\\)$/ { actual++ }\n      active && /regional handler diagnostic: status=502 .*stages=\\[admit reserve cancel_before_start\\\
      ] reservations=1 starts=0 completed=0 canceled=1 started=false reserved_model=\"gpt-5\\.4\" maximum=1200000 expected_maximum=1200000\
      \ handshakes=1 submissions=0 http_replays=0 context_error=<nil>$/ { diagnostic++ }\n      END { if (message != 1 ||\
      \ expected != 1 || actual != 1 || diagnostic != 1) exit 1 }\n    ' \"$evidence/prepared-baseline.log\"\n  done\ndone\n"
  - name: Regional response ownership GREEN on clean exact candidate
    if: ${{ !cancelled() }}
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    shell: bash
    run: "evidence=\"$RUNNER_TEMP/pr777-response-ownership\"\nmkdir -p \"$evidence\"\ntest \"$(git rev-parse HEAD)\" = \"\
      $CANDIDATE_SHA\"\ntest -z \"$(git status --porcelain)\"\ncd backend\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ \"$PWD\"\nset +e\ngo test -race -v -tags=unit ./internal/service ./internal/handler -run '^TestOpenAIWSSSEIncomplete'\
      \ -count=1 -timeout=8m 2>&1 | tee \"$evidence/head.log\"\nhead_exit=${PIPESTATUS[0]}\nset -e\nprintf '%s\\n' \"$head_exit\"\
      \ > \"$evidence/head.exitcode\"\ntest \"$head_exit\" -eq 0\nfor mode in json sse; do\n  for close_mode in eof 1000;\
      \ do\n    grep -F -- \"--- PASS: TestOpenAIWSSSEIncompleteRegionalHandlerOwnsSingleResponse/$mode/$close_mode \" \"\
      $evidence/head.log\"\n  done\ndone\ngrep -F -- '--- PASS: TestOpenAIWSSSEIncompleteRegionalPayloadTypes (' \"$evidence/head.log\"\
      \ngrep -F -- '--- PASS: TestOpenAIWSSSEIncompleteRegionalPreparedPayloadBounds (' \"$evidence/head.log\"\ntest \"$(grep\
      \ -Fc 'stages=[admit reserve start] reservations=1 starts=1 completed=0 canceled=0 started=true reserved_model=\"gpt-5.4\"\
      \ maximum=1200000 expected_maximum=1200000 handshakes=1 submissions=1 http_replays=0 context_error=<nil>' \"$evidence/head.log\"\
      )\" -eq 4\ntest -z \"$(git status --porcelain)\"\n"
  - name: Upload regional ownership and prepared JSON RED and GREEN evidence
    if: always()
    uses: actions/upload-artifact@v6
    with:
      name: sync-20261116-openai-sse-delivery-backend-pr777-response-ownership-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: ${{ runner.temp }}/pr777-response-ownership/
      if-no-files-found: error
  - name: Collector and content projection regressions
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race ./internal/pkg/requesttiming -count=1'
    shell: bash
  - name: Plugin delivery startup configuration
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test ./internal/config -run ''^TestPluginSSEEarlyEventsConfiguration$'' -count=1'
    shell: bash
  - name: Host SSE parsers, trust boundary and native WS regressions
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit ./internal/service -run ''Test(PluginSSE|OpenAISSE|OpenAIWS.*Timing|OpenAIWSSSEAcceleration|OpenAIWSSSEIncomplete|OpenAIResponsesTTFT|WSSemanticFirstToken|PriorityResponsesSemanticEventContext|OpenAINativeFirstOutput|Issue605)''
      -count=1 -timeout=8m'
    shell: bash
  - name: Accelerated WS incomplete response ownership
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit ./internal/handler -run ''^TestOpenAIWSSSEIncomplete'' -count=1 -timeout=3m'
    shell: bash
