name: sync-20261116-encrypted-history-400-settings
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - working-directory: frontend
    run: 'pnpm exec vue-tsc --noEmit

      pnpm exec vitest run src/views/admin/__tests__/SettingsView.spec.ts src/i18n/__tests__/localeKeyCompleteness.spec.ts
      src/components/common/__tests__/NewFeatureBadge.spec.ts

      '
    shell: bash
  - name: Install screenshot browser
    run: 'npm install --prefix "$RUNNER_TEMP/history400-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/history400-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Capture independent actual settings
    env:
      PLAYWRIGHT_MODULE: ${{ runner.temp }}/history400-browser/node_modules/playwright/index.mjs
    run: node scripts/encrypted-history-400-preview.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/history400-ui"
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-encrypted-history-400-settings-encrypted-history-400-ui
      path: ${{ runner.temp }}/history400-ui
      if-no-files-found: error
