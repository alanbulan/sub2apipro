name: sync-20261116-upstream-v0221-ui-rendered
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Assert exact candidate
    run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
    shell: bash
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Preserve complete baseline archive
    run: 'mkdir -p "$RUNNER_TEMP/v0221-baseline"

      git archive "$SOURCE_BASE" | tar -x -C "$RUNNER_TEMP/v0221-baseline"

      cmp frontend/package.json "$RUNNER_TEMP/v0221-baseline/frontend/package.json"

      cmp frontend/pnpm-lock.yaml "$RUNNER_TEMP/v0221-baseline/frontend/pnpm-lock.yaml"

      ln -s "$GITHUB_WORKSPACE/frontend/node_modules" "$RUNNER_TEMP/v0221-baseline/frontend/node_modules"

      '
    shell: bash
  - name: Install isolated browser remotely
    run: 'npm install --prefix "$RUNNER_TEMP/v0221-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/v0221-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Render actual baseline and candidate components with real CSS
    env:
      BASELINE_ROOT: ${{ runner.temp }}/v0221-baseline/frontend
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/v0221-browser/node_modules/playwright
      SCREENSHOT_DIR: ${{ runner.temp }}/v0221-ui
    run: 'set -euo pipefail

      mkdir -p "$SCREENSHOT_DIR"

      node scripts/upstream-v0221-screenshot.mjs 2>&1 | tee "$SCREENSHOT_DIR/render.log"

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-upstream-v0221-ui-rendered-v0221-ui-${{ github.event_name }}-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/v0221-ui
      if-no-files-found: error
