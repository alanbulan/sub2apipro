name: sync-20261116-model-billing-groups-scope-ui
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Exercise real configuration page, API pagination and locale keys
    env:
      NODE_OPTIONS: --max-old-space-size=1024
    run: pnpm --dir frontend exec vitest run src/views/admin/__tests__/AutoConfigView.spec.ts src/utils/__tests__/modelBilling.spec.ts
      src/i18n/__tests__/localeKeyCompleteness.spec.ts src/components/admin/operations/__tests__/AutoConfigHistory.spec.ts
      --maxWorkers=1 --minWorkers=1
    shell: bash
  - name: Install isolated browser for offline real-page checks
    run: 'npm install --prefix "$RUNNER_TEMP/model-billing-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/model-billing-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Fetch immutable baseline for before screenshot
    run: git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git 973d4bbd0064121a5533e0d3232ece6043f0d5fc
    shell: bash
  - name: Exercise real page with synthetic local HTTP and capture desktop/mobile
    env:
      NODE_OPTIONS: --max-old-space-size=1024
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/model-billing-browser/node_modules/playwright
      MODEL_BILLING_SCREENSHOT_DIR: ${{ runner.temp }}/model-billing-screenshots
    run: node scripts/model-billing-groups-browser.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-model-billing-groups-scope-ui-model-billing-groups-ui-${{ github.event.pull_request.head.sha ||
        github.sha }}
      path: ${{ runner.temp }}/model-billing-screenshots
      if-no-files-found: error
