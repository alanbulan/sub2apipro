name: sync-20261116-oauth-degradation-actions-unit
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/checkout@v6
    with:
      ref: 1411d0fc6e1fca51d4b657c21837cd74c87bf84e
      path: baseline
  - uses: actions/checkout@v6
    with:
      ref: fb75b87cebe8314d9eba171948367451511f9417
      path: historical-fixtures
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: candidate/backend/go.sum
      go-version: 1.27.4
  - name: Baseline behavioral RED
    shell: bash
    run: 'set -euo pipefail

      mkdir -p evidence

      git -C baseline rev-parse HEAD > evidence/red-head.txt

      git -C historical-fixtures rev-parse HEAD > evidence/historical-fixtures-head.txt

      cp historical-fixtures/backend/internal/service/oauth_degradation_actions_test.go historical-fixtures/backend/internal/service/oauth_degradation_scope_test.go
      baseline/backend/internal/service/

      python3 "$GITHUB_WORKSPACE/candidate/scripts/prepare-sync-ci.py" baseline/backend

      set +e

      (cd baseline/backend && go test -tags=unit ./internal/service -run ''^TestOAuthDegradation'' -count=1 -v) > evidence/red.log
      2>&1

      result=$?

      set -e

      cat evidence/red.log

      test "$result" -ne 0

      ! grep -Eq ''build failed|setup failed|undefined:|syntax error:|no tests to run|panic:'' evidence/red.log

      grep -F ''degradation hold must prevent'' evidence/red.log

      grep -F ''enabling degradation action requires'' evidence/red.log

      '
  - name: Exact candidate GREEN
    shell: bash
    run: 'set -euo pipefail

      git -C candidate rev-parse HEAD | tee evidence/green-head.txt

      python3 "$GITHUB_WORKSPACE/candidate/scripts/prepare-sync-ci.py" candidate/backend

      (cd candidate/backend && go test -race -tags=unit ./internal/service ./internal/handler/admin -run ''TestOAuthAutoConfig|TestOAuthInitial|TestOAuthModelMapping|TestModelBilling|TestOAuthDegradation|TestAutoConfig|TestAdvanceConcurrency|TestOpenAITwoFAAdmission|TestQualityModel|TestAccountIsModelSupported|TestGPT55Retirement''
      -count=1 -v) 2>&1 | tee evidence/green.log

      python3 "$GITHUB_WORKSPACE/candidate/scripts/prepare-sync-ci.py" candidate/backend

      (cd candidate/backend && go test -race -tags=unit ./internal/repository -count=1 -v) 2>&1 | tee evidence/repository-unit.log

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-oauth-degradation-actions-unit-oauth-degradation-unit-${{ github.event_name }}-${{ github.run_id
        }}
      path: evidence/
