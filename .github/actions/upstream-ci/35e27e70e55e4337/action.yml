name: sync-20261116-mature-review-repairs-f2
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_phase:
    description: Upstream matrix parameter phase.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      cache: false
      go-version: 1.27.4
  - uses: actions/cache/restore@v6
    with:
      path: '~/.cache/go-build

        ~/go/pkg/mod

        '
      key: mature-repair-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
      restore-keys: 'mature-go-${{ runner.os }}-${{ hashFiles(''backend/go.sum'') }}-candidate-

        mature-go-${{ runner.os }}-${{ hashFiles(''backend/go.sum'') }}-

        '
  - name: Bind F2 tests and pre-fix production blobs
    env:
      PHASE: ${{ inputs.sync_matrix_phase }}
    run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/repair-f2\"\ntest \"$(git rev-parse HEAD)\" = '${{ github.sha }}'\ntest\
      \ -z \"$(git status --porcelain)\"\ngit rev-parse HEAD HEAD^{tree} > \"$RUNNER_TEMP/repair-f2/candidate.txt\"\nsha256sum\
      \ backend/internal/service/repair_f2_coupon_recovery_test.go > \"$RUNNER_TEMP/repair-f2/test-sha256.txt\"\nbaseline=b98e6acb2dc772651b6a597d40cce311f96a2ba5\n\
      git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git \"$baseline\"\nfor name in payment_fulfillment.go\
      \ payment_coupons.go payment_easypay_recovery.go payment_order_lifecycle.go; do\n  path=\"backend/internal/service/$name\"\
      \n  if [ \"$PHASE\" = red ]; then\n    git show \"$baseline:$path\" > \"$path\"\n    test \"$(git hash-object \"$path\"\
      )\" = \"$(git rev-parse \"$baseline:$path\")\"\n  fi\n  git hash-object \"$path\" >> \"$RUNNER_TEMP/repair-f2/production-blobs.txt\"\
      \ndone\nif [ \"$PHASE\" = red ]; then\n  target=backend/internal/handler/admin/payment_handler.go\n  git show \"$baseline:$target\"\
      \ > \"$target\"\n  test \"$(git hash-object \"$target\")\" = \"$(git rev-parse \"$baseline:$target\")\"\n  git hash-object\
      \ \"$target\" >> \"$RUNNER_TEMP/repair-f2/production-blobs.txt\"\nfi\n"
    shell: bash
  - name: PostgreSQL payment recovery oracle
    env:
      PHASE: ${{ inputs.sync_matrix_phase }}
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\nset +e\n(cd backend && go test\
      \ -tags=unit ./internal/service -run '^TestRepairF2' -count=1 -json -timeout=5m) > \"$RUNNER_TEMP/repair-f2/test.jsonl\"\
      \ 2>&1\nresult=$?\nset -e\nprintf '%s\\n' \"$result\" > \"$RUNNER_TEMP/repair-f2/exit-code.txt\"\ncat \"$RUNNER_TEMP/repair-f2/test.jsonl\"\
      \npython3 - <<'PYORACLE'\nimport json, os\nfrom pathlib import Path\np = Path(os.environ['RUNNER_TEMP']) / 'repair-f2'\n\
      raw = (p / 'test.jsonl').read_text()\nevents = [json.loads(line) for line in raw.splitlines() if line.startswith('{')]\n\
      outcomes = {e['Test']: e['Action'] for e in events if e.get('Test') and e['Action'] in ('pass', 'fail', 'skip')}\nrejected\
      \ = ['TestRepairF2BackgroundPaymentCannotReverseCancellation/' + actor + '/coupon_true' for actor in ('user', 'admin')]\n\
      controls = ['TestRepairF2BackgroundPaymentCannotReverseCancellation/' + actor + '/coupon_false' for actor in ('user',\
      \ 'admin')]\nfor provider in ('alipay', 'bepusdt', 'easypay'):\n    root = 'TestRepairF2ProviderRecoveryWindowsApplyToCoupons/'\
      \ + provider\n    rejected.append(root + '/outside_true/coupon_true')\n    controls.append(root + '/outside_true/coupon_false')\n\
      \    controls.extend(root + '/outside_false/coupon_' + value for value in ('false', 'true'))\nassert not any(e['Action']\
      \ == 'skip' for e in events), 'No skipped database evidence'\nassert all(s not in raw.lower() for s in ('build failed',\
      \ 'no tests to run', 'undefined:', 'panic:')), 'Invalid RED fixture/build'\nassert all(outcomes.get(case) == 'pass'\
      \ for case in controls), outcomes\nif os.environ['PHASE'] == 'red':\n    assert int((p / 'exit-code.txt').read_text())\
      \ != 0\n    assert all(outcomes.get(case) == 'fail' for case in rejected), outcomes\n    assert raw.count('F2 background\
      \ paid response must not reverse committed cancellation') >= 2\n    assert raw.count('F2 coupon must preserve the canonical\
      \ provider recovery deadline') >= 3\nelse:\n    assert int((p / 'exit-code.txt').read_text()) == 0\n    assert all(outcomes.get(case)\
      \ == 'pass' for case in rejected), outcomes\nPYORACLE\n"
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-review-repairs-f2-repair-f2-${{ inputs.sync_matrix_phase }}-${{ github.sha }}
      path: ${{ runner.temp }}/repair-f2/
