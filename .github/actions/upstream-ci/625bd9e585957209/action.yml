name: sync-20261116-dashboard-account-concurrency-frontend
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Dashboard and feature notice regressions
    run: pnpm --dir frontend exec vitest run src/views/admin/__tests__/DashboardView.spec.ts src/components/common/__tests__/NewFeatureBadge.spec.ts
    shell: bash
  - name: Build and typecheck frontend
    run: pnpm --dir frontend run build
    shell: bash
