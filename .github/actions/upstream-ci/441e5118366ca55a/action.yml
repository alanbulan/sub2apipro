name: sync-20261116-pelican-random-questions-isolated-e2e
description: Current upstream checks, retaining matrix parameters and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/checkout@v6
    with:
      ref: ${{ env.APP_SHA }}
      path: app
      persist-credentials: false
  - name: Record the two immutable checkout identities
    shell: bash
    run: "set -euo pipefail\nexport EVIDENCE_DIR=\"$RUNNER_TEMP/pelican-isolated-evidence\"\nprintf 'EVIDENCE_DIR=%s\\n' \"\
      $EVIDENCE_DIR\" >> \"$GITHUB_ENV\"\nprintf 'FIXTURE_UID=%s\\nFIXTURE_GID=%s\\n' \"$(id -u)\" \"$(id -g)\" >> \"$GITHUB_ENV\"\
      \nmkdir -p \"$EVIDENCE_DIR\"\ntest \"$(git -C app rev-parse HEAD)\" = \"$APP_SHA\"\ntest \"$(git -C harness rev-parse\
      \ HEAD)\" = \"$HARNESS_SHA\"\n{\n  printf 'APP_SHA=%s\\nAPP_TREE=%s\\n' \"$APP_SHA\" \"$(git -C app rev-parse 'HEAD^{tree}')\"\
      \n  printf 'HARNESS_SHA=%s\\nHARNESS_TREE=%s\\n' \"$HARNESS_SHA\" \"$(git -C harness rev-parse 'HEAD^{tree}')\"\n  printf\
      \ 'PARENT_BASE_SHA=%s\\nRUN_ID=%s\\nRUN_ATTEMPT=%s\\n' \"$PARENT_BASE_SHA\" \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\"\
      \n} > \"$EVIDENCE_DIR/identity.txt\"\ncp harness/.github/fixtures/pelican-question-e2e/acceptance.json \"$EVIDENCE_DIR/acceptance.json\"\
      \n"
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
  - name: Synthetic detail identity gate (does not replace real E2E)
    shell: bash
    run: "set -euo pipefail\nnode --test harness/.github/fixtures/pelican-question-e2e/detail-identity.test.mjs harness/.github/fixtures/pelican-question-e2e/nominal-round.test.mjs\
      \ harness/.github/fixtures/pelican-question-e2e/navigation.test.mjs \\\n  | tee \"$EVIDENCE_DIR/detail-identity-synthetic.tap\"\
      \n"
  - name: Build and prefetch before runtime isolation (CI only)
    shell: bash
    run: "set -euo pipefail\nfixture_context=\"$RUNNER_TEMP/pelican-harness-context\"\nmkdir -p \"$fixture_context/scripts\"\
      \ncp harness/scripts/pelican-*.mjs \"$fixture_context/scripts/\"\ndocker build --build-arg COMMIT=\"$APP_SHA\" --tag\
      \ \"pelican-app-base:$APP_SHA\" app\ndocker build --target runner --tag \"pelican-runner:$HARNESS_SHA\" \\\n  --file\
      \ harness/.github/fixtures/pelican-question-e2e/Dockerfile \"$fixture_context\"\ndocker build --target app --build-arg\
      \ \"APP_IMAGE=pelican-app-base:$APP_SHA\" \\\n  --tag \"pelican-app:$APP_SHA\" \\\n  --file harness/.github/fixtures/pelican-question-e2e/Dockerfile\
      \ \"$fixture_context\"\ndocker pull postgres:18-alpine\ndocker pull redis:7-alpine\n"
  - name: Start only the internal runtime network and real migrated application
    working-directory: harness/.github/fixtures/pelican-question-e2e
    shell: bash
    run: "set -euo pipefail\ndocker compose up --detach --no-build --pull never --wait --wait-timeout 180 postgres redis fake-upstream\
      \ app\ndocker compose exec -T postgres psql --username fixture --dbname fixture --set ON_ERROR_STOP=1 < seed.sql\n#\
      \ Start the browser as a service (not `compose run` with a second network).\ndocker compose up --detach --no-build --pull\
      \ never browser\ndocker network inspect \"${COMPOSE_PROJECT_NAME}_isolated\" \\\n  --format '{{json .Internal}}' > \"\
      $EVIDENCE_DIR/network-internal.json\"\ntest \"$(cat \"$EVIDENCE_DIR/network-internal.json\")\" = true\nfor service in\
      \ postgres redis fake-upstream app browser; do\n  container_id=\"$(docker compose ps --all --quiet \"$service\")\"\n\
      \  test -n \"$container_id\"\n  docker inspect \"$container_id\" --format \\\n    '{\"service\":{{json (index .Config.Labels\
      \ \"com.docker.compose.service\")}},\"networks\":{{json .NetworkSettings.Networks}},\"ports\":{{json .HostConfig.PortBindings}},\"\
      networkMode\":{{json .HostConfig.NetworkMode}},\"privileged\":{{json .HostConfig.Privileged}},\"user\":{{json .Config.User}},\"\
      mounts\":{{json .Mounts}}}' \\\n    > \"$EVIDENCE_DIR/network-$service.json\"\ndone\nnode ../../../scripts/pelican-question-e2e.mjs\
      \ topology\n"
  - name: Wait for the browser's implemented scenarios
    working-directory: harness/.github/fixtures/pelican-question-e2e
    shell: bash
    run: 'set -euo pipefail

      container_id="$(docker compose ps --all --quiet browser)"

      result="$(timeout 1080s docker wait "$container_id")"

      # Harness logs contain only scenario names/status, never response bodies or tokens.

      docker compose logs --no-color browser

      test "$result" = 0

      '
  - name: Explicit acceptance boundary
    if: always()
    shell: bash
    run: "{\n  echo '### Isolated E2E manual, account and group schedules — full acceptance pending'\n  echo 'Implemented:\
      \ manual scenarios, disabled group-plan creation, UI-created A/B account schedules,'\n  echo 'same nominal time, real\
      \ Claim leases, four PG results and provider/history/detail/DOM reconciliation.'\n  echo 'Also implemented: UI-enabled\
      \ group plan, actual RunDue/Claim, two results and PG/provider/list/detail/DOM reconciliation.'\n  echo 'Group routing\
      \ is checked against the actual chosen accounts, without assuming equal distribution.'\n  echo 'Successor gates: same-plan\
      \ T2 with a different question and coexisting histories;'\n  echo 'UI edits persisted and reloaded while old PG/API/DOM\
      \ snapshots stay unchanged;'\n  echo 'deterministic provider refusal, failed history, released leases and subsequent\
      \ valid RunDue.'\n  echo 'Read this candidate artifact and checks; earlier SHA results do not validate new scenarios.'\n\
      \  echo 'A green job does not clear all Issue #795 technical or product acceptance gates.'\n} >> \"$GITHUB_STEP_SUMMARY\"\
      \n"
  - name: Destroy all disposable runtime containers and volumes
    if: always()
    working-directory: harness/.github/fixtures/pelican-question-e2e
    run: docker compose down --volumes --remove-orphans --timeout 10
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-pelican-random-questions-isolated-e2e-pelican-isolated-e2e-${{ github.run_id }}-${{ github.run_attempt
        }}
      path: ${{ env.EVIDENCE_DIR }}/
      retention-days: 7
