name: sync-20261116-pr838-compat-count-counter
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Original PR head must fail the retained compatibility regression
    shell: bash
    run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/pr838-counter\"\ngit rev-parse HEAD > \"$RUNNER_TEMP/pr838-counter/head.txt\"\
      \nbaseline=d2b2b246fc0235740e87c742b24be5a5c9e055e0\ntargets=(backend/internal/service/openai_gateway_cc_pipeline.go\
      \ backend/internal/service/openai_gateway_upstream_errors.go)\ntrap 'git restore --source=HEAD -- \"${targets[@]}\"\
      ' EXIT\nfor target in \"${targets[@]}\"; do\n  git show \"$baseline:$target\" > \"$target\"\n  test \"$(git hash-object\
      \ \"$target\")\" = \"$(git rev-parse \"$baseline:$target\")\"\ndone\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ backend\nset +e\n(cd backend && go test -tags=unit ./internal/service -run '^TestCompatErrorPipelineCountsEachResponseOnce$'\
      \ -count=1 -v -timeout=3m) > \"$RUNNER_TEMP/pr838-counter/red.log\" 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/pr838-counter/red.log\"\
      \ntest \"$result\" -eq 1\n! grep -Eiq 'build failed|undefined:|no tests to run|panic:|--- SKIP:' \"$RUNNER_TEMP/pr838-counter/red.log\"\
      \ngrep -q 'same upstream response must be counted once across compatibility handlers' \"$RUNNER_TEMP/pr838-counter/red.log\"\
      \ngit restore --source=HEAD -- \"${targets[@]}\"\ntrap - EXIT\ngit diff --exit-code\n"
  - name: Fixed compatibility pipeline and existing authentication controls
    shell: bash
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -race -tags=unit ./internal/service -run ''^Test(CompatErrorPipeline|FastPathThenGeneralHandler|PendingModel401|Credential401|OpenAIWSAfterOutput)''
      -count=1 -v -timeout=5m) 2>&1 | tee "$RUNNER_TEMP/pr838-counter/green.log"

      grep -q -- ''--- PASS: TestCompatErrorPipelineCountsEachResponseOnce'' "$RUNNER_TEMP/pr838-counter/green.log"

      ! grep -Eiq ''build failed|undefined:|no tests to run|panic:|--- SKIP:|DATA RACE'' "$RUNNER_TEMP/pr838-counter/green.log"

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-pr838-compat-count-counter-pr838-compat-counter-${{ github.sha }}
      path: ${{ runner.temp }}/pr838-counter/
