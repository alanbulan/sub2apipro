name: sync-20261116-issue765-image-scheduler-ws-first-frame-regression
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Repeat real handler peer close, cancellation and configured timeout
    shell: bash
    run: "set -euo pipefail\nexport ISSUE765_WS_EVIDENCE=\"$RUNNER_TEMP/issue765-ws-first-frame\"\nprintf 'ISSUE765_WS_EVIDENCE=%s\\\
      n' \"$ISSUE765_WS_EVIDENCE\" >> \"$GITHUB_ENV\"\nmkdir -p \"$ISSUE765_WS_EVIDENCE\"\ntest \"$(git rev-parse HEAD)\"\
      \ = \"$EXPECTED_HEAD\"\ntest -z \"$(git status --porcelain)\"\ngit rev-parse HEAD | tee \"$ISSUE765_WS_EVIDENCE/head.txt\"\
      \ngo version | tee \"$ISSUE765_WS_EVIDENCE/toolchain.txt\"\ngrep -F 'go1.27.4' \"$ISSUE765_WS_EVIDENCE/toolchain.txt\"\
      \ntest -z \"$(gofmt -l backend/internal/handler/openai_gateway_handler_test.go)\"\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ backend\n(cd backend && go test -race -shuffle=on -json -tags=unit ./internal/handler -run '^TestOpenAIResponsesWebSocket_(DisconnectBeforeFirstMessageIsInfo|RequestCanceledBeforeFirstMessageIsInfo|FirstMessageTimeoutUsesConfig)$'\
      \ -count=20 -timeout=5m) > \"$ISSUE765_WS_EVIDENCE/ws-first-frame.jsonl\" 2> \"$ISSUE765_WS_EVIDENCE/ws-first-frame.stderr\"\
      \npython3 - <<'PY'\nimport json\nimport os\nfrom collections import Counter\nfrom pathlib import Path\nevidence = Path(os.environ['ISSUE765_WS_EVIDENCE'])\n\
      events = [json.loads(line) for line in (evidence / 'ws-first-frame.jsonl').read_text().splitlines()]\npeer = 'TestOpenAIResponsesWebSocket_DisconnectBeforeFirstMessageIsInfo'\n\
      expected = {\n    peer,\n    peer + '/StatusNormalClosure',\n    peer + '/StatusGoingAway',\n    'TestOpenAIResponsesWebSocket_RequestCanceledBeforeFirstMessageIsInfo',\n\
      \    'TestOpenAIResponsesWebSocket_FirstMessageTimeoutUsesConfig',\n}\npassed = Counter(e['Test'] for e in events if\
      \ e.get('Action') == 'pass' and 'Test' in e)\nassert passed == Counter({name: 20 for name in expected}), passed\nassert\
      \ not any(e.get('Action') in {'skip', 'fail'} for e in events), 'unexpected skip/failure'\nfor name in sorted(expected):\n\
      \    print(f'{name}: {passed[name]} passes')\nPY\ntest -z \"$(git status --porcelain)\"\n"
  - uses: actions/upload-artifact@v6
    if: always()
    with:
      name: sync-20261116-issue765-image-scheduler-ws-first-frame-regression-issue765-ws-first-frame-${{ github.event_name
        }}-${{ github.event.pull_request.head.sha || github.sha }}
      path: ${{ env.ISSUE765_WS_EVIDENCE }}/
