name: sync-20261116-openai-legacy-admission-admission
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_mode:
    description: Upstream matrix parameter mode.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Verify exact candidate and record regression blobs
    shell: bash
    run: "set -euo pipefail\nLOG_DIR=\"$RUNNER_TEMP/pr756-legacy-admission-logs\"\nprintf 'LOG_DIR=%s\\n' \"$LOG_DIR\" >>\
      \ \"$GITHUB_ENV\"\nmkdir -p \"$LOG_DIR\"\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED\"\ntest -z \"$(git status --porcelain)\"\
      \n{\n  git rev-parse HEAD\n  go version\n  git rev-parse HEAD:backend/internal/service/openai_legacy_admission_rebind_test.go\n\
      \  git rev-parse HEAD:backend/internal/repository/gateway_cache_legacy_admission_test.go\n} | tee \"$LOG_DIR/candidate.txt\"\
      \n"
  - name: RED must fail only at final admitted binding assertions
    if: inputs.sync_matrix_mode == 'RED'
    shell: bash
    run: "set -euo pipefail\nbaseline=b10b3856bee445820a7748764b9641f8229d3dbe\nred=\"$RUNNER_TEMP/pr756-legacy-admission-red\"\
      \ngit worktree add --detach \"$red\" \"$EXPECTED\"\ntrap 'git worktree remove --force \"$red\"' EXIT\n# Keep the exact\
      \ candidate tests and all other production files. Only\n# these two cooperating implementation paths are restored for\
      \ RED.\nfor target in \\\n  backend/internal/service/openai_account_scheduler.go \\\n  backend/internal/service/openai_gateway_scheduling.go;\
      \ do\n  git show \"$baseline:$target\" > \"$red/$target\"\n  restored=$(git -C \"$red\" hash-object \"$target\")\n \
      \ test \"$restored\" = \"$(git rev-parse \"$baseline:$target\")\"\n  echo \"$target baseline=$baseline blob=$restored\"\
      \ >> \"$LOG_DIR/red-source.txt\"\ndone\nfor target in \\\n  backend/internal/service/openai_legacy_admission_rebind_test.go\
      \ \\\n  backend/internal/repository/gateway_cache_legacy_admission_test.go; do\n  test \"$(git -C \"$red\" hash-object\
      \ \"$target\")\" = \"$(git rev-parse \"HEAD:$target\")\"\ndone\nexpected_paths=$(printf '%s\\n' \\\n  backend/internal/service/openai_account_scheduler.go\
      \ \\\n  backend/internal/service/openai_gateway_scheduling.go)\ntest \"$(git -C \"$red\" diff --name-only)\" = \"$expected_paths\"\
      \ntest -z \"$(git -C \"$red\" ls-files --others --exclude-standard)\"\ngit -C \"$red\" diff > \"$LOG_DIR/red-source.diff\"\
      \npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" \"$red/backend\"\nset +e\n(cd \"$red/backend\" && go test\
      \ -tags=unit ./internal/service ./internal/repository \\\n  -run '^(TestOpenAILegacyAdmissionRebind|TestStickySessionLegacyAdmissionRedis)$'\
      \ \\\n  -count=1 -v -timeout=5m) > \"$LOG_DIR/red.log\" 2>&1\nresult=$?\nset -e\ncat \"$LOG_DIR/red.log\"\ntest \"$result\"\
      \ -ne 0\n! grep -Eqi 'build failed|setup failed|undefined:|syntax error|no tests to run|panic:|fatal error:|--- SKIP:|LEGACY_ADMISSION_FIXTURE'\
      \ \"$LOG_DIR/red.log\"\ngrep -q -- '--- FAIL: TestOpenAILegacyAdmissionRebind ' \"$LOG_DIR/red.log\"\ngrep -q -- '---\
      \ FAIL: TestStickySessionLegacyAdmissionRedis ' \"$LOG_DIR/red.log\"\ntest \"$(grep -c 'LEGACY_ADMISSION_REBIND: final\
      \ admitted C must own sticky session' \"$LOG_DIR/red.log\")\" -eq 6\ntest \"$(grep -c 'LEGACY_ADMISSION_REDIS: final\
      \ admitted C must own sticky session' \"$LOG_DIR/red.log\")\" -eq 6\n# Verify every intended subcase failed, rather\
      \ than accepting an\n# unrelated package failure that happened to print a marker.\nfor mode in priority_lru load_batch;\
      \ do\n  for scenario in new_session rpm_spillover; do\n    grep -q -- \"--- FAIL: TestOpenAILegacyAdmissionRebind/$mode/$scenario\
      \ \" \"$LOG_DIR/red.log\"\n  done\n  for scenario in new_session excluded_A; do\n    grep -q -- \"--- FAIL: TestStickySessionLegacyAdmissionRedis/$mode/$scenario\
      \ \" \"$LOG_DIR/red.log\"\n  done\ndone\ngrep -q -- '--- FAIL: TestOpenAILegacyAdmissionRebind/load_batch/capacity_spillover\
      \ ' \"$LOG_DIR/red.log\"\ngrep -q -- '--- FAIL: TestStickySessionLegacyAdmissionRedis/load_batch/capacity_spillover\
      \ ' \"$LOG_DIR/red.log\"\ngrep -q -- '--- FAIL: TestOpenAILegacyAdmissionRebind/load_batch/load_read_failure ' \"$LOG_DIR/red.log\"\
      \ngrep -q -- '--- FAIL: TestStickySessionLegacyAdmissionRedis/load_batch/load_read_failure ' \"$LOG_DIR/red.log\"\n\
      test \"$(git -C \"$red\" diff --name-only)\" = \"$expected_paths\"\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED\"\n\
      test -z \"$(git status --porcelain)\"\n"
  - name: GREEN compile production packages from clean candidate
    if: inputs.sync_matrix_mode == 'GREEN'
    shell: bash
    run: 'set -euo pipefail

      test "$(git rev-parse HEAD)" = "$EXPECTED"

      test -z "$(git status --porcelain)"

      (cd backend && go build ./internal/service ./internal/repository) 2>&1 | tee "$LOG_DIR/production-build.log"

      '
  - name: GREEN race regressions and ownership boundaries
    if: inputs.sync_matrix_mode == 'GREEN'
    shell: bash
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\n(cd backend && go test -race\
      \ -tags=unit ./internal/service ./internal/repository \\\n  -run '^(TestOpenAILegacyAdmissionRebind|TestStickySessionLegacyAdmissionRedis(LateWaiter)?|TestOpenAIStickyEscapeLateWaitPlanCannotRestoreOriginalBinding|TestStickySessionRebind.*|TestOpenAILegacyStickySpilloverRebindKeepsReplacement|TestOpenAIStickyEscapeDoesNotMoveProviderContinuationOwner|TestOpenAIStickyEscapePreservesExplicitOwnerBinding|TestOpenAIProfitControlStickyBindingOccursOnlyAfterTerminalAdmission|TestOpenAIProfitControlAfterAdmissionBindEagerWithoutGate|TestLegacySchedulerDecision_.*|TestOpenAIGatewayService_GuardianParent.*|TestIssue715Recovery(RetainsNativeOwnerAgainstBPSPreference|CannotBypassRPM))$'\
      \ \\\n  -count=1 -v -timeout=8m) 2>&1 | tee \"$LOG_DIR/green-race.log\"\n! grep -Eqi 'no tests to run|--- SKIP:' \"\
      $LOG_DIR/green-race.log\"\nfor name in \\\n  TestOpenAILegacyAdmissionRebind \\\n  TestStickySessionLegacyAdmissionRedis\
      \ \\\n  TestStickySessionLegacyAdmissionRedisLateWaiter \\\n  TestOpenAIStickyEscapeLateWaitPlanCannotRestoreOriginalBinding\
      \ \\\n  TestStickySessionRebindCompetingInstancesAgreeOnOneReplacement \\\n  TestOpenAIStickyEscapeDoesNotMoveProviderContinuationOwner\
      \ \\\n  TestOpenAIGatewayService_GuardianParentHashCollisionPreservesParentBinding \\\n  TestIssue715RecoveryRetainsNativeOwnerAgainstBPSPreference\
      \ \\\n  TestOpenAIProfitControlStickyBindingOccursOnlyAfterTerminalAdmission; do\n  grep -q -- \"--- PASS: $name \"\
      \ \"$LOG_DIR/green-race.log\"\ndone\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED\"\ntest -z \"$(git status --porcelain)\"\
      \n"
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-openai-legacy-admission-admission-pr756-legacy-admission-${{ inputs.sync_matrix_mode }}-${{ github.event_name
        }}-${{ github.event.pull_request.head.sha || github.sha }}
      path: ${{ runner.temp }}/pr756-legacy-admission-logs
      if-no-files-found: error
