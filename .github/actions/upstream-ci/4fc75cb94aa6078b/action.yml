name: sync-20261116-oauth-apikey-disposition-disposition
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: OAuth creation and PostgreSQL timer regressions
    working-directory: backend
    env:
      ACCOUNT_TIMER_TEST_DSN: postgres://timer_fixture:timer_fixture@127.0.0.1:5432/schedulable_timer_fixture?sslmode=disable
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=unit ./internal/service -run ''^(TestOAuth(APIKeyDisposition|AutoConfig)|TestAccountReadableSnapshot_DenylistTripwire)''
      -count=1

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=integration ./internal/accounttimer -count=1 -v

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=integration ./internal/repository -run ''^TestOAuth(APIKeyDisposition|InitialQuality)'' -count=1 -v

      '
    shell: bash
