name: sync-20261116-ws-unsent-delta-repair877
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_phase:
    description: Upstream matrix parameter phase.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Exact reviewed PR877 implementation for repair RED
    if: matrix.phase == 'RED'
    shell: bash
    run: 'set -euo pipefail

      # Keep all current tests. Replace only the implementation containing

      # the two reviewed faults; the original takeover RED stays separate.

      baseline=4b13c785786ff1d623bc23203991dac405494567

      target=backend/internal/service/openai_ws_agent_recovery.go

      git show "$baseline:$target" > "$target"

      test "$(git hash-object "$target")" = "$(git rev-parse "$baseline:$target")"

      '
  - name: Named instruction and continuation-anchor repair evidence
    env:
      PHASE: ${{ inputs.sync_matrix_phase }}
    shell: bash
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\nset +e\n(cd backend && go test\
      \ -race -json -tags=unit,unsentdelta ./internal/service -run '^TestOpenAIWSUnsentDelta(Instructions|ContinuationAnchor|DeliveryScope)$'\
      \ -count=1 -timeout=3m) > \"$RUNNER_TEMP/unsent-delta-repair877.jsonl\" 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/unsent-delta-repair877.jsonl\"\
      \npython3 scripts/assert-readable-continuation.py --clean-log \"$RUNNER_TEMP/unsent-delta-repair877.jsonl\"\npython3\
      \ - \"$PHASE\" \"$result\" \"$RUNNER_TEMP/unsent-delta-repair877.jsonl\" <<'PY'\nimport json,sys\nfrom collections import\
      \ Counter\nphase,status,path=sys.argv[1],int(sys.argv[2]),sys.argv[3]\nrows=[]\nfor line in open(path):\n    try: rows.append(json.loads(line))\n\
      \    except ValueError: pass\npackage='github.com/Wei-Shaw/sub2api/internal/service'\ninstructions='TestOpenAIWSUnsentDeltaInstructions'\n\
      anchor='TestOpenAIWSUnsentDeltaContinuationAnchor'\ndelivery='TestOpenAIWSUnsentDeltaDeliveryScope'\nroots={instructions,anchor,delivery}\n\
      leaves={instructions+'/'+s for s in ('omitted_after_omitted_turn','omitted_after_explicit_turn','current_null','current_explicit','current_empty')}\n\
      leaves.update(anchor+'/'+s for s in ('missing_anchor_independent_task','empty_anchor_independent_task','null_anchor_independent_task','valid_anchor_independent_task','valid_anchor_empty_previous','valid_anchor_null_previous','valid_anchor_blank_previous','valid_anchor_wrong_previous','completed_matching_anchor'))\n\
      leaves.update(delivery+'/'+s for s in ('valid','pending','failed_write','terminal_excludes','unknown_call','changed_call','wrong_pointer','wrong_key','wrong_model','sent_error','oversize'))\n\
      markers={instructions+'/'+s:'STALE_INSTRUCTIONS_RESTORED' for s in ('omitted_after_omitted_turn','omitted_after_explicit_turn')}\n\
      markers.update({anchor+'/'+s:'INDEPENDENT_TASK_ATTACHED' for s in ('missing_anchor_independent_task','empty_anchor_independent_task','null_anchor_independent_task')})\n\
      assert phase in ('RED','GREEN'),phase\nfailures=set(markers)|{instructions,anchor,None} if phase=='RED' else set()\n\
      counts=Counter((r.get('Action'),r.get('Test')) for r in rows if r.get('Package')==package)\nassert status==(1 if phase=='RED'\
      \ else 0),status\nassert all(r.get('Package')==package for r in rows),rows\nassert {r.get('Test') for r in rows if r.get('Action')=='run'}==leaves|roots,rows\n\
      assert {r.get('Test') for r in rows if r.get('Action')=='fail'}==failures,rows\nassert not any(r.get('Action')=='skip'\
      \ for r in rows),rows\nfor name in leaves|roots|{None}:\n    assert name is None or counts['run',name]==1,(name,counts)\n\
      \    expected='fail' if name in failures else 'pass'\n    assert counts[expected,name]==1 and counts['pass',name]+counts['fail',name]==1,(name,counts)\n\
      if phase=='RED':\n    for name,marker in markers.items():\n        output=''.join(r.get('Output','') for r in rows if\
      \ r.get('Test')==name)\n        assert marker in output,(name,output)\nPY\n"
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-ws-unsent-delta-repair877-unsent-delta-repair877-${{ inputs.sync_matrix_phase }}-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/unsent-delta-repair877.jsonl
      if-no-files-found: error
