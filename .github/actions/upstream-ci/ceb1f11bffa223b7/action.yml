name: sync-20261116-vip-auto-credit-postgres-repository
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Exact same regressions GREEN, real PostgreSQL ledger, admission, mail, concurrency and upgrades
    working-directory: backend
    shell: bash
    run: 'set -euo pipefail

      mkdir -p "$RUNNER_TEMP/vip-credit-logs"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -p 1 -tags=vipcreditintegration ./internal/repository -run ''^TestVipCredit'' -count=1 -v -timeout=10m
      | tee "$RUNNER_TEMP/vip-credit-logs/green.log"

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-vip-auto-credit-postgres-repository-vip-credit-logs-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: ${{ runner.temp }}/vip-credit-logs
      if-no-files-found: error
