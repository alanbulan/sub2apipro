name: sync-20261116-issue811-acl-followup-acl-concurrency
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Assert exact candidate and prepare evidence assertions
    shell: bash
    run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_HEAD\"\nmkdir -p \"$RUNNER_TEMP/issue811\"\ngit\
      \ rev-parse HEAD HEAD^{tree} > \"$RUNNER_TEMP/issue811/candidate.txt\"\ngit diff --exit-code\ncat > \"$RUNNER_TEMP/issue811/assert-tests.py\"\
      \ <<'PY'\nimport json, pathlib, sys\npath, action, *required = sys.argv[1:]\nrows = [json.loads(line) for line in pathlib.Path(path).read_text().splitlines()\
      \ if line.startswith('{')]\nseen = {row.get('Test') for row in rows if row.get('Action') == action}\nskipped = [row.get('Test')\
      \ for row in rows if row.get('Action') == 'skip']\noutput = ''.join(row.get('Output', '') for row in rows)\nforbidden\
      \ = ('[build failed]', 'build failed', 'undefined:', 'no tests to run', 'DATA RACE')\nmissing = set(required) - seen\n\
      if skipped or missing or any(value in output for value in forbidden):\n    raise SystemExit(f'incomplete {action} evidence:\
      \ skipped={skipped}, missing={sorted(missing)}')\nif action == 'pass' and any(row.get('Action') == 'fail' for row in\
      \ rows):\n    raise SystemExit('GREEN contains a failure')\nprint(f'{action}: all {len(required)} required tests observed;\
      \ no skips/build failures/data races')\nPY\n"
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Provision repository PostgreSQL and Redis before the race process
    shell: bash
    run: |
      set -euo pipefail
      test "${GITHUB_ACTIONS:-}" = true
      docker run -d --name issue811-repository-postgres \
        -e POSTGRES_USER=fixture -e POSTGRES_PASSWORD=fixture \
        -e POSTGRES_DB=issue811_repository \
        -p 127.0.0.1:15432:5432 postgres:18.1-alpine3.23
      docker run -d --name issue811-repository-redis \
        -p 127.0.0.1:16379:6379 redis:8.4-alpine
      ready=false
      for attempt in $(seq 1 60); do
        if docker exec -e PGPASSWORD=fixture issue811-repository-postgres \
          psql -h 127.0.0.1 -X -qAt -v ON_ERROR_STOP=1 \
          -U fixture -d issue811_repository -c 'SELECT 1' >/dev/null 2>&1 \
          && docker exec issue811-repository-redis redis-cli ping | grep -qx PONG; then
          ready=true
          break
        fi
        sleep 1
      done
      test "$ready" = true
      printf '%s\n' \
        'SUB2API_TEST_POSTGRES_DSN=postgres://fixture:fixture@127.0.0.1:15432/issue811_repository?sslmode=disable&TimeZone=UTC' \
        'SUB2API_TEST_REDIS_URL=redis://127.0.0.1:16379/0' >> "$GITHUB_ENV"
  - name: GREEN real PostgreSQL risk generation and ownership with race detection
    working-directory: backend
    shell: bash
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" \"$PWD\"\ngo test -race -json ./internal/keyrisk\
      \ -count=1 -timeout=10m 2>&1 | tee \"$RUNNER_TEMP/issue811/green-keyrisk.jsonl\"\npython3 \"$RUNNER_TEMP/issue811/assert-tests.py\"\
      \ \"$RUNNER_TEMP/issue811/green-keyrisk.jsonl\" pass \\\n  TestRestrictionRejectsConcurrentEpisodeOrKeyChanges \\\n\
      \  TestRestrictionRejectsConcurrentEpisodeOrKeyChanges/{reopened,resolved,ignored,owner,disabled,deleted,expired,blacklist}\
      \ \\\n  TestRestrictionRequiresCurrentLiveOwnedKey TestRetiredRulesCannotNotifyOrRestrictBeforeMigration \\\n  TestPerKeyIPMigrationPreservesAuditAndValidMixedQueue\
      \ TestExplicitlyAllowedMultiExitKeysDoNotAlert\n"
  - name: GREEN actual repository opposite ACL interleavings with race detection
    working-directory: backend
    shell: bash
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" \"$PWD\"\ngo test -race -json -tags=integration\
      \ ./internal/repository -run '^TestAPIKeyUpdatePreservesConcurrentOppositeACL$' -count=1 -timeout=10m 2>&1 | tee \"\
      $RUNNER_TEMP/issue811/green-repository.jsonl\"\npython3 \"$RUNNER_TEMP/issue811/assert-tests.py\" \"$RUNNER_TEMP/issue811/green-repository.jsonl\"\
      \ pass \\\n  TestAPIKeyUpdatePreservesConcurrentOppositeACL \\\n  TestAPIKeyUpdatePreservesConcurrentOppositeACL/{whitelist,blacklist}/clear={false,true}\n"
  - name: GREEN handler cache masks SQL and deny precedence
    working-directory: backend
    shell: bash
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" \"$PWD\"\ngo test -race -json -tags=unit\
      \ ./internal/handler/admin ./internal/service ./internal/repository ./internal/pkg/ip ./internal/server/middleware \\\
      \n  -run '^(TestKeyRisk|TestUserKeyRisk|TestAPIKeyUpdate_|TestAPIKeyRepositoryIPRulesPostgresSQL|TestAPIKeyService_InvalidateAuthCacheByKey|TestCheckIPRestrictionWithCompiledRules|TestAPIKeyAuthIPRestriction)'\
      \ \\\n  -count=1 -timeout=10m 2>&1 | tee \"$RUNNER_TEMP/issue811/green-unit.jsonl\"\npython3 \"$RUNNER_TEMP/issue811/assert-tests.py\"\
      \ \"$RUNNER_TEMP/issue811/green-unit.jsonl\" pass \\\n  TestKeyRiskRestrictionOnlyUpdatesCurrentKeysWhitelist TestKeyRiskRejectsUnsafeAndStaleRestrictionActions\
      \ \\\n  TestKeyRiskRestrictionFailureDoesNotInvalidateCache/{write,commit} \\\n  TestAPIKeyUpdate_OnlyDeclaresRequestedColumns\
      \ TestAPIKeyRepositoryIPRulesPostgresSQL \\\n  TestAPIKeyService_InvalidateAuthCacheByKey TestCheckIPRestrictionWithCompiledRules\
      \ \\\n  TestAPIKeyAuthIPRestrictionIncludesClientIPForBlacklistDenial\n"
  - name: Compile ordinary production server package
    working-directory: backend
    shell: bash
    run: 'set -euo pipefail

      CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/issue811/sub2api" ./cmd/server 2>&1 | tee "$RUNNER_TEMP/issue811/build.log"

      sha256sum "$RUNNER_TEMP/issue811/sub2api" > "$RUNNER_TEMP/issue811/build-sha256.txt"

      '
  - name: Prepare isolated compilable defect variants for behavioral RED
    shell: bash
    run: "set -euo pipefail\ngit worktree add --detach \"$RUNNER_TEMP/issue811-red-lock\" \"$EXPECTED_HEAD\"\ngit worktree\
      \ add --detach \"$RUNNER_TEMP/issue811-red-columns\" \"$EXPECTED_HEAD\"\npython3 - \"$RUNNER_TEMP/issue811-red-lock\"\
      \ \"$RUNNER_TEMP/issue811-red-columns\" <<'PY'\nimport pathlib, sys\nlock = pathlib.Path(sys.argv[1]) / 'backend/internal/keyrisk/service.go'\n\
      source = lock.read_text()\nstart = source.index('func (s *Service) RestrictIPWhitelist(')\nprefix, method = source[:start],\
      \ source[start:]\nassert method.count(' FOR UPDATE OF e,k') == 1\nlock.write_text(prefix + method.replace(' FOR UPDATE\
      \ OF e,k', '', 1))\ncolumns = pathlib.Path(sys.argv[2]) / 'backend/internal/service/api_key_service.go'\nsource = columns.read_text()\n\
      for name in ('IPWhitelist', 'IPBlacklist'):\n    old = f'fields.{name} = true'\n    assert source.count(old) == 1\n\
      \    source = source.replace(old, 'fields.IPRules = true', 1)\ncolumns.write_text(source)\nPY\ngit -C \"$RUNNER_TEMP/issue811-red-lock\"\
      \ diff > \"$RUNNER_TEMP/issue811/red-lock.patch\"\ngit -C \"$RUNNER_TEMP/issue811-red-columns\" diff > \"$RUNNER_TEMP/issue811/red-columns.patch\"\
      \ncat > \"$RUNNER_TEMP/issue811/red-method.txt\" <<'TEXT'\nSame-signature defect variants based on the exact candidate,\
      \ not unchanged old production blobs:\n1. Remove only event+key row locks from RestrictIPWhitelist; retain all predicates\
      \ and whitelist UPDATE.\n2. Restore the service's combined IPRules masks; retain new mask definitions to keep tests\
      \ compilable.\nRegressions, APIs, schema and fixtures remain from the candidate. Never publish these variants.\nTEXT\n"
  - name: RED stale episode must fail for business behavior
    shell: bash
    run: 'set -euo pipefail

      cd "$RUNNER_TEMP/issue811-red-lock/backend"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      set +e

      go test -race -json ./internal/keyrisk -run ''^TestRestrictionRejectsConcurrentEpisodeOrKeyChanges/reopened$'' -count=1
      -timeout=3m > "$RUNNER_TEMP/issue811/red-lock.jsonl" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/issue811/red-lock.jsonl"

      test "$result" -ne 0

      python3 "$RUNNER_TEMP/issue811/assert-tests.py" "$RUNNER_TEMP/issue811/red-lock.jsonl" fail TestRestrictionRejectsConcurrentEpisodeOrKeyChanges/reopened

      grep -q ''stale restriction must reject changed episode or key'' "$RUNNER_TEMP/issue811/red-lock.jsonl"

      '
  - name: RED combined masks must fail for persisted ACL loss
    shell: bash
    run: 'set -euo pipefail

      cd "$RUNNER_TEMP/issue811-red-columns/backend"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      set +e

      go test -race -json -tags=integration ./internal/repository -run ''^TestAPIKeyUpdatePreservesConcurrentOppositeACL/whitelist/clear=false$''
      -count=1 -timeout=5m > "$RUNNER_TEMP/issue811/red-columns.jsonl" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/issue811/red-columns.jsonl"

      test "$result" -ne 0

      python3 "$RUNNER_TEMP/issue811/assert-tests.py" "$RUNNER_TEMP/issue811/red-columns.jsonl" fail TestAPIKeyUpdatePreservesConcurrentOppositeACL/whitelist/clear=false

      grep -q ''concurrent blacklist must survive stale opposite ACL edit'' "$RUNNER_TEMP/issue811/red-columns.jsonl"

      '
  - name: Export repository startup metadata without raw request content
    if: always()
    shell: bash
    run: |
      python3 scripts/issue605-startup-metadata.py \
        "$RUNNER_TEMP/issue811/green-repository.jsonl" \
        "$RUNNER_TEMP/issue811/green-repository-startup.json"
      if [ -f "$RUNNER_TEMP/issue811/red-columns.jsonl" ]; then
        python3 scripts/issue605-startup-metadata.py \
          "$RUNNER_TEMP/issue811/red-columns.jsonl" \
          "$RUNNER_TEMP/issue811/red-columns-startup.json"
      fi
  - name: Remove only disposable issue811 repository services
    if: always()
    shell: bash
    run: |
      docker rm -f -v issue811-repository-postgres issue811-repository-redis >/dev/null 2>&1 || true
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-issue811-acl-followup-acl-concurrency-issue811-acl-${{ github.event_name }}-${{ github.event.pull_request.head.sha
        || github.sha }}-${{ github.run_attempt }}
      path: '${{ runner.temp }}/issue811/*.txt

        ${{ runner.temp }}/issue811/*.jsonl

        ${{ runner.temp }}/issue811/*.patch

        ${{ runner.temp }}/issue811/*.log

        ${{ runner.temp }}/issue811/*.py

        '
      if-no-files-found: error
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: issue811-repository-startup-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
      path: ${{ runner.temp }}/issue811/*-startup.json
      if-no-files-found: error
