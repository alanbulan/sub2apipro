name: sync-20261116-upstream-v0220-regression-codex-nonstream-red
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: red/backend/go.sum
      go-version: 1.27.4
  - name: Prove four SetupToken missing-header counterexamples on isolated old code
    working-directory: red
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    shell: bash
    run: "set -euo pipefail\nproof=\"$RUNNER_TEMP/pr722-red\"\nmkdir -p \"$proof\"\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_HEAD\"\
      \ntest -z \"$(git status --porcelain)\"\ngit rev-parse HEAD | tee \"$proof/candidate.txt\"\noriginal=f5c61be7ad8b2b129b4d35e163395aefffdd97df\n\
      printf '%s\\n' \"$original\" | tee \"$proof/tested-production-source.txt\"\ngit fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git\
      \ \"$original\"\nold=\"$RUNNER_TEMP/pr722-original\"\ngit worktree add --detach \"$old\" \"$original\"\ntrap 'git worktree\
      \ remove --force \"$old\"' EXIT\nregression=backend/internal/service/openai_oauth_passthrough_non_stream_test.go\ncp\
      \ \"$regression\" \"$old/$regression\"\ntest \"$(git -C \"$old\" hash-object \"$regression\")\" = \"$(git rev-parse\
      \ \"HEAD:$regression\")\"\nfor target in backend/internal/service/openai_gateway_passthrough.go backend/internal/service/openai_gateway_response_handling.go;\
      \ do\n  expected=$(git rev-parse \"$original:$target\")\n  actual=$(git -C \"$old\" hash-object \"$target\")\n  test\
      \ \"$actual\" = \"$expected\"\n  printf '%s %s %s\\n' \"$target\" \"$expected\" \"$actual\" | tee -a \"$proof/production-blobs.txt\"\
      \ndone\ngit rev-parse \"HEAD:$regression\" | tee \"$proof/candidate-test-blob.txt\"\ngit -C \"$old\" diff --stat | tee\
      \ \"$proof/restored-diff.txt\"\npython3 \"$GITHUB_WORKSPACE/red/scripts/prepare-sync-ci.py\" \"$old/backend\"\nset +e\n\
      (cd \"$old/backend\" && go test -json -tags=unit ./internal/service -run '^TestOpenAIGatewayService_OAuthLike(NonStreamTerminalMatrix|StreamTrueStillStreams|NonStreamJSONLiteralFramingPreserved)$'\
      \ -count=1 -timeout=5m) > \"$proof/tests.jsonl\" 2>&1\nresult=$?\nset -e\nprintf '%s\\n' \"$result\" > \"$proof/exit.txt\"\
      \ncat \"$proof/tests.jsonl\"\npython3 scripts/pr722-codex-nonstream-proof.py red \"$proof/tests.jsonl\" \"$result\"\
      \ | tee \"$proof/summary.txt\"\n"
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-upstream-v0220-regression-codex-nonstream-red-pr722-red-${{ github.event_name }}-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/pr722-red/
