name: sync-20261116-mature-review-repairs-r3
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_phase:
    description: Upstream matrix parameter phase.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      cache: false
      go-version: 1.27.4
  - uses: actions/cache/restore@v6
    with:
      path: '~/.cache/go-build

        ~/go/pkg/mod

        '
      key: mature-repair-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
      restore-keys: 'mature-go-${{ runner.os }}-${{ hashFiles(''backend/go.sum'') }}-candidate-

        mature-go-${{ runner.os }}-${{ hashFiles(''backend/go.sum'') }}-

        '
  - name: Bind R3 moderation tests and pre-fix production blob
    env:
      PHASE: ${{ inputs.sync_matrix_phase }}
    run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/repair-r3\"\ntest \"$(git rev-parse HEAD)\" = '${{ github.sha }}'\ntest\
      \ -z \"$(git status --porcelain)\"\ngit rev-parse HEAD HEAD^{tree} > \"$RUNNER_TEMP/repair-r3/candidate.txt\"\nsha256sum\
      \ backend/internal/qqbot/repair_r3_moderation_integration_test.go backend/internal/qqbot/repair_f3_delivery_integration_test.go\
      \ > \"$RUNNER_TEMP/repair-r3/test-sha256.txt\"\nbaseline=00b48f2757ffb684acdcc96b0cea16ea24a2a353\ngit fetch --no-tags\
      \ --depth=1 https://github.com/ranxi2001/sub2api.git \"$baseline\"\nfor name in moderation.go; do\n  path=\"backend/internal/qqbot/$name\"\
      \n  if [ \"$PHASE\" = red ]; then\n    git show \"$baseline:$path\" > \"$path\"\n    test \"$(git hash-object \"$path\"\
      )\" = \"$(git rev-parse \"$baseline:$path\")\"\n  fi\n  git hash-object \"$path\" >> \"$RUNNER_TEMP/repair-r3/production-blobs.txt\"\
      \ndone\n"
    shell: bash
  - name: Running model and final QQ send authorization oracle
    env:
      PHASE: ${{ inputs.sync_matrix_phase }}
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\nset +e\n(cd backend && go test\
      \ -tags=integration ./internal/qqbot -run '^TestRepairR3' -count=1 -json -timeout=5m) > \"$RUNNER_TEMP/repair-r3/test.jsonl\"\
      \ 2>&1\nresult=$?\nset -e\nprintf '%s\\n' \"$result\" > \"$RUNNER_TEMP/repair-r3/exit-code.txt\"\ncat \"$RUNNER_TEMP/repair-r3/test.jsonl\"\
      \npython3 - <<'PYORACLE'\nimport json, os\nfrom pathlib import Path\np = Path(os.environ['RUNNER_TEMP']) / 'repair-r3'\n\
      raw = (p / 'test.jsonl').read_text()\nevents = [json.loads(line) for line in raw.splitlines() if line.startswith('{')]\n\
      outcomes = {e['Test']: e['Action'] for e in events if e.get('Test') and e['Action'] in ('pass', 'fail', 'skip')}\ncases\
      \ = ['TestRepairR3ModerationRevocationAfterTokenWait/' + kind + '/' + change for kind in ('mute', 'recall') for change\
      \ in ('disabled', 'removed_group', 'appid', 'credential')]\nordering = ['TestRepairR3ModerationDispatchHoldsConfigFence/'\
      \ + kind for kind in ('mute', 'recall')]\ncontrols = ['TestRepairR3ModerationRevocationAfterTokenWait/' + kind + '/unchanged'\
      \ for kind in ('mute', 'recall')]\nassert not any(e['Action'] == 'skip' for e in events), 'No skipped database evidence'\n\
      assert all(s not in raw.lower() for s in ('build failed', 'no tests to run', 'undefined:', 'panic:')), 'Invalid RED\
      \ fixture/build'\nassert all(outcomes.get(case) == 'pass' for case in controls), outcomes\nif os.environ['PHASE'] ==\
      \ 'red':\n    assert int((p / 'exit-code.txt').read_text()) != 0\n    assert all(outcomes.get(case) == 'fail' for case\
      \ in cases+ordering), outcomes\n    assert raw.count('R3 committed revocation must prevent old moderation HTTP operation')\
      \ >= 8\n    assert raw.count('F3 configuration committed while the final send authorization lock was absent') >= 2\n\
      else:\n    assert int((p / 'exit-code.txt').read_text()) == 0\n    assert all(outcomes.get(case) == 'pass' for case\
      \ in cases+ordering), outcomes\n    assert raw.count('R2 observed config backend') >= 2\nPYORACLE\n"
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-review-repairs-r3-repair-r3-${{ inputs.sync_matrix_phase }}-${{ github.sha }}
      path: ${{ runner.temp }}/repair-r3/
