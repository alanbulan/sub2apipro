name: sync-20261116-http-task-rebuild-owner-scan-mutations
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_mutant:
    description: Upstream matrix parameter mutant.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Install isolated Redis fixture
    run: "bash \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\nif ! command -v redis-server >/dev/null; then\n  bash\
      \ \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\n  sudo apt-get update\n  sudo apt-get install -y --no-install-recommends\
      \ redis-server\nfi\n"
    shell: bash
  - name: Execute unsafe source mutant with unchanged composed HTTP oracle
    shell: bash
    run: 'set -euo pipefail

      test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      test -z "$(git status --porcelain)"

      mkdir -p "$RUNNER_TEMP/http-mutant-evidence"

      git worktree add --detach "$RUNNER_TEMP/http-owner-mutant" "$CANDIDATE_SHA"

      python3 scripts/mutate-http-rebuild-owner-scan.py "$RUNNER_TEMP/http-owner-mutant" "$MUTANT" > "$RUNNER_TEMP/http-mutant-evidence/mutation.json"

      git -C "$RUNNER_TEMP/http-owner-mutant" diff --exit-code "$CANDIDATE_SHA" -- ''backend/**/*_test.go''

      git -C "$RUNNER_TEMP/http-owner-mutant" diff > "$RUNNER_TEMP/http-mutant-evidence/source.diff"

      git rev-parse HEAD > "$RUNNER_TEMP/http-mutant-evidence/candidate.txt"

      order=forward

      if [ "$MUTANT" = break-on-owner-mismatch ]; then order=reverse; fi

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$RUNNER_TEMP/http-owner-mutant/backend"

      set +e

      (cd "$RUNNER_TEMP/http-owner-mutant/backend" && go test -race -json -tags=unit ./internal/handler -run "^TestOpenAI409HTTPMixedDeliveryFences$/^apikey$/^stream=false$/^A$/^failed$/^$order$"
      -count=1 -timeout=5m) > "$RUNNER_TEMP/http-mutant-evidence/transport.jsonl" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/http-mutant-evidence/transport.jsonl"

      python3 scripts/assert-http-task-rebuild.py MUTANT "$result" "$RUNNER_TEMP/http-mutant-evidence/transport.jsonl" "--mutant=$MUTANT"

      test -z "$(git status --porcelain)"

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-http-task-rebuild-owner-scan-mutations-http-owner-mutant-${{ inputs.sync_matrix_mutant }}-${{ env.CANDIDATE_SHA
        }}
      path: ${{ runner.temp }}/http-mutant-evidence/
      if-no-files-found: error
