name: sync-20261116-oauth-degradation-native-controls-frontend
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Use Ubuntu HTTPS mirror for CI dependencies
    run: 'bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      '
    shell: bash
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Account editor, degradation settings and locales
    shell: bash
    run: 'set -euo pipefail

      mkdir -p evidence

      git rev-parse HEAD > evidence/head.txt

      pnpm --dir frontend exec vitest run src/views/admin/__tests__/OAuthDegradationActions.spec.ts src/views/admin/__tests__/AutoConfigView.spec.ts
      src/components/account/__tests__/EditAccountModal.spec.ts src/components/admin/operations/__tests__/AutoConfigHistory.spec.ts
      src/i18n/__tests__/localeKeyCompleteness.spec.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee evidence/frontend.log

      pnpm --dir frontend typecheck 2>&1 | tee evidence/typecheck.log

      '
  - name: Install isolated browser for synthetic settings preview
    run: 'npm install --prefix "$RUNNER_TEMP/quality429-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/quality429-browser/node_modules/.bin/playwright" install --with-deps chromium

      git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git 90549fe897d6187d8251af44c9ece5230d2a83f4

      '
    shell: bash
  - name: Render independent conditions before and after
    env:
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/quality429-browser/node_modules/playwright
      OAUTH_DEGRADATION_SCREENSHOT_DIR: ${{ github.workspace }}/evidence/screenshots
    run: node scripts/oauth-degradation-429-browser.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-oauth-degradation-native-controls-frontend-oauth-native-controls-frontend-${{ github.run_id }}
      path: evidence/
      retention-days: 14
