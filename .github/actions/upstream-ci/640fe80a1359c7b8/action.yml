name: sync-20261116-account-performance-error-threshold-backend
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Bounds, real HTTP evidence, evaluation and pause ownership
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit ./internal/service ./internal/repository -run ''^TestAccountPerformance'' -count=1 -v -timeout=10m'
    shell: bash
  - name: Bounded process-local HTTP collector
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race ./internal/pkg/upstreamstats -count=1 -v -timeout=2m'
    shell: bash
  - name: Migrated PostgreSQL pause evidence and configuration
    working-directory: backend
    env:
      CI: 'true'
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=integration ./internal/repository -run ''^TestAccountPerformance'' -count=1 -v -timeout=10m'
    shell: bash
