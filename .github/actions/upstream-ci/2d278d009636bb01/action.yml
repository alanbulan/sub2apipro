name: sync-20261116-ws-plaintext-owner-continuation
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_phase:
    description: Upstream matrix parameter phase.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Redis fixture dependency
    run: "bash \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\nif ! command -v redis-server >/dev/null; then\n  bash\
      \ \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\n  sudo apt-get update\n  sudo apt-get install -y --no-install-recommends\
      \ redis-server\nfi\n"
    shell: bash
  - name: Pin baseline production implementation
    if: inputs.sync_matrix_phase == 'RED'
    run: "for target in backend/internal/service/openai_ws_agent_recovery.go backend/internal/service/openai_ws_forwarder_ingress.go\
      \ backend/internal/service/openai_ws_http_bridge.go backend/internal/handler/openai_agent_message_recovery.go; do\n\
      \  git show \"b9feadf7dd6228a4117e360821d9994b7cc54897:$target\" > \"$target\"\n  test \"$(git hash-object \"$target\"\
      )\" = \"$(git rev-parse \"b9feadf7dd6228a4117e360821d9994b7cc54897:$target\")\"\ndone\n"
    shell: bash
  - name: Actual delta continuation and delivery boundaries
    env:
      PHASE: ${{ inputs.sync_matrix_phase }}
    shell: bash
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\nset +e\n(cd backend && go test\
      \ -race -json -tags=unit,plaintextowner ./internal/service ./internal/handler -run '^TestOpenAIWS(Plaintext(ResponseOwnershipDelivery|ToolContinuation(WithoutStorage)?|ToolAfterRebuild)|RecoveryRefusalCapture)$'\
      \ -count=1 -timeout=5m) > \"$RUNNER_TEMP/plaintext-owner.jsonl\" 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/plaintext-owner.jsonl\"\
      \npython3 scripts/assert-readable-continuation.py --clean-log \"$RUNNER_TEMP/plaintext-owner.jsonl\"\npython3 - \"$PHASE\"\
      \ \"$result\" \"$RUNNER_TEMP/plaintext-owner.jsonl\" <<'PY'\nimport json,sys\nphase,status,path=sys.argv[1],int(sys.argv[2]),sys.argv[3]\n\
      rows=[]\nfor line in open(path):\n    try: rows.append(json.loads(line))\n    except ValueError: pass\nfailures={r['Test']\
      \ for r in rows if r.get('Action')=='fail' and '/' in r.get('Test','')}\npasses={r['Test'] for r in rows if r.get('Action')=='pass'\
      \ and '/' in r.get('Test','')}\nexpected={f'TestOpenAIWSPlaintextResponseOwnershipDelivery/{x}' for x in ('completed','empty_output','done')}\n\
      expected.update('TestOpenAIWSPlaintextToolContinuation'+suffix+'/'+mode for mode in ('passthrough','http_bridge') for\
      \ suffix in ('','WithoutStorage'))\nexpected.update('TestOpenAIWSPlaintextToolAfterRebuild/'+mode for mode in ('http_bridge','ctx_pool','shared','dedicated','passthrough'))\n\
      capture=[r for r in rows if r.get('Test')=='TestOpenAIWSRecoveryRefusalCapture']\nif phase=='RED':\n    assert status!=0\
      \ and failures==expected,(status,failures)\n    for name in expected:\n        text=''.join(r.get('Output','') for r\
      \ in rows if r.get('Test')==name)\n        assert 'PLAINTEXT_RESPONSE_OWNER_MISSING' in text or 'PLAINTEXT_TOOL_CONTINUATION_REFUSED'\
      \ in text,(name,text)\n    assert len(passes)==11,passes\n    assert any(r.get('Action')=='fail' for r in capture),capture\n\
      \    assert 'RECOVERY_REFUSAL_CAPTURE_MISSING' in ''.join(r.get('Output','') for r in capture)\nelse:\n    assert status==0\
      \ and not failures,(status,failures)\n    assert len(passes)==23,passes\n    assert any(r.get('Action')=='pass' for\
      \ r in capture),capture\nPY\n"
  - name: GREEN stateless projection cannot bypass ownership or content checks
    if: inputs.sync_matrix_phase == 'GREEN'
    shell: bash
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -race -json -tags=unit,plaintextowner ./internal/service -run ''^TestOpenAIWSPlaintextBridgeProjectionGuards$''
      -count=1 -timeout=2m) | tee "$RUNNER_TEMP/plaintext-guards.jsonl"

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-ws-plaintext-owner-continuation-plaintext-owner-${{ inputs.sync_matrix_phase }}-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/plaintext-*.jsonl
      if-no-files-found: error
