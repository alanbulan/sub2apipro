name: sync-20261116-token-guard-v2-scheduler-scheduler
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Scheduling, cancellation and retained re-login budget under race detector
    shell: bash
    run: 'set -euo pipefail

      mkdir -p test-evidence

      git rev-parse HEAD > test-evidence/head.txt

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -race -tags=unit ./internal/service -run ''^Test(AccountTokenGuardV2|ReloginBudget|ExhaustedRelogin|RestoredBudget)''
      -count=1 -v -timeout=10m) 2>&1 | tee test-evidence/scheduler.log

      '
  - name: PostgreSQL cutoff, lease fencing and budget persistence
    shell: bash
    env:
      CI: 'true'
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -tags=integration ./internal/repository -run ''^Test(AccountTokenGuardV2|ReloginBudget)'' -count=1
      -v -timeout=15m) 2>&1 | tee test-evidence/storage.log

      if grep -Eq -- ''--- SKIP:|no tests to run'' test-evidence/storage.log; then exit 1; fi

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-token-guard-v2-scheduler-scheduler-credential-patrol-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: test-evidence/
      if-no-files-found: error
