name: sync-20261116-profit-operations-frontend
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - run: pnpm exec vitest run src/views/admin/__tests__/ProfitOperationsView.spec.ts src/views/admin/__tests__/ProviderProfit.spec.ts
      src/components/admin/operations/__tests__/SmartOpsNav.spec.ts src/components/layout/__tests__/AppSidebar.spec.ts --maxWorkers=1
      --minWorkers=1 --no-file-parallelism
    working-directory: frontend
    shell: bash
  - name: Calendar presets in local timezones
    working-directory: frontend
    run: 'TZ=Asia/Shanghai pnpm exec vitest run src/views/admin/__tests__/ProfitOperationsView.spec.ts --maxWorkers=1 --minWorkers=1
      --no-file-parallelism

      TZ=Europe/Berlin pnpm exec vitest run src/views/admin/__tests__/ProfitOperationsView.spec.ts --maxWorkers=1 --minWorkers=1
      --no-file-parallelism

      '
    shell: bash
  - run: pnpm --dir frontend run build
    shell: bash
  - name: Install isolated browser
    run: 'npm install --prefix "$RUNNER_TEMP/upstream-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/upstream-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Independent profit page with synthetic data and zero live requests
    env:
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/upstream-browser/node_modules/playwright
      UPSTREAM_SCREENSHOT_DIR: ${{ runner.temp }}/upstream-screenshots
    run: node scripts/upstream-channel-entities-screenshot.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-profit-operations-frontend-upstream-profit-ui-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: ${{ runner.temp }}/upstream-screenshots
      if-no-files-found: error
