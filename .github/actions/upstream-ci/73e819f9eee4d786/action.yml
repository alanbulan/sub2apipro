name: sync-20261116-issue733-priority-filters-analysis-race
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Exact candidate analysis race and lifecycle regressions
    run: "set -euo pipefail\ntest -z \"$(git status --porcelain)\"\ngit rev-parse HEAD | tee \"$RUNNER_TEMP/analysis-race-head.txt\"\
      \npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\n(cd backend && go test -race -tags=unit ./internal/service\
      \ -run '^TestPriorityAnalysis' -count=1 -v -timeout=10m) 2>&1 | tee \"$RUNNER_TEMP/analysis-race.log\"\nfor name in\
      \ ConcurrentScopesHaveBoundedSQLReaders CoalescesAndOwnsMutableResponses FirstWaiterCancellationKeepsOtherReadersAlive\
      \ LastCancellationHoldsSlotUntilRepositoryExit DifferentPrincipalsAndScopesNeverMerge ErrorsAndShutdownReleaseLifecycle\
      \ BudgetTimeoutReleasesLifecycle PreparationIsBoundedAndCancelled CancelledWorkCannotPublishSuccess CatalogSharesPreparationBudgetAndCancels;\
      \ do\n  grep -q -- \"--- PASS: TestPriorityAnalysis$name \" \"$RUNNER_TEMP/analysis-race.log\"\ndone\n! grep -q -- '---\
      \ SKIP: TestPriorityAnalysis' \"$RUNNER_TEMP/analysis-race.log\"\n"
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-issue733-priority-filters-analysis-race-issue733-analysis-race-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/analysis-race*
