name: sync-20261116-mature-review-repairs-f1
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_phase:
    description: Upstream matrix parameter phase.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      cache: false
      go-version: 1.27.4
  - uses: actions/cache/restore@v6
    with:
      path: '~/.cache/go-build

        ~/go/pkg/mod

        '
      key: mature-repair-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
      restore-keys: 'mature-go-${{ runner.os }}-${{ hashFiles(''backend/go.sum'') }}-candidate-

        mature-go-${{ runner.os }}-${{ hashFiles(''backend/go.sum'') }}-

        '
  - name: Bind exact candidate tests and production blobs
    env:
      PHASE: ${{ inputs.sync_matrix_phase }}
    run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/repair-f1\"\ntest \"$(git rev-parse HEAD)\" = '${{ github.sha }}'\ntest\
      \ -z \"$(git status --porcelain)\"\ngit rev-parse HEAD HEAD^{tree} > \"$RUNNER_TEMP/repair-f1/candidate.txt\"\nsha256sum\
      \ backend/internal/qqbot/repair_f1_submission_test.go > \"$RUNNER_TEMP/repair-f1/test-sha256.txt\"\nbaseline=b98e6acb2dc772651b6a597d40cce311f96a2ba5\n\
      git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git \"$baseline\"\nfor name in site_chat_retry.go\
      \ site_chat.go client.go config.go service.go types.go price_notifications.go; do\n  path=\"backend/internal/qqbot/$name\"\
      \n  if [ \"$PHASE\" = red ]; then\n    git show \"$baseline:$path\" > \"$path\"\n    test \"$(git hash-object \"$path\"\
      )\" = \"$(git rev-parse \"$baseline:$path\")\"\n  fi\n  git hash-object \"$path\" >> \"$RUNNER_TEMP/repair-f1/production-blobs.txt\"\
      \ndone\n"
    shell: bash
  - name: Real generation POST submission oracle
    env:
      PHASE: ${{ inputs.sync_matrix_phase }}
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\nset +e\n(cd backend && go test\
      \ ./internal/qqbot -run '^TestRepairF1' -count=1 -json -timeout=2m) > \"$RUNNER_TEMP/repair-f1/test.jsonl\" 2>&1\nresult=$?\n\
      set -e\nprintf '%s\\n' \"$result\" > \"$RUNNER_TEMP/repair-f1/exit-code.txt\"\ncat \"$RUNNER_TEMP/repair-f1/test.jsonl\"\
      \npython3 - <<'PY'\nimport json, os\nfrom pathlib import Path\np = Path(os.environ['RUNNER_TEMP']) / 'repair-f1'\nraw\
      \ = (p / 'test.jsonl').read_text()\nevents = [json.loads(line) for line in raw.splitlines() if line.startswith('{')]\n\
      outcomes = {e['Test']: e['Action'] for e in events if e.get('Test') and e['Action'] in ('pass', 'fail', 'skip')}\ncases\
      \ = ['TestRepairF1SubmittedGenerationIsNotReplayed/' + protocol + '/' + failure for protocol in ('chat_completions',\
      \ 'responses') for failure in ('headers_timeout', 'attempt_deadline', 'eof', 'truncated_body')]\nassert not any(e['Action']\
      \ == 'skip' for e in events), 'No skipped evidence'\nassert all(s not in raw.lower() for s in ('build failed', 'no tests\
      \ to run', 'undefined:', 'panic:')), 'Invalid RED fixture/build'\nassert outcomes.get('TestRepairF1DefinitelyUnsubmittedDialCanRetry')\
      \ == 'pass', 'Safe unsubmitted control must pass'\nif os.environ['PHASE'] == 'red':\n    assert int((p / 'exit-code.txt').read_text())\
      \ != 0\n    assert all(outcomes.get(case) == 'fail' for case in cases), outcomes\n    assert raw.count('F1 accepted\
      \ generation POST must not be replayed after uncertain response') >= 8\nelse:\n    assert int((p / 'exit-code.txt').read_text())\
      \ == 0\n    assert all(outcomes.get(case) == 'pass' for case in cases), outcomes\nPY\n"
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-review-repairs-f1-repair-f1-${{ inputs.sync_matrix_phase }}-${{ github.sha }}
      path: ${{ runner.temp }}/repair-f1/
