name: sync-20261116-openai-connection-account-type-regression-persisted-compatibility
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Existing PostgreSQL Redis HTTP inference and OAuth compatibility regressions
    run: 'set -euo pipefail

      mkdir -p "$RUNNER_TEMP/connection-proof"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -tags=integration ./internal/repository ./internal/service -run ''^TestIssue594|^TestOpenAIConnection''
      -count=1 -json -timeout=25m) > "$RUNNER_TEMP/connection-proof/integration.jsonl" 2>&1 || { cat "$RUNNER_TEMP/connection-proof/integration.jsonl";
      exit 1; }

      cat "$RUNNER_TEMP/connection-proof/integration.jsonl"

      python3 scripts/openai-connection-account-type-proof.py integration-green "$RUNNER_TEMP/connection-proof"

      git diff --exit-code HEAD

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-openai-connection-account-type-regression-persisted-compatibility-connection-type-persisted-${{
        github.event.pull_request.head.sha || github.sha }}
      path: ${{ runner.temp }}/connection-proof
      if-no-files-found: error
