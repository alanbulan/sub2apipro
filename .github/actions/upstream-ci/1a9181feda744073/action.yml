name: sync-20261116-http-task-rebuild-transport
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_phase:
    description: Upstream matrix parameter phase.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Install isolated Redis fixture
    run: "bash \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\nif ! command -v redis-server >/dev/null; then\n  bash\
      \ \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\n  sudo apt-get update\n  sudo apt-get install -y --no-install-recommends\
      \ redis-server\nfi\n"
    shell: bash
  - name: Keep clean candidate and prepare disposable RED source
    shell: bash
    run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$CANDIDATE_SHA\"\ntest -z \"$(git status --porcelain)\"\n\
      mkdir -p \"$RUNNER_TEMP/http-task-evidence\"\ngit rev-parse HEAD HEAD^{tree} > \"$RUNNER_TEMP/http-task-evidence/candidate.txt\"\
      \ngit rev-parse \"$BASELINE_SHA\" > \"$RUNNER_TEMP/http-task-evidence/baseline.txt\"\nif [ \"$PHASE\" = RED ]; then\n\
      \  git worktree add --detach \"$RUNNER_TEMP/http-task-red\" \"$CANDIDATE_SHA\"\n  cd \"$RUNNER_TEMP/http-task-red\"\n\
      \  while IFS= read -r target; do\n    case \"$target\" in *_test.go) continue ;; esac\n    if git cat-file -e \"$BASELINE_SHA:$target\"\
      \ 2>/dev/null; then\n      mkdir -p -- \"$(dirname -- \"$target\")\"\n      git show \"$BASELINE_SHA:$target\" > \"\
      $target\"\n      git add -N -- \"$target\"\n      expected=$(git rev-parse \"$BASELINE_SHA:$target\")\n      test \"\
      $(git hash-object \"$target\")\" = \"$expected\"\n      echo \"$target baseline=$expected\" >> \"$RUNNER_TEMP/http-task-evidence/red-blobs.txt\"\
      \n    else\n      rm -- \"$target\"\n      echo \"$target baseline=absent\" >> \"$RUNNER_TEMP/http-task-evidence/red-blobs.txt\"\
      \n    fi\n  done < <(git diff --no-renames --name-only \"$BASELINE_SHA\" \"$CANDIDATE_SHA\" -- 'backend/**/*.go')\n\
      \  git diff --exit-code \"$BASELINE_SHA\" -- 'backend/**/*.go' ':!backend/**/*_test.go'\n  # Record the real refusal/normalization\
      \ callsites even on the\n  # initial test-only head, where no production blob needs changing.\n  for target in backend/internal/handler/openai_gateway_handler.go\
      \ backend/internal/service/openai_409_omit_history.go backend/internal/service/openai_agent_message_recovery.go backend/internal/service/openai_gateway_forward.go\
      \ backend/internal/service/openai_codex_transform.go; do\n    expected=$(git rev-parse \"$BASELINE_SHA:$target\")\n\
      \    test \"$(git hash-object \"$target\")\" = \"$expected\"\n    echo \"$target baseline=$expected\" >> \"$RUNNER_TEMP/http-task-evidence/red-blobs.txt\"\
      \n  done\nfi\ngit diff --exit-code \"$CANDIDATE_SHA\" -- 'backend/**/*_test.go'\nif [ \"$PHASE\" = RED ]; then\n  bash\
      \ \"$GITHUB_WORKSPACE/scripts/exclude-later-400-red-fixtures.sh\" \"$BASELINE_SHA\"\n  bash \"$GITHUB_WORKSPACE/scripts/exclude-later-http2-red-fixtures.sh\"\
      \ \"$BASELINE_SHA\"\n  bash \"$GITHUB_WORKSPACE/scripts/prepare-replay-red-fixtures.sh\" \"$BASELINE_SHA\" . \"$CANDIDATE_SHA\"\
      \ | tee \"$RUNNER_TEMP/http-task-evidence/replay-fixtures.txt\"\n  bash \"$GITHUB_WORKSPACE/scripts/prepare-moderation-red-fixtures.sh\"\
      \ \"$BASELINE_SHA\" . \"$CANDIDATE_SHA\" | tee \"$RUNNER_TEMP/http-task-evidence/moderation-fixtures.txt\"\nfi\nfor\
      \ target in backend/internal/handler/openai_409_http_rebuild_test.go backend/internal/handler/openai_409_readable_continuation_test.go\
      \ backend/internal/handler/openai_responses_failover_cancel_test.go; do\n  expected=$(git rev-parse \"$CANDIDATE_SHA:$target\"\
      )\n  test \"$(git hash-object \"$target\")\" = \"$expected\"\n  echo \"$target candidate=$expected\" >> \"$RUNNER_TEMP/http-task-evidence/test-blobs.txt\"\
      \ndone\n"
  - name: Same composed network regression
    shell: bash
    run: 'set -euo pipefail

      tested_tree="$GITHUB_WORKSPACE"

      if [ "$PHASE" = RED ]; then tested_tree="$RUNNER_TEMP/http-task-red"; fi

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$tested_tree/backend"

      set +e

      (cd "$tested_tree/backend" && go test -race -json -tags=unit ./internal/handler -run ''^TestOpenAI409HTTPTaskRebuild$''
      -count=1 -timeout=5m) > "$RUNNER_TEMP/http-task-evidence/transport.jsonl" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/http-task-evidence/transport.jsonl"

      python3 scripts/assert-http-task-rebuild.py "$PHASE" "$result" "$RUNNER_TEMP/http-task-evidence/transport.jsonl"

      '
  - name: GREEN intent and delivery boundaries
    if: inputs.sync_matrix_phase == 'GREEN'
    shell: bash
    run: 'set -euo pipefail

      test -z "$(git status --porcelain)"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -race -json -tags=unit ./internal/handler -run ''^TestOpenAI409HTTPRebuildBoundaries$'' -count=1
      -timeout=5m) > "$RUNNER_TEMP/http-task-evidence/boundaries.jsonl" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/http-task-evidence/boundaries.jsonl"

      python3 scripts/assert-http-task-rebuild.py GREEN "$result" "$RUNNER_TEMP/http-task-evidence/boundaries.jsonl" --boundaries

      '
  - name: GREEN mixed producer fences and tool-definition wire mutations
    if: inputs.sync_matrix_phase == 'GREEN'
    shell: bash
    run: "set -euo pipefail\nfor suite in mixed-fences tool-oracle normalization pointer-waiver; do\n  test_name=TestOpenAI409HTTPMixedDeliveryFences\n\
      \  if [ \"$suite\" = tool-oracle ]; then test_name=TestOpenAI409HTTPToolDefinitionOracle; fi\n  if [ \"$suite\" = normalization\
      \ ]; then test_name=TestOpenAI409HTTPControlNormalization; fi\n  if [ \"$suite\" = pointer-waiver ]; then test_name=TestOpenAI409HTTPUnownedPointerMustDetach;\
      \ fi\n  python3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\n  set +e\n  (cd backend && go test -race -json\
      \ -tags=unit ./internal/handler -run \"^$test_name$\" -count=1 -timeout=5m) > \"$RUNNER_TEMP/http-task-evidence/$suite.jsonl\"\
      \ 2>&1\n  result=$?\n  set -e\n  cat \"$RUNNER_TEMP/http-task-evidence/$suite.jsonl\"\n  python3 scripts/assert-http-task-rebuild.py\
      \ GREEN \"$result\" \"$RUNNER_TEMP/http-task-evidence/$suite.jsonl\" \"--$suite\"\ndone\n"
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-http-task-rebuild-transport-http-task-rebuild-${{ inputs.sync_matrix_phase }}-${{ env.CANDIDATE_SHA
        }}
      path: ${{ runner.temp }}/http-task-evidence/
      if-no-files-found: error
