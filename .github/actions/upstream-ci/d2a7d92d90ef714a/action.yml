name: sync-20261116-pr598-repair-regression-queued-ui-red
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - name: Install frontend dependencies
    working-directory: frontend
    run: pnpm install --frozen-lockfile
    shell: bash
  - name: Overlay only the queued UI regressions on exact defective c0c component
    shell: bash
    run: "set -euo pipefail\ngit fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git c0c7533badd6e4696e58d709f59eb7e10bf4b5f0\n\
      baseline=\"$RUNNER_TEMP/pr598-c0c-ui\"\ngit worktree add --detach \"$baseline\" c0c7533badd6e4696e58d709f59eb7e10bf4b5f0\n\
      trap 'git worktree remove --force \"$baseline\"' EXIT\n# Retain the pre-refactor regressions for this historical component.\n\
      # Current tests use shared-performance fixtures absent from c0c.\ntest_source=6fa7fb86eae7c732794450646dc13831dce87ff1\n\
      test_path=frontend/src/views/admin/__tests__/PrioritySchedulingView.spec.ts\ngit show \"$test_source:$test_path\" >\
      \ \"$baseline/$test_path\"\nln -s \"$GITHUB_WORKSPACE/frontend/node_modules\" \"$baseline/frontend/node_modules\"\n\
      mkdir -p \"$RUNNER_TEMP/pr598-queued-red\"\nbash scripts/pr598-source-proof.sh \"$baseline\" c0c7533badd6e4696e58d709f59eb7e10bf4b5f0\
      \ \\\n  frontend/src/views/admin/PrioritySchedulingView.vue \\\n  frontend/src/api/admin/priorityScheduling.ts | tee\
      \ \"$RUNNER_TEMP/pr598-queued-red/production.txt\"\ntest \"$(git rev-parse \"$test_source:$test_path\")\" = \"$(git\
      \ hash-object \"$baseline/$test_path\")\"\nset +e\npnpm --dir \"$baseline/frontend\" exec vitest run src/views/admin/__tests__/PrioritySchedulingView.spec.ts\
      \ -t 'reads back the recomputed group after automatically switching the sticky scope|supersedes an in-flight old latency\
      \ window with the selected window' --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile=\"\
      $RUNNER_TEMP/pr598-queued-red/ui.json\" > \"$RUNNER_TEMP/pr598-queued-red/ui.log\" 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/pr598-queued-red/ui.log\"\
      \ntest \"$result\" -ne 0\ngrep -q -- 'reads back the recomputed group after automatically switching the sticky scope'\
      \ \"$RUNNER_TEMP/pr598-queued-red/ui.log\"\ngrep -q -- 'supersedes an in-flight old latency window with the selected\
      \ window' \"$RUNNER_TEMP/pr598-queued-red/ui.log\"\n! grep -Eq 'Failed to resolve|SyntaxError|No test files found' \"\
      $RUNNER_TEMP/pr598-queued-red/ui.log\"\nnode --input-type=module - \"$RUNNER_TEMP/pr598-queued-red/ui.json\" <<'JS'\n\
      import fs from 'node:fs'\nconst result = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))\nconst cases = result.testResults.flatMap(file\
      \ => file.assertionResults)\nfor (const title of ['reads back the recomputed group after automatically switching the\
      \ sticky scope', 'supersedes an in-flight old latency window with the selected window']) {\n  if (!cases.some(test =>\
      \ test.title === title && test.status === 'failed')) throw new Error(`Missing behavior RED: ${title}`)\n}\nJS\n"
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-pr598-repair-regression-queued-ui-red-pr598-queued-red-ui-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/pr598-queued-red
      if-no-files-found: error
