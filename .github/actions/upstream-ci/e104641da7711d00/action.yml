name: sync-20261116-issue881-totp-production-build
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '24'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - name: Production frontend and embedded Linux binary
    shell: bash
    run: 'set -euo pipefail

      test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      mkdir -p evidence

      git rev-parse HEAD > evidence/head.txt

      pnpm --dir frontend install --frozen-lockfile 2>&1 | tee evidence/dependencies.log

      pnpm --dir frontend run build 2>&1 | tee evidence/frontend-build.log

      (cd backend && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags embed -trimpath -ldflags="-s -w -X main.Commit=${{
      github.event.pull_request.head.sha || github.sha }}" -o "$RUNNER_TEMP/sub2api-production" ./cmd/server) 2>&1 | tee evidence/production-build.log

      sha256sum "$RUNNER_TEMP/sub2api-production" > evidence/binary.sha256

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-issue881-totp-production-build-issue881-production-build-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: evidence/
