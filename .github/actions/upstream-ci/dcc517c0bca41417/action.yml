name: sync-20261116-mature-channel-community-ops-before-ui
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Freeze before source
    run: 'git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git 37dc4620a41a68abaeab329358c15821c41e3f7f

      git worktree add --detach "$RUNNER_TEMP/mature-before" 37dc4620a41a68abaeab329358c15821c41e3f7f

      '
    shell: bash
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir "$RUNNER_TEMP/mature-before/frontend" install --frozen-lockfile
    shell: bash
  - name: Install isolated browser
    run: 'npm install --prefix "$RUNNER_TEMP/mature-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/mature-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Real baseline components in both languages and viewport sizes
    env:
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/mature-browser/node_modules/playwright
      MATURE_BASE_ROOT: ${{ runner.temp }}/mature-before
      MATURE_SCREENSHOT_DIR: ${{ runner.temp }}/mature-before-evidence
    run: node scripts/mature-providers-before.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-channel-community-ops-before-ui-mature-before-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: ${{ runner.temp }}/mature-before-evidence/
