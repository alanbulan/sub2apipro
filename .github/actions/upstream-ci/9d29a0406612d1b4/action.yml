name: sync-20261116-issue605-p1-repair-repaired-green
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Exact repaired source
    run: "test \"$(git rev-parse HEAD)\" = \"$EXPECTED_HEAD\"\ngit diff --exit-code HEAD\nmkdir -p \"$RUNNER_TEMP/issue605-p1-green\"\
      \ngit rev-parse HEAD > \"$RUNNER_TEMP/issue605-p1-green/source-head.txt\"\nfor path in backend/internal/service/openai_ws_v2/passthrough_relay.go\
      \ backend/internal/service/openai_ws_v2_passthrough_adapter.go backend/internal/handler/openai_gateway_handler.go; do\n\
      \  git hash-object \"$path\" >> \"$RUNNER_TEMP/issue605-p1-green/production-blobs.txt\"\ndone\n"
    shell: bash
  - name: GREEN actual service current-turn result
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit ./internal/service -run ''^TestSmartProtocolPassthroughPartialUsage$'' -count=1 -timeout=10m
      -json > "$RUNNER_TEMP/issue605-p1-green/service.jsonl" 2>&1'
    shell: bash
  - name: GREEN authenticated handler PG Redis exact billing
    if: ${{ !cancelled() }}
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=integration ./internal/repository -run ''^TestSmartProtocolPassthroughPartialBilling$'' -count=1
      -timeout=10m -json > "$RUNNER_TEMP/issue605-p1-green/integration.jsonl" 2>&1'
    shell: bash
  - name: Require complete per-case GREEN
    if: always()
    run: timeout 120s python3 scripts/issue605-p1-proof.py green "$RUNNER_TEMP/issue605-p1-green"
    shell: bash
  - uses: actions/upload-artifact@v6
    if: always()
    with:
      name: sync-20261116-issue605-p1-repair-repaired-green-issue605-p1-green-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: '${{ runner.temp }}/issue605-p1-green/*.txt

        ${{ runner.temp }}/issue605-p1-green/summary.json

        ${{ runner.temp }}/issue605-p1-green/whitelist.jsonl

        '
      if-no-files-found: error
