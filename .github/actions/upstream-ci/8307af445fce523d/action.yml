name: sync-20261116-oauth-initial-ws-backend
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Initial template scope, API compatibility and WS behavior
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=unit ./internal/service ./internal/handler/admin -run ''^(TestOAuthAutoConfig|TestAutoConfig|TestOpenAIWSSSEAcceleration)''
      -count=1 -timeout=15m'
    shell: bash
