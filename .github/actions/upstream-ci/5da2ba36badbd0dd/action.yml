name: sync-20261116-collection-reliability-packaging
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-python@v6
    with:
      python-version: '3.12'
  - run: python3 -m pip install PyYAML==6.0.3
    shell: bash
  - name: Release Docker contexts preserve notices and licenses
    run: python3 -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
    shell: bash
