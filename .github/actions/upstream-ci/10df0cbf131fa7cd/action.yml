name: sync-20261116-issue842-replay-metadata-evidence
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Install isolated Redis fixture
    run: "bash \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\nif ! command -v redis-server >/dev/null; then\n  bash\
      \ \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\n  sudo apt-get update\n  sudo apt-get install -y --no-install-recommends\
      \ redis-server\nfi\n"
    shell: bash
  - name: Candidate GREEN at exact head
    shell: bash
    run: 'set -euo pipefail

      test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      test -z "$(git status --porcelain)"

      mkdir -p "$RUNNER_TEMP/issue842"

      git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/issue842/candidate.txt"

      # Formatting is verified remotely as well; no local toolchain runs.

      gofmt -d backend/internal/handler/openai_issue842*_test.go backend/internal/service/openai_issue842_replay_test.go backend/internal/service/issue842_gateway_test_support.go
      backend/internal/service/openai_agent_replay_metadata.go backend/internal/service/openai_ws_agent_recovery.go > "$RUNNER_TEMP/issue842/format.patch"

      cat "$RUNNER_TEMP/issue842/format.patch"

      cd backend

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -json -tags=unit ./internal/handler ./internal/service -run ''^Test(Issue(842|805)|OpenAIAgentRecoveryCompaction|WithoutOpenAIRemoteCompaction)''
      -count=1 -timeout=10m 2>&1 | tee "$RUNNER_TEMP/issue842/green.jsonl"

      if grep -Eiq ''"Action":"skip"|no tests to run|panic:|WARNING: DATA RACE'' "$RUNNER_TEMP/issue842/green.jsonl"; then
      exit 1; fi

      '
  - name: Isolated pinned defect RED with candidate fixtures
    shell: bash
    run: "set -euo pipefail\nbaseline=aa8e596e6d6f3e4648d6beba73b39b240dd5357a\ngit fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git\
      \ \"$baseline\"\ngit worktree add --detach \"$RUNNER_TEMP/issue842-red\" \"$EXPECTED_HEAD_SHA\"\ncd \"$RUNNER_TEMP/issue842-red\"\
      \n# Only the production paths of this repair are restored. Candidate\n# fixtures stay exact, and the original GREEN\
      \ tree stays untouched.\nfor target in backend/internal/handler/openai_gateway_handler.go backend/internal/service/openai_account_scheduler.go\
      \ backend/internal/service/openai_409_omit_history.go backend/internal/service/openai_ws_agent_recovery.go backend/internal/service/openai_gateway_request_body.go\
      \ backend/internal/service/openai_gateway_forward.go backend/internal/service/openai_agent_message_recovery.go; do\n\
      \  git show \"$baseline:$target\" > \"$target\"\n  expected=$(git rev-parse \"$baseline:$target\")\n  actual=$(git hash-object\
      \ \"$target\")\n  echo \"$target expected=$expected actual=$actual\" >> \"$RUNNER_TEMP/issue842/red-blobs.txt\"\n  test\
      \ \"$expected\" = \"$actual\"\ndone\ntarget=backend/internal/service/openai_agent_replay_metadata.go\nif git cat-file\
      \ -e \"$baseline:$target\" 2>/dev/null; then exit 1; fi\nrm -- \"$target\"\ntest ! -e \"$target\"\necho \"$target baseline=absent\
      \ actual=absent\" >> \"$RUNNER_TEMP/issue842/red-blobs.txt\"\ntarget=backend/internal/handler/openai_issue842_replay_test.go\n\
      test \"$(git hash-object \"$target\")\" = \"$(git rev-parse \"$EXPECTED_HEAD_SHA:$target\")\"\nbash \"$GITHUB_WORKSPACE/scripts/prepare-ws-owner-red-fixtures.sh\"\
      \ \"$baseline\" . \"$EXPECTED_HEAD_SHA\" | tee \"$RUNNER_TEMP/issue842/ws-owner-red-blobs.txt\"\ngit diff --stat > \"\
      $RUNNER_TEMP/issue842/red-diff.txt\"\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\nset +e\n(cd\
      \ backend && go test -json -tags=unit ./internal/handler -run '^TestIssue842(HTTP|WS)ReplayMetadata$' -count=1 -timeout=5m)\
      \ > \"$RUNNER_TEMP/issue842/red.jsonl\" 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/issue842/red.jsonl\"\ntest \"$result\"\
      \ -ne 0\nif grep -Eiq 'build failed|no tests to run|undefined:|panic:|panic_recovered|fatal error:|runtime error:|WARNING:\
      \ DATA RACE|\"Action\":\"skip\"' \"$RUNNER_TEMP/issue842/red.jsonl\"; then exit 1; fi\npython3 - \"$RUNNER_TEMP/issue842/red.jsonl\"\
      \ <<'PY'\nimport itertools, json, sys\nevents = [json.loads(line) for line in open(sys.argv[1])]\nfailed = {e.get('Test')\
      \ for e in events if e.get('Action') == 'fail'}\nvariants = ('reasoning_status', 'reasoning_content', 'plaintext_reasoning',\
      \ 'reasoning_id', 'invalid_replay_id', 'message_call_id')\nfor kind, stream, variant, known in itertools.product(('apikey',\
      \ 'oauth'), ('false', 'true'), variants, ('true', 'false')):\n    name = f'TestIssue842HTTPReplayMetadata/{kind}/stream={stream}/{variant}/known={known}'\n\
      \    assert name in failed, f'missing business RED: {name}'\n    output = ''.join(e.get('Output', '') for e in events\
      \ if e.get('Test') == name)\n    assert 'Issue842 benign replay metadata must reach B once' in output, name\n    assert\
      \ 'encrypted_agent_recovery_wire_changed' in output, name\nfor mode, variant, known in itertools.product(('ctx_pool',\
      \ 'passthrough', 'http_bridge'), variants, ('true', 'false')):\n    name = f'TestIssue842WSReplayMetadata/{mode}/{variant}/known={known}'\n\
      \    assert name in failed, f'missing WS business RED: {name}'\n    output = ''.join(e.get('Output', '') for e in events\
      \ if e.get('Test') == name)\n    assert 'Issue842 WS benign metadata must reach the actual adapter once' in output,\
      \ name\n    assert 'encrypted_agent_recovery_wire_changed' in output or 'Issue842 metadata policy refusal before frame'\
      \ in output, name\nPY\n"
  - name: OAuth store and summary repair RED on pinned prior candidate
    shell: bash
    run: "set -euo pipefail\nbaseline=af0328aec4a47c6c81a9b81d9a65c66ac660aea0\ngit fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git\
      \ \"$baseline\"\ngit worktree add --detach \"$RUNNER_TEMP/issue842-oauth-red\" \"$EXPECTED_HEAD_SHA\"\ncd \"$RUNNER_TEMP/issue842-oauth-red\"\
      \n# Preserve the live production/BPS merge and the exact candidate\n# fixture. Restore only the four production paths\
      \ of this repair.\nfor target in backend/internal/service/openai_agent_replay_metadata.go backend/internal/service/openai_agent_message_recovery.go\
      \ backend/internal/service/openai_gateway_forward.go backend/internal/service/openai_ws_agent_recovery.go; do\n  git\
      \ show \"$baseline:$target\" > \"$target\"\n  expected=$(git rev-parse \"$baseline:$target\")\n  actual=$(git hash-object\
      \ \"$target\")\n  echo \"$target expected=$expected actual=$actual\" >> \"$RUNNER_TEMP/issue842/oauth-red-blobs.txt\"\
      \n  test \"$expected\" = \"$actual\"\ndone\nbash \"$GITHUB_WORKSPACE/scripts/prepare-ws-owner-red-fixtures.sh\" \"$baseline\"\
      \ . \"$EXPECTED_HEAD_SHA\" | tee \"$RUNNER_TEMP/issue842/ws-owner-oauth-red-blobs.txt\"\nfor target in backend/internal/handler/openai_issue842_oauth_repair_test.go\
      \ backend/internal/service/issue842_gateway_test_support.go; do\n  test \"$(git hash-object \"$target\")\" = \"$(git\
      \ rev-parse \"$EXPECTED_HEAD_SHA:$target\")\"\ndone\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\n\
      set +e\n(cd backend && go test -json -tags=unit ./internal/handler -run '^TestIssue842OAuthStateless(HTTP|WS)$' -count=1\
      \ -timeout=5m) > \"$RUNNER_TEMP/issue842/oauth-red.jsonl\" 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/issue842/oauth-red.jsonl\"\
      \ntest \"$result\" -ne 0\nif grep -Eiq 'build failed|no tests to run|undefined:|panic:|panic_recovered|fatal error:|runtime\
      \ error:|WARNING: DATA RACE|\"Action\":\"skip\"' \"$RUNNER_TEMP/issue842/oauth-red.jsonl\"; then exit 1; fi\npython3\
      \ - \"$RUNNER_TEMP/issue842/oauth-red.jsonl\" <<'PY'\nimport itertools, json, sys\nevents = [json.loads(line) for line\
      \ in open(sys.argv[1])]\nfailed = {e.get('Test') for e in events if e.get('Action') == 'fail'}\nfor stream, store, summary\
      \ in itertools.product(('false', 'true'), ('omitted', 'true'), ('omitted', 'null', 'nonempty')):\n    name = f'TestIssue842OAuthStatelessHTTP/oauth/stream={stream}/store={store}/summary={summary}'\n\
      \    assert name in failed, f'missing OAuth HTTP business RED: {name}'\n    output = ''.join(e.get('Output', '') for\
      \ e in events if e.get('Test') == name)\n    assert 'Issue842 OAuth stateless input must match immutable-source metadata\
      \ projection' in output, name\nfor mode, store, summary in itertools.product(('ctx_pool', 'passthrough', 'http_bridge'),\
      \ ('omitted', 'true'), ('omitted', 'null', 'nonempty')):\n    name = f'TestIssue842OAuthStatelessWS/{mode}/store={store}/summary={summary}'\n\
      \    assert name in failed, f'missing OAuth WS business RED: {name}'\n    output = ''.join(e.get('Output', '') for e\
      \ in events if e.get('Test') == name)\n    assert 'Issue842 OAuth WS stateless input must match immutable-source metadata\
      \ projection' in output, name\nPY\n"
  - name: Remote formatting gate
    run: test ! -s "$RUNNER_TEMP/issue842/format.patch"
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-issue842-replay-metadata-evidence-issue842-${{ env.EXPECTED_HEAD_SHA }}-${{ github.run_attempt }}
      path: ${{ runner.temp }}/issue842/
      if-no-files-found: error
