name: sync-20261116-oauth-initial-ws-screenshots-screenshots
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Prepare isolated screenshot browser
    run: 'npm install --prefix "$RUNNER_TEMP/oauth-ws-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      node "$RUNNER_TEMP/oauth-ws-browser/node_modules/playwright/cli.js" install --with-deps chromium

      '
    shell: bash
  - name: Capture actual component with fictional data
    env:
      EVIDENCE_DIR: ${{ runner.temp }}/oauth-initial-ws-${{ github.sha }}
      SUB2API_PLAYWRIGHT_MODULE: ${{ runner.temp }}/oauth-ws-browser/node_modules/playwright/index.mjs
    run: node scripts/oauth-initial-ws-preview.mjs "$GITHUB_WORKSPACE" "$EVIDENCE_DIR"
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-oauth-initial-ws-screenshots-screenshots-oauth-initial-ws-${{ github.sha }}
      path: ${{ runner.temp }}/oauth-initial-ws-${{ github.sha }}
      if-no-files-found: error
      retention-days: 30
