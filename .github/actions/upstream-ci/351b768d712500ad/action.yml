name: sync-20261116-issue715-agent-recovery-green
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Exact clean candidate GREEN
    run: 'set -euo pipefail

      git rev-parse HEAD

      test -z "$(git status --porcelain)"

      cd backend

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit ./internal/service ./internal/handler ./internal/repository -run ''^Test(Issue715|Issue758|AstraCodexToolCapabilities|EncryptedSticky|EncryptedPrioritySticky|OpenAIGatewayService_SelectAccountWithScheduler_Encrypted)''
      -count=1 -v -timeout=10m

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=integration ./internal/repository -run ''^TestGatewayCacheSuite$'' -testify.m ''^TestIssue715AgentOwnership$''
      -count=1 -v -timeout=5m

      '
    shell: bash
