name: sync-20261116-bps-function-code-branches-function-code-branches
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Verify regression rejects the original decoder
    shell: bash
    run: 'set -euo pipefail

      target=backend/internal/service/basispoints/function_code_transport.go

      cp "$target" "$RUNNER_TEMP/function-code-current.go"

      trap ''cp "$RUNNER_TEMP/function-code-current.go" "$target"'' EXIT

      git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git dc1e1b072faa53ec2e6f0925be39d5d024ec1687

      git show dc1e1b072faa53ec2e6f0925be39d5d024ec1687:"$target" > "$target"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test ./internal/service/basispoints -run ''^TestFunctionCode(TransportSchemaBranches|BranchStreamingIsAtomic)$''
      -count=1 -v) > "$RUNNER_TEMP/function-code-red.log" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/function-code-red.log"

      test "$result" -ne 0

      grep -q -- ''--- FAIL: TestFunctionCodeTransportSchemaBranches'' "$RUNNER_TEMP/function-code-red.log"

      grep -q -- ''--- FAIL: TestFunctionCodeBranchStreamingIsAtomic'' "$RUNNER_TEMP/function-code-red.log"

      '
  - name: Verify branch compatibility and existing BPS regressions
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test ./internal/service/basispoints -count=1 -v'
    shell: bash
