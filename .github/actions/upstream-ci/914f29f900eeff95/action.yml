name: sync-20261116-readable-continuation-409-http
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_phase:
    description: Upstream matrix parameter phase.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Install isolated Redis fixture
    run: "bash \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\nif ! command -v redis-server >/dev/null; then\n  bash\
      \ \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\n  sudo apt-get update\n  sudo apt-get install -y --no-install-recommends\
      \ redis-server\nfi\n"
    shell: bash
  - name: Pin candidate and unchanged behavioral test
    env:
      PHASE: ${{ inputs.sync_matrix_phase }}
    run: "set -euo pipefail\ngit diff --exit-code\ntest -z \"$(git status --porcelain)\"\ngit rev-parse HEAD > \"$RUNNER_TEMP/readable-$PHASE-provenance.txt\"\
      \nfor target in backend/internal/handler/openai_409_readable_continuation_test.go backend/internal/handler/openai_responses_failover_cancel_test.go;\
      \ do\n  test \"$(git hash-object \"$target\")\" = \"$(git rev-parse \"HEAD:$target\")\"\n  git rev-parse \"HEAD:$target\"\
      \ >> \"$RUNNER_TEMP/readable-$PHASE-provenance.txt\"\ndone\n"
    shell: bash
  - name: Restore fixed production blob in RED checkout only
    if: matrix.phase == 'RED'
    run: "set -euo pipefail\nbaseline=dbed7697aa56e76c6eb48c4914fa441496b67bdd\n# Restore the matching production callers\
      \ too: later HTTP rebuild\n# APIs must not turn the original reasoning RED into a compile error.\nfor target in backend/internal/service/openai_409_omit_history.go\
      \ backend/internal/service/openai_agent_message_recovery.go backend/internal/service/openai_agent_message_delivery.go\
      \ backend/internal/service/openai_agent_message_recovery_error.go backend/internal/service/openai_account_scheduler.go\
      \ backend/internal/service/openai_gateway_forward.go backend/internal/service/openai_codex_transform.go backend/internal/handler/openai_gateway_handler.go\
      \ backend/internal/handler/openai_agent_message_recovery.go; do\n  git show \"$baseline:$target\" > \"$target\"\n  test\
      \ \"$(git hash-object \"$target\")\" = \"$(git rev-parse \"$baseline:$target\")\"\n  git rev-parse \"$baseline:$target\"\
      \ >> \"$RUNNER_TEMP/readable-RED-provenance.txt\"\ndone\n# Future shadow calls/fields do not exist in this original\
      \ baseline.\nfor target in backend/internal/service/openai_ws_agent_recovery.go backend/internal/service/openai_ws_forwarder_ingress.go\
      \ backend/internal/service/openai_ws_v2_passthrough_adapter.go backend/internal/service/openai_ws_http_bridge.go; do\n\
      \  git show \"$baseline:$target\" > \"$target\"\n  test \"$(git hash-object \"$target\")\" = \"$(git rev-parse \"$baseline:$target\"\
      )\"\ndone\nif git cat-file -e \"$baseline:backend/internal/service/openai_ws_readable_continuation.go\" 2>/dev/null;\
      \ then exit 1; fi\nrm -- backend/internal/service/openai_ws_readable_continuation.go\n# Keep the selected HTTP tests\
      \ intact and remove only new production.\nfor target in backend/internal/service/openai_409_readable_shadow.go backend/internal/repository/gateway_cache_readable_shadow.go\
      \ backend/internal/repository/gateway_cache_agent_shadow_epoch.go backend/internal/service/openai_400_omit_history.go\
      \ backend/internal/service/openai_history_omission.go; do\n  if git cat-file -e \"$baseline:$target\" 2>/dev/null; then\
      \ exit 1; fi\n  rm -- \"$target\"\ndone\n# This later helper is not part of the pinned recovery defect. Its\n# pre-OAuth-projection\
      \ API is compatible with the restored struct;\n# preserve every selected defect/caller blob and behavioral assertion.\n\
      compatibility=00d2e9be01404c6e85c0560fa196e4650ef5d0fb\ntarget=backend/internal/service/openai_agent_replay_metadata.go\n\
      if git cat-file -e \"$baseline:$target\" 2>/dev/null; then exit 1; fi\ngit fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git\
      \ \"$compatibility\"\ncandidate_blob=$(git rev-parse \"HEAD:$target\")\ntest \"$(git hash-object \"$target\")\" = \"\
      $candidate_blob\"\nexpected=$(git rev-parse \"$compatibility:$target\")\ngit show \"$compatibility:$target\" > \"$target\"\
      \nactual=$(git hash-object \"$target\")\ntest \"$actual\" = \"$expected\"\necho \"$target defect_source=$baseline defect_blob=absent\
      \ compatibility=$compatibility candidate=$candidate_blob expected=$expected actual=$actual\" >> \"$RUNNER_TEMP/readable-RED-provenance.txt\"\
      \nbash \"$GITHUB_WORKSPACE/scripts/prepare-ws-owner-red-fixtures.sh\" \"$baseline\" . HEAD | tee \"$RUNNER_TEMP/readable-ws-owner-red-blobs.txt\"\
      \n"
    shell: bash
  - name: Same HTTP JSON and SSE behavior in both checkouts
    env:
      PHASE: ${{ inputs.sync_matrix_phase }}
    shell: bash
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -race -json -tags=unit ./internal/handler -run ''^TestOpenAI409ReadableContinuationHTTP$'' -count=1
      -timeout=5m) > "$RUNNER_TEMP/readable-$PHASE.jsonl" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/readable-$PHASE.jsonl"

      python3 scripts/assert-readable-continuation.py "$PHASE" "$result" "$RUNNER_TEMP/readable-$PHASE.jsonl"

      '
  - name: GREEN omission and delivery safeguards
    if: matrix.phase == 'GREEN'
    working-directory: backend
    shell: bash
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit ./internal/service ./internal/handler ./internal/handler/admin -run ''^Test(OmitOpenAIHistorical|OpenAI409(OmitHistory|Replay|Omission|ReadableReasoning|Rebuild|OAuth)|UpdateSettingsOpenAI409|Issue715(OutputPending|PendingLookup|ObservedPending|HTTPFailedDelivery|HTTPRecoveryKeepsHardRestrictions|HTTPRecoveryCannotBypassLongContext|HTTPPartialOutput))''
      -count=1 -v -timeout=5m 2>&1 | tee "$RUNNER_TEMP/readable-GREEN-safeguards.log"

      python3 ../scripts/assert-readable-continuation.py --clean-log "$RUNNER_TEMP/readable-GREEN-safeguards.log"

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-readable-continuation-409-http-readable-continuation-${{ inputs.sync_matrix_phase }}-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/readable-*
      if-no-files-found: error
