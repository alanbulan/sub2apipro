name: sync-20261116-pr610-queue-timing-behavior
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: GREEN clean exact candidate, authenticated synthetic network and clock barriers
    run: 'set -euo pipefail

      test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"

      test -z "$(git status --porcelain)"

      echo "green_exact_head=$SOURCE_HEAD"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -tags=unit ./internal/handler ./internal/service -run ''^TestPR610'' -count=1 -v -timeout=8m)
      2>&1 | tee "$RUNNER_TEMP/pr610-green.log"

      ! grep -E -- ''--- SKIP:|no tests to run'' "$RUNNER_TEMP/pr610-green.log"

      grep -F -- ''--- PASS: TestPR610AuthenticatedTurnsCountWaitOnce'' "$RUNNER_TEMP/pr610-green.log"

      grep -F -- ''--- PASS: TestPR610BridgeRejectedFieldRetryKeepsLegacyDenominator'' "$RUNNER_TEMP/pr610-green.log"

      '
    shell: bash
  - name: PostgreSQL measured cohorts, full migration runner and joint upgrade
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -tags=integration ./internal/repository -run ''^TestPR610'' -count=1 -v -timeout=8m) 2>&1 | tee
      "$RUNNER_TEMP/pr610-postgres.log"

      ! grep -E -- ''--- SKIP:|no tests to run'' "$RUNNER_TEMP/pr610-postgres.log"

      grep -F -- ''--- PASS: TestPR610MeasuredCohortPreservesLegacyOperations'' "$RUNNER_TEMP/pr610-postgres.log"

      grep -F -- ''--- PASS: TestPR610Migrations320321322JointUpgradeIdempotencyAndLegacyRead'' "$RUNNER_TEMP/pr610-postgres.log"

      '
    shell: bash
  - name: RED frozen defective production blobs in disposable checkout, wall-clock behavioral assertions
    run: "set -euo pipefail\nold=\"$RUNNER_TEMP/pr610-red\"\ngit worktree add --detach \"$old\" \"$SOURCE_HEAD\"\ntrap 'git\
      \ worktree remove --force \"$old\"' EXIT\nfiles=(backend/internal/handler/openai_gateway_handler.go backend/internal/service/openai_ws_forwarder_ingress.go\
      \ backend/internal/service/openai_ws_http_bridge.go backend/internal/service/openai_ws_v2_passthrough_adapter.go backend/internal/repository/upstream_operations.go\
      \ backend/internal/repository/profit_operations.go backend/internal/repository/channel_operations_stats.go)\ngit -C\
      \ \"$old\" restore --source=\"$BASELINE\" -- \"${files[@]}\"\nfor file in \"${files[@]}\"; do\n  test \"$(git -C \"\
      $old\" hash-object \"$file\")\" = \"$(git rev-parse \"$BASELINE:$file\")\"\n  echo \"red_blob=$BASELINE:$file $(git\
      \ -C \"$old\" hash-object \"$file\")\"\ndone\nfor testname in TestPR610RealWaitNativeIngress TestPR610RealBridgeRetryDenominator\
      \ TestPR610RealCtxPoolRetryKeepsFinalAttemptScope; do\n  python3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" \"\
      $old/backend\"\n  set +e\n  (cd \"$old/backend\" && go test -tags=unit ./internal/handler -run \"^$testname$\" -count=1\
      \ -v -timeout=5m) > \"$RUNNER_TEMP/pr610-red-$testname.log\" 2>&1\n  result=$?\n  set -e\n  cat \"$RUNNER_TEMP/pr610-red-$testname.log\"\
      \n  test \"$result\" -ne 0\n  ! grep -E -- 'build failed|undefined:|no tests to run|panic:|setup failed|--- SKIP:' \"\
      $RUNNER_TEMP/pr610-red-$testname.log\"\n  grep -F -- \"--- FAIL: $testname\" \"$RUNNER_TEMP/pr610-red-$testname.log\"\
      \ndone\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" \"$old/backend\"\nset +e\n(cd \"$old/backend\" && go\
      \ test -tags=integration ./internal/repository -run '^TestPR610MeasuredCohortPreservesLegacyOperations$' -count=1 -v\
      \ -timeout=8m) > \"$RUNNER_TEMP/pr610-red-operations.log\" 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/pr610-red-operations.log\"\
      \ntest \"$result\" -ne 0\n! grep -E -- 'build failed|undefined:|no tests to run|panic:|setup failed|--- SKIP:' \"$RUNNER_TEMP/pr610-red-operations.log\"\
      \ngrep -F -- '--- FAIL: TestPR610MeasuredCohortPreservesLegacyOperations' \"$RUNNER_TEMP/pr610-red-operations.log\"\n\
      grep -F 'legacy operations TTFT must retain its original population and values' \"$RUNNER_TEMP/pr610-red-operations.log\"\
      \ngrep -F 'accepted frame must count real blocked acquisition before forward' \"$RUNNER_TEMP/pr610-red-TestPR610RealWaitNativeIngress.log\"\
      \ngrep -F 'rejected-field network time must stay in legacy TPS denominator' \"$RUNNER_TEMP/pr610-red-TestPR610RealBridgeRetryDenominator.log\"\
      \ngrep -F 'ctx_pool retry retains accepted frame and pre-final-forward scope' \"$RUNNER_TEMP/pr610-red-TestPR610RealCtxPoolRetryKeepsFinalAttemptScope.log\"\
      \nfor file in \"${files[@]}\"; do test \"$(git -C \"$old\" hash-object \"$file\")\" = \"$(git rev-parse \"$BASELINE:$file\"\
      )\"; done\ntest -z \"$(git status --porcelain)\"\n"
    shell: bash
  - name: Race check for actual turn boundary lifetimes
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -race -tags=unit ./internal/handler -run ''^TestPR610'' -count=1 -v -timeout=8m) 2>&1 | tee "$RUNNER_TEMP/pr610-race.log"

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-pr610-queue-timing-behavior-pr610-behavior-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: ${{ runner.temp }}/pr610-*.log
