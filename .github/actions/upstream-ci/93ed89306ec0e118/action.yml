name: sync-20261116-issue-582-regression-regression
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_redis:
    description: Upstream matrix parameter redis.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Install Redis binary for existing readiness adapter test
    run: 'bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      sudo apt-get update

      sudo apt-get install -y --no-install-recommends redis-server

      '
    shell: bash
  - name: Assert exact head and static formatting
    run: 'set -euo pipefail

      test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      git rev-parse HEAD

      git diff --check

      test -z "$(git diff --diff-filter=ACMRT --name-only 08d69a522 HEAD -- ''*.go'' | xargs -r gofmt -l)"

      '
    shell: bash
  - name: Real Redis 6.0 baseline RED
    if: inputs.sync_matrix_redis == '6.0'
    run: bash scripts/issue-582-red.sh
    shell: bash
  - name: Exact head real Redis snapshot, outbox, queue and session behavior
    working-directory: backend
    run: 'set -euo pipefail

      git diff --exit-code

      test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=integration ./internal/repository -run ''^(TestIssue582|TestUserMsgQueueCacheSuite|TestConcurrencyCacheSuite|TestSchedulerCache|TestSchedulerSnapshotOutboxReplay)''
      -count=1 -v | tee "$RUNNER_TEMP/issue-582-real-redis.log"

      ! grep -E -- ''--- SKIP: TestIssue582'' "$RUNNER_TEMP/issue-582-real-redis.log"

      '
    shell: bash
  - name: Preserve scheduler memo, fencing and failure protections
    working-directory: backend
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit ./internal/repository -run ''^Test(Scheduler|APIKeyCacheIncrementCreateCount)'' -count=1 -v
      | tee "$RUNNER_TEMP/issue-582-scheduler-unit.log"

      '
    shell: bash
  - name: Session, IP risk and serverless regressions
    working-directory: backend
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit ./internal/pkg/redissession ./internal/pkg/rediscompat ./internal/iprisk ./internal/serverless
      -count=1 -v | tee "$RUNNER_TEMP/issue-582-audit-unit.log"

      '
    shell: bash
  - uses: actions/upload-artifact@v6
    if: always()
    with:
      name: sync-20261116-issue-582-regression-regression-issue-582-${{ inputs.sync_matrix_redis }}-${{ github.event_name
        }}-${{ github.event.pull_request.head.sha || github.sha }}
      path: ${{ runner.temp }}/issue-582-*.log
