name: sync-20261116-openai-sse-delivery-frontend
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm install --frozen-lockfile
    working-directory: frontend
    shell: bash
  - name: Usage timing and new feature notice regressions
    working-directory: frontend
    run: pnpm test:run src/components/admin/usage/__tests__/UsageTable.spec.ts src/components/admin/usage/__tests__/UsageTimingDialog.spec.ts
      src/components/common/__tests__/NewFeatureBadge.spec.ts src/views/admin/__tests__/UsageView.spec.ts src/__tests__/integration/usage-reasoning-effort.spec.ts
    shell: bash
  - name: Locale completeness, typecheck and production build
    working-directory: frontend
    run: pnpm build
    shell: bash
