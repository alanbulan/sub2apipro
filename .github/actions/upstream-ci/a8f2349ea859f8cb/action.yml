name: sync-20261116-oauth429-weekly-only-red
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Restore only affected production source in disposable checkout
    shell: bash
    run: "set -euo pipefail\nmkdir -p evidence\ntest \"$(git rev-parse HEAD)\" = \"$CANDIDATE\"\ngit rev-parse HEAD HEAD^{tree}\
      \ > evidence/candidate.txt\ngit diff --exit-code\ngit worktree add --detach \"$RUNNER_TEMP/oauth429-red\" \"$CANDIDATE\"\
      \nwhile read -r expected target; do\n  test \"$(git rev-parse \"$BASELINE:$target\")\" = \"$expected\"\n  candidate_blob=$(git\
      \ rev-parse \"$CANDIDATE:$target\")\n  git show \"$BASELINE:$target\" > \"$RUNNER_TEMP/oauth429-red/$target\"\n  actual=$(git\
      \ hash-object \"$RUNNER_TEMP/oauth429-red/$target\")\n  test \"$actual\" = \"$expected\"\n  printf '%s %s %s\\n' \"\
      $BASELINE\" \"$actual\" \"$target\" >> evidence/restored-blobs.txt\n  printf '%s %s %s\\n' \"$CANDIDATE\" \"$candidate_blob\"\
      \ \"$target\" >> evidence/candidate-source-blobs.txt\ndone <<'BLOBS'\nab9d5251a4acec7c17b0adb0f21ae59a71f89067 backend/internal/service/openai_disable_scheduling_429.go\n\
      849aec6c598b9ca5e94f218f76e7d7266505ae57 backend/internal/service/openai_gateway_service.go\n9fb1903315d1f086f4f38bd73a5a0a5f69f6542a\
      \ backend/internal/service/openai_gateway_usage.go\n9dfffb6d6280278c5c21015ddffad12b706efa5c backend/internal/service/openai_ws_forwarder_support.go\n\
      aa0c3dafdf9e9e3f5ec78467fa08899c67e9ec89 backend/internal/service/openai_gateway_passthrough.go\n3af551183471cd0ac3b2a6baa27aa506975dce96\
      \ backend/internal/service/openai_ws_forwarder_v2.go\nfcff9837e12c0aa9c3ea3e22724f923890681fe1 backend/internal/service/openai_ws_forwarder_ingress.go\n\
      aee0bb83694c375d5baf431db916ea093a1658f4 backend/internal/service/openai_ws_v2_passthrough_adapter.go\n0f83bd1fcfcf9d585c4fda999cce71bb7154451f\
      \ backend/internal/service/openai_plugin_transport.go\nfc1490884a556ef7518786c770fbd73a237155da backend/internal/service/openai_gateway_response_handling.go\n\
      ed1708f3c2ee470d80ab97b377ff610050e383fc backend/internal/service/openai_ws_http_bridge.go\n0e4455ea613b07f2775c793346bd0b8fa0257fd5\
      \ backend/internal/service/openai_quota_service.go\n26744ab312ed9552b375487d34052fd8b7f28da1 backend/internal/service/openai_quota_usage_snapshot.go\n\
      BLOBS\ngit ls-files 'backend/internal/service/*429*test.go' 'backend/internal/repository/oauth429_weekly_only*test.go'\
      \ > evidence/retained-tests.txt\nwhile IFS= read -r test_file; do\n  candidate_blob=$(git hash-object \"$test_file\"\
      )\n  red_blob=$(git hash-object \"$RUNNER_TEMP/oauth429-red/$test_file\")\n  test \"$candidate_blob\" = \"$red_blob\"\
      \n  printf '%s %s\\n' \"$candidate_blob\" \"$test_file\" >> evidence/retained-test-blobs.txt\ndone < evidence/retained-tests.txt\n\
      git -C \"$RUNNER_TEMP/oauth429-red\" diff --exit-code -- '*_test.go'\n# The retained helper references the new storage\
      \ field. Add only that\n# zero-value field after proving every original production blob above.\nbash scripts/oauth429-weekly-only-bridge-compat.sh\
      \ \"$RUNNER_TEMP/oauth429-red\" \"$BASELINE\" | tee evidence/bridge-compat.txt\npython3 scripts/prepare-openai-usage-red-compat.py\
      \ \"$RUNNER_TEMP/oauth429-red\" \"$BASELINE\" | tee evidence/usage-compat.json\n# This later, unrelated regression requires\
      \ the candidate-only WS\n# stream-phase helper. Exclude it only from this disposable old-source\n# checkout; GREEN explicitly\
      \ runs all six tests with candidate sources.\nexcluded=backend/internal/service/temp_unsched_pending_test.go\nif git\
      \ cat-file -e \"$BASELINE:$excluded\" 2>/dev/null; then echo 'historical-exclusion-baseline-present' >&2; exit 1; fi\n\
      candidate_blob=$(git rev-parse \"$CANDIDATE:$excluded\")\ntest \"$(git hash-object \"$RUNNER_TEMP/oauth429-red/$excluded\"\
      )\" = \"$candidate_blob\"\nif grep -q '^func TestOAuth429WeeklyOnly' \"$excluded\"; then echo 'historical-exclusion-target-regression'\
      \ >&2; exit 1; fi\nrm -- \"$RUNNER_TEMP/oauth429-red/$excluded\"\ntest ! -e \"$RUNNER_TEMP/oauth429-red/$excluded\"\n\
      printf '%s baseline=absent candidate=%s red=absent reason=candidate-only-WS-stream-phase-helper\\n' \"$excluded\" \"\
      $candidate_blob\" > evidence/excluded-tests.txt\ngit -C \"$RUNNER_TEMP/oauth429-red\" diff --exit-code -- '*_test.go'\
      \ \":!$excluded\"\ngit -C \"$RUNNER_TEMP/oauth429-red\" diff --stat > evidence/red-diff.txt\n"
  - name: Require behavioral RED from unchanged service regressions
    shell: bash
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$RUNNER_TEMP/oauth429-red/backend"

      set +e

      (cd "$RUNNER_TEMP/oauth429-red/backend" && go test -json -tags=unit ./internal/service -run ''^TestOAuth429WeeklyOnly''
      -count=1 -timeout=10m) > evidence/red.jsonl 2> evidence/red.stderr

      result=$?

      set -e

      printf ''%s\n'' "$result" > evidence/red-exit.txt

      python3 scripts/oauth429-weekly-only-evidence.py red evidence/red.jsonl "$result"

      '
  - name: Isolate rejected-header cache poisoning with original parser sources
    shell: bash
    run: "set -euo pipefail\ngit worktree add --detach \"$RUNNER_TEMP/oauth429-cache-red\" \"$CANDIDATE\"\nwhile read -r expected\
      \ target; do\n  test \"$(git rev-parse \"$BASELINE:$target\")\" = \"$expected\"\n  git show \"$BASELINE:$target\" >\
      \ \"$RUNNER_TEMP/oauth429-cache-red/$target\"\n  test \"$(git hash-object \"$RUNNER_TEMP/oauth429-cache-red/$target\"\
      )\" = \"$expected\"\n  printf '%s %s %s\\n' \"$BASELINE\" \"$expected\" \"$target\" >> evidence/cache-restored-blobs.txt\n\
      done <<'BLOBS'\n9fb1903315d1f086f4f38bd73a5a0a5f69f6542a backend/internal/service/openai_gateway_usage.go\nBLOBS\ngit\
      \ -C \"$RUNNER_TEMP/oauth429-cache-red\" diff --exit-code -- '*_test.go'\ngit -C \"$RUNNER_TEMP/oauth429-cache-red\"\
      \ diff --stat > evidence/cache-red-diff.txt\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" \"$RUNNER_TEMP/oauth429-cache-red/backend\"\
      \nset +e\n(cd \"$RUNNER_TEMP/oauth429-cache-red/backend\" && go test -json -tags=unit ./internal/service -run '^TestOAuth429WeeklyOnly(SequentialCache|NonweeklyPersistenceRetainsEvidence)$'\
      \ -count=1 -timeout=10m) > evidence/red-cache.jsonl 2> evidence/red-cache.stderr\nresult=$?\nset -e\nprintf '%s\\n'\
      \ \"$result\" > evidence/red-cache-exit.txt\npython3 scripts/oauth429-weekly-only-evidence.py red-cache evidence/red-cache.jsonl\
      \ \"$result\"\n"
  - name: Retained HTTP evidence without receipt-time binding must fail expiry regression
    shell: bash
    run: "set -euo pipefail\nbefore=d93943307125aa239fae94a6cc719e03c1c1b3ff\ngit worktree add --detach \"$RUNNER_TEMP/oauth429-expiry-red\"\
      \ \"$CANDIDATE\"\nwhile read -r expected target; do\n  test \"$(git rev-parse \"$before:$target\")\" = \"$expected\"\
      \n  git show \"$before:$target\" > \"$RUNNER_TEMP/oauth429-expiry-red/$target\"\n  test \"$(git hash-object \"$RUNNER_TEMP/oauth429-expiry-red/$target\"\
      )\" = \"$expected\"\n  printf '%s %s %s\\n' \"$before\" \"$expected\" \"$target\" >> evidence/expiry-restored-blobs.txt\n\
      done <<'BLOBS'\nfc1490884a556ef7518786c770fbd73a237155da backend/internal/service/openai_gateway_response_handling.go\n\
      c1833fc0e65a9e4951418de52658e343f14593f0 backend/internal/service/openai_gateway_passthrough.go\ned1708f3c2ee470d80ab97b377ff610050e383fc\
      \ backend/internal/service/openai_ws_http_bridge.go\nBLOBS\ngit -C \"$RUNNER_TEMP/oauth429-expiry-red\" diff --exit-code\
      \ -- '*_test.go'\nbash scripts/oauth429-weekly-only-bridge-compat.sh \"$RUNNER_TEMP/oauth429-expiry-red\" \"$before\"\
      \ | tee evidence/expiry-bridge-compat.txt\ngit -C \"$RUNNER_TEMP/oauth429-expiry-red\" diff --stat > evidence/expiry-red-diff.txt\n\
      python3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" \"$RUNNER_TEMP/oauth429-expiry-red/backend\"\nset +e\n(cd \"\
      $RUNNER_TEMP/oauth429-expiry-red/backend\" && go test -json -tags=unit ./internal/service -run '^TestOAuth429WeeklyOnlyHTTPStreamExpiredObservation$'\
      \ -count=1 -timeout=10m) > evidence/red-http-expiry.jsonl 2> evidence/red-http-expiry.stderr\nresult=$?\nset -e\nprintf\
      \ '%s\\n' \"$result\" > evidence/red-http-expiry-exit.txt\npython3 scripts/oauth429-weekly-only-evidence.py red-http-expiry\
      \ evidence/red-http-expiry.jsonl \"$result\"\n"
  - name: Original quota-query persistence must fail against real PostgreSQL
    shell: bash
    env:
      CI: 'true'
    run: 'set -euo pipefail

      git worktree add --detach "$RUNNER_TEMP/oauth429-query-red" "$CANDIDATE"

      target=backend/internal/service/openai_quota_usage_snapshot.go

      expected=26744ab312ed9552b375487d34052fd8b7f28da1

      test "$(git rev-parse "$BASELINE:$target")" = "$expected"

      git show "$BASELINE:$target" > "$RUNNER_TEMP/oauth429-query-red/$target"

      test "$(git hash-object "$RUNNER_TEMP/oauth429-query-red/$target")" = "$expected"

      printf ''%s %s %s\n'' "$BASELINE" "$expected" "$target" > evidence/query-restored-blobs.txt

      git -C "$RUNNER_TEMP/oauth429-query-red" diff --exit-code -- ''*_test.go''

      git -C "$RUNNER_TEMP/oauth429-query-red" diff --stat > evidence/query-red-diff.txt

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$RUNNER_TEMP/oauth429-query-red/backend"

      set +e

      (cd "$RUNNER_TEMP/oauth429-query-red/backend" && go test -json -tags=integration ./internal/repository -run ''^TestOAuth429WeeklyOnlyQueryUsageSupersedesEvidence$''
      -count=1 -timeout=10m) > evidence/red-query.jsonl 2> evidence/red-query.stderr

      result=$?

      set -e

      printf ''%s\n'' "$result" > evidence/red-query-exit.txt

      python3 scripts/oauth429-weekly-only-evidence.py red-query evidence/red-query.jsonl "$result"

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-oauth429-weekly-only-red-oauth429-red-${{ github.event.pull_request.head.sha || github.sha }}
      path: evidence/
      if-no-files-found: error
