name: sync-20261116-ws-unsent-delta-takeover
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_phase:
    description: Upstream matrix parameter phase.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Redis fixture dependency
    run: "if ! command -v redis-server >/dev/null; then\n  bash \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\n  sudo\
      \ apt-get update\n  sudo apt-get install -y --no-install-recommends redis-server\nfi\n"
    shell: bash
  - name: Exact baseline implementation for RED
    if: inputs.sync_matrix_phase == 'RED'
    run: "for target in backend/internal/service/openai_ws_agent_recovery.go backend/internal/service/openai_ws_forwarder_ingress.go\
      \ backend/internal/service/openai_ws_readable_continuation.go backend/internal/service/openai_ws_http_bridge.go; do\n\
      \  git show \"2927209f5492d8cb690b83a1964b2f093c19ad7a:$target\" > \"$target\"\n  test \"$(git hash-object \"$target\"\
      )\" = \"$(git rev-parse \"2927209f5492d8cb690b83a1964b2f093c19ad7a:$target\")\"\ndone\npython3 scripts/prepare-discovery-red-compat.py\
      \ 2927209f5492d8cb690b83a1964b2f093c19ad7a . HEAD --target ws --fixture backend/internal/handler/openai_ws_unsent_delta_test.go\
      \ --manifest \"$RUNNER_TEMP/unsent-delta-compatibility.json\"\n"
    shell: bash
  - name: Same socket, account pause, result delta and next turn
    env:
      PHASE: ${{ inputs.sync_matrix_phase }}
    shell: bash
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\nset +e\n(cd backend && go test\
      \ -race -json -tags=unit,unsentdelta ./internal/handler -run '^TestOpenAIWS(UnsentDelta(Takeover|Fences)|BridgeNormalizedDeltaID)$'\
      \ -count=1 -timeout=5m) > \"$RUNNER_TEMP/unsent-delta.jsonl\" 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/unsent-delta.jsonl\"\
      \npython3 scripts/assert-readable-continuation.py --clean-log \"$RUNNER_TEMP/unsent-delta.jsonl\"\npython3 - \"$PHASE\"\
      \ \"$result\" \"$RUNNER_TEMP/unsent-delta.jsonl\" <<'PY'\nimport json,sys\nphase,status,path=sys.argv[1],int(sys.argv[2]),sys.argv[3]\n\
      rows=[json.loads(l) for l in open(path) if l.startswith('{')]\noutcomes={r.get('Test'):r['Action'] for r in rows if\
      \ r.get('Action') in ('pass','fail','skip') and r.get('Test')}\nmodes=('http_bridge','ctx_pool','shared','dedicated','passthrough')\n\
      expected={f'TestOpenAIWSUnsentDeltaTakeover/{m}/turn_{n}' for m in modes for n in (2,53)}\nnormalized={f'TestOpenAIWSBridgeNormalizedDeltaID/{id}'\
      \ for id in ('foreign-provider-id','ctc_original_output')}\nexpected |= normalized\nfences={f'TestOpenAIWSUnsentDeltaFences/{m}/{f}'\
      \ for m in ('http_bridge','ctx_pool','passthrough') for f in ('unknown_pointer','unknown_call','terminal_excludes','beta_off')}\n\
      assert all(outcomes.get(n)=='pass' for n in fences),outcomes\nif phase=='RED':\n    assert status!=0 and all(outcomes.get(n)=='fail'\
      \ for n in expected),outcomes\n    for name in expected:\n        assert ('NORMALIZED_DELTA_REFUSED' if name in normalized\
      \ else 'UNSENT_DELTA_NOT_RESUMED') in ''.join(r.get('Output','') for r in rows if r.get('Test')==name),name\nelse:\n\
      \    assert status==0 and all(outcomes.get(n)=='pass' for n in expected),outcomes\n    assert not any(a in ('fail','skip')\
      \ for a in outcomes.values()),outcomes\nPY\n"
  - name: GREEN delivery scope and memory release
    if: inputs.sync_matrix_phase == 'GREEN'
    shell: bash
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -race -json -tags=unit,unsentdelta ./internal/service -run ''^TestOpenAIWSUnsentDeltaDeliveryScope$''
      -count=1 -timeout=2m) | tee "$RUNNER_TEMP/unsent-delta-guards.jsonl"

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-ws-unsent-delta-takeover-unsent-delta-${{ inputs.sync_matrix_phase }}-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: '${{ runner.temp }}/unsent-delta*.jsonl

        ${{ runner.temp }}/unsent-delta-compatibility.json

        '
      if-no-files-found: error
