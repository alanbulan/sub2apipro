name: sync-20261116-bps-search-search-protocol
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Record exact candidate and baseline source identities
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    shell: bash
    run: 'set -euo pipefail

      test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      git diff --exit-code HEAD

      test -z "$(git status --porcelain)"

      evidence_dir="$RUNNER_TEMP/issue871-evidence"

      baseline_sha=ff1082fd51038f10dcb3a8ecb1d5a738258b0f66

      mkdir -p "$evidence_dir"

      git rev-parse HEAD HEAD^{tree} HEAD^ > "$evidence_dir/candidate.txt"

      git rev-parse "$baseline_sha" "$baseline_sha^{tree}" > "$evidence_dir/baseline.txt"

      git ls-tree -r HEAD -- backend .github/workflows/bps-search.yml scripts/issue871-evidence.py scripts/test_issue871_evidence.py
      > "$evidence_dir/candidate-blobs.txt"

      git ls-tree -r "$baseline_sha" -- backend > "$evidence_dir/baseline-blobs.txt"

      cp scripts/issue871-evidence.py scripts/test_issue871_evidence.py "$evidence_dir/"

      '
  - name: Validate behavioral evidence gate mutations
    run: python3 -m unittest discover -s scripts -p 'test_issue871_evidence.py'
    shell: bash
  - name: RED isolated production baseline with candidate standalone diagnostics fixture
    shell: bash
    run: 'set -euo pipefail

      evidence_dir="$RUNNER_TEMP/issue871-evidence"

      baseline_sha=ff1082fd51038f10dcb3a8ecb1d5a738258b0f66

      fixture_path=backend/internal/service/openai_excel_bps_search_diagnostics_test.go

      git worktree add --detach "$RUNNER_TEMP/issue871-red" "$baseline_sha"

      test "$(git -C "$RUNNER_TEMP/issue871-red" rev-parse HEAD)" = "$baseline_sha"

      git show "HEAD:$fixture_path" > "$RUNNER_TEMP/issue871-red/$fixture_path"

      git rev-parse "HEAD:$fixture_path" > "$evidence_dir/fixture-blob.txt"

      test "$(git hash-object "$RUNNER_TEMP/issue871-red/$fixture_path")" = "$(git rev-parse "HEAD:$fixture_path")"

      cp "$RUNNER_TEMP/issue871-red/$fixture_path" "$evidence_dir/standalone-diagnostics_test.go"

      git -C "$RUNNER_TEMP/issue871-red" status --short > "$evidence_dir/red-status.txt"

      git -C "$RUNNER_TEMP/issue871-red" diff --exit-code HEAD

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$RUNNER_TEMP/issue871-red/backend"

      set +e

      (cd "$RUNNER_TEMP/issue871-red/backend" && go test -tags=unit ./internal/service -run ''^TestExcelBPSSearchDiagnosticsThroughForward$/^search_403$/^json$''
      -count=1 -json -timeout=5m) > "$evidence_dir/red.jsonl" 2> "$evidence_dir/red.stderr"

      test_status=$?

      set -e

      printf ''%s\n'' "$test_status" > "$evidence_dir/red-exit.txt"

      python3 scripts/issue871-evidence.py RED "$test_status" "$evidence_dir/red.jsonl" "$evidence_dir/red.stderr"

      test "$(git -C "$RUNNER_TEMP/issue871-red" rev-parse HEAD)" = "$baseline_sha"

      git -C "$RUNNER_TEMP/issue871-red" diff --exit-code HEAD

      '
  - name: GREEN clean exact candidate diagnosis boundary
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    shell: bash
    run: 'set -euo pipefail

      evidence_dir="$RUNNER_TEMP/issue871-evidence"

      test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      git diff --exit-code HEAD

      test -z "$(git status --porcelain)"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -race -tags=unit ./internal/service -run ''^TestExcelBPSSearchDiagnosticsThroughForward$/^search_403$/^json$''
      -count=1 -json -timeout=5m) > "$evidence_dir/green.jsonl" 2> "$evidence_dir/green.stderr"

      test_status=$?

      set -e

      printf ''%s\n'' "$test_status" > "$evidence_dir/green-exit.txt"

      python3 scripts/issue871-evidence.py GREEN "$test_status" "$evidence_dir/green.jsonl" "$evidence_dir/green.stderr"

      test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      git diff --exit-code HEAD

      test -z "$(git status --porcelain)"

      '
  - name: RED business continuation on pinned current production baseline
    shell: bash
    run: 'set -euo pipefail

      evidence_dir="$RUNNER_TEMP/issue871-evidence"

      baseline_sha=da526bfbab47efd40549cab98f1069f9b2b45b9f

      fixture_path=backend/internal/service/openai_excel_bps_search_business_test.go

      red_dir="$RUNNER_TEMP/issue871-business-red"

      git worktree add --detach "$red_dir" "$baseline_sha"

      test "$(git -C "$red_dir" rev-parse HEAD)" = "$baseline_sha"

      git rev-parse "$baseline_sha" "$baseline_sha^{tree}" > "$evidence_dir/business-baseline.txt"

      git ls-tree -r "$baseline_sha" -- backend > "$evidence_dir/business-baseline-blobs.txt"

      git show "HEAD:$fixture_path" > "$red_dir/$fixture_path"

      git rev-parse "HEAD:$fixture_path" > "$evidence_dir/business-fixture-blob.txt"

      test "$(git hash-object "$red_dir/$fixture_path")" = "$(git rev-parse "HEAD:$fixture_path")"

      cp "$red_dir/$fixture_path" "$evidence_dir/business_test.go"

      git -C "$red_dir" status --short > "$evidence_dir/business-red-status.txt"

      test "$(git -C "$red_dir" status --porcelain)" = "?? $fixture_path"

      git -C "$red_dir" diff --exit-code HEAD

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$red_dir/backend"

      set +e

      (cd "$red_dir/backend" && go test -tags=unit ./internal/service -run ''^TestExcelBPSSearchBusinessThroughForward$/^direct$/^json$''
      -count=1 -json -timeout=5m) > "$evidence_dir/business-red.jsonl" 2> "$evidence_dir/business-red.stderr"

      test_status=$?

      set -e

      printf ''%s\n'' "$test_status" > "$evidence_dir/business-red-exit.txt"

      python3 scripts/issue871-evidence.py RED "$test_status" "$evidence_dir/business-red.jsonl" "$evidence_dir/business-red.stderr"
      business

      test "$(git -C "$red_dir" rev-parse HEAD)" = "$baseline_sha"

      git -C "$red_dir" diff --exit-code HEAD

      test "$(git -C "$red_dir" status --porcelain)" = "?? $fixture_path"

      '
  - name: GREEN business continuation on exact candidate
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    shell: bash
    run: 'set -euo pipefail

      evidence_dir="$RUNNER_TEMP/issue871-evidence"

      test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      git diff --exit-code HEAD

      test -z "$(git status --porcelain)"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -race -tags=unit ./internal/service -run ''^TestExcelBPSSearchBusinessThroughForward$/^direct$/^json$''
      -count=1 -json -timeout=5m) > "$evidence_dir/business-green.jsonl" 2> "$evidence_dir/business-green.stderr"

      test_status=$?

      set -e

      printf ''%s\n'' "$test_status" > "$evidence_dir/business-green-exit.txt"

      python3 scripts/issue871-evidence.py GREEN "$test_status" "$evidence_dir/business-green.jsonl" "$evidence_dir/business-green.stderr"
      business

      test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      git diff --exit-code HEAD

      test -z "$(git status --porcelain)"

      '
  - name: Repeat real Forward repair ownership and provenance with race detection
    working-directory: backend
    shell: bash
    run: "set -euo pipefail\nrace_log=\"$RUNNER_TEMP/issue871-evidence/repair-race-repeat.log\"\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ \"$PWD\"\ngo test -race -tags=unit ./internal/service -run '^TestExcelBPSSearchRepair(OwnershipRaceThroughForward|ProvenanceThroughForward)$'\
      \ -count=20 -v -timeout=10m 2>&1 | tee \"$race_log\"\nfor repair in transport unknown_target; do\n  for outcome in success\
      \ failed; do\n    for mode in json sse compact_keepalive; do\n      test \"$(grep -Fc -- \"--- PASS: TestExcelBPSSearchRepairOwnershipRaceThroughForward/$repair/$outcome/$mode\
      \ \" \"$race_log\")\" -eq 20\n    done\n  done\ndone\n"
  - working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race ./internal/service/basispoints -run ''Test(WebSearch|AlphaSearch|ToolChoice|CurrentEncrypted|CompactionPolicy)''
      -count=1 -v'
    shell: bash
  - working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit ./internal/service -run ''Test(ExcelBPSAccountSearch|ExcelBPSSearch|BPSSearchDefaults)'' -count=1
      -v -timeout=10m'
    shell: bash
  - working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=integration ./internal/repository -run ''^TestQuality(BPSSnapshotEqualDefaultsAndManualChanges|EnableBPSRestoreAfterAccountEditorSave|BPSSearchRestorePreservesManualChanges)$''
      -count=1 -v -timeout=10m'
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-bps-search-search-protocol-issue871-behavior-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: ${{ runner.temp }}/issue871-evidence/
      retention-days: 30
