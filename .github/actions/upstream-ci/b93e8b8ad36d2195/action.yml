name: sync-20261116-oauth-apikey-disposition-disposition-ui
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Actual Vue selector and notice regressions
    run: pnpm --dir frontend exec vitest run src/components/admin/operations/__tests__/OAuthAPIKeyDispositionCard.spec.ts
      src/views/admin/__tests__/AutoConfigView.spec.ts src/i18n/__tests__/localeKeyCompleteness.spec.ts --maxWorkers=1 --minWorkers=1
    shell: bash
  - name: Prepare isolated screenshot browser
    run: 'bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      npm install --prefix "$RUNNER_TEMP/disposition-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      node "$RUNNER_TEMP/disposition-browser/node_modules/playwright/cli.js" install --with-deps chromium

      '
    shell: bash
  - name: Actual before and after component screenshots
    env:
      SUB2API_PLAYWRIGHT_MODULE: ${{ runner.temp }}/disposition-browser/node_modules/playwright/index.mjs
    run: node scripts/oauth-apikey-disposition-preview.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/disposition-evidence"
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-oauth-apikey-disposition-disposition-ui-oauth-apikey-disposition-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/disposition-evidence
      if-no-files-found: warn
      retention-days: 30
