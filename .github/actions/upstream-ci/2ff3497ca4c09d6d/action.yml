name: sync-20261116-security-scan-backend-security
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Assert exact candidate head
    run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
    shell: bash
  - name: Set up Go
    uses: actions/setup-go@v6
    with:
      check-latest: false
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Verify Go version
    run: 'go version | grep -q ''go1.27.4''

      '
    shell: bash
  - name: Run govulncheck
    working-directory: backend
    run: 'go install golang.org/x/vuln/cmd/govulncheck@latest

      govulncheck ./...

      '
    shell: bash
