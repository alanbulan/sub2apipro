name: sync-20261116-smart-ops-sidebar-preview-screenshots
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Install isolated screenshot browser
    run: 'npm install --prefix "$RUNNER_TEMP/pr-ui-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/pr-ui-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Fetch immutable before baseline
    run: git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git c115bef917eae22fc2f5a4d0ba6ac6cbe600e8e4
    shell: bash
  - name: Capture actual Vue components with fictional local data
    env:
      NODE_OPTIONS: --max-old-space-size=1536
      PLAYWRIGHT_MODULE: ${{ runner.temp }}/pr-ui-browser/node_modules/playwright/index.mjs
    run: 'node scripts/prmerge-ui-preview.mjs "$GITHUB_WORKSPACE" sidebar "$RUNNER_TEMP/smart-ops-sidebar-preview" c115bef917eae22fc2f5a4d0ba6ac6cbe600e8e4

      node scripts/prmerge-ui-preview.mjs "$GITHUB_WORKSPACE" sidebar "$RUNNER_TEMP/smart-ops-sidebar-preview"

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-smart-ops-sidebar-preview-screenshots-smart-ops-sidebar-preview-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/smart-ops-sidebar-preview
      if-no-files-found: error
