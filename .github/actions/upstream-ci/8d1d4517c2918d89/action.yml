name: sync-20261116-future-shadow-task-association-mutation
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Install isolated Redis
    run: "bash \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\nif ! command -v redis-server >/dev/null; then\n  bash\
      \ \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\n  sudo apt-get update\n  sudo apt-get install -y --no-install-recommends\
      \ redis-server\nfi\n"
    shell: bash
  - name: Mutate only disposable production and require wrong-task network failure
    shell: bash
    run: 'set -euo pipefail

      test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      test -z "$(git status --porcelain)"

      mkdir -p "$RUNNER_TEMP/shadow-mutation-evidence"

      git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/shadow-mutation-evidence/candidate.txt"

      git worktree add --detach "$RUNNER_TEMP/shadow-mutant" "$CANDIDATE_SHA"

      python3 scripts/mutate-future-shadow.py "$RUNNER_TEMP/shadow-mutant" > "$RUNNER_TEMP/shadow-mutation-evidence/mutation.jsonl"

      git -C "$RUNNER_TEMP/shadow-mutant" diff --exit-code "$CANDIDATE_SHA" -- ''backend/**/*_test.go''

      git -C "$RUNNER_TEMP/shadow-mutant" diff --stat > "$RUNNER_TEMP/shadow-mutation-evidence/delta.txt"

      git hash-object backend/internal/handler/openai_409_shadow_http_test.go > "$RUNNER_TEMP/shadow-mutation-evidence/test-blob.txt"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$RUNNER_TEMP/shadow-mutant/backend"

      set +e

      (cd "$RUNNER_TEMP/shadow-mutant/backend" && go test -race -json -tags=unit ./internal/handler -run ''^TestOpenAI409FutureShadowTaskAssociation$''
      -count=1 -timeout=5m) > "$RUNNER_TEMP/shadow-mutation-evidence/association.jsonl" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/shadow-mutation-evidence/association.jsonl"

      python3 scripts/assert-future-shadow.py RED "$result" "$RUNNER_TEMP/shadow-mutation-evidence/association.jsonl" --association

      test -z "$(git status --porcelain)"

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-future-shadow-task-association-mutation-future-shadow-task-mutation-${{ env.CANDIDATE_SHA }}
      path: ${{ runner.temp }}/shadow-mutation-evidence/
      if-no-files-found: error
