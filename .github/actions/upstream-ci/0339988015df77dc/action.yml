name: sync-20261116-issue711-scheduler-contention-regression
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_mode:
    description: Upstream matrix parameter mode.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Record exact candidate and regression identity
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    run: "mkdir -p evidence\ngit rev-parse HEAD | tee evidence/head.txt\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_HEAD\"\
      \nsha256sum backend/internal/integration/issue711/snapshot_contention_test.go \\\n  backend/internal/service/scheduler_snapshot_retired_group_batch_test.go\
      \ > evidence/tests.sha256\ngo version | tee evidence/toolchain.txt\n"
    shell: bash
  - name: Restore exact defective production blob in isolated RED job
    if: inputs.sync_matrix_mode != 'green'
    env:
      MODE: ${{ inputs.sync_matrix_mode }}
    shell: bash
    run: "set -euo pipefail\nbaseline=7eb2e271acdc4b36d62f1b542b16b5abb5b1bb09\nif [ \"$MODE\" = red-locks ]; then\n  target=backend/internal/repository/account_codex_snapshot.go\n\
      \  expected=4b0f4c612101ef6d83080e96ae205164ab164b1c\nelif [ \"$MODE\" = red-state ]; then\n  target=backend/internal/service/openai_codex_snapshot_contract.go\n\
      \  expected=8029364741588ba7263ae581f1f22b4dc4315ff2\nelse\n  baseline=b677bb176ae66e67ed09919756c10f1b0ae2ac0f\n  target=backend/internal/service/scheduler_snapshot_service.go\n\
      \  expected=20f7505e699aaf8853da320f3d11ac182e69e2a7\nfi\ngit fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git\
      \ \"$baseline\"\ngit show \"$baseline:$target\" > \"$target\"\ntest \"$(git hash-object \"$target\")\" = \"$expected\"\
      \nprintf '%s %s %s\\n' \"$baseline\" \"$target\" \"$expected\" | tee evidence/baseline.txt\ngit diff --stat\n"
  - name: Exact head unit safety and race checks
    if: inputs.sync_matrix_mode == 'green'
    working-directory: backend
    shell: bash
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" \"$PWD\"\ngo test -race -tags=unit ./internal/service\
      \ ./internal/repository \\\n  -run '^(TestSchedulerPublicationLockRoundTripAndRollback|TestSchedulerPublicationDiagnostics|TestSchedulerSnapshotUsesLatestCompleteAccounts|TestSchedulerSnapshotIDRetryFiltersLatestMembership|TestSchedulerOutboxRetry|TestSchedulerRetiredGroupBatch|TestSchedulerGroupLifecycle|TestSchedulerPrepareGroupLifecycle|TestSchedulerRebuildBatch|TestSchedulerBulkAccountEvent|TestSchedulerFullRebuild|TestSchedulerRebuildRetireAfterDBLoadFencesPublish)'\
      \ \\\n  -count=1 -v -timeout=5m 2>&1 | tee ../evidence/unit-green.log\n! grep -Eq 'no tests to run|--- SKIP:' ../evidence/unit-green.log\n\
      for name in ReconcilesOnce RechecksNextCall DoesNotCacheFailure CapturesConcurrentReopen; do\n  grep -F -- \"--- PASS:\
      \ TestSchedulerRetiredGroupBatch$name\" ../evidence/unit-green.log\ndone\n"
  - name: Retired-group behavioral RED against exact baseline
    if: inputs.sync_matrix_mode == 'red-retirement'
    working-directory: backend
    shell: bash
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" \"$PWD\"\nset +e\ngo test -race -tags=unit\
      \ ./internal/service \\\n  -run '^TestSchedulerRetiredGroupBatchReconcilesOnce$' \\\n  -count=1 -v -timeout=5m > ../evidence/retirement-red.log\
      \ 2>&1\nresult=$?\nset -e\ncat ../evidence/retirement-red.log\nprintf '%s\\n' \"$result\" > ../evidence/exit.txt\nif\
      \ grep -Eq '\\[build failed\\]|\\[setup failed\\]|undefined:|syntax error:|no tests to run|panic:|--- SKIP:|WARNING:\
      \ DATA RACE|race detected during execution' ../evidence/retirement-red.log; then\n  echo 'Compilation, fixture errors,\
      \ missing tests and skips are not behavioral evidence'\n  exit 1\nfi\ntest \"$result\" -ne 0\ngrep -F -- '--- FAIL:\
      \ TestSchedulerRetiredGroupBatchReconcilesOnce' ../evidence/retirement-red.log\ngrep -F -- 'retired group authority\
      \ must be read once per bucket preparation' ../evidence/retirement-red.log\n"
  - name: Real PostgreSQL and Redis behavioral RED or GREEN
    if: inputs.sync_matrix_mode != 'red-retirement'
    env:
      MODE: ${{ inputs.sync_matrix_mode }}
    working-directory: backend
    shell: bash
    run: "set -euo pipefail\ncase \"$MODE\" in\n  green) regression='^TestIssue711';;\n  red-locks) regression='^TestIssue711BatchedPublicationContention$';;\n\
      \  red-state) regression='^TestIssue711StaleRebuildCannotRestoreAccount$';;\nesac\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ \"$PWD\"\nset +e\ngo test -race -tags=integration ./internal/integration/issue711 -run \"$regression\" \\\n  -count=1\
      \ -v -timeout=5m > ../evidence/integration.log 2>&1\nresult=$?\nset -e\ncat ../evidence/integration.log\nprintf '%s\\\
      n' \"$result\" > ../evidence/exit.txt\nif grep -Eq '\\[build failed\\]|\\[setup failed\\]|undefined:|syntax error:|no\
      \ tests to run|panic:|--- SKIP:|WARNING: DATA RACE|race detected during execution' ../evidence/integration.log; then\n\
      \  echo 'Compilation, fixture errors, missing tests and skips are not behavioral evidence'\n  exit 1\nfi\nif [ \"$MODE\"\
      \ = green ]; then\n  test \"$result\" -eq 0\n  for name in BatchedPublicationContention StaleRebuildCannotRestoreAccount\
      \ PublicationFailureKeepsActiveAndFencesOldWriter TwoWritersDrainAccountChanges; do\n    grep -F -- \"--- PASS: TestIssue711$name\"\
      \ ../evidence/integration.log\n  done\nelse\n  test \"$result\" -ne 0\n  if [ \"$MODE\" = red-locks ]; then\n    grep\
      \ -F -- '--- FAIL: TestIssue711BatchedPublicationContention' ../evidence/integration.log\n    grep -F -- 'lock acquisition\
      \ round trips must be bounded per publication' ../evidence/integration.log\n  else\n    grep -F -- '--- FAIL: TestIssue711StaleRebuildCannotRestoreAccount'\
      \ ../evidence/integration.log\n    grep -F -- 'stale rebuild restored a disabled account' ../evidence/integration.log\n\
      \  fi\nfi\n"
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-issue711-scheduler-contention-regression-issue711-${{ inputs.sync_matrix_mode }}-${{ github.event_name
        }}-${{ github.run_id }}
      path: evidence/
      if-no-files-found: error
      retention-days: 14
