name: sync-20261116-mature-channel-community-ops-after-ui
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Isolated browser
    run: 'npm install --prefix "$RUNNER_TEMP/after-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/after-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Provider actual components after
    env:
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/after-browser/node_modules/playwright
      MATURE_SCREENSHOT_DIR: ${{ runner.temp }}/after-evidence/providers
    run: node scripts/mature-providers-after.mjs
    shell: bash
  - name: Provider account import and group creation after
    if: always()
    env:
      SUB2API_PLAYWRIGHT_MODULE: ${{ runner.temp }}/after-browser/node_modules/playwright/index.mjs
      EVIDENCE_DIR: ${{ runner.temp }}/after-evidence/accounts
    run: node scripts/mature-account-after.mjs
    shell: bash
  - name: QQ actual overview, setup and group management
    if: always()
    env:
      SUB2API_PLAYWRIGHT_MODULE: ${{ runner.temp }}/after-browser/node_modules/playwright/index.mjs
      EVIDENCE_DIR: ${{ runner.temp }}/after-evidence/community
    run: node scripts/mature-community-after.mjs
    shell: bash
  - name: Payment before and coupon reward checkout after
    if: always()
    env:
      SUB2API_PLAYWRIGHT_MODULE: ${{ runner.temp }}/after-browser/node_modules/playwright/index.mjs
      EVIDENCE_DIR: ${{ runner.temp }}/after-evidence/payment
    run: 'git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git 37dc4620a41a68abaeab329358c15821c41e3f7f

      node scripts/mature-payment-comparison.mjs

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-channel-community-ops-after-ui-mature-after-${{ github.sha }}
      path: ${{ runner.temp }}/after-evidence/
