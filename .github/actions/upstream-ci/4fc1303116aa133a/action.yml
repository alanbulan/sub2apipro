name: sync-20261116-ws-plaintext-owner-repair870
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_phase:
    description: Upstream matrix parameter phase.
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Redis fixture dependency
    run: "bash \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\nif ! command -v redis-server >/dev/null; then\n  bash\
      \ \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\n  sudo apt-get update\n  sudo apt-get install -y --no-install-recommends\
      \ redis-server\nfi\n"
    shell: bash
  - name: Pin reviewed PR implementation for repair RED
    if: inputs.sync_matrix_phase != 'GREEN'
    env:
      PHASE: ${{ inputs.sync_matrix_phase }}
    run: "# Keep candidate type declarations and tests compatible. Only these\n# two implementations execute the three reviewed\
      \ faulty behaviors.\nbaseline=04ec5e737ecb925faa2e8f3b00efff816715c55c\nif [ \"$PHASE\" = PLAINTEXT_RED ]; then\n  baseline=72c21bedea567d8032f736adba16edcf5645ca19\n\
      fi\nfor target in backend/internal/service/openai_ws_agent_recovery.go backend/internal/service/openai_ws_http_bridge.go;\
      \ do\n  git show \"$baseline:$target\" > \"$target\"\n  test \"$(git hash-object \"$target\")\" = \"$(git rev-parse\
      \ \"$baseline:$target\")\"\ndone\n"
    shell: bash
  - name: Exact later-turn HTTP wire behavior
    env:
      PHASE: ${{ inputs.sync_matrix_phase }}
    shell: bash
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\nset +e\n(cd backend && go test\
      \ -race -json -tags=unit,plaintextowner ./internal/handler -run '^TestOpenAIWSPlaintextRepair870$' -count=1 -timeout=3m)\
      \ > \"$RUNNER_TEMP/plaintext-repair870.jsonl\" 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/plaintext-repair870.jsonl\"\
      \npython3 scripts/assert-readable-continuation.py --clean-log \"$RUNNER_TEMP/plaintext-repair870.jsonl\"\npython3 -\
      \ \"$PHASE\" \"$result\" \"$RUNNER_TEMP/plaintext-repair870.jsonl\" <<'PY'\nimport json,sys\nfrom collections import\
      \ Counter\nphase,status,path=sys.argv[1],int(sys.argv[2]),sys.argv[3]\nrows=[]\nfor line in open(path):\n    try: rows.append(json.loads(line))\n\
      \    except ValueError: pass\npackage='github.com/Wei-Shaw/sub2api/internal/handler'\nroot='TestOpenAIWSPlaintextRepair870'\n\
      markers={root+'/assistant_history':'F1_ASSISTANT_HISTORY_LOST',root+'/wrong_response':'F2_WRONG_RESPONSE_SENT',root+'/terminal_excludes':'F3_EXCLUDED_TOOL_SENT'}\n\
      plaintext_markers={root+'/ordinary_tool':'F3_PLAINTEXT_TOOL_REFUSED',root+'/empty_terminal':'F3_EMPTY_TERMINAL_REFUSED',root+'/duplicate_call':'F3_DUPLICATE_WARMUP_REFUSED'}\n\
      leaves=set(markers)|set(plaintext_markers)|{root+'/'+s for s in ('stored_pointer','unknown_pointer')}\ncounts=Counter((r.get('Action'),r.get('Test'))\
      \ for r in rows if r.get('Package')==package)\nassert phase in ('RED','PLAINTEXT_RED','GREEN'),phase\nexpected_markers=markers\
      \ if phase=='RED' else plaintext_markers if phase=='PLAINTEXT_RED' else {}\nexpected_fail=set(expected_markers)|{root,None}\
      \ if phase!='GREEN' else set()\nassert status==(0 if phase=='GREEN' else 1),status\nassert {r.get('Test') for r in rows\
      \ if r.get('Action')=='run'}==leaves|{root},rows\nassert all(r.get('Package')==package for r in rows),rows\nassert {r.get('Test')\
      \ for r in rows if r.get('Action')=='fail'}==expected_fail,rows\nfor name in leaves|{root,None}:\n    assert name is\
      \ None or counts['run',name]==1,(name,counts)\n    expected='fail' if name in expected_fail else 'pass'\n    assert\
      \ counts[expected,name]==1 and counts['pass',name]+counts['fail',name]==1,(name,counts)\nif phase!='GREEN':\n    for\
      \ name,marker in expected_markers.items():\n        output=''.join(r.get('Output','') for r in rows if r.get('Test')==name)\n\
      \        assert marker in output,(name,output)\nPY\n"
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-ws-plaintext-owner-repair870-plaintext-repair870-${{ inputs.sync_matrix_phase }}-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/plaintext-repair870.jsonl
      if-no-files-found: error
