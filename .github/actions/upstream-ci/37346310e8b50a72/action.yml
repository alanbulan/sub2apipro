name: sync-20261116-future-shadow-validator
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Evidence self-tests
    shell: bash
    run: 'set -euo pipefail

      python3 -B -m unittest discover -s scripts -p ''test_assert_future_shadow.py'' -v 2>&1 | tee "$RUNNER_TEMP/shadow-validator.log"

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-future-shadow-validator-shadow-validator-${{ github.event.pull_request.head.sha || github.sha }}
      path: ${{ runner.temp }}/shadow-validator.log
      if-no-files-found: error
