name: sync-20261116-issue817-quota-skip-followup-pending-5xx
description: Current upstream checks, retaining matrix parameters and regression assertions.
inputs:
  sync_matrix_behavior:
    description: Upstream matrix parameter behavior.
    required: true
runs:
  using: composite
  steps:
  - name: Record exact candidate and baseline blob
    working-directory: ${{ inputs.sync_matrix_behavior }}
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      BEHAVIOR: ${{ inputs.sync_matrix_behavior }}
    shell: bash
    run: "set -euo pipefail\nmkdir -p evidence\ngit rev-parse HEAD | tee evidence/head.txt\ntest \"$(git rev-parse HEAD)\"\
      \ = \"$EXPECTED_HEAD\"\nif [ \"$BEHAVIOR\" = red ]; then\n  original=c424f8217da12cd4fb8d10aeaf1c4f2592c3f286\n  source=backend/internal/repository/quality_template_quota.go\n\
      \  git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git \"$original\"\n  git rev-parse \"$original:$source\"\
      \ | tee evidence/original-blob.txt\n  # Only the isolated RED checkout receives the old production blob.\n  git show\
      \ \"$original:$source\" > \"$source\"\nfi\n"
  - name: Reject contaminated RED evidence before running product regressions
    working-directory: ${{ inputs.sync_matrix_behavior }}
    shell: bash
    run: "set -euo pipefail\ncat > evidence/gate-valid-red.log <<'LOG'\n=== RUN   TestIssue817QuotaSkipPreservesPending5xxExecution/never_run\n\
      expected: 1\nactual  : 0\nMessages: pending 5xx signal must execute after quota-skipped cron before acknowledgement\n\
      === RUN   TestIssue817QuotaSkipPreservesPending5xxExecution/previous_completed_run\nexpected: 1\nactual  : 0\nMessages:\
      \ pending 5xx signal must execute after quota-skipped cron before acknowledgement\n--- FAIL: TestIssue817QuotaSkipPreservesPending5xxExecution\n\
      \    --- FAIL: TestIssue817QuotaSkipPreservesPending5xxExecution/never_run\n    --- FAIL: TestIssue817QuotaSkipPreservesPending5xxExecution/previous_completed_run\n\
      LOG\nvalidator=scripts/issue817-validate-evidence.sh\nbash \"$validator\" red 1 evidence/gate-valid-red.log\nfor forbidden\
      \ in 'WARNING: DATA RACE' 'panic: injected' 'Segmentation fault' '--- SKIP: injected' '[build failed]' 'no tests to\
      \ run'; do\n  cp evidence/gate-valid-red.log evidence/gate-contaminated-red.log\n  printf '%s\\n' \"$forbidden\" >>\
      \ evidence/gate-contaminated-red.log\n  if bash \"$validator\" red 1 evidence/gate-contaminated-red.log; then\n    echo\
      \ \"Gate wrongly accepted forbidden evidence: $forbidden\" >&2\n    exit 1\n  fi\ndone\n# Both FAIL labels still exist;\
      \ only the second child's diagnosis is\n# missing. A first-child-only global grep would wrongly accept this.\nawk '/===\
      \ RUN.*previous_completed_run/ { second=1 } second && /Messages:/ { next } { print }' evidence/gate-valid-red.log >\
      \ evidence/gate-missing-second-diagnostic.log\nif bash \"$validator\" red 1 evidence/gate-missing-second-diagnostic.log;\
      \ then\n  echo 'Gate wrongly accepted a missing second-child diagnostic' >&2\n  exit 1\nfi\nif bash \"$validator\" red\
      \ 0 evidence/gate-valid-red.log; then\n  echo 'Gate wrongly accepted a zero first RED exit' >&2\n  exit 1\nfi\necho\
      \ 'Evidence gate synthetic rejection regressions passed'\n"
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: ${{ inputs.sync_matrix_behavior }}/backend/go.sum
      go-version: 1.27.4
  - name: Prepare live first-signal startup diagnostics
    working-directory: ${{ inputs.sync_matrix_behavior }}
    shell: bash
    run: "set -euo pipefail\nif ! command -v gdb >/dev/null; then\n  bash \"${GITHUB_WORKSPACE}/${{ inputs.sync_matrix_behavior\
      \ }}/scripts/ci-ubuntu-mirrors.sh\"\n  sudo apt-get update\n  sudo apt-get install -y --no-install-recommends gdb\n\
      fi\nuname -a > evidence/kernel.txt\ngo version > evidence/toolchain.txt\n"
  - name: Real PostgreSQL plan and existing Redis trigger worker
    working-directory: ${{ inputs.sync_matrix_behavior }}
    env:
      CI: 'true'
      BEHAVIOR: ${{ inputs.sync_matrix_behavior }}
    shell: bash
    run: 'set -euo pipefail

      set +e

      bash scripts/issue817-race-gate.sh "$BEHAVIOR" "$PWD" ''^TestIssue817QuotaSkipPreservesPending5xxExecution$'' > evidence/pending-5xx.log
      2>&1

      result=$?

      set -e

      cat evidence/pending-5xx.log

      test "$(cat evidence/binary-identity-ok.txt)" = passed

      bash scripts/issue817-validate-evidence.sh "$BEHAVIOR" "$result" evidence/pending-5xx.log

      '
  - name: Retained exact lease, 401, ownership, manual and trigger contracts
    if: matrix.behavior == 'green'
    working-directory: green/backend
    env:
      CI: 'true'
    shell: bash
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/${{ inputs.sync_matrix_behavior }}/scripts/prepare-sync-ci.py\" \"\
      $PWD\"\ngo test -race -tags=integration ./internal/repository -run '^(TestIssue817QuotaSkipPreserves401AndOwnership|TestIssue817QuotaSkipRetainsActualIsolationOwnership|TestIssue817ManualTriggerIsOneShotAndLeaseFenced|TestQuality5xxClaimKeepsCronAndCoalescesScheduledRun|TestQuality5xxFinishConsumesCrossedCronWithoutOverwritingEdits|TestQualityRetestRestBlocksEveryClaimUntilDeadline)$'\
      \ -count=1 -v -timeout=10m 2>&1 | tee ../evidence/retained-contracts.log\nif grep -Eq 'no tests to run|--- SKIP:|panic:|WARNING:\
      \ DATA RACE|race detected during execution' ../evidence/retained-contracts.log; then\n  exit 1\nfi\nfor required in\
      \ \\\n  TestIssue817QuotaSkipPreserves401AndOwnership \\\n  TestIssue817QuotaSkipRetainsActualIsolationOwnership \\\n\
      \  TestIssue817ManualTriggerIsOneShotAndLeaseFenced \\\n  TestQuality5xxClaimKeepsCronAndCoalescesScheduledRun \\\n\
      \  TestQuality5xxFinishConsumesCrossedCronWithoutOverwritingEdits \\\n  TestQualityRetestRestBlocksEveryClaimUntilDeadline;\
      \ do\n  grep -F -- \"--- PASS: $required (\" ../evidence/retained-contracts.log\ndone\n"
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-issue817-quota-skip-followup-pending-5xx-issue817-skip-${{ inputs.sync_matrix_behavior }}-${{ github.event_name
        }}-${{ github.run_id }}
      path: '${{ inputs.sync_matrix_behavior }}/evidence/

        evidence/

        '
      if-no-files-found: error
