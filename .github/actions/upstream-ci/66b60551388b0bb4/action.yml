name: sync-20261116-admin-usage-platform-filter-backend
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Build and start committed backend before generation
    working-directory: backend
    run: 'go build -o "$RUNNER_TEMP/sub2api-platform" ./cmd/server

      "$RUNNER_TEMP/sub2api-platform" -version

      '
    shell: bash
  - name: Verify generated Ent code
    working-directory: backend
    run: 'go generate ./ent

      git diff --exit-code -- ent

      '
    shell: bash
  - name: Affected backend unit tests
    working-directory: backend
    shell: bash
    run: 'set -o pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=unit ./internal/repository ./internal/service ./internal/handler/admin -run ''Test(Usage|AdminUsage|PrepareUsage|GatewayServiceRecordUsage|OpenAIGatewayServiceRecordUsage|Dashboard|FinalizeLive|BatchImage)''
      -count=1 -v -timeout=15m 2>&1 | tee "$RUNNER_TEMP/platform-unit.log"

      if grep -Eq -- ''--- SKIP:|no tests to run'' "$RUNNER_TEMP/platform-unit.log"; then exit 1; fi

      '
  - name: Historical platform SQL regression (disposable PostgreSQL)
    working-directory: backend
    shell: bash
    run: 'set -o pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=integration ./internal/repository -run ''TestUsage(Log|Platform)|TestRegionalSubscriptionCanonicalUsesDurableFundingMetadata|TestRegionalLegacyUnknownAllocation''
      -count=1 -v -timeout=15m 2>&1 | tee "$RUNNER_TEMP/platform-sql.log"

      if grep -Eq -- ''--- SKIP:|no tests to run'' "$RUNNER_TEMP/platform-sql.log"; then exit 1; fi

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-admin-usage-platform-filter-backend-platform-sql-${{ github.sha }}
      path: '${{ runner.temp }}/platform-sql.log

        ${{ runner.temp }}/platform-unit.log

        '
