name: sync-20261116-model-billing-groups-billing-regressions
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache: true
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Test actual billing services and admin configuration handlers
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -tags=unit ./internal/service ./internal/handler/admin -run ''^(TestModelBilling|TestAutoConfigModelBilling)''
      -count=1 -v -timeout=15m'
    shell: bash
