name: sync-20261116-encrypted-history-409-protocol
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Install isolated Redis fixture
    run: "bash \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\nif ! command -v redis-server >/dev/null; then\n  bash\
      \ \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\n  sudo apt-get update\n  sudo apt-get install -y --no-install-recommends\
      \ redis-server\nfi\n"
    shell: bash
  - name: Actual HTTP and Redis omission regressions
    working-directory: backend
    shell: bash
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit ./internal/service ./internal/handler ./internal/handler/admin -run ''^Test(OmitOpenAIHistorical|OpenAI409|UpdateSettingsOpenAI409)''
      -count=1 -v -timeout=5m 2>&1 | tee "$RUNNER_TEMP/omit-history-protocol.log"

      '
  - name: Same HTTP regression against pinned pre-fix omission code must fail
    shell: bash
    run: "set -euo pipefail\nbaseline=11f250894eab310cbd4508946c44c9e2a3a2eb48\ncallers=96ba36a85edab665ad5a035788fc07a40fd18762\n\
      git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git \"$baseline\"\ngit fetch --no-tags --depth=1\
      \ https://github.com/ranxi2001/sub2api.git \"$callers\"\ngit worktree add --detach \"$RUNNER_TEMP/omit-metadata-red\"\
      \ HEAD\ncd \"$RUNNER_TEMP/omit-metadata-red\"\n# Keep the pre-rebuild callers coherent with the old omission API.\n\
      # The historical metadata regression itself remains the candidate's.\nfor target in backend/internal/service/openai_agent_message_recovery.go\
      \ backend/internal/service/openai_agent_message_delivery.go backend/internal/service/openai_agent_message_recovery_error.go\
      \ backend/internal/service/openai_account_scheduler.go backend/internal/service/openai_gateway_forward.go backend/internal/service/openai_codex_transform.go\
      \ backend/internal/handler/openai_gateway_handler.go backend/internal/handler/openai_agent_message_recovery.go; do\n\
      \  git show \"$callers:$target\" > \"$target\"\n  test \"$(git hash-object \"$target\")\" = \"$(git rev-parse \"$callers:$target\"\
      )\"\ndone\nfor target in backend/internal/service/openai_ws_agent_recovery.go backend/internal/service/openai_ws_forwarder_ingress.go\
      \ backend/internal/service/openai_ws_v2_passthrough_adapter.go backend/internal/service/openai_ws_http_bridge.go; do\n\
      \  git show \"$callers:$target\" > \"$target\"\n  test \"$(git hash-object \"$target\")\" = \"$(git rev-parse \"$callers:$target\"\
      )\"\ndone\nif git cat-file -e \"$callers:backend/internal/service/openai_ws_readable_continuation.go\" 2>/dev/null;\
      \ then exit 1; fi\nrm -- backend/internal/service/openai_ws_readable_continuation.go\nfor target in backend/internal/service/openai_409_readable_shadow.go\
      \ backend/internal/repository/gateway_cache_readable_shadow.go backend/internal/repository/gateway_cache_agent_shadow_epoch.go\
      \ backend/internal/service/openai_400_omit_history.go backend/internal/service/openai_history_omission.go; do\n  if\
      \ git cat-file -e \"$callers:$target\" 2>/dev/null; then exit 1; fi\n  rm -- \"$target\"\ndone\n# This later helper\
      \ is not part of the pinned recovery defect. Its\n# pre-OAuth-projection API is compatible with the restored struct;\n\
      # preserve every selected defect/caller blob and behavioral assertion.\ncompatibility=00d2e9be01404c6e85c0560fa196e4650ef5d0fb\n\
      target=backend/internal/service/openai_agent_replay_metadata.go\nif git cat-file -e \"$callers:$target\" 2>/dev/null;\
      \ then exit 1; fi\ngit fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git \"$compatibility\"\ncandidate_blob=$(git\
      \ rev-parse \"HEAD:$target\")\ntest \"$(git hash-object \"$target\")\" = \"$candidate_blob\"\nexpected=$(git rev-parse\
      \ \"$compatibility:$target\")\ngit show \"$compatibility:$target\" > \"$target\"\nactual=$(git hash-object \"$target\"\
      )\ntest \"$actual\" = \"$expected\"\necho \"$target defect_source=$callers defect_blob=absent compatibility=$compatibility\
      \ candidate=$candidate_blob expected=$expected actual=$actual\" >> \"$RUNNER_TEMP/omit-history-red-compat.txt\"\nbash\
      \ \"$GITHUB_WORKSPACE/scripts/prepare-ws-owner-red-fixtures.sh\" \"$callers\" . HEAD | tee \"$RUNNER_TEMP/omit-history-ws-owner-red-blobs.txt\"\
      \ntarget=backend/internal/service/openai_409_omit_history.go\ngit show \"$baseline:$target\" > \"$target\"\ntest \"\
      $(git hash-object \"$target\")\" = \"$(git rev-parse \"$baseline:$target\")\"\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ backend\nset +e\n(cd backend && go test -race -tags=unit ./internal/handler -run '^TestOpenAI409ReplayMetadataHTTP$'\
      \ -count=1 -v -timeout=5m) > \"$RUNNER_TEMP/omit-history-red.log\" 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/omit-history-red.log\"\
      \ntest \"$result\" -ne 0\nif grep -Eiq 'build failed|no tests to run|undefined:|panic|data race|--- SKIP:' \"$RUNNER_TEMP/omit-history-red.log\"\
      ; then exit 1; fi\ngrep -q -- '--- FAIL: TestOpenAI409ReplayMetadataHTTP' \"$RUNNER_TEMP/omit-history-red.log\"\ngrep\
      \ -q 'encrypted_agent_recovery_wire_changed' \"$RUNNER_TEMP/omit-history-red.log\"\n"
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-encrypted-history-409-protocol-encrypted-history-409-protocol-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: '${{ runner.temp }}/omit-history-protocol.log

        ${{ runner.temp }}/omit-history-red.log

        ${{ runner.temp }}/omit-history-red-compat.txt

        '
