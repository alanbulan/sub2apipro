name: sync-20261116-ai-ops-frontend
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: AI operations component and API boundaries
    working-directory: frontend
    run: pnpm exec vitest run src/views/admin/__tests__/AIOpsView.spec.ts src/components/admin/operations/__tests__/AIOpsControls.spec.ts
      src/components/admin/operations/__tests__/AIOpsRecoveryProbes.spec.ts src/api/admin/__tests__/aiOps.spec.ts src/api/admin/__tests__/aiOpsControl.spec.ts
      src/components/admin/operations/__tests__/SmartOpsNav.spec.ts src/components/common/__tests__/NewFeatureBadge.spec.ts
      --maxWorkers=1 --minWorkers=1 --no-file-parallelism
    shell: bash
  - name: Frontend typecheck
    run: pnpm --dir frontend run typecheck
    shell: bash
  - name: Install isolated synthetic browser
    run: 'bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      npm install --prefix "$RUNNER_TEMP/ai-ops-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/ai-ops-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Actual AI operations pages with synthetic data
    env:
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/ai-ops-browser/node_modules/playwright
      AI_OPS_SCREENSHOT_DIR: ${{ runner.temp }}/ai-ops-screenshots
    run: node scripts/ai-ops-screenshot.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-ai-ops-frontend-ai-ops-ui-${{ github.event.pull_request.head.sha || github.sha }}
      path: ${{ runner.temp }}/ai-ops-screenshots
      if-no-files-found: warn
