name: sync-20261116-mistral-budget-backend
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit ./internal/service -run ''^(TestMistral|TestCNProviderBalanceCheckRunOnceProbesMistral|TestHandleUpstreamError_Mistral)''
      -count=1 -v -timeout=10m'
    shell: bash
