name: sync-20261116-upstream-v0221-regression-frontend
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Assert exact candidate head
    run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
    shell: bash
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - name: Install locked frontend dependencies remotely
    working-directory: frontend
    run: pnpm install --frozen-lockfile
    shell: bash
  - name: Lint
    working-directory: frontend
    run: pnpm run lint:check
    shell: bash
  - name: Typecheck
    working-directory: frontend
    run: pnpm run typecheck
    shell: bash
  - name: Complete frontend suite
    working-directory: frontend
    run: pnpm run test:run
    shell: bash
  - name: Production frontend build
    working-directory: frontend
    run: pnpm run build
    shell: bash
