name: sync-20261116-issue733-priority-ui-scope-contract
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Pinned baseline configuration contract RED
    shell: bash
    run: 'set -euo pipefail

      mkdir -p "$RUNNER_TEMP/issue733-contract"

      git worktree add --detach "$RUNNER_TEMP/issue733-contract-baseline" 8889aee65d908c2458becb86d4fe54f4359dc61d

      git show d79c1044914e7924c38cc4a239e42ff8980698e6:backend/internal/service/priority_latency_series_regression_test.go
      > "$RUNNER_TEMP/issue733-contract-baseline/backend/internal/service/priority_latency_series_regression_test.go"

      git show 8889aee65d908c2458becb86d4fe54f4359dc61d:backend/internal/service/priority_latency_series.go > "$RUNNER_TEMP/issue733-contract/baseline.go"

      cmp "$RUNNER_TEMP/issue733-contract/baseline.go" "$RUNNER_TEMP/issue733-contract-baseline/backend/internal/service/priority_latency_series.go"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$RUNNER_TEMP/issue733-contract-baseline/backend"

      set +e

      (cd "$RUNNER_TEMP/issue733-contract-baseline/backend" && go test -tags=unit ./internal/service -run ''^TestPriorityLatencySeriesExposesConfigurationScope$''
      -count=1 -v -timeout=5m) > "$RUNNER_TEMP/issue733-contract/red.log" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/issue733-contract/red.log"

      test "$result" -ne 0

      grep -q -- ''--- FAIL: TestPriorityLatencySeriesExposesConfigurationScope'' "$RUNNER_TEMP/issue733-contract/red.log"

      grep -q -- ''latency scope must expose exact configuration revision'' "$RUNNER_TEMP/issue733-contract/red.log"

      '
  - name: Candidate scope and recompute contract GREEN
    run: 'set -euo pipefail

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -tags=unit ./internal/service -run ''^(TestPriorityLatencySeries|TestPriorityRecompute)'' -count=1
      -v -timeout=5m) 2>&1 | tee "$RUNNER_TEMP/issue733-contract/green.log"

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-issue733-priority-ui-scope-contract-issue733-contract-${{ github.event.pull_request.head.sha ||
        github.sha }}
      path: ${{ runner.temp }}/issue733-contract
