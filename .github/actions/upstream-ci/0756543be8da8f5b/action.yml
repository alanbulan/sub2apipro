name: sync-20261116-ws-tool-provenance-behavior
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Install isolated Redis
    run: "bash \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\nif ! command -v redis-server >/dev/null; then\n  bash\
      \ \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\n  sudo apt-get update\n  sudo apt-get install -y --no-install-recommends\
      \ redis-server\nfi\n"
    shell: bash
  - name: Real handler RED against exact production blobs
    shell: bash
    run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$CANDIDATE\"\nmkdir -p \"$RUNNER_TEMP/ws-provenance-evidence\"\
      \ngit rev-parse HEAD HEAD^{tree} > \"$RUNNER_TEMP/ws-provenance-evidence/candidate.txt\"\ngit worktree add --detach\
      \ \"$RUNNER_TEMP/ws-provenance-red\" \"$CANDIDATE\"\ngit diff --name-only \"$BASELINE\" \"$CANDIDATE\" -- backend |\
      \ while IFS= read -r target; do\n  case \"$target\" in\n    *_test.go) continue ;;\n    *.go)\n      if git cat-file\
      \ -e \"$BASELINE:$target\" 2>/dev/null; then\n        mkdir -p -- \"$(dirname -- \"$RUNNER_TEMP/ws-provenance-red/$target\"\
      )\"\n        git show \"$BASELINE:$target\" > \"$RUNNER_TEMP/ws-provenance-red/$target\"\n        test \"$(git hash-object\
      \ \"$RUNNER_TEMP/ws-provenance-red/$target\")\" = \"$(git rev-parse \"$BASELINE:$target\")\"\n        printf '%s %s\\\
      n' \"$(git rev-parse \"$BASELINE:$target\")\" \"$target\" >> \"$RUNNER_TEMP/ws-provenance-evidence/baseline-blobs.txt\"\
      \n      else\n        rm -- \"$RUNNER_TEMP/ws-provenance-red/$target\"\n      fi ;;\n  esac\ndone\nbash scripts/prepare-free-fast-red-fixtures.sh\
      \ \"$BASELINE\" \"$RUNNER_TEMP/ws-provenance-red\" \"$CANDIDATE\"\nbash scripts/prepare-usage-sort-red-fixture.sh \"\
      $BASELINE\" \"$RUNNER_TEMP/ws-provenance-red\" \"$CANDIDATE\"\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ \"$RUNNER_TEMP/ws-provenance-red/backend\"\nset +e\n(cd \"$RUNNER_TEMP/ws-provenance-red/backend\" && go test -p=2\
      \ -tags=unit,ownerconflict ./internal/handler -run '^TestOpenAIWSMixedOwnerToolProvenance$' -count=1 -json -timeout=2m)\
      \ > \"$RUNNER_TEMP/ws-provenance-evidence/red.jsonl\" 2>&1\nstatus=$?\nset -e\ncat \"$RUNNER_TEMP/ws-provenance-evidence/red.jsonl\"\
      \ntest \"$status\" -eq 1\npython3 scripts/ws-tool-provenance-evidence.py RED \"$status\" \"$RUNNER_TEMP/ws-provenance-evidence/red.jsonl\"\
      \n"
  - name: Candidate provenance GREEN
    if: hashFiles('backend/internal/service/openai_tool_provenance.go') != ''
    shell: bash
    run: 'set -euo pipefail

      test "$(git rev-parse HEAD)" = "$CANDIDATE"

      git diff --exit-code

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -p=2 -tags=unit,ownerconflict ./internal/handler -run ''^TestOpenAIWSMixedOwnerToolProvenance$''
      -count=1 -json -timeout=3m) > "$RUNNER_TEMP/ws-provenance-evidence/first-green.jsonl" 2>&1

      status=$?

      set -e

      cat "$RUNNER_TEMP/ws-provenance-evidence/first-green.jsonl"

      python3 scripts/ws-tool-provenance-evidence.py GREEN "$status" "$RUNNER_TEMP/ws-provenance-evidence/first-green.jsonl"

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      set +e

      (cd backend && go test -race -p=2 -tags=unit,ownerconflict ./internal/handler -run ''^TestOpenAIWSMixedOwnerToolProvenance$''
      -count=1 -json -timeout=5m) > "$RUNNER_TEMP/ws-provenance-evidence/green.jsonl" 2>&1

      status=$?

      set -e

      cat "$RUNNER_TEMP/ws-provenance-evidence/green.jsonl"

      python3 scripts/ws-tool-provenance-evidence.py GREEN "$status" "$RUNNER_TEMP/ws-provenance-evidence/green.jsonl"

      '
  - name: Genuine delivery, mutations and task association
    if: hashFiles('backend/internal/service/openai_tool_provenance.go') != ''
    shell: bash
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\n(cd backend && go test -race\
      \ -p=2 -tags=unit,ownerconflict ./internal/handler -run '^TestOpenAIWSMixedOwnerToolProvenanceCases$' -count=1 -json\
      \ -timeout=5m) > \"$RUNNER_TEMP/ws-provenance-evidence/cases.jsonl\" 2>&1\npython3 scripts/assert-readable-continuation.py\
      \ --clean-log \"$RUNNER_TEMP/ws-provenance-evidence/cases.jsonl\"\npython3 - \"$RUNNER_TEMP/ws-provenance-evidence/cases.jsonl\"\
      \ <<'PY'\nimport json,sys\nrows=[json.loads(line) for line in open(sys.argv[1]) if line.startswith('{')]\nfor kind in\
      \ ('function','custom'):\n    for case in ('valid','id','type','name','args','epoch','unrelated','undelivered','proof_pending','proof_failed','proof_conflict','proof_missing'):\n\
      \        name=f'TestOpenAIWSMixedOwnerToolProvenanceCases/{kind}/{case}'\n        assert sum(r.get('Action')=='pass'\
      \ and r.get('Test')==name for r in rows)==1,name\nassert not any(r.get('Action') in ('fail','skip') for r in rows)\n\
      PY\n"
  - name: Shadow provenance and delivery lifecycle
    if: hashFiles('backend/internal/service/openai_tool_provenance.go') != ''
    shell: bash
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\n(cd backend && go test -race\
      \ -p=2 -tags=unit,ownerconflict ./internal/handler -run '^TestOpenAIWSShadowToolProvenance$' -count=1 -json -timeout=5m)\
      \ > \"$RUNNER_TEMP/ws-provenance-evidence/shadow.jsonl\" 2>&1\npython3 scripts/assert-readable-continuation.py --clean-log\
      \ \"$RUNNER_TEMP/ws-provenance-evidence/shadow.jsonl\"\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\n\
      (cd backend && go test -race -p=2 -tags=unit,ownerconflict ./internal/service -run '^Test(OpenAIToolProvenanceDeliveryAndScope|OpenAIWSMixedOwnerFinalSendFences)$'\
      \ -count=1 -json -timeout=5m) > \"$RUNNER_TEMP/ws-provenance-evidence/delivery.jsonl\" 2>&1\npython3 scripts/assert-readable-continuation.py\
      \ --clean-log \"$RUNNER_TEMP/ws-provenance-evidence/delivery.jsonl\"\npython3 - \"$RUNNER_TEMP/ws-provenance-evidence\"\
      \ <<'PY'\nimport json,sys,pathlib\nroot=pathlib.Path(sys.argv[1])\nfor filename,tests in [('shadow.jsonl',{f'TestOpenAIWSShadowToolProvenance/{kind}/{case}'\
      \ for kind in ('function','custom') for case in ('valid','phantom','epoch')}),('delivery.jsonl',{'TestOpenAIToolProvenanceDeliveryAndScope','TestOpenAIWSMixedOwnerFinalSendFences'})]:\n\
      \    rows=[json.loads(line) for line in (root/filename).read_text().splitlines() if line.startswith('{')]\n    for name\
      \ in tests: assert sum(r.get('Action')=='pass' and r.get('Test')==name for r in rows)==1,name\n    assert not any(r.get('Action')\
      \ in ('fail','skip') for r in rows)\nPY\n"
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-ws-tool-provenance-behavior-ws-tool-provenance-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: ${{ runner.temp }}/ws-provenance-evidence
