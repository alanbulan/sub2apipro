name: sync-20261116-mature-channel-community-ops-account-before
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
  - name: Frozen source and dependencies
    run: 'git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git 37dc4620a41a68abaeab329358c15821c41e3f7f

      git worktree add --detach "$RUNNER_TEMP/account-before" 37dc4620a41a68abaeab329358c15821c41e3f7f

      pnpm --dir "$RUNNER_TEMP/account-before/frontend" install --frozen-lockfile

      npm install --prefix "$RUNNER_TEMP/account-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/account-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Actual account import baseline
    env:
      MATURE_BASE_ROOT: ${{ runner.temp }}/account-before
      EVIDENCE_DIR: ${{ runner.temp }}/account-before-evidence
      SUB2API_PLAYWRIGHT_MODULE: ${{ runner.temp }}/account-browser/node_modules/playwright/index.mjs
    run: node scripts/mature-account-before.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-channel-community-ops-account-before-mature-account-before-${{ github.sha }}
      path: ${{ runner.temp }}/account-before-evidence/
