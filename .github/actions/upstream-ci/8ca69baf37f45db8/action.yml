name: sync-20261116-oauth-degradation-actions-ui
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Use Ubuntu HTTPS mirror for CI dependencies
    run: 'bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      '
    shell: bash
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - run: git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git 1411d0fc6e1fca51d4b657c21837cd74c87bf84e
    shell: bash
  - name: Vue baseline behavioral RED
    shell: bash
    run: 'set -euo pipefail

      mkdir -p evidence

      source=frontend/src/views/admin/AutoConfigView.vue

      cp "$source" "$RUNNER_TEMP/auto-config-candidate.vue"

      trap ''cp "$RUNNER_TEMP/auto-config-candidate.vue" "$source"'' EXIT

      git show 1411d0fc6e1fca51d4b657c21837cd74c87bf84e:"$source" > "$source"

      set +e

      pnpm --dir frontend exec vitest run src/views/admin/__tests__/OAuthDegradationActions.spec.ts --maxWorkers=1 --minWorkers=1
      > evidence/ui-red.log 2>&1

      result=$?

      set -e

      cat evidence/ui-red.log

      test "$result" -ne 0

      grep -F ''missing degradation action business controls'' evidence/ui-red.log

      ! grep -Eq ''Failed to resolve|Transform failed|No test files found'' evidence/ui-red.log

      '
  - name: Actual Vue settings and notices
    shell: bash
    run: 'set -euo pipefail

      mkdir -p evidence

      git rev-parse HEAD > evidence/ui-head.txt

      pnpm --dir frontend exec vitest run src/views/admin/__tests__/OAuthDegradationActions.spec.ts src/views/admin/__tests__/AutoConfigView.spec.ts
      src/components/admin/operations/__tests__/AutoConfigHistory.spec.ts src/stores/__tests__/newFeatureNotices.spec.ts src/i18n/__tests__/localeKeyCompleteness.spec.ts
      --maxWorkers=1 --minWorkers=1 2>&1 | tee evidence/ui.log

      '
  - name: Frontend types and changed-file lint
    shell: bash
    run: 'set -euo pipefail

      pnpm --dir frontend typecheck 2>&1 | tee evidence/typecheck.log

      pnpm --dir frontend exec eslint src/components/admin/operations/OAuthDegradationCard.vue src/utils/oauthDegradation.ts
      src/views/admin/AutoConfigView.vue src/api/admin/autoConfig.ts src/components/admin/operations/AutoConfigHistory.vue
      2>&1 | tee evidence/lint.log

      '
  - name: Isolated browser dependencies
    run: 'npm install --prefix "$RUNNER_TEMP/oauth-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/oauth-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - run: git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git 1411d0fc6e1fca51d4b657c21837cd74c87bf84e
    shell: bash
  - name: Real Vue and project CSS before and after (fixture only)
    env:
      PLAYWRIGHT_ROOT: ${{ runner.temp }}/oauth-browser/node_modules/playwright
      OAUTH_DEGRADATION_SCREENSHOT_DIR: ${{ github.workspace }}/evidence/screenshots
    run: node scripts/oauth-degradation-browser.mjs
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-oauth-degradation-actions-ui-oauth-degradation-ui-${{ github.event_name }}-${{ github.run_id }}
      path: evidence/
