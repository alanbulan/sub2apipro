name: sync-20261116-priority-observation-availability
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Exact head availability handler and transport regressions
    shell: bash
    run: 'set -euo pipefail

      mkdir -p "$RUNNER_TEMP/priority-availability-logs"

      git rev-parse HEAD | tee "$RUNNER_TEMP/priority-availability-logs/head.txt"

      test "$(git rev-parse HEAD)" = ''${{ github.event.pull_request.head.sha || github.sha }}''

      python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" backend

      (cd backend && go test -tags=unit ./internal/service ./internal/handler -run ''^TestPriorityLatencyAvailability'' -count=1
      -v -timeout=5m) 2>&1 | tee "$RUNNER_TEMP/priority-availability-logs/green.log"

      grep -q -- ''--- PASS: TestPriorityLatencyAvailabilityPoolBoundaries'' "$RUNNER_TEMP/priority-availability-logs/green.log"

      grep -q -- ''--- PASS: TestPriorityLatencyAvailabilityHTTPAndChatTransport'' "$RUNNER_TEMP/priority-availability-logs/green.log"

      grep -q -- ''--- PASS: TestPriorityLatencyAvailabilityNativeFallback'' "$RUNNER_TEMP/priority-availability-logs/green.log"

      grep -q -- ''--- PASS: TestPriorityLatencyAvailabilityHandlerSlots'' "$RUNNER_TEMP/priority-availability-logs/green.log"

      '
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-priority-observation-availability-priority-availability-${{ github.event.pull_request.head.sha ||
        github.sha }}
      path: ${{ runner.temp }}/priority-availability-logs
      if-no-files-found: error
