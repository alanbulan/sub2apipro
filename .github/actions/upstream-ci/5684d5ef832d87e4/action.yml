name: sync-20261116-backend-ci-golangci-lint
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - name: Assert exact candidate head
    run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
    shell: bash
  - uses: actions/setup-go@v6
    with:
      check-latest: false
      cache: true
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Verify Go version
    run: 'go version | grep -q ''go1.27.4''

      '
    shell: bash
  - name: golangci-lint
    uses: golangci/golangci-lint-action@v9
    with:
      version: v2.14.0
      args: --timeout=30m
      working-directory: backend
