name: sync-20261116-scheduler-outbox-retry-retry
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Event preservation, retry failure and existing lifecycle boundaries
    working-directory: backend
    run: 'python3 "$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py" "$PWD"

      go test -race -tags=unit ./internal/service -run ''^(TestSchedulerOutboxRetry|TestSchedulerSnapshotServicePollOutbox|TestSchedulerSnapshotServiceCheckOutboxLag|TestSchedulerFullRebuild|TestSchedulerGroupLifecycle|TestSchedulerPrepareGroupLifecycle)''
      -count=1 -timeout=5m'
    shell: bash
  - name: Durable PostgreSQL retry copying, cleanup, lease and restart
    working-directory: backend
    env:
      CI: 'true'
      GOTRACEBACK: crash
    shell: bash
    run: "set -euo pipefail\nmkdir -p ../evidence\nuname -a > ../evidence/kernel.txt\ngo version > ../evidence/toolchain.txt\n\
      go env GOOS GOARCH CGO_ENABLED GOTOOLCHAIN >> ../evidence/toolchain.txt\ndocker version > ../evidence/docker-version.txt\n\
      docker info > ../evidence/docker-info.txt\nif ! command -v gdb >/dev/null; then\n  bash \"${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh\"\
      \n  sudo apt-get update\n  sudo apt-get install -y --no-install-recommends gdb\nfi\nulimit -c unlimited\nsudo sysctl\
      \ -w \"kernel.core_pattern=$RUNNER_TEMP/scheduler-retry.core.%p\" > ../evidence/core-pattern.txt\nexport GORACE=\"log_path=$PWD/../evidence/race\
      \ history_size=4\"\nbinary=\"$RUNNER_TEMP/scheduler-retry.test\"\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\"\
      \ \"$PWD\"\ngo test -c -race -tags=integration ./internal/repository -o \"$binary\"\nset +e\n\"$binary\" -test.run '^TestSchedulerOutboxRetryPostgres'\
      \ -test.count=1 -test.v=true -test.timeout=10m > ../evidence/integration.log 2>&1\nresult=$?\nset -e\ncat ../evidence/integration.log\n\
      printf '%s\\n' \"$result\" > ../evidence/exit.txt\nif [ \"$result\" -ne 0 ]; then\n  for core in \"$RUNNER_TEMP\"/scheduler-retry.core.*;\
      \ do\n    [ -f \"$core\" ] || continue\n    # Core files inherit the runner environment. Only retain a\n    # backtrace\
      \ without argument/local values, never the raw core.\n    gdb -batch -ex 'set print frame-arguments none' -ex 'thread\
      \ apply all bt' \\\n      \"$binary\" \"$core\" > \"../evidence/backtrace-$(basename \"$core\").txt\" 2>&1 || true\n\
      \  done\nfi\nexit \"$result\"\n"
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-scheduler-outbox-retry-retry-scheduler-outbox-retry-${{ github.run_id }}-${{ github.run_attempt
        }}
      path: evidence/
      if-no-files-found: warn
      retention-days: 14
