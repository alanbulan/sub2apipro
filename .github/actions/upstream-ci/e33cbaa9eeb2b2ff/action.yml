name: sync-20261116-key-risk-postgres-postgres
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Verify checkout identity
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
    shell: bash
  - name: Run PostgreSQL risk and notification regressions with race detection
    working-directory: backend
    shell: bash
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" \"$PWD\"\ngo test -race -json ./internal/keyrisk\
      \ -count=1 -timeout=10m | tee \"$RUNNER_TEMP/key-risk-tests.jsonl\"\npython3 - \"$RUNNER_TEMP/key-risk-tests.jsonl\"\
      \ <<'PY'\nimport json, sys\nrows = [json.loads(line) for line in open(sys.argv[1]) if line.startswith('{')]\nskipped\
      \ = [row['Test'] for row in rows if row.get('Action') == 'skip' and row.get('Test')]\npassed = {row['Test'] for row\
      \ in rows if row.get('Action') == 'pass' and row.get('Test')}\nrequired = {'TestRiskNoticeIncludesAllKeysBeyondFifty',\
      \ 'TestReminderLimitSurvivesOutboxCleanupAndRestart', 'TestAcknowledgementIsOwnedIdempotentAndSuppressesQueuedMail',\
      \ 'TestUpgradePreservesPriorDeliveryAttempts'}\nif skipped or not required <= passed:\n    raise SystemExit(f'Incomplete\
      \ PostgreSQL acceptance: skipped={skipped}, missing={sorted(required - passed)}')\nprint(f'{len(passed)} risk tests\
      \ passed; no skipped tests')\nPY\n"
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-key-risk-postgres-postgres-key-risk-${{ github.event.pull_request.head.sha || github.sha }}
      path: ${{ runner.temp }}/key-risk-tests.jsonl
