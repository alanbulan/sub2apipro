name: sync-20261116-openai-multi-auth-i18n-lock-candidate
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v4
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: 22
  - name: Generate reviewable patched i18n lock in isolation
    run: 'set -euo pipefail

      mkdir "$RUNNER_TEMP/issue594-i18n-candidate"

      cp frontend/package.json frontend/pnpm-lock.yaml "$RUNNER_TEMP/issue594-i18n-candidate/"

      node - <<''JS''

      const fs = require(''fs''); const p = `${process.env.RUNNER_TEMP}/issue594-i18n-candidate/package.json`

      const data = JSON.parse(fs.readFileSync(p)); data.pnpm.overrides[''decode-uri-component@<0.5.1''] = ''0.5.1''; fs.writeFileSync(p,
      JSON.stringify(data, null, 2) + ''\n'')

      JS

      pnpm --dir "$RUNNER_TEMP/issue594-i18n-candidate" install --lockfile-only --ignore-scripts

      '
    shell: bash
  - uses: actions/upload-artifact@v6
    with:
      name: sync-20261116-openai-multi-auth-i18n-lock-candidate-issue594-i18n-candidate-${{ github.event_name }}-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: '${{ runner.temp }}/issue594-i18n-candidate/package.json

        ${{ runner.temp }}/issue594-i18n-candidate/pnpm-lock.yaml

        '
