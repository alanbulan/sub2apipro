name: sync-20261116-issue715-agent-recovery-deadline-diagnostic
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Original SQL deadline with PostgreSQL lock snapshots
    shell: bash
    run: "#!/usr/bin/env bash\n# CI-only diagnostic. Do not run in the local worktree.\n# Invoke at repository root after\
      \ actions/setup-go. Docker is required.\n# Upload $RUNNER_TEMP/issue715-deadline-diag with if: always().\nset -euo pipefail\n\
      issue715_diag_dir=\"${RUNNER_TEMP:?}/issue715-deadline-diag\"\nmkdir -p \"$issue715_diag_dir\"\ngit rev-parse HEAD >\
      \ \"$issue715_diag_dir/head.txt\"\ngit diff --exit-code -- backend/internal/repository/ops_repo_dashboard.go backend/internal/repository/ops_repo_dashboard_integration_test.go\
      \ backend/internal/repository/integration_harness_test.go backend/go.mod backend/go.sum\n# Preserve the original test's\
      \ 50 ms request deadline and real lock fixture.\n# -timeout only caps this diagnostic process, not the asserted deadline.\n\
      (\n  cd backend\n  python3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" \"$PWD\"\n  go test -tags=integration ./internal/repository\
      \ -run '^TestOpsOutputTPSQueryDeadline$' -count=20 -v -timeout=2m\n) > \"$issue715_diag_dir/test.log\" 2>&1 &\nissue715_diag_pid=$!\n\
      issue715_diag_samples=0\nwhile kill -0 \"$issue715_diag_pid\" 2>/dev/null; do\n  # The repository harness owns these\
      \ ephemeral containers. No published\n  # PostgreSQL host port or testsupport API is needed: psql is inside the image.\n\
      \  # This job must run alone on its runner (normal Actions job isolation).\n  while IFS= read -r issue715_diag_container;\
      \ do\n    test -n \"$issue715_diag_container\" || continue\n    issue715_diag_samples=$((issue715_diag_samples + 1))\n\
      \    date -u +'%Y-%m-%dT%H:%M:%S.%NZ' >> \"$issue715_diag_dir/postgres-state.log\"\n    docker inspect --format '{{.Id}}\
      \ {{.Config.Image}} {{.State.Status}} {{.State.StartedAt}}' \"$issue715_diag_container\" >> \"$issue715_diag_dir/postgres-state.log\"\
      \ 2>&1 || true\n    timeout 4s docker exec -e PGCONNECT_TIMEOUT=2 \"$issue715_diag_container\" psql -X -U postgres -d\
      \ sub2api_test -v ON_ERROR_STOP=1 -P pager=off -c \"SELECT clock_timestamp() AS captured_at, pid, backend_start, xact_start,\
      \ query_start, state_change, state, wait_event_type, wait_event, pg_blocking_pids(pid) AS blockers, left(query,1600)\
      \ AS query FROM pg_stat_activity WHERE datname='sub2api_test' AND pid<>pg_backend_pid() ORDER BY pid; SELECT pid, locktype,\
      \ relation::regclass AS relation, virtualtransaction, virtualxid, transactionid, mode, granted, waitstart FROM pg_locks\
      \ WHERE database=(SELECT oid FROM pg_database WHERE datname='sub2api_test') ORDER BY pid, granted, locktype, mode;\"\
      \ >> \"$issue715_diag_dir/postgres-state.log\" 2>&1 || true\n    docker logs --timestamps --tail=100 \"$issue715_diag_container\"\
      \ > \"$issue715_diag_dir/postgres-${issue715_diag_container}.log\" 2>&1 || true\n  done < <(docker ps -q --filter label=org.testcontainers=true\
      \ --filter ancestor=postgres:18.1-alpine3.23)\n  sleep 1\ndone\nset +e\nwait \"$issue715_diag_pid\"\nissue715_diag_result=$?\n\
      set -e\ncat \"$issue715_diag_dir/test.log\"\nprintf 'exit=%s postgres_samples=%s\\n' \"$issue715_diag_result\" \"$issue715_diag_samples\"\
      \ | tee \"$issue715_diag_dir/result.txt\"\nif test \"$issue715_diag_result\" -ne 0; then\n  # Expose useful state near\
      \ a timeout without dumping the whole polling file.\n  tail -n 160 \"$issue715_diag_dir/postgres-state.log\" 2>/dev/null\
      \ || true\n  exit \"$issue715_diag_result\"\nfi\n# Docker absence/fixture failure/no tests must not become a diagnostic\
      \ PASS.\ntest \"$issue715_diag_samples\" -gt 0\ntest \"$(grep -c '^=== RUN   TestOpsOutputTPSQueryDeadline$' \"$issue715_diag_dir/test.log\"\
      )\" -eq 20\ntest \"$(grep -c '^--- PASS: TestOpsOutputTPSQueryDeadline ' \"$issue715_diag_dir/test.log\")\" -eq 20\n\
      if grep -En '^--- (FAIL|SKIP):|panic:|\\[build failed\\]|\\[no tests to run\\]|skipping integration tests' \"$issue715_diag_dir/test.log\"\
      ; then exit 1; fi\n"
  - uses: actions/upload-artifact@v6
    if: always()
    with:
      name: sync-20261116-issue715-agent-recovery-deadline-diagnostic-issue715-deadline-diagnostic-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/issue715-deadline-diag/
