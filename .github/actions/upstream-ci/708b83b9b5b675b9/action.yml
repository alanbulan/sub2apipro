name: sync-20261116-mature-review-repairs-manual-review-ui
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Isolated browser and frozen page before evidence
    run: 'git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git b98e6acb2dc772651b6a597d40cce311f96a2ba5

      npm install --prefix "$RUNNER_TEMP/repair-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      node "$RUNNER_TEMP/repair-browser/node_modules/playwright/cli.js" install --with-deps chromium

      EVIDENCE_DIR="$RUNNER_TEMP/repair-ui/before" REPAIR_CAPTURE_MODE=before SUB2API_PLAYWRIGHT_MODULE="$RUNNER_TEMP/repair-browser/node_modules/playwright/index.mjs"
      node scripts/mature-repair-order-review.mjs

      '
    shell: bash
  - name: RED actual order page has no approval for paid recovery holds
    run: 'set -euo pipefail

      mkdir -p "$RUNNER_TEMP/repair-ui"

      target=frontend/src/views/admin/orders/AdminOrdersView.vue

      cp "$target" "$RUNNER_TEMP/repair-ui-current.vue"

      trap ''cp "$RUNNER_TEMP/repair-ui-current.vue" "$target"'' EXIT

      git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git b98e6acb2dc772651b6a597d40cce311f96a2ba5

      git show b98e6acb2dc772651b6a597d40cce311f96a2ba5:"$target" > "$target"

      test "$(git hash-object "$target")" = "$(git rev-parse b98e6acb2dc772651b6a597d40cce311f96a2ba5:"$target")"

      set +e

      (cd frontend && pnpm exec vitest run src/views/admin/orders/__tests__/AdminOrdersView.recoveryReview.spec.ts --maxWorkers=1
      --minWorkers=1 --no-file-parallelism) > "$RUNNER_TEMP/repair-ui/red.log" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/repair-ui/red.log"

      test "$result" -ne 0

      ! grep -Eiq ''Failed to resolve|Cannot find module|No test files found|Unhandled Error'' "$RUNNER_TEMP/repair-ui/red.log"

      grep -q ''F2 manual reconciliation must expose approval for a paid recovery hold'' "$RUNNER_TEMP/repair-ui/red.log"

      '
    shell: bash
  - name: GREEN explicit approval and decline behavior
    run: 'set -o pipefail

      test -z "$(git status --porcelain)"

      (cd frontend && pnpm exec vitest run src/views/admin/orders/__tests__/AdminOrdersView.recoveryReview.spec.ts --maxWorkers=1
      --minWorkers=1 --no-file-parallelism) 2>&1 | tee "$RUNNER_TEMP/repair-ui/green.log"

      '
    shell: bash
  - name: Actual repaired order review before and after
    run: 'EVIDENCE_DIR="$RUNNER_TEMP/repair-ui/comparison" SUB2API_PLAYWRIGHT_MODULE="$RUNNER_TEMP/repair-browser/node_modules/playwright/index.mjs"
      node scripts/mature-repair-order-review.mjs

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-review-repairs-manual-review-ui-repair-manual-ui-${{ github.sha }}
      path: ${{ runner.temp }}/repair-ui/
