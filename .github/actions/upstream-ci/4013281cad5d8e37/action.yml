name: sync-20261116-priority-observation-ui
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Real page bounded refresh lifecycle
    run: 'set -euo pipefail

      mkdir -p "$RUNNER_TEMP/priority-logs"

      pnpm --dir frontend exec vitest run src/views/admin/__tests__/PrioritySchedulingView.spec.ts src/i18n/__tests__/localeKeyCompleteness.spec.ts
      --maxWorkers=1 --minWorkers=1 2>&1 | tee "$RUNNER_TEMP/priority-logs/ui.log"

      '
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-priority-observation-ui-priority-ui-${{ github.event.pull_request.head.sha || github.sha }}
      path: ${{ runner.temp }}/priority-logs
