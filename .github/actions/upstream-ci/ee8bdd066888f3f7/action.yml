name: sync-20261116-encrypted-history-409-screenshots
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Install isolated screenshot browser
    run: 'npm install --prefix "$RUNNER_TEMP/omit-history-browser" --no-save --ignore-scripts playwright@1.56.1

      bash "${GITHUB_WORKSPACE}/scripts/ci-ubuntu-mirrors.sh"

      "$RUNNER_TEMP/omit-history-browser/node_modules/.bin/playwright" install --with-deps chromium

      '
    shell: bash
  - name: Capture actual setting component
    env:
      PLAYWRIGHT_MODULE: ${{ runner.temp }}/omit-history-browser/node_modules/playwright/index.mjs
    run: node scripts/encrypted-history-409-preview.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/omit-history-ui"
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-encrypted-history-409-screenshots-encrypted-history-409-ui-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: ${{ runner.temp }}/omit-history-ui
      if-no-files-found: error
