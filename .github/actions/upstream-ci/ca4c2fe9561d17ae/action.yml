name: sync-20261116-issue765-image-scheduler-regression
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/checkout@v6
    with:
      ref: e295f336ffd681ca5ccb3e85b27e9ae7d247bf46
      path: baseline
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: candidate/backend/go.sum
      go-version: 1.27.4
  - name: Record clean candidate and toolchain
    shell: bash
    run: 'set -euo pipefail

      mkdir -p evidence

      test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD"

      git -C candidate rev-parse HEAD | tee evidence/head.txt

      git -C candidate diff --exit-code

      git -C candidate diff --check

      go version | tee evidence/toolchain.txt

      grep -F ''go1.27.4'' evidence/toolchain.txt

      sha256sum candidate/backend/internal/repository/scheduler_cache_image_authorization*test.go > evidence/tests.sha256

      test -z "$(gofmt -l candidate/backend/internal/repository/scheduler_cache_image_authorization*test.go candidate/backend/internal/service/openai_images_allowlist_test.go)"

      '
  - name: RED - identical regressions on isolated original projection
    shell: bash
    run: "set -euo pipefail\ntest \"$(git -C baseline rev-parse HEAD)\" = e295f336ffd681ca5ccb3e85b27e9ae7d247bf46\ncp candidate/backend/internal/repository/scheduler_cache_image_authorization*test.go\
      \ baseline/backend/internal/repository/\ngit -C baseline diff --exit-code\npython3 \"$GITHUB_WORKSPACE/candidate/scripts/prepare-sync-ci.py\"\
      \ baseline/backend\nset +e\n(cd baseline/backend && go test -json -tags=integration ./internal/repository -run '^TestIssue765ImageAuthorization(Marshal|Redis)$'\
      \ -count=1 -timeout=12m) > evidence/red.jsonl 2> evidence/red.stderr\nresult=$?\nset -e\ncat evidence/red.stderr\ntest\
      \ \"$result\" -eq 1\npython3 - <<'PY'\nimport json\nfrom pathlib import Path\nevents = [json.loads(line) for line in\
      \ Path('evidence/red.jsonl').read_text().splitlines()]\nparents = {'TestIssue765ImageAuthorizationMarshal', 'TestIssue765ImageAuthorizationRedis'}\n\
      grants = {'exact', 'prefix', 'mapping_complete'}\nexpected = parents | {f'{parent}/{grant}' for parent in parents for\
      \ grant in grants}\nfailed = {e['Test'] for e in events if e.get('Action') == 'fail' and 'Test' in e}\nassert failed\
      \ == expected, (failed, expected)\nassert not any(e.get('Action') == 'skip' for e in events), 'RED skipped tests'\n\
      for parent in parents:\n    for grant in grants:\n        name = f'{parent}/{grant}'\n        output = ''.join(e.get('Output',\
      \ '') for e in events if e.get('Test') == name)\n        model = 'public-image' if grant == 'mapping_complete' else\
      \ 'nano-banana-2'\n        marker = f'ISSUE765_AUTHORIZATION_LOST payload=metadata grant={grant} model={model}'\n  \
      \      assert marker in output, (name, output)\n        print(f'Expected behavioral RED: {name}: {marker}')\nPY\n"
  - name: GREEN - clean candidate marshal and candidate rejection boundaries
    shell: bash
    run: 'set -euo pipefail

      test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD"

      test -z "$(git -C candidate status --porcelain)"

      python3 "$GITHUB_WORKSPACE/candidate/scripts/prepare-sync-ci.py" candidate/backend

      (cd candidate/backend && go test -race -json -tags=unit ./internal/repository ./internal/service -run ''^(TestIssue765|TestExtraImageModels)''
      -count=1 -timeout=10m) > evidence/green-unit.jsonl 2> evidence/green-unit.stderr

      '
  - name: GREEN - real Redis publication, memo refresh and revocation
    shell: bash
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/candidate/scripts/prepare-sync-ci.py\" candidate/backend\n(cd candidate/backend\
      \ && go test -race -json -tags=integration ./internal/repository -run '^(TestIssue765|TestSchedulerCacheSnapshotUsesSlimMetadataButKeepsFullAccount$)'\
      \ -count=1 -timeout=12m) > evidence/green-redis.jsonl 2> evidence/green-redis.stderr\npython3 - <<'PY'\nimport json\n\
      from pathlib import Path\nrequired = {\n    'green-unit': {'TestIssue765ImageAuthorizationMarshal', 'TestIssue765ExtraImagesCandidateAuthorization'},\n\
      \    'green-redis': {'TestIssue765ImageAuthorizationMarshal', 'TestIssue765ImageAuthorizationRedis', 'TestSchedulerCacheSnapshotUsesSlimMetadataButKeepsFullAccount'},\n\
      }\nfor log, names in required.items():\n    events = [json.loads(line) for line in Path(f'evidence/{log}.jsonl').read_text().splitlines()]\n\
      \    passed = {e['Test'] for e in events if e.get('Action') == 'pass' and 'Test' in e}\n    assert names <= passed,\
      \ (log, names - passed)\n    assert not any(e.get('Action') in {'skip', 'fail'} for e in events), log\n    print(f'{log}:\
      \ required tests passed without skips')\nPY\ntest -z \"$(git -C candidate status --porcelain)\"\n"
  - uses: actions/upload-artifact@v6
    if: always()
    with:
      name: sync-20261116-issue765-image-scheduler-regression-issue765-${{ github.event_name }}-${{ github.event.pull_request.head.sha
        || github.sha }}
      path: evidence/
