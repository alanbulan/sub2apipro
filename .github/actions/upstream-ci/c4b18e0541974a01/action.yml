name: sync-20261116-admin-usage-platform-filter-frontend
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: Platform behavioral regression
    run: pnpm --dir frontend exec vitest run src/components/admin/usage/__tests__/UsageFilters.spec.ts src/views/admin/__tests__/UsageView.platform.spec.ts
      src/views/admin/__tests__/UsageView.spec.ts src/components/common/__tests__/NewFeatureBadge.spec.ts
    shell: bash
  - name: Frontend critical tests, lint and types
    run: make test-frontend
    shell: bash
  - name: Production frontend build
    run: pnpm --dir frontend run build
    shell: bash
