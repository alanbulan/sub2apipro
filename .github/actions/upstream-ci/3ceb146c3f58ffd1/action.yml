name: sync-20261116-mature-channel-community-ops-provider-ui
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v6
    with:
      version: 9
  - uses: actions/setup-node@v6
    with:
      node-version: '22'
      cache: pnpm
      cache-dependency-path: frontend/pnpm-lock.yaml
  - run: pnpm --dir frontend install --frozen-lockfile
    shell: bash
  - name: RED existing page lacks provider management
    shell: bash
    run: 'set -euo pipefail

      mkdir -p "$RUNNER_TEMP/mature-ui-evidence"

      target=frontend/src/views/admin/UpstreamChannelOperationsView.vue

      cp "$target" "$RUNNER_TEMP/provider-current.vue"

      trap ''cp "$RUNNER_TEMP/provider-current.vue" "$target"'' EXIT

      git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git 37dc4620a41a68abaeab329358c15821c41e3f7f

      git show 37dc4620a41a68abaeab329358c15821c41e3f7f:"$target" > "$target"

      set +e

      (cd frontend && pnpm exec vitest run src/views/admin/__tests__/MatureProviders.spec.ts --maxWorkers=1 --minWorkers=1
      --no-file-parallelism) > "$RUNNER_TEMP/mature-ui-evidence/red.log" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/mature-ui-evidence/red.log"

      test "$result" -ne 0

      grep -q ''channel operations must expose provider CRUD'' "$RUNNER_TEMP/mature-ui-evidence/red.log"

      ! grep -Eiq ''Failed to resolve|Cannot find module|No test files found'' "$RUNNER_TEMP/mature-ui-evidence/red.log"

      '
  - name: RED community navigation on frozen baseline
    shell: bash
    run: 'set -euo pipefail

      target=frontend/src/components/admin/operations/SmartOpsNav.vue

      cp "$target" "$RUNNER_TEMP/community-current.vue"

      trap ''cp "$RUNNER_TEMP/community-current.vue" "$target"'' EXIT

      git show 37dc4620a41a68abaeab329358c15821c41e3f7f:"$target" > "$target"

      set +e

      (cd frontend && pnpm exec vitest run src/views/admin/__tests__/MatureCommunityNav.spec.ts --maxWorkers=1 --minWorkers=1
      --no-file-parallelism) > "$RUNNER_TEMP/mature-ui-evidence/community-red.log" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/mature-ui-evidence/community-red.log"

      test "$result" -ne 0

      grep -q ''community operations must be reachable'' "$RUNNER_TEMP/mature-ui-evidence/community-red.log"

      ! grep -Eiq ''Failed to resolve|Cannot find module|No test files found'' "$RUNNER_TEMP/mature-ui-evidence/community-red.log"

      '
  - name: RED account import entry before implementation
    shell: bash
    run: 'set -euo pipefail

      target=frontend/src/components/account/CreateAccountModal.vue

      cp "$target" "$RUNNER_TEMP/account-current.vue"

      trap ''cp "$RUNNER_TEMP/account-current.vue" "$target"'' EXIT

      git show 37dc4620a41a68abaeab329358c15821c41e3f7f:"$target" > "$target"

      set +e

      (cd frontend && pnpm exec vitest run src/components/account/__tests__/CreateAccountModal.spec.ts -t ''mature provider
      import entry'' --maxWorkers=1 --minWorkers=1 --no-file-parallelism) > "$RUNNER_TEMP/mature-ui-evidence/account-red.log"
      2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/mature-ui-evidence/account-red.log"

      test "$result" -ne 0

      grep -q ''API Key and Responses accounts must offer provider import'' "$RUNNER_TEMP/mature-ui-evidence/account-red.log"

      ! grep -Eiq ''Failed to resolve|Cannot find module|No test files found'' "$RUNNER_TEMP/mature-ui-evidence/account-red.log"

      '
  - name: GREEN provider interactions
    working-directory: frontend
    run: pnpm exec vitest run src/views/admin/__tests__/MatureCommunityNav.spec.ts src/views/admin/__tests__/MatureProviders.spec.ts
      src/views/admin/__tests__/UpstreamChannelOperationsView.spec.ts src/components/common/__tests__/NewFeatureBadge.spec.ts
      src/components/admin/operations/__tests__/SmartOpsNav.spec.ts src/components/layout/__tests__/AppSidebar.spec.ts --maxWorkers=1
      --minWorkers=1 --no-file-parallelism
    shell: bash
  - name: QQ frontend business regression
    working-directory: frontend
    run: pnpm exec vitest run src/components/admin/qqbot/__tests__ src/views/admin/__tests__/QQBotView.spec.ts src/views/admin/__tests__/QQBotSetup.spec.ts
      src/views/admin/__tests__/QQBotActivities.spec.ts src/views/admin/__tests__/QQBotRecords.spec.ts src/components/admin/__tests__/QQBotBindings.spec.ts
      src/components/user/profile/__tests__/ProfileQQBotCard.spec.ts src/views/auth/__tests__/QQBotBindView.spec.ts src/views/auth/__tests__/QQBotTransferView.spec.ts
      src/api/__tests__/qqbot.spec.ts --maxWorkers=1 --minWorkers=1 --no-file-parallelism
    shell: bash
  - name: RED definite remote refusals must not be presented as unknown writes
    shell: bash
    run: 'set -euo pipefail

      target=frontend/src/components/account/MatureProviderImport.vue

      cp "$target" "$RUNNER_TEMP/mature-import-current.vue"

      trap ''cp "$RUNNER_TEMP/mature-import-current.vue" "$target"'' EXIT

      git fetch --no-tags --depth=1 https://github.com/ranxi2001/sub2api.git a72031bcda0102664f65d3889783d227fe6fa802

      git show a72031bcda0102664f65d3889783d227fe6fa802:"$target" > "$target"

      set +e

      (cd frontend && pnpm exec vitest run src/components/account/__tests__/MatureProviderImport.spec.ts --maxWorkers=1 --minWorkers=1
      --no-file-parallelism) > "$RUNNER_TEMP/mature-ui-evidence/key-refusal-red.log" 2>&1

      result=$?

      set -e

      cat "$RUNNER_TEMP/mature-ui-evidence/key-refusal-red.log"

      test "$result" -ne 0

      ! grep -Eiq ''Failed to resolve|Cannot find module|No test files found|Unhandled Error'' "$RUNNER_TEMP/mature-ui-evidence/key-refusal-red.log"

      grep -q ''definite refusals must remain distinct from uncertain writes'' "$RUNNER_TEMP/mature-ui-evidence/key-refusal-red.log"

      '
  - name: Account import regression
    working-directory: frontend
    run: pnpm exec vitest run src/components/account/__tests__/CreateAccountModal.spec.ts src/components/account/__tests__/CreateAccountModal.autoBPS.spec.ts
      src/components/account/__tests__/MatureProviderImport.spec.ts --maxWorkers=1 --minWorkers=1 --no-file-parallelism
    shell: bash
  - name: Coupon reward payment UI regressions
    working-directory: frontend
    run: pnpm exec vitest run src/components/payment/__tests__/RechargeCouponPicker.spec.ts src/views/admin/orders/__tests__/AdminCouponsView.spec.ts
      src/views/user/__tests__/UserCouponsView.spec.ts src/views/user/__tests__/PaymentView.spec.ts --maxWorkers=1 --minWorkers=1
      --no-file-parallelism
    shell: bash
  - name: Frontend production build
    run: pnpm --dir frontend run build
    shell: bash
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Embedded production server build
    working-directory: backend
    run: CGO_ENABLED=0 go build -tags embed -trimpath -ldflags "-X main.Commit=${{ github.sha }}" -o "$RUNNER_TEMP/mature-embedded-server"
      ./cmd/server
    shell: bash
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-mature-channel-community-ops-provider-ui-mature-ui-tests-${{ github.sha }}
      path: ${{ runner.temp }}/mature-ui-evidence/
