name: sync-20261116-quality-oauth-401-regression
description: Current upstream checks, preserving runner setup and regression assertions.
runs:
  using: composite
  steps:
  - uses: actions/setup-go@v6
    with:
      cache-dependency-path: backend/go.sum
      go-version: 1.27.4
  - name: Record exact head
    run: 'mkdir -p evidence

      git rev-parse HEAD > evidence/head.txt

      git diff --exit-code

      '
    shell: bash
  - name: Own transport and complete round evidence
    shell: bash
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\n(cd backend && go test -tags=unit\
      \ ./internal/service -run '^TestQualityOAuth401' -count=1 -v -timeout=10m) 2>&1 | tee evidence/unit.log\nif grep -Eq\
      \ -- '--- SKIP:|no tests to run' evidence/unit.log; then exit 1; fi\nfor name in DirectSourceExcludesTicketsAndPlugins\
      \ RevocationRequiresStructuredCode EvidenceRequiresCompleteOwnCredentialRound PolicyLimitsAndReusableConfig; do\n  grep\
      \ -F -- \"--- PASS: TestQualityOAuth401$name\" evidence/unit.log\ndone\n"
  - name: Durable trust and saved rule version on isolated PostgreSQL
    shell: bash
    env:
      CI: 'true'
    run: "set -euo pipefail\npython3 \"$GITHUB_WORKSPACE/scripts/prepare-sync-ci.py\" backend\n(cd backend && go test -tags=integration\
      \ ./internal/repository -run '^TestQualityOAuth401' -count=1 -v -timeout=20m) 2>&1 | tee evidence/storage.log\nif grep\
      \ -Eq -- '--- SKIP:|no tests to run' evidence/storage.log; then exit 1; fi\nfor name in SharedBatchCountsBeforeErrorRedaction\
      \ SixRoundsSurvivePruningAndDeleteOnlyRule ResetAndTypeCredentialFences UnavailableRequiresCurrentRevoked401 Untrusted401ThenUnavailableNeverDeletes\
      \ UnavailableUsesOnlyCurrentCredentialTrust SavedRuleVersionRestartsStreak PreservesOtherRuleOwnership KeepsOwnershipAndTemplateDeletionMarker;\
      \ do\n  grep -F -- \"--- PASS: TestQualityOAuth401$name\" evidence/storage.log\ndone\n"
  - uses: actions/upload-artifact@v7
    if: always()
    with:
      name: sync-20261116-quality-oauth-401-regression-quality-oauth-401-${{ github.event.pull_request.head.sha || github.sha
        }}
      path: evidence/
      if-no-files-found: error
