<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          document.documentElement.dataset.appTheme =
            ['minimalism', 'neoBrutalism', 'apple', 'notion', 'wabiSabi'].includes(
              localStorage.getItem('app-theme')
            )
              ? localStorage.getItem('app-theme')
              : 'minimalism';
          const savedColorMode = localStorage.getItem('theme');
          document.documentElement.classList.toggle(
            'dark',
            savedColorMode === 'dark' ||
              (!savedColorMode && window.matchMedia('(prefers-color-scheme: dark)').matches)
          );
        } catch {}
      })();
    </script>
    <title></title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
